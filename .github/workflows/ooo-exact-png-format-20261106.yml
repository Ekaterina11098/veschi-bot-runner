name: OOO approved PNG format correction
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ooo-exact-png-format-20261106.yml']
permissions:
  contents: read
concurrency:
  group: ooo-cloud-pilot-20261106-v1
  cancel-in-progress: false
jobs:
  correct:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 59fe6b6fe1fe3279fed8d506fb3f8a4832116768
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 --quiet
      - run: python -m py_compile scripts/ooo_exact_format_delivery.py
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OOO_TELEGRAM_BOT_TOKEN: ${{ secrets.OOO_TELEGRAM_BOT_TOKEN }}
        run: python -u scripts/ooo_exact_format_delivery.py

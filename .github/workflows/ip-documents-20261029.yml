name: Exact IP documents read
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ip-documents-20261029.yml']
permissions: {contents: write}
concurrency:
  group: wb-ip-content-documents
  cancel-in-progress: false
jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests cryptography==46.0.2 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - run: python scripts/ip_documents_20261029.py
        env:
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
      - name: Preserve encrypted proof only
        if: always()
        run: |
          mkdir -p recovery-output/documents
          for f in "$RUNNER_TEMP"/stock-deploy-proof/*.aes.json; do
            test -f "$f" || continue
            cp "$f" "recovery-output/documents/$(basename "$f" .aes.json)-${{ github.run_id }}.aes.json"
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-output/documents/
          git diff --cached --quiet || git commit -m "Preserve encrypted exact IP document proof"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
          done
          exit 1

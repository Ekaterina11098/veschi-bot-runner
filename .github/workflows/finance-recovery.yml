name: Recover IP finance calculation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/finance-recovery.yml'
permissions:
  contents: read
concurrency:
  group: bot-finance-parser-validation
  cancel-in-progress: false
  queue: max
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: main
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: pip install requests==2.32.5 python-dotenv > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Inspect privately
        run: |
          python - <<'PY'
          import run_private
          for pattern in ('test_sku_economics.py','test_profit_math.py','test_sku_profit_check.py','test_advertising_decision_engine.py','test_advertising_experiments.py','test_advertising_conversation.py','test_advertising_sales_report.py','test_ip_price_policy.py','test_price_loss_guard.py','test_ip_price_history.py'):
              run_private.execute('Validate finance and advertising calculations', ['-m','unittest','discover','-s','tests','-p',pattern])
          run_private.execute('Verify IP sales report from complete cached sources', ['-c', "from unittest.mock import patch; from advertising_agent import sales_report as s; from advertising_agent import agent_store as store; p=patch.object(s,'refresh',side_effect=RuntimeError('Validation uses cached data only')); p.start(); r=s.report(); store.cache_set('advertising:sales_report_probe',r,ttl_days=7); print('Scoped sales report verified'); p.stop()"])
          run_private.execute('Verify IP price policy with cached data only', ['-c', "from advertising_agent.price_policy import assess; from advertising_agent import agent_store as store; r=assess(collect_sources=False); store.cache_set('advertising:price_policy_probe',r,ttl_days=7); print('IP price policy read-only verified')"])
          run_private.execute('Verify saved report parsing without new WB requests', ['-m','advertising_agent.finance_recovery','--validate-saved'])
          PY
        env:
          TASK: finance-recovery
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_FINANCE_TOKEN_2: ${{ secrets.WB_FINANCE_TOKEN_2 }}

# Verify current calculation version and operation conservation.

# Include obsolete-cache guards in final verification.

# Verify orders-based DRR target and buyout informational display.

# Verify order-based price-test budgets.

# Validate rounded break-even regression after final source update.

# Verify final independently scoped IP pricing rules.

# Validate manual seller-price tracking separately from buyer-price changes.

# Validate live preconditions and positive-profit reductions together.

# Verify cabinet-wide pricing scope and full result rendering.

# Verify one full-cabinet sales read without narrowing recommendations.

# Verify final historical trend routing and complete price evidence.

# Reuse cabinet finance and identical source reads during history analysis.

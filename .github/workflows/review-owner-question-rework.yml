name: Deliver owner-requested question rework
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/review-owner-question-rework.yml']
permissions:
  contents: read
concurrency:
  group: review-owner-question-rework
  cancel-in-progress: false
jobs:
  approved-replies:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 73ecafcd12d9c38b194eaf289b38bfb1e39e31fd
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'psycopg[binary]==3.2.10' cryptography==46.0.2 requests==2.32.5 python-dotenv==1.1.1
      - name: Validate exact approvals, all cabinets and no duplicate POST
        run: |
          python -m unittest test_review_approved_worker.py
          python -m unittest discover -s review-approval-preparation -p test_review_telegram.py
          python -m unittest test_review_autonomy.py test_review_cleanup.py test_review_owner_question_rework.py
          python -m py_compile review_approved_worker.py
      - name: Deliver one question card with two variants for owner approval; no WB writes
        env:
          PYTHONPATH: ${{ github.workspace }}/private-source
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
        run: python review_owner_question_rework.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-telegram-cleanup-receipts
          path: ${{ runner.temp }}/stock-deploy-proof
          retention-days: 90


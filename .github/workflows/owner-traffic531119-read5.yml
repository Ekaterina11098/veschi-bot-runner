name: Owner read-only traffic check531119
on:
  push:
    paths: ['.github/workflows/owner-traffic531119-read5.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-traffic531119-read5
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Bounded fresh growth economics; no model or Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: disabled-no-send
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json,os,time,requests
          from china_cloud_cost_control import Cache,WB,validate_identity,stamp
          from china_advertising_state import AdvertisingIO
          from china_morning_readiness import current_prices,published_stock
          from china_moysklad_read import read_stock
          ROOT='china_agent:owner_531119_traffic_check:2026-11-05:v1'
          c=Cache();w=WB();io=AdvertisingIO();validate_identity(c,w)
          if not c.create(ROOT+':claim',dict(created_at=stamp(),wb_writes=0,telegram_calls=0)):raise ValueError('Read already claimed; use dated cache')
          v=dict(cabinet='token_3',status='collecting',observed_at=stamp(),wb_writes=0,telegram_calls=0,grants_action_permission=False,errors={})
          def save():
           p=json.loads(json.dumps(v));c.put(ROOT,p)
          def getread(name,fn):
           try:v[name]=fn();save()
           except Exception as e:v['errors'][name]=str(e)[:220];save()
          def extra(path,body):
           if path not in ('/adv/v1/normquery/stats','/adv/v0/normquery/get-minus'):raise ValueError('Read endpoint outside exact scope')
           time.sleep(2)
           r=requests.post('https://advert-api.wildberries.ru'+path,headers={'Authorization':w.token},json=body,timeout=50)
           if not r.ok:raise RuntimeError('Read API HTTP '+str(r.status_code))
           return r.json()
          getread('campaigns',lambda:w.campaigns([41298169,41570073]))
          getread('budgets',lambda:w.req('/api/advert/v2/budget','POST',dict(advertIds=[41298169,41570073])))
          getread('minimum531',lambda:w.minimums(41298169,[1473243902],'search'))
          getread('minimum119',lambda:w.minimums(41570073,[1473243898],'search'))
          getread('prices',lambda:current_prices(io,[1473243902,1473243898]))
          if 'prices'in v:getread('published_stock',lambda:published_stock(io,v['prices'],[1473243902,1473243898]))
          getread('stock',lambda:read_stock(['531-NoelBag-grey','119-NoelBag-darkblack']))
          getread('fullstats',lambda:w.req('/adv/v3/fullstats?ids=41298169,41570073&beginDate=2026-11-04&endDate=2026-11-05'))
          getread('minus',lambda:extra('/adv/v0/normquery/get-minus',dict(items=[dict(advert_id=41298169,nm_id=1473243902),dict(advert_id=41570073,nm_id=1473243898)])))
          getread('query_stats',lambda:extra('/adv/v1/normquery/stats',dict(**{'from':'2026-11-04','to':'2026-11-05'},items=[dict(advertId=41298169,nmId=1473243902),dict(advertId=41570073,nmId=1473243898)])))
          v.update(status='complete'if not v['errors']else'partial',completed_at=stamp());save()
          print(json.dumps(dict(status=v['status'],errors=list(v['errors']),wb_writes=0,telegram_calls=0)))
          
          
          PY

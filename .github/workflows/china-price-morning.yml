name: China price morning report only
on:
  push:
    branches: [main]
    paths: ['china-price-morning-request.json']
  workflow_dispatch:
    inputs:
      action:
        description: Deliver both morning reports or preview without sending
        type: choice
        options: [run, verify]
        default: verify
  schedule:
    - cron: '30,45 7 * * *'
    - cron: '0,15 8 * * *'
permissions:
  contents: read
concurrency:
  group: bot-business-agent
  cancel-in-progress: false
jobs:
  report:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: bot-mpstats-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact dated request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_ACTION: ${{ inputs.action }}
        run: python scripts/china_morning_schedule.py
      - uses: actions/checkout@v4
        if: steps.request.outputs.allowed == 'true'
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.request.outputs.allowed == 'true'
        with:
          python-version: '3.12'
      - name: Install pinned transport and existing worker dependencies
        if: steps.request.outputs.allowed == 'true'
        run: pip install requests==2.32.5 python-dotenv aiogram apscheduler pillow simplejson==4.2.0 > "$RUNNER_TEMP/install.log" 2>&1
      - name: Deliver exact China morning report
        if: steps.request.outputs.allowed == 'true'
        working-directory: source
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          REPORT_ACTION: ${{ steps.request.outputs.action }}
        run: |
          python ../scripts/test_china_period_buyout.py
          python ../scripts/china_chat_migration.py --root .
          python ../scripts/install_china_order_coverage.py
          python ../scripts/check_china_installed_price_step.py china_agent/demand.py
          cp ../scripts/china_wb_order_gaps.py china_agent/wb_order_gaps.py
          cp ../scripts/china_coverage_worker.py china_agent/coverage_worker.py
          cp ../scripts/china_price_brief.py china_agent/price_brief.py
          cp ../scripts/china_buyer_price_forecast.py china_agent/buyer_price_forecast.py
          cp ../scripts/china_morning_pair.py china_agent/morning_pair.py
          cp ../scripts/china_daily_expected_control.py china_agent/daily_expected_control.py
          cp ../scripts/china_control_owner_preview.py china_agent/control_owner_preview.py
          cp ../scripts/china_expected_order_profit.py china_agent/expected_order_profit.py
          cp ../scripts/china_price_experiment_result.py china_agent/price_experiment_result.py
          python -m compileall -q china_agent/morning_pair.py china_agent/daily_expected_control.py
          if [ "$REPORT_ACTION" = verify ]; then
            python -m china_agent.morning_pair --verify
          else
            python -m china_agent.morning_pair
          fi


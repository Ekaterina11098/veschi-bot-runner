name: Read requested IP report availability October 26-31
on:
  push:
    branches: [main]
    paths: ['.github/workflows/read-ip-period-20261026.yml']
  workflow_dispatch:
permissions: {}
concurrency:
  group: ip-period-20261026-read
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read finance report into private storage
        shell: python
        env:
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import os,json,gzip,urllib.request,urllib.error,time,datetime
          ROOT="weekly_report_review:ip:20261026:"
          SB=os.environ["SUPABASE_URL"].rstrip("/")
          def now():return datetime.datetime.now(datetime.timezone.utc).isoformat()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs):raise RuntimeError("Redirect blocked")
          op=urllib.request.build_opener(NoRedirect)
          def http(url,headers,body=None):
           req=urllib.request.Request(url,headers=headers,method="GET" if body is None else "POST",data=None if body is None else json.dumps(body).encode())
           try:
            with op.open(req,timeout=90) as r:
             raw=r.read()
             if r.headers.get("Content-Encoding")=="gzip":raw=gzip.decompress(raw)
             return r.status,json.loads(raw) if raw else []
           except urllib.error.HTTPError as e:return e.code,None
          def put(key,payload):
           h={"apikey":os.environ["SUPABASE_SECRET_KEY"],"Authorization":"Bearer "+os.environ["SUPABASE_SECRET_KEY"],"Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=minimal"}
           req=urllib.request.Request(SB+"/rest/v1/telegram_api_cache?on_conflict=cache_key",headers=h,method="POST",data=json.dumps({"cache_key":ROOT+key,"payload":payload,"updated_at":now(),"expires_at":"2099-01-01T00:00:00Z"}).encode())
           with op.open(req,timeout=60) as r:assert r.status in (200,201,204)
          H={"Authorization":os.environ["WB_TOKEN_2"],"Content-Type":"application/json","Accept-Encoding":"gzip"}
          BASE="https://finance-api.wildberries.ru/api/finance/v1/sales-reports/"
          status,reports=http(BASE+"list",H,{"dateFrom":"2026-10-26","dateTo":"2026-11-01","period":"weekly","limit":1000,"offset":0})
          proof={"run_id":os.environ["GITHUB_RUN_ID"],"at":now(),"status":"reading","list_http":status,"reports":reports,"chunks":[],"rows":0}
          put("source_proof:v1",proof)
          if status not in (200,204):raise RuntimeError("Report list HTTP "+str(status))
          if status==204:proof["status"]="no_data";put("source_proof:v1",proof);raise SystemExit()
          if not isinstance(reports,list):raise RuntimeError("Unexpected list shape")
          proof.update(status="availability_checked",completed_at=now(),requested_date_from="2026-10-26",requested_date_to="2026-10-31")
          put("source_proof:v1",proof)
          print("Report availability stored privately.")

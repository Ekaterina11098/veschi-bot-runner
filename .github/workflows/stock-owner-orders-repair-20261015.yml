name: Owner fixed orders stock repair 2026-10-15
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stock-owner-orders-repair-20261015.yml']
permissions:
  contents: read
concurrency:
  group: bot-stock
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: c415e933cf52573a817d40b5ce641e68be16280c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline journal and orders regression; no business credentials
        working-directory: private-source
        run: python -m unittest test_owner_low_rule test_order_demand -v
      - run: pip install requests==2.32.5 python-dotenv==1.1.1 aiogram==3.22.0 simplejson==4.2.0 'psycopg[binary]==3.2.9' cryptography > "$RUNNER_TEMP/repair-install.log" 2>&1
      - name: Execute exact owner-authorized repair; no inventory collection
        env:
          PYTHONPATH: ${{ github.workspace }}/private-source:${{ github.workspace }}
          STOCK_CLOUD_EXECUTION_ENABLED: 'true'
          STOCK_JOURNAL_IMPORT_ACCEPTED: 'true'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          AUTO_STOCK_FAIL_FAST: '1'
        run: |
          python - <<'PY'
          from datetime import datetime,timezone,timedelta
          assert datetime.now(timezone(timedelta(hours=3))).date().isoformat()=='2026-10-15'
          PY
          python private-source/owner_fixed_repair.py private-source/owner_repair_plan_20261015.json ff508b54ad48d18f353a6385f4f72fd0f3a5e4b45dfce6505390330d45623951
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-orders-stock-repair-receipt
          path: ${{ runner.temp }}/stock-deploy-proof
          retention-days: 90

name: IP reports prepared early and delivered by the existing cloud clock
on:
  workflow_dispatch:
    inputs:
      slot:
        description: Approved IP report slot
        required: true
        type: choice
        options: [morning, midday]
      verify_only:
        description: Saved-data verification only, no sources or report delivery
        required: true
        default: false
        type: boolean
permissions: {contents: read}
concurrency:
  group: ip-report-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b0e2e018b74824fab5a98efa567bb592e5d5b129
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 2f798a9509b72030d6fb5ec68fb915c5d216c31b
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 cryptography==46.0.2 Pillow==12.3.0 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Reuse dated data and read only missing report fields; no WB credentials
        if: inputs.verify_only != true
        env:
          IP_REPORT_SLOT: ${{ inputs.slot }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
        run: python ip_scheduled_source.py
      - name: Freeze private PNGs or verify saved example; never send from the runner
        env:
          IP_REPORT_SLOT: ${{ inputs.slot }}
          IP_REPORT_VERIFY_ONLY: ${{ inputs.verify_only && 'true' || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ADVERTISING_TELEGRAM_BOT_TOKEN: ${{ secrets.ADVERTISING_TELEGRAM_BOT_TOKEN }}
        run: |
          if [ "$IP_REPORT_VERIFY_ONLY" = "true" ]; then
            python -c 'import json;from ip_report_freeze import credentials,main;credentials();print(json.dumps(main()))'
          else
            python ip_report_freeze.py
          fi

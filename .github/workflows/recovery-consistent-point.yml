name: Consistent database point with reused verified rows
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recovery-consistent-point.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: veshi-storage-maintenance
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 99ab899dd306835642d4b33ef8bb6254644ea17c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-dotenv requests simplejson cryptography 'psycopg[binary]==3.2.9' > "$RUNNER_TEMP/install.log" 2>&1
      - uses: actions/download-artifact@v4
        with:
          name: owner-encrypted-storage-backup
          run-id: 38561695550
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/point-input/snapshots
      - uses: actions/download-artifact@v4
        with:
          name: owner-encrypted-cache-component
          run-id: 38577383158
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/point-input/cache
      - uses: actions/download-artifact@v4
        with:
          name: owner-encrypted-snapshot-tail-component

name: Read exact OOO weekly report document
on:
  push:
    branches: [main]
    paths: ['.github/workflows/read-ooo-weekly-document-890006779.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Download only the exact listed weekly document
        shell: python
        env:
          WB_FINANCE_TOKEN_1: ${{ secrets.WB_FINANCE_TOKEN_1 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import os,json,gzip,urllib.request,urllib.error,urllib.parse,base64,io,zipfile,sys
          sys.path.insert(0,"scripts")
          import fbs_document_chain as m
          db=m.Cache(m.Transport());ROOT="weekly_report_review:ooo:20261026_20261031:"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs):raise RuntimeError("Redirect blocked")
          op=urllib.request.build_opener(NoRedirect)
          url="https://documents-api.wildberries.ru/api/v1/documents/download?"+urllib.parse.urlencode({"serviceName":"weekly-implementation-report-890006779","extension":"zip"})
          result={"at":m.now(),"serviceName":"weekly-implementation-report-890006779"}
          try:
           with op.open(urllib.request.Request(url,headers={"Authorization":os.environ["WB_FINANCE_TOKEN_1"],"Accept-Encoding":"gzip"}),timeout=90) as response:
            raw=response.read()
            if response.headers.get("Content-Encoding")=="gzip":raw=gzip.decompress(raw)
            result.update(http=response.status,status="downloaded",content_type=response.headers.get("Content-Type"),bytes=len(raw))
            try:value=json.loads(raw)
            except Exception:value=None
            if isinstance(value,dict):
             result["response_keys"]=list(value)
             db.put(ROOT+"weekly_document_response:v1",value)
             candidates=[]
             def find(obj):
              if isinstance(obj,dict):
               for k,v in obj.items():
                if isinstance(v,str) and len(v)>100 and k.casefold() in ("document","content","file","data"):candidates.append(v)
                elif isinstance(v,(dict,list)):find(v)
              elif isinstance(obj,list):
               for v in obj:find(v)
             find(value)
             result["base64_candidates"]=len(candidates)
             if len(candidates)==1:
              try:raw=base64.b64decode(candidates[0],validate=True)
              except Exception:raw=b""
             else:raw=b""
            else:
             db.put(ROOT+"weekly_document_response:v1",{"raw_base64":base64.b64encode(raw).decode()})
            if raw and zipfile.is_zipfile(io.BytesIO(raw)):
             z=zipfile.ZipFile(io.BytesIO(raw));result["files"]=[{"name":x.filename,"bytes":x.file_size} for x in z.infolist()]
          except urllib.error.HTTPError as exc:result.update(status="unavailable",http=exc.code,retry_after=exc.headers.get("X-RateLimit-Retry") or exc.headers.get("Retry-After"))
          except Exception as exc:result.update(status="error",error_type=type(exc).__name__)
          db.put(ROOT+"weekly_document_download:v1",result)
          print("One exact weekly document download attempted; private receipt saved.")

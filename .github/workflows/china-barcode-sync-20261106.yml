name: China barcode sync to MoySklad
on:
  push:
    paths:
      - '.github/workflows/china-barcode-sync-20261106.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: china-barcode-sync-20261106
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: scripts/fbs_document_chain.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add exact matched barcodes and verify
        shell: python
        env:
          BARCODE_APPLY: '1'
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import os,json,time,urllib.request,urllib.error,gzip,collections,sys
          sys.path.insert(0,"scripts")
          from fbs_document_chain import Transport,Cache,Worker,MS,Stop,now
          t=Transport();db=Cache(t);w=Worker(t,db,{})
          KEY="barcode_sync:china:20261106:v1"
          def wb_cards():
              out=[];cursor={"limit":100};seen=set()
              while True:
                  req=urllib.request.Request("https://content-api.wildberries.ru/content/v2/get/cards/list",data=json.dumps({"settings":{"sort":{"ascending":False},"cursor":cursor,"filter":{"withPhoto":-1}}}).encode(),headers={"Authorization":os.environ["WB_TOKEN_3"],"Content-Type":"application/json"},method="POST")
                  try:
                      with urllib.request.urlopen(req,timeout=45) as f:d=json.load(f)
                  except urllib.error.HTTPError as e:raise Stop("WB HTTP_"+str(e.code)) from None
                  batch=d.get("cards")
                  if not isinstance(batch,list) or not isinstance(d.get("cursor"),dict):raise Stop("Incomplete WB response")
                  for c in batch:
                      if c["nmID"] in seen:raise Stop("Repeated WB card")
                      seen.add(c["nmID"]);out.append(c)
                  if d["cursor"].get("total",0)<100:return out
                  cursor={"limit":100,"updatedAt":d["cursor"]["updatedAt"],"nmID":d["cursor"]["nmID"]}
                  if len(out)>20000:raise Stop("WB scope too large")
                  time.sleep(.7)
          def vals(p):
              return {str(v) for b in p.get("barcodes",[]) for v in b.values()}
          def norm(s):return str(s or "").strip().casefold()
          prior=db.get(KEY)
          if os.getenv("BARCODE_APPLY")=="1" and prior and prior.get("status")=="verified":
              print("Already verified; no repeat");raise SystemExit(0)
          if prior and prior.get("applied"):
              db.put(KEY+":history:"+str(prior.get("run_id")),prior)
          result={"status":"reading","at":now(),"run_id":os.environ["GITHUB_RUN_ID"],"writes":0}
          try:
              cards=wb_cards()
              products=w.ms_rows("entity/product")
              variants=w.ms_rows("entity/variant")
              bundles=w.ms_rows("entity/bundle")
              owners=collections.defaultdict(set);idx=collections.defaultdict(list);wbowners=collections.defaultdict(set)
              for p in products+variants+bundles:
                  for b in vals(p):owners[b].add(p["id"])
              for p in products:
                  if not p.get("archived"):idx[norm(p.get("article"))].append(p)
              for c in cards:
                  for s in c.get("sizes",[]):
                      for b in s.get("skus",[]):wbowners[str(b)].add((c["nmID"],s["chrtID"]))
              plan=[];issues=[];already=[]
              for c in cards:
                  article=c.get("vendorCode");ps=idx[norm(article)]
                  skus=sorted({str(b) for s in c.get("sizes",[]) for b in s.get("skus",[])})
                  base={"article":article,"nmID":c["nmID"],"barcodes":skus}
                  if not skus:issues.append({**base,"reason":"no_barcodes"});continue
                  if len(ps)!=1:issues.append({**base,"reason":"missing_product" if not ps else "duplicate_article","candidates":[{"id":p["id"],"name":p["name"]} for p in ps]});continue
                  p=ps[0];base.update(id=p["id"],name=p["name"])
                  if len(c.get("sizes",[]))!=1 or p.get("variantsCount",0):issues.append({**base,"reason":"requires_variant_mapping"});continue
                  if any(len(wbowners[b])!=1 or owners[b]-{p["id"]} for b in skus):issues.append({**base,"reason":"barcode_conflict","owners":[{"id":q["id"],"article":q.get("article"),"name":q.get("name"),"archived":q.get("archived")} for q in products+variants+bundles if q["id"] in set().union(*(owners[b] for b in skus))],"wb_owners":{b:[list(v) for v in sorted(wbowners[b])] for b in skus}});continue
                  missing=[b for b in skus if b not in vals(p)]
                  if missing:plan.append({**base,"missing":missing,"before":p.get("barcodes",[])})
                  else:already.append(base)
              result.update(status="audited",cards_count=len(cards),product_count=len(products),plan=plan,issues=issues,already=already,planned_products=len(plan),planned_barcodes=sum(len(p["missing"]) for p in plan))
              db.put(KEY,result)
          
              if os.getenv("BARCODE_APPLY")=="1":
                  applied=list((prior or {}).get("applied",[]))
                  old_inflight=(prior or {}).get("inflight")
                  if old_inflight:
                      p=t.request(MS,"entity/product/"+old_inflight["id"])
                      if p.get("barcodes",[])==old_inflight["expected"]:
                          if not any(x["id"]==p["id"] for x in applied):applied.append({**old_inflight,"after":p["barcodes"],"reconciled":True})
                      elif p.get("barcodes",[])!=old_inflight["before"]:raise Stop("Previous inflight barcode state changed")
                  result.update(status="applying",applied=applied,writes=len(applied),inflight=None,inflight_batch=None);db.put(KEY,result)
                  for offset in range(0,len(plan),25):
                      fresh=w.ms_rows("entity/product")
                      current={p["id"]:p for p in fresh}
                      all_current=fresh+w.ms_rows("entity/variant")+w.ms_rows("entity/bundle")
                      own=collections.defaultdict(set)
                      for p in all_current:
                          for b in vals(p):own[b].add(p["id"])
                      changes=[]
                      for item in plan[offset:offset+25]:
                          live=current[item["id"]]
                          if norm(live.get("article"))!=norm(item["article"]) or live.get("archived") or live.get("variantsCount",0):raise Stop("Product identity changed")
                          missing=[b for b in item["missing"] if b not in vals(live)]
                          if not missing:continue
                          if any(own[b]-{live["id"]} for b in missing):raise Stop("Barcode collision on refreshed catalog")
                          before=live.get("barcodes",[])
                          changes.append({"id":live["id"],"article":live["article"],"before":before,"expected":before+[{"code128":b} for b in missing],"meta":{k:live["meta"][k] for k in ("href","type","mediaType")}})
                      if not changes:continue
                      result["inflight_batch"]=changes;db.put(KEY,result)
                      response=t.request(MS,"entity/product","POST",[{"meta":x["meta"],"barcodes":x["expected"]} for x in changes])
                      checked={p["id"]:p for p in w.ms_rows("entity/product")}
                      for x in changes:
                          if checked[x["id"]].get("barcodes",[])!=x["expected"]:raise Stop("Batch readback mismatch")
                          result["applied"].append({**x,"after":checked[x["id"]]["barcodes"]})
                      result["writes"]=len(result["applied"]);result["inflight_batch"]=None;db.put(KEY,result)
                  checked={p["id"]:p for p in w.ms_rows("entity/product")}
                  for item in plan+already:
                      if not set(item["barcodes"])<=vals(checked[item["id"]]):raise Stop("Final coverage mismatch")
                  for item in result["applied"]:
                      if not all(b in checked[item["id"]].get("barcodes",[]) for b in item["before"]):raise Stop("Existing barcode lost")
                  result.update(status="verified",verified_at=now(),covered_cards=len(plan)+len(already));db.put(KEY,result)
              print(json.dumps({k:result[k] for k in ["status","cards_count","planned_products","planned_barcodes","writes"]}))
          except Exception as e:
              result.update(status="error",error=str(e) if isinstance(e,Stop) else type(e).__name__)
              db.put(KEY,result);print("Audit stopped; details in private cache");raise SystemExit(1)
          
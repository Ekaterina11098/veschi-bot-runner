name: China morning delivery diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-morning-diagnose-20261016.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv > "$RUNNER_TEMP/install.log" 2>&1
      - name: Read exact morning job and isolated audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import json
          from advertising_agent.notify import db,cache_get
          state=cache_get('china_agent:demand_watch:v1') or {}
          result=[]
          for nm,e in state.get('price_history',{}).items():
              change=e.get('last_price_change') or e.get('increase') or {}
              if str(change.get('detected_at','')).startswith('2026-10-15'):
                  result.append(dict(nm_id=nm,article=e.get('article'),change=change,increase=e.get('increase')))
          print('YESTERDAY_CHANGES',json.dumps(result,ensure_ascii=False))
          PY

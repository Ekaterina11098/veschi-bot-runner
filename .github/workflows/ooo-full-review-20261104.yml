name: OOO full cabinet recommendation checks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ooo-full-review-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wb-ooo-advertising-owner
  cancel-in-progress: false
jobs:
  execute:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 3708405208147b76cb76ad9ae9b432377f652bee
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - run: python -m py_compile scripts/ooo_full_review_20261104.py
      - name: Execute exact owner-approved OOO scope with durable no-replay journal
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: python scripts/ooo_full_review_20261104.py

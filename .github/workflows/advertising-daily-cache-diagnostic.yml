name: Exact retained advertising pair diagnostic GET only
on:
  push:
    branches: [advertising-pair-retained-audit-20261017]
    paths: ['.github/workflows/advertising-daily-cache-diagnostic.yml']
permissions: {contents: write}
concurrency:
  group: wb-ip-advertising-agent
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 6eb5f990aecfa1a92909169ffd76f05ac6da469d
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install simplejson==3.20.2 requests==2.32.5 python-dotenv cryptography==46.0.2 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - run: python advertising_daily_cache_diagnostic.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ADVERTISING_EXECUTION_ENABLED: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-pair-retained-audit
          path: ${{ runner.temp }}/stock-deploy-proof/*.aes.json
          retention-days: 90
      - name: Preserve only encrypted diagnostic on this isolated branch
        if: always()
        run: |
          mkdir -p recovery-output/advertising
          for file in "$RUNNER_TEMP"/stock-deploy-proof/*.aes.json; do
            test -f "$file" || continue
            cp "$file" "recovery-output/advertising/pair-retained-audit-${{ github.run_id }}.aes.json"
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-output/advertising/pair-retained-audit-*.aes.json
          git diff --cached --quiet || git commit -m "Preserve encrypted retained pair diagnostic"
          git push origin HEAD:advertising-pair-retained-audit-20261017

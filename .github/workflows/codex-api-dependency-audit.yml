name: Codex API access dependency inventory
on:
  push:
    branches: [main]
    paths: ['scripts/audit_codex_api_dependencies.py','.github/workflows/codex-api-dependency-audit.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/recovery-output/
            !/recovery-vault/
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-audit
          persist-credentials: false
          filter: blob:none
      - name: Inventory auth/product dependencies without API credentials or business calls
        run: python scripts/audit_codex_api_dependencies.py

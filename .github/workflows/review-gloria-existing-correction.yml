name: Correct article in existing Gloria answer only
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/review-gloria-existing-correction.yml']
permissions: {contents: read}
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'psycopg[binary]==3.2.10' requests==2.32.5
      - name: Read, edit one existing answer once, verify exact text
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: python review_gloria_existing_correction.py

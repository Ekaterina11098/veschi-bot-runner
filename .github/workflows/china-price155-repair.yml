name: Owner repair Pavel price command155
on:
  push:
    paths: ['ops/china-price155-trigger.json']
permissions:
  contents: read
jobs:
  repair:
    if: github.repository == 'Ekaterina11098/veschi-bot-runner' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: china-confirmed-wb-price-writes
      cancel-in-progress: false
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: pip install requests==2.32.5 Pillow==11.3.0
      - run: |
          PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_china_zero_order*.py'
          PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_china_price_apply.py'
      - name: Prepare or apply exact reviewed command
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          PYTHONPATH: scripts
        run: python scripts/china_zero_order_price_execute.py

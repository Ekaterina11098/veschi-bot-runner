name: Issue 10 IP observed price event analysis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/issue-10-stage-one.yml']
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * *'
permissions:
  contents: read
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: c761b46907052a6cd669d8ce3c6f9710fbb7f8b9
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv aiogram apscheduler pillow > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Model isolation and source limited decision tests
        env:
          TASK: ip-regina-model-tests
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          for pattern in ('test_ip_daily_recommendations.py','test_ip_price_event_analysis.py','test_price_effect_recovery.py','test_ip_price_history.py','test_ip_regina_deterioration.py','test_ip_regina_model_review.py','test_ip_completed_investigations.py','test_stock_configuration.py','test_stock_limits.py','test_mpstats*.py'):
              run_private.execute('Regina finance once; no zero substitution or origin guessing',['-m','unittest','discover','-s','tests','-p',pattern])
          PY
      - name: Recover exact pilot traffic gaps from MPStats
        env:
          TASK: ip-event-traffic-gap
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          IP_RECOVERY_MODE: event_traffic
          IP_PERIOD_FROM: '2026-09-28'
          IP_PERIOD_TO: '2026-10-11'
          IP_EVENT_PILOT_NMS: '320251605,699208547'
        run: |
          python - <<'PY'
          import run_private
          run_private.execute('Exact MPStats pilot daily traffic gap; retain terminal results',['-m','analytics.ip_financial_period_recovery'])
          PY
      - name: Review both periods and refresh exact ten-color inventory gaps
        env:
          TASK: ip-price-event-analysis
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          run_private.execute('Regina financial bridge and exact inventory gap; no buyer bypass',['-m','analytics.ip_price_event_analysis'])
          PY

      - name: Notification dry run without Telegram
        env:
          TASK: ip-notification-preview
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          run_private.execute('Private notification preview; no Telegram',['-c',"""import json
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          from analytics.stage_one import read
          from analytics.collect import database,RUN_ID
          from analytics.ip_daily_recommendations import preview_notifications,POLICY_VERSION
          rows=read('analytics_snapshots',dict(source='eq.ip_daily_recommendations',cabinet='eq.token_2',select='payload',order='id.desc',limit=1))
          report=rows[0]['payload'][0]
          prior=read('analytics_snapshots',dict(source='eq.ip_notification_dry_run',cabinet='eq.token_2',select='payload',order='id.desc',limit=1))
          ledger=prior[0]['payload'][0]['preview']['preview_state'] if prior else None
          first=preview_notifications(report,ledger)
          repeat=preview_notifications(report,first['preview_state'])
          assert repeat['messages']==[]
          shared=json.loads(Path('business_agents/shared_knowledge.json').read_text())
          database('POST','telegram_api_cache',params={'on_conflict':'cache_key'},body=dict(cache_key='veschi:shared_knowledge:v1',payload=shared,expires_at=(datetime.now(timezone.utc)+timedelta(days=365)).isoformat()))
          database('POST','analytics_snapshots',body=dict(source='ip_notification_dry_run',cabinet='token_2',run_id=RUN_ID,period_from=report['period_from'],period_to=report['period_to'],payload=[dict(policy_version=POLICY_VERSION,preview=first,repeat_message_count=len(repeat['messages']),actual_telegram_calls=0)],status='complete'))
          """])
          PY

name: Owner four low-traffic CPC tests28 recovery
on:
  push:
    branches: [main]
    paths: [.github/workflows/china-owner-four-lowtraffic28.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: china-owner-advertising-write
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'Ekaterina11098/veschi-bot-runner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - run: python -m py_compile scripts/china_owner_four_lowtraffic28.py
      - name: Exact approved four CPC tests and WB verification
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: python scripts/china_owner_four_lowtraffic28.py

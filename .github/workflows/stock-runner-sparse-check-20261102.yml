name: Verify minimal stock runner checkout
on:
  push:
    paths: ['.github/workflows/stock-runner-sparse-check-20261102.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            content_group_destination.py
            stock_deploy_support.py
          sparse-checkout-cone-mode: false
      - run: python -m py_compile content_group_destination.py stock_deploy_support.py
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 2da9bb426bf17ed1ee609b5212a224b3fb43c08c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - run: pip install requests==2.32.5 python-dotenv==1.1.1 aiogram==3.22.0 simplejson==4.2.0 'psycopg[binary]==3.2.9' cryptography
      - name: Import complete daily entry without service calls
        env:
          PYTHONPATH: private-source:.
        run: python -c "import stock_deploy_support, stock_regular_job; print('Daily imports passed without service calls')"

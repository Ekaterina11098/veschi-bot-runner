name: China morning delivery diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-morning-diagnose-20261016.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv > "$RUNNER_TEMP/install.log" 2>&1
      - name: Read exact morning job and isolated audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import json
          from advertising_agent.notify import db,cache_get
          wanted=['11-FurScarf-black','12-FurScarf-coffee','145-FlorenceBag-black','30-2belts115-chocolate','42-Zont-Iblue','475-LucetteBag-green','482-RiginaBag-red','541-RayeBag-black','570-FloraBag-dbrown','589-BonnieBag-brown','591-AllaBag-coffee','592-AllaBag-brown','593-KendraBag-coffee','617-MayaBag-chocolate','9-FurPanama-lblue']
          snaps=db('GET','analytics_snapshots',params={'id':'eq.17719','cabinet':'eq.token_3','select':'id,payload,collected_at,period_from,period_to','limit':1})
          snap=snaps[0]; obs=snap['payload'][0]; raw=obs['data']['data']
          report=[]
          for article in wanted:
              found=[r for r in raw['data'] if r.get('sa_name','').casefold()==article.casefold()]
              report.append(dict(article=article,rows=[{k:r.get(k) for k in ('p_id','nm_id','sa_name','orders_count','sales_count','sparkline_orders','sparkline','returns_count','sales_sum_without_spp','returns_sum_without_spp')} for r in found],reason='absent_from_products_report' if not found else 'row_present_validation_needed'))
          print('MISSING_DIAGNOSIS',json.dumps(dict(id=snap['id'],period_from=snap['period_from'],period_to=snap['period_to'],total=raw.get('total'),row_count=len(raw['data']),need_update=raw.get('need_update'),items=report),ensure_ascii=False))
          PY

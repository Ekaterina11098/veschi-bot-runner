name: Owner agent isolation checks
on:
  push:
    paths: ['owner_agent/**', '.github/workflows/owner-agent*.yml']
  pull_request:
    paths: ['owner_agent/**', '.github/workflows/owner-agent*.yml']
permissions: {contents: read}
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --test owner_agent/test.mjs

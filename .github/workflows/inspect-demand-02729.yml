name: Inspect requested demand 02729
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-demand-02729.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bot-stock-and-commands
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read demand and pricing audit privately
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: python scripts/inspect_demand_02729.py

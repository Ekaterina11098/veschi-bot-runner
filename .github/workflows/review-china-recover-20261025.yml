name: Recover exactly three verified positive China reviews
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/review-china-recover-20261025.yml']
permissions: {contents: read}
concurrency:
  group: review-china-positive-recover-20261025
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 18649db15489c3dc77edc22bec5a4ddc5ed6a410
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'psycopg[binary]==3.2.10' requests==2.32.5 python-dotenv==1.1.1
      - run: python -m unittest test_review_auto_five_star.py test_review_morning.py
      - name: Enqueue only exact saved eligible reviews; no WB or Telegram calls
        env:
          PYTHONPATH: private-source:review-approval-preparation
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os,json,time,hmac,hashlib,psycopg
          from review_telegram_approval import Approval,Repository,sha,identity
          from review_approval_bridge import SQLSource,DurableBridge,reply_key
          from review_auto_five_star import CONFIG_KEY,enqueue,classify
          from review_durable_workflow import DurableReviews
          from review_queue import _request
          root=os.environ['SUPABASE_SECRET_KEY'].encode()
          pw=hmac.new(root,b'veschi:review-approval-login:20261015:v1',hashlib.sha256).hexdigest()
          with psycopg.connect(host='aws-0-eu-central-1.pooler.supabase.com',port=5432,dbname='postgres',user='review_approval_login_20261015.abxgjoqlddhtcmjcjwxw',password=pw,sslmode='require',autocommit=True,connect_timeout=15) as conn:
              repo=Repository(conn,postgres=True);source=SQLSource(conn)
              cfg=source.read('reviews:telegram-approval:config:v1')
              app=Approval(repo,'automatic-policy-only',str(cfg['owner_id']),str(cfg['chat_id']),str(cfg['bot_id']),enabled=True)
              app.chat=app.delivery_chat();bridge=DurableBridge(app,source);store=DurableReviews(_request)
              policy=source.read(CONFIG_KEY);report=[]
              for ident in ('UWOCLnzyhlGC78lrjtWZ','LdBRlxJVNLjHIzufp4BL','kvSXnQoqoyCHo8bmT5ca'):
                  observed=repo.get('events','china-missing-api:20261025:'+ident) or {}
                  body=observed.get('body') or {};item=body.get('data')
                  if observed.get('http_status')!=200 or body.get('error') or not isinstance(item,dict) or item.get('id')!=ident or time.time()-observed.get('checked_at',0)>4*3600:raise RuntimeError('Exact read unavailable or stale')
                  if not classify(item)['eligible']:raise RuntimeError('Review is not unambiguously positive')
                  if source.journal(reply_key('token_3','feedbacks',ident)) or source.was_notified('token_3','feedbacks',ident):
                      report.append(dict(item_id=ident,status='existing_manual_workflow'));continue
                  result=enqueue(app,bridge,store,item,'token_3','recovered-20261025-'+sha(ident)[:12],observed['checked_at'],policy)
                  report.append(dict(item_id=ident,**result))
              with repo.transaction():repo.put('events','china-positive-recovery:20261025:v1',dict(results=report,checked_at=time.time(),run_id=os.getenv('GITHUB_RUN_ID'),wb_calls=0,telegram_calls=0))
              print(json.dumps(report))
          PY

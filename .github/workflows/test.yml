name: Runner isolation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==12.3.0
      - run: python -m unittest -v test_runner_isolation.py test_mpstats_selector.py test_finance_daily_selector.py test_daily_selector.py test_analytics_pause.py

      - run: python -m unittest discover -s tests -p test_advertising_daily_tables.py -v
      - run: python -m unittest discover -s tests -p test_advertising_daily_png.py -v
      - run: python -m unittest discover -s tests -p test_advertising_weekly_png.py -v

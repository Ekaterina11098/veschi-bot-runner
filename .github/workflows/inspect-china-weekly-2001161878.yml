name: Inspect requested China weekly MS scope 2001161878
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-china-weekly-2001161878.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
          filter: blob:none
      - name: Read exact products and complete store stock
        shell: python
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import sys,json,collections,concurrent.futures
          sys.path.insert(0,"scripts")
          import fbs_document_chain as m
          class ReadOnly(m.Transport):
           def request(self,base,path,method="GET",body=None,params=None):
            if base==m.MS and method!="GET":raise m.Stop("MS writes prohibited")
            return super().request(base,path,method,body,params)
          t=ReadOnly();db=m.Cache(t);w=m.Worker(t,db,{})
          root="weekly_report_review:china:20261101:"
          plan=db.get(root+"plan:v1");assert plan["salesUnits"]==138
          sales=plan["sales"]
          config=db.get("fbs_document_chain:china:config:v1");template=config["templates"]["salesreturn"]
          out={"at":m.now(),"sales":sales,"status":"reading","products":{},"stock":{}}
          for k in ("organization","agent","store"):out[k]=t.request(m.MS,m.href(template[k])[len(m.MS):])
          out["rate"]=template["rate"];out["currency"]=t.request(m.MS,m.href(template["rate"]["currency"])[len(m.MS):])
          out["duplicate_orders"]=w.ms_rows("entity/customerorder",{"filter":"name=2001161878"})
          flt="store="+m.href(out["store"])
          for typ in ("customerorder","demand"):
           ds=w.ms_rows("entity/"+typ,{"filter":flt+";moment>=2026-09-01 00:00:00","order":"moment,desc"})
           out[typ+"_history"]=[{k:d.get(k) for k in ("id","name","moment","description","applicable","sum","organization","agent","store","rate","vatEnabled","vatIncluded","customerOrder")} for d in ds[:20]]
          db.put(root+"ms_preflight:v1",out)
          def product(a):
           rt=ReadOnly();rw=m.Worker(rt,None,{})
           return a,rw.ms_rows("entity/product",{"filter":"article="+a+";archived=false"})
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
           for a,ps in pool.map(product,set(sales)|set(plan["returns"])):out["products"][a]=ps
          db.put(root+"ms_preflight:v1",out)
          def norm(x):return m.href(x).split("?")[0]
          try:
           bulk=w.ms_rows("report/stock/all",{"filter":flt,"stockMode":"all","quantityMode":"all"})
           byid={norm(r):r for r in bulk};out["stock_source"]="complete store stock report"
           for a,ps in out["products"].items():out["stock"][a]=[byid[norm(ps[0])]] if len(ps)==1 and norm(ps[0]) in byid else []
          except m.Stop:
           out["stock_source"]="individual stock fallback"
           for a,ps in out["products"].items():
            if len(ps)==1:out["stock"][a]=w.ms_rows("report/stock/all",{"filter":flt+";product="+norm(ps[0]),"stockMode":"all","quantityMode":"all"})
          out["states"]=t.request(m.MS,"entity/customerorder/metadata").get("states",[])
          import decimal,urllib.request,xml.etree.ElementTree as ET
          from decimal import Decimal,ROUND_FLOOR
          xml=urllib.request.urlopen("https://www.cbr.ru/scripts/XML_daily.asp?date_req=03/11/2026",timeout=90).read()
          tree=ET.fromstring(xml);cny=[x for x in tree.findall("Valute") if x.findtext("CharCode")=="CNY"];assert len(cny)==1
          fx={"requested_date":"2026-11-03","effective_date":tree.attrib["Date"],"currency":"CNY","nominal":cny[0].findtext("Nominal"),"rub":cny[0].findtext("Value").replace(",","."),"source":"https://www.cbr.ru/scripts/XML_daily.asp?date_req=03/11/2026"}
          out["fx"]=fx;out["return_costs"]={};out["basis"]={}
          for a in plan["returns"]:
           ss=out["stock"].get(a,[])
           if len(ss)==1 and ss[0].get("price",0)>0:out["return_costs"][a]={"unit_kopecks":str(ss[0]["price"]),"source":"current FBO stock","at":m.now()}
          def ps(kind,ident,stock=False):
           if not stock:return w.ms_rows("entity/"+kind+"/"+ident+"/positions",{"expand":"assortment"})
           result=[];offset=0
           while True:
            page=t.request(m.MS,"entity/"+kind+"/"+ident+"/positions",params={"expand":"assortment","fields":"stock","limit":50,"offset":offset});batch=page["rows"];result+=batch;offset+=len(batch)
            if offset==page["meta"]["size"]:return result
            assert batch
          flt="store="+norm(out["store"])+";organization="+norm(out["organization"])+";agent="+norm(out["agent"])
          for d in w.ms_rows("entity/demand",{"filter":flt+";moment>=2026-01-01 00:00:00","order":"moment,desc"}):
           if not d.get("applicable"):continue
           order=d.get("customerOrder",{})
           if not norm(order).startswith(m.MS):continue
           order=t.request(m.MS,norm(order)[len(m.MS):])
           if "Китай ВБ" not in order.get("description","") or order.get("name")=="2001161878":continue
           positions=ps("demand",d["id"]);cap=collections.Counter()
           for p in positions:
            a=(p["assortment"].get("article") or "").strip().casefold()
            if a in plan["returns"] and a not in out["basis"]:cap[a]+=p["quantity"]
           if not cap:continue
           detail=t.request(m.MS,"entity/demand/"+d["id"]);used=collections.Counter()
           for ref in detail.get("returns",[]):
            r=t.request(m.MS,norm(ref)[len(m.MS):])
            for p in ps("salesreturn",r["id"]):used[(p["assortment"].get("article") or "").strip().casefold()]+=p["quantity"]
           for a,q in cap.items():
            if q-used[a]>=plan["returns"][a]:out["basis"][a]={"id":d["id"],"name":d["name"],"moment":d["moment"],"capacity":q,"returned":used[a]}
           for p in ps("demand",d["id"],True):
            a=(p["assortment"].get("article") or "").strip().casefold();cost=p.get("stock",{}).get("cost") or 0
            if a in cap and a not in out["return_costs"] and cost>0:out["return_costs"][a]={"unit_kopecks":str(Decimal(str(cost))/Decimal(str(p["quantity"]))),"source":"historical demand "+d["name"],"moment":d["moment"]}
           db.put(root+"ms_preflight:v1",out)
           if set(out["basis"])==set(plan["returns"]) and set(out["return_costs"])==set(plan["returns"]):break
          out["CK"]={}
          for a,cost in out["return_costs"].items():
           rub=Decimal(cost["unit_kopecks"])/100;assert rub>0
           out["CK"][a]=int((rub*Decimal(fx["nominal"])/Decimal(fx["rub"])).to_integral_value(rounding=ROUND_FLOOR))
          out["status"]="read_verified";out["completed_at"]=m.now();db.put(root+"ms_preflight:v1",out)
          print("Read-only requested weekly scope and stock stored privately.")
          
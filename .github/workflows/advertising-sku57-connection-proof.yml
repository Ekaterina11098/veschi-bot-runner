name: Read-only SKU57 recovery storage connection proof
on:
  push:
    branches: [main]
    paths: ['.github/workflows/advertising-sku57-connection-proof.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 3dc7e093d03a0839bf3d97bc76a51cee3b6981ec
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 simplejson==3.20.2 python-dotenv==1.1.1 cryptography==46.0.2 > "$RUNNER_TEMP/proof-dependencies.log" 2>&1
      - name: GET existing scope only, no WB or Telegram credentials
        env:
          PYTHONPATH: private-source
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_EGRESS_OPTIMIZED: 'false'
          ADVERTISING_EXECUTION_ENABLED: 'false'
        run: |
          python - <<'PY'
          import os,json,requests
          from urllib.parse import urlsplit
          from stock_deploy_support import seal,error
          native=requests.sessions.Session.request
          host=urlsplit(os.environ['SUPABASE_URL']).hostname
          def guarded(session,method,url,*a,**kw):
              if method.upper()!='GET' or urlsplit(url).hostname!=host:raise PermissionError('Read-only Supabase proof')
              return native(session,method,url,*a,**kw)
          requests.sessions.Session.request=guarded
          report={'wb_calls':0,'telegram_calls':0,'rows_created':0,'execution_enabled':False}
          try:
              from analytics.collect import database
              def get(table,params):return database('GET',table,params=params) or []
              report['registration']=get('advertising_telegram_chat',{'is_active':'eq.true','select':'chat_id,registered_by_user_id','limit':2})
              report['actions']=get('advertising_agent_actions',{'action_type':'eq.temporary_remove_product','select':'id,status,receipt,specification,approved_by,digest','limit':20})
              report['watches']=get('advertising_agent_watches',{'policy->>mode':'eq.sku_membership_recovery','campaign_id':'eq.39410834','nm_id':'eq.1007948808','select':'id,status,policy,state,next_check_at,expires_at','limit':20})
              report['success']=True
          except Exception as exc:report['success']=False;report['error']=error(exc)
          finally:seal('sku57-connection',report)
          print(json.dumps({k:report[k] for k in ('success','wb_calls','telegram_calls','rows_created','execution_enabled')}))
          raise SystemExit(0 if report['success'] else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-sku57-connection
          path: ${{ runner.temp }}/stock-deploy-proof/*.aes.json
          retention-days: 90
      - name: Preserve ciphertext only, never retry source
        if: always()
        run: |
          mkdir -p recovery-output/advertising
          cp "$RUNNER_TEMP/stock-deploy-proof/sku57-connection.aes.json" "recovery-output/advertising/sku57-connection-${{ github.run_id }}.aes.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-output/advertising/
          git commit -m "Preserve encrypted read-only SKU57 wiring proof"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
          done
          exit 1

name: Verify retained run attempt identity offline
on:
  push:
    branches: [fix-retained-run-attempt-20261017]
    paths: ['.github/workflows/advertising-retained-identity-verify.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 6eb5f990aecfa1a92909169ffd76f05ac6da469d
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m py_compile advertising_source_owner.py advertising_daily_owner.py
          python -m unittest test_advertising_daily_repair -v

name: Dated owner campaign membership and bid read
on:
  push:
    branches: [main]
    paths: ['scripts/owner_four_campaign_presence_read.py']
permissions:
  contents: read
jobs:
  read:
    if: false # Dated results read verified; do not replay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: china-dialog-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Read exact requested campaign membership; no writes or Telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: python scripts/owner_four_campaign_presence_read.py

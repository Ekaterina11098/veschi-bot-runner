name: Owner budgets recommendations only 4Nov
on:
  push:
    paths: ['.github/workflows/owner-budget-recommendations4.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-budget-recommendations4
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Bounded fresh growth economics; no model or Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: disabled
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import copy,json
          from datetime import datetime,timezone
          from china_cloud_cost_control import Cache
          from china_advertising_state import AdvertisingIO
          from china_daily_ad_actions import plan,BIND
          from china_loss_control import PLAN
          c=Cache();io=AdvertisingIO();ROOT='china_agent:budget_recommendations_only:2026-11-04:v1'
          if c.get(ROOT+':delivery'):raise ValueError('Existing edit journal; never replay')
          old=c.get('china_agent:advertising_artifacts:2026-11-04:v2');delivery=c.get('china_agent:advertising_delivery:2026-11-04:v1')
          f=next(x for x in old['files']if x['family']=='budgets')
          archive=dict(artifacts=old,delivery=delivery,binding=c.get(BIND+'671'))
          if not c.create(ROOT+':original',archive):raise ValueError('Archive exists; inspect before retry')
          p=plan(io,'2026-11-04',dict(family='budgets',actions=[]),1,slot='recommendations-only')
          caption='Китай · бюджеты · 2026-11-04 · рекомендации по резерву на три дня. Для пополнения нужны актуальная проверка условий и отдельная команда.'
          record=dict(status='editing',message_id=671,chat_id=-1004342917488,created_at=datetime.now(timezone.utc).isoformat(),wb_writes=0)
          if io.tg('getMe',{})['id']!=8780468043:raise ValueError('Bot identity')
          if not c.create(ROOT+':delivery',record):raise ValueError('Concurrent edit')
          try:
           r=io.tg('editMessageCaption',dict(chat_id=-1004342917488,message_id=671,caption=caption))
           if r.get('message_id')!=671 or r.get('chat',{}).get('id')!=-1004342917488:raise ValueError('Edit receipt mismatch')
           at=datetime.now(timezone.utc).isoformat();p.update(report_message_ids=[671],visible_from=at);io.put(PLAN+p['plan_id'],p)
           c.put(BIND+'671',dict(plan_id=p['plan_id'],plan_sha256=p['plan_sha256'],chat_id=-1004342917488,family='budgets'))
           new=copy.deepcopy(old)
           for file in new['files']:
            if file['family']=='budgets':file.update(plan_id=p['plan_id'],plan_sha256=p['plan_sha256'],action_count=0)
           c.put('china_agent:advertising_artifacts:2026-11-04:v2',new)
           for part in delivery['parts']:
            if part['kind']=='budgets:001':part.update(receipt=r,edited_at=at,plan_id=p['plan_id'],plan_sha256=p['plan_sha256'])
           c.put('china_agent:advertising_delivery:2026-11-04:v1',delivery)
           record.update(status='edited_verified',receipt=r,plan_id=p['plan_id'],new_action_count=0);c.put(ROOT+':delivery',record)
          except Exception as ex:record.update(status='uncertain',reason=str(ex));c.put(ROOT+':delivery',record);raise
          replykey=ROOT+':pavel_reply'
          if c.get(replykey):raise ValueError('Pavel reply exists')
          text='Павел, уточнение по бюджетам: четыре суммы — только рекомендации, условное согласование отменено. Пополнений по ним не было. Готовые пополнения предложим после проверки текущих условий.'
          s=dict(status='sending',chat_id=-1004342917488,text=text)
          if not c.create(replykey,s):raise ValueError('Concurrent reply')
          try:
           r=io.tg('sendMessage',dict(chat_id=-1004342917488,reply_to_message_id=678,text=text))
           if r.get('chat',{}).get('id')!=-1004342917488 or type(r.get('message_id'))is not int:raise ValueError('Reply receipt')
           s.update(status='sent',message_id=r['message_id'],receipt=r);c.put(replykey,s)
          except Exception as ex:s.update(status='uncertain',reason=str(ex));c.put(replykey,s);raise
          print(json.dumps(dict(status='corrected',budget_message=671,pavel_reply=s['message_id'],wb_writes=0)))
          PY

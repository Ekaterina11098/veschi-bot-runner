name: Owner authorized reply to Pavel27Oct
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-pavel-reply27.yml']
permissions:
  contents: read
concurrency:
  group: china-pavel-reply27-321
  cancel-in-progress: false
jobs:
  reply:
    if: ${{ false }} # Owner reply326 confirmed; dated one-off closed.
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python - <<'PY'
          import os,pathlib,urllib.request
          root=pathlib.Path('scripts');root.mkdir(exist_ok=True)
          for name in ['china_pavel_reply27.py','china_price_apply.py']:
              root.joinpath(name).write_bytes(urllib.request.urlopen('https://raw.githubusercontent.com/Ekaterina11098/veschi-bot-runner/'+os.environ['GITHUB_SHA']+'/scripts/'+name,timeout=40).read())
          PY
      - run: pip install requests==2.32.5 > /tmp/dependencies.log 2>&1
      - name: Send the reviewed reply once without marketplace calls
        run: PYTHONPATH=scripts python scripts/china_pavel_reply27.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: disabled
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}

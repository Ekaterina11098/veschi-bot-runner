name: Replace owner-requested PNG - delete old then send corrected
on:
  push:
    branches: [china-ad-test-png-delivery-20261023]
    paths: ['.github/workflows/china-ad-test-png-replacement.yml']
permissions:
  contents: read
jobs:
  replacement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 > "$RUNNER_TEMP/install.log" 2>&1
      - name: Delete specifically authorized old photo and deliver corrected frozen PNG
        env:
          PYTHONPATH: scripts
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          WB_TOKEN_3: NOT_PROVIDED_FOR_DELIVERY
        run: |
          python - <<'PY'
          import base64,json
          from china_price_apply import IO
          from china_loss_control import PLAN,CHAT,BOT
          from china_new_ads import LATEST,deliver
          io=IO();latest=io.get(LATEST);pid=latest['plan_id'];key='china_agent:new_ad_replacement:v1:'+pid
          record=io.get(key)
          if not record or record.get('owner_authorized_delete') is not True:raise ValueError('No exact owner deletion instruction')
          old=io.get('china_agent:new_ad_delivery:v1:'+record['old_plan_id'])
          if not old or old.get('status')!='sent' or old.get('message_id')!=record['old_message_id'] or old.get('chat_id')!=CHAT:raise ValueError('Old Telegram message not proven')
          if io.tg('getMe',{}).get('id')!=BOT:raise ValueError('Wrong bot')
          if record['status'] not in ('deleted','done'):
              if record['status'] in ('deleting','uncertain'):raise ValueError('Delete outcome uncertain; do not repeat blindly')
              record['status']='deleting';io.put(key,record)
              try:
                  result=io.tg('deleteMessage',dict(chat_id=CHAT,message_id=record['old_message_id']))
                  if result is not True:raise ValueError('Delete not confirmed')
                  record['status']='deleted';io.put(key,record)
              except Exception:
                  record['status']='uncertain';io.put(key,record);raise
          p=io.get(PLAN+pid);file=io.get('china_agent:new_ad_png:v1:'+pid)
          receipt=deliver(io,p,base64.b64decode(file['data'],validate=True))
          if receipt['status']=='sent':
              record.update(status='done',new_message_id=receipt['message_id']);io.put(key,record)
          print(json.dumps({'status':record['status'],'old_message_deleted':record['old_message_id'],'new_message_id':receipt.get('message_id'),'wb_writes':0}))
          PY

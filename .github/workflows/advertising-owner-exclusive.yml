name: IP exclusive current campaign read only, owner preparation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/advertising-owner-exclusive.yml']
permissions:
  contents: write
concurrency:
  group: wb-ip-advertising-agent
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 1b4201067880e379d8dacbe5f6ca3f9848d6ffb0
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 python-dotenv cryptography==46.0.2 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Current membership and single due budget, no historical WB analytics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          SUPABASE_EGRESS_OPTIMIZED: 'true'
        run: python advertising_exclusive_owner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-advertising-exclusive
          path: ${{ runner.temp }}/stock-deploy-proof/*.aes.json
          retention-days: 90
      - name: Independent ciphertext
        if: always()
        run: |
          mkdir -p recovery-output/advertising
          cp "$RUNNER_TEMP/stock-deploy-proof/advertising-exclusive.aes.json" "recovery-output/advertising/exclusive-${{ github.run_id }}.aes.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-output/advertising/
          git commit -m "Preserve encrypted current campaign receipt"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
          done
          exit 1

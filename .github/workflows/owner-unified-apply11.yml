name: Owner approved Advertising menu11Nov
on:
  push:
    paths: ['.github/workflows/owner-unified-apply11.yml']
permissions: {contents: read}
concurrency:
  group: china-owner-ui-menu11
  cancel-in-progress: false
jobs:
  verify-menu:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify navigation and preserve report confirmations
        run: |
          mkdir -p work/main-menu11 work/advertising-menu11
          node scripts/test_main_menu.mjs
          node scripts/test_sales_full_path.mjs
          node scripts/test_direct_ads.mjs
          node scripts/test_advertising_ui.mjs
      - name: Deliver exact owner approved menu once without marketplace calls
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: |
          node scripts/owner_daily_table_png11.mjs
          node scripts/owner_advertising_drr_menu11.mjs

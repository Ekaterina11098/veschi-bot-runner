name: Resurface unanswered cards for new content employee
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/review-history-resurface-20261109.yml']
permissions:
  contents: read
concurrency:
  group: review-history-resurface-20261109
  cancel-in-progress: false
jobs:
  resurface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /review_history_resurface.py
            /test_review_history_resurface.py
            /review-approval-preparation/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'psycopg[binary]==3.2.10'
      - run: python -m unittest test_review_history_resurface.py
      - name: Deliver one-time pending cards without publishing answers
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python -u - <<'PY'
          import os,sys,hmac,hashlib,base64,json,urllib.request,time
          sys.path.insert(0,'review-approval-preparation')
          import psycopg
          from review_telegram_approval import Approval,Repository
          from review_history_resurface import resurface
          batch='employee-history-20261109-v1'
          root=os.environ['SUPABASE_SECRET_KEY'].encode()
          password=hmac.new(root,b'veschi:review-approval-login:20261015:v1',hashlib.sha256).hexdigest()
          with psycopg.connect(host='aws-0-eu-central-1.pooler.supabase.com',port=5432,dbname='postgres',user='review_approval_login_20261015.abxgjoqlddhtcmjcjwxw',password=password,sslmode='require',autocommit=True,connect_timeout=15,options='-c statement_timeout=30000') as conn:
              row=conn.execute("SELECT payload FROM review_approval.source_cache WHERE cache_key='reviews:telegram-approval:config:v1'").fetchone()
              cfg=row[0] if row else {}
              if not cfg.get('enabled') or not cfg.get('destination_verified'):raise SystemExit('Unverified destination')
              secret=base64.b64encode(hmac.new(root,b'veschi:review-approval-ingress:20261015:v1',hashlib.sha256).digest()).decode()
              app=Approval(Repository(conn,postgres=True),secret,cfg['owner_id'],cfg['chat_id'],cfg['bot_id'],enabled=True)
              if app.group_chat()!='-1003932246120':raise SystemExit('Wrong content group')
              key='history-resurface:'+batch+':plan'
              with app.repo.transaction():
                  conn.execute("SELECT pg_advisory_xact_lock(hashtextextended(%s,0))",(key,))
                  plan=app.repo.get('events',key)
                  if not plan:
                      rows=conn.execute("""SELECT c.id FROM review_approval.items i JOIN review_approval.cards c ON c.id=i.payload::jsonb->>'token'
                        WHERE c.payload::jsonb->>'chat_id'=%s
                        AND ((c.payload::jsonb->>'status'='awaiting' AND i.payload::jsonb->>'status'='open')
                          OR (c.payload::jsonb->>'status'='rework' AND i.payload::jsonb->>'status'='rework'))
                        AND NOT EXISTS (SELECT 1 FROM review_approval.intents n WHERE n.payload::jsonb->>'ref'=i.id)
                        ORDER BY (c.payload::jsonb->>'message_id')::bigint""",(app.group_chat(),)).fetchall()
                      if len(rows)>50:raise RuntimeError('Unexpected scope size')
                      plan=dict(tokens=[r[0] for r in rows],created_at=time.time())
                      app.repo.put('events',key,plan)
              class SendOnly:
                  def call(self,method,payload):
                      if method!='sendMessage' or str(payload.get('chat_id'))!=app.group_chat():raise RuntimeError('Outside authorized delivery')
                      request=urllib.request.Request('https://api.telegram.org/bot'+os.environ['TELEGRAM_BOT_TOKEN']+'/sendMessage',data=json.dumps(payload,ensure_ascii=False).encode(),headers={'Content-Type':'application/json'},method='POST')
                      with urllib.request.urlopen(request,timeout=20) as response:data=json.load(response)
                      if data.get('ok') is not True:raise RuntimeError('Telegram delivery unconfirmed')
                      return data['result']
              transport=SendOnly()
              counts={}
              for token in plan['tokens']:
                  result=resurface(app,transport,token,batch)
                  status=result['status'];counts[status]=counts.get(status,0)+1
                  print(json.dumps(dict(card_token=token,status=status,message_id=result.get('message_id'))),flush=True)
                  if status in ('submitting','uncertain'):raise SystemExit('Unknown delivery result; read-only reconciliation required')
                  time.sleep(1.1)
              print(json.dumps(counts))
          PY

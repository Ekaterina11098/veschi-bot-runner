name: Advertising saved-data questions only
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Exact newly routed saved-dialogue job
        required: true
        type: string
permissions: {contents: read}
concurrency:
  group: ip-bounded-cloud-answers
  cancel-in-progress: false
  queue: max
jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 63a6fdb0276c8af48330e7656f6293d0ab44c5c5
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ip_dialog_png.py
            /ip_cloud_dialog.py
            /ip_cloud_prepare.py
            /test_ip_cloud_dialog.py
            /advertising_budget_evidence.py
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: a0d222353b1fb120fb66a114f64f463e2f936a28
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 cryptography==46.0.2 Pillow==12.3.0 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Focused offline regression; no credentials
        run: python -m unittest test_ip_cloud_dialog
      - name: Prepare compact saved evidence once; no sources or model
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python ip_cloud_prepare.py
      - name: One bounded Sol answer and confirmed delivery; no WB credentials
        env:
          DIALOG_JOB_ID: ${{ inputs.job_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADVERTISING_TELEGRAM_BOT_TOKEN: ${{ secrets.ADVERTISING_TELEGRAM_BOT_TOKEN }}
          ADVERTISING_EXECUTION_ENABLED: 'false'
        run: |
          if ! [[ "$DIALOG_JOB_ID" =~ ^[1-9][0-9]*$ ]]; then exit 1; fi
          python ip_cloud_dialog.py --job "$DIALOG_JOB_ID"

      - name: Check queue completion without a model or new schedule
        if: always()
        env:
          IP_CLOUD_RUN_FAILED: ${{ job.status == 'failure' && 'true' || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ADVERTISING_TELEGRAM_BOT_TOKEN: ${{ secrets.ADVERTISING_TELEGRAM_BOT_TOKEN }}
        run: python ip_cloud_dialog.py --health

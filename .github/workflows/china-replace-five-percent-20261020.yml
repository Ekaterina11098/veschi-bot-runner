name: China one-time five percent report replacement
on:
  push:
    branches: [china-report-five-percent-owner-20261020]
    paths: ['china_replace_five_percent_20261020.py']
permissions:
  contents: read
concurrency:
  group: china-owner-report-replacement-20261020
  cancel-in-progress: false
jobs:
  replace:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - name: Replace exact report once without WB writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: python china_replace_five_percent_20261020.py

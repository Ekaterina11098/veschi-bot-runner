name: Diagnose saved five-star semantic routing without external writes
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/review-positive-live-probe-20261104.yml']
permissions: {contents: read}
concurrency:
  group: review-positive-live-probe-20261104
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, filter: "blob:none", sparse-checkout-cone-mode: false, sparse-checkout: "/*.py\n/review-approval-preparation/*.py"}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 18649db15489c3dc77edc22bec5a4ddc5ed6a410
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: '/*.py'
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'psycopg[binary]==3.2.10' requests==2.32.5 python-dotenv==1.1.1
      - name: Enqueue only exact saved eligible reviews; no WB or Telegram calls
        env:
          PYTHONPATH: private-source:review-approval-preparation
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_SEMANTIC_AUTO_FIVE_STAR: '1'
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: |
          python - <<'PY'
          import os,json,time,hmac,hashlib,psycopg
          from review_telegram_approval import Repository
          from review_auto_five_star import classify
          root=os.environ['SUPABASE_SECRET_KEY'].encode()
          pw=hmac.new(root,b'veschi:review-approval-login:20261015:v1',hashlib.sha256).hexdigest()
          with psycopg.connect(host='aws-0-eu-central-1.pooler.supabase.com',port=5432,dbname='postgres',user='review_approval_login_20261015.abxgjoqlddhtcmjcjwxw',password=pw,sslmode='require',autocommit=True,connect_timeout=15) as conn:
              repo=Repository(conn,postgres=True)
              state=repo.get('events','reviews-morning:2026-11-04') or {}
              results=[]
              for cabinet,scope in state.get('scopes',{}).items():
                  for item in scope.get('items',[]):
                      if item.get('productValuation')!=5:continue
                      result=dict(cabinet=cabinet,item_id=item['id'],assessment=classify(item))
                      results.append(result)
                      with repo.transaction():repo.put('events','positive-semantic-diagnostics:20261104:v2',dict(results=results,checked_at=time.time(),run_id=os.getenv('GITHUB_RUN_ID')))
                      print(json.dumps(result))
          PY

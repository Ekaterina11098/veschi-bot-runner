name: IP API diagnostic respecting existing shared cooldown
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ip-api-diagnosis-20261102.yml']
permissions: {}
concurrency:
  group: wb-ip-advertising-agent
  cancel-in-progress: false
jobs:
  read:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Read exact WB configuration and candidate cards
        env:
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import os,json,urllib.request,urllib.error,urllib.parse,datetime,time,gzip,hashlib,re
          KEY='ip_agent:wave1_wb_read:2026-11-02:v1'
          SB=os.environ['SUPABASE_URL'].rstrip('/')
          sh={'apikey':os.environ['SUPABASE_SECRET_KEY'],'Authorization':'Bearer '+os.environ['SUPABASE_SECRET_KEY'],'Content-Type':'application/json'}
          wh={'Authorization':os.environ['WB_TOKEN_2'],'Content-Type':'application/json'}
          def stamp():return datetime.datetime.now(datetime.timezone.utc).isoformat()
          class NR(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*a,**k):raise RuntimeError('Redirect blocked')
          opener=urllib.request.build_opener(NR)
          def call(url,headers,method='GET',body=None):
           req=urllib.request.Request(url,headers=headers,method=method,data=None if body is None else json.dumps(body).encode())
           try:
            with opener.open(req,timeout=50) as r:
             b=r.read()
             if r.headers.get('Content-Encoding')=='gzip':b=gzip.decompress(b)
             return json.loads(b) if b else None
           except urllib.error.HTTPError as e:raise RuntimeError('HTTP '+str(e.code)+' RetryAfter '+str(e.headers.get('Retry-After','unknown'))) from None
          def get(key):
           r=call(SB+'/rest/v1/telegram_api_cache?'+urllib.parse.urlencode({'cache_key':'eq.'+key,'select':'payload'}),sh)
           return r[0]['payload'] if r else None
          def save():
           call(SB+'/rest/v1/telegram_api_cache?on_conflict=cache_key',dict(sh,Prefer='resolution=merge-duplicates'),'POST',{'cache_key':KEY,'payload':out,'updated_at':stamp(),'expires_at':'2036-11-02T00:00:00Z'})
          KEY='ip_agent:api_diagnosis:2026-11-02:v1'
          if get(KEY):raise SystemExit('Existing diagnosis preserved')
          scope=get('ip_agent:expanded98:2026-11-02:v1')
          if not scope or len(scope.get('scope',[]))!=98:raise ValueError('Approved scope absent')
          endpoint='/api/advert/v2/adverts'
          pause='wb-pause:'+hashlib.sha256((os.environ['WB_TOKEN_2']+'advert-api.wildberries.ru'+endpoint).encode()).hexdigest()
          out={'status':'checking_transport','started_at':stamp(),'wb_writes':0,'telegram_calls':0,'run_id':os.environ['GITHUB_RUN_ID'],'business_requests':0}
          existing=get(pause) or {}
          remaining=max(0,float(existing.get('until',0))-time.time()+1)
          out['shared_pause_remaining_seconds']=round(remaining);save()
          if remaining>900:
           out.update(status='deferred_shared_cooldown',next_allowed_at=datetime.datetime.fromtimestamp(existing['until'],datetime.timezone.utc).isoformat());save();raise SystemExit()
          if remaining:time.sleep(remaining)
          existing=get(pause) or {}
          if float(existing.get('until',0))>time.time()+1:
           out.update(status='deferred_extended_cooldown',next_allowed_at=datetime.datetime.fromtimestamp(existing['until'],datetime.timezone.utc).isoformat());save();raise SystemExit()
          cid=next(x['campaign'] for x in scope['scope'] if x.get('campaign'))
          req=urllib.request.Request('https://advert-api.wildberries.ru'+endpoint+'?ids='+str(cid),headers=dict(wh,**{'User-Agent':'python-requests/2.32.5'}))
          allowed={'retry-after','x-ratelimit-retry','x-ratelimit-reset','x-ratelimit-limit','x-ratelimit-remaining','content-type','server','date'}
          out['business_requests']=1;out['requested_at']=stamp()
          try:
           with opener.open(req,timeout=55) as response:
            out.update(http_status=response.status,headers={k.lower():v for k,v in response.headers.items() if k.lower() in allowed},configuration=json.loads(response.read()),status='read_verified')
          except urllib.error.HTTPError as e:
           headers={k.lower():v for k,v in e.headers.items() if k.lower() in allowed}
           body=e.read(4096).decode('utf-8','replace').replace(os.environ['WB_TOKEN_2'],'[REDACTED]')
           body=re.sub(r'eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+','[JWT REDACTED]',body)
           out.update(status='http_error',http_status=e.code,headers=headers,error_body_private=body)
           retry=headers.get('retry-after') or headers.get('x-ratelimit-retry')
           if e.code==429 and retry:
            try:
             seconds=float(retry)
             previous=get(pause) or {}
             until=max(float(previous.get('until',0)),time.time()+seconds+1)
             call(SB+'/rest/v1/telegram_api_cache?on_conflict=cache_key',dict(sh,Prefer='resolution=merge-duplicates'),'POST',{'cache_key':pause,'payload':{'until':until,'basis':'diagnostic_429_provider_header'},'updated_at':stamp(),'expires_at':datetime.datetime.fromtimestamp(until+61,datetime.timezone.utc).isoformat()})
             out['next_allowed_at']=datetime.datetime.fromtimestamp(until,datetime.timezone.utc).isoformat()
            except ValueError:out['retry_header_parse']='date_or_unknown'
          except Exception as e:out.update(status='transport_error',error_type=type(e).__name__)
          out['finished_at']=stamp();save()
          print(json.dumps({'status':out['status'],'http_status':out.get('http_status'),'wb_writes':0,'telegram_calls':0}))

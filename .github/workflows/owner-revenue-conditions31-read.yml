name: Owner revenue diagnosis read31
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-revenue-conditions31-read.yml']
permissions: {contents: read}
jobs:
  read:
    if: ${{ github.event.head_commit.message == 'Read current conditions for China revenue diagnosis31' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - run: python -m py_compile scripts/owner_revenue_conditions31_read.py
      - name: Read only five China products, save privately
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: python scripts/owner_revenue_conditions31_read.py

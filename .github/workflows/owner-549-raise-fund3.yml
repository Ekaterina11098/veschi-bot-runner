name: Owner approved 549 raise and funding 3Nov
on:
  push:
    paths: ['.github/workflows/owner-549-raise-fund3.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-549-raise-fund3
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Exact owner 549 bid and 100 CNY funding; durable journals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: disabled
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import copy,json,time,os,requests
          from datetime import datetime,timezone
          from china_cloud_cost_control import Cache,WB,validate_identity,projection,stamp
          from china_moysklad_read import read_stock
          from china_morning_readiness import current_prices,published_stock
          from china_price_apply import IO
          ROOT='china_agent:owner_549_raise_fund:2026-11-03:v1'
          CID=41332083
          NM=1473244000
          def norm(v):return json.loads(json.dumps(v))
          c=Cache()
          def put(k,v):c.put(k,norm(v))
          def approve():
           a=c.get(ROOT+':approval')or{}
           if not(a.get('status')=='approved'and a.get('owner_user_id')==5122667182 and a.get('source_channel')=='codex'and a.get('cabinet')=='token_3'and a.get('execution_authorized')is True):raise ValueError('Approval absent')
           if (a['campaign_id'],a['nm_id'],a['placement'],a['old_minor'],a['target_minor'],a['deposit_cny'])!=(CID,NM,'search',28,30,100):raise ValueError('Scope changed')
           if datetime.now(timezone.utc)>=datetime.fromisoformat(a['expires_at'])or datetime.now(timezone.utc).date().isoformat()!='2026-11-03':raise ValueError('Approval expired')
           return a
          class Scoped(WB):
           def req(self,path,method='GET',body=None,write=False):
            bare=path.split('?')[0]
            if write:
             approve()
             good=method=='POST'and path=='/adv/v1/budget/deposit?id=41332083'and isinstance(body,dict)and set(body)=={'sum','type'}and body['sum']==100 and body['type']in[0,1]
             good=good or(method=='PATCH'and path=='/api/advert/v1/bids'and body=={'bids':[{'advert_id':CID,'nm_bids':[{'nm_id':NM,'placement':'search','bid_kopecks':30}]}]})
             if not good:raise ValueError('Write outside exact owner scope')
            elif (method,bare)not in[('GET','/api/advert/v2/adverts'),('GET','/api/advert/v1/config'),('GET','/adv/v1/balance'),('POST','/api/advert/v2/budget'),('POST','/api/advert/v1/bids/min')]:raise ValueError('Read outside scope')
            time.sleep(1.4)
            r=requests.request(method,'https://advert-api.wildberries.ru'+path,headers={'Authorization':self.token},json=body,timeout=55)
            if not r.ok:raise RuntimeError('WB HTTP '+str(r.status_code))
            return r.json()if r.content else{}
          def budget(w):
           j=w.req('/api/advert/v2/budget','POST',{'advertIds':[CID]})['adverts']
           if len(j)!=1 or j[0]['advertId']!=CID or j[0]['currency']!='CNY':raise ValueError('Budget currency/identity unknown')
           return j[0]['total']
          def main():
           if os.environ.get('GITHUB_REPOSITORY')!='Ekaterina11098/veschi-bot-runner'or os.environ.get('GITHUB_REF')!='refs/heads/main':raise ValueError('Public main only')
           approve()
           if c.get(ROOT+':execution'):print('Existing execution; never replay');return
           w=Scoped();validate_identity(c,w)
           e={'status':'preflight','created_at':stamp(),'campaign_id':CID,'nm_id':NM,'approval_key':ROOT+':approval','steps':{},'wb_writes':0,'telegram_calls':0,'price_writes':0,'stock_writes':0}
           if not c.create(ROOT+':execution',e):return
           def save():put(ROOT+':execution',e)
           try:
            before=w.campaigns([CID])[str(CID)];cfg=w.req('/api/advert/v1/config');wallet=w.req('/adv/v1/balance')
            if before['status']!=9 or before['currency']!='CNY'or before['bid_type']!='manual'or before['settings']['payment_type']!='cpc'or before['settings']['placements']['search']is not True:raise ValueError('Campaign mode changed')
            ns=next(n for n in before['nm_settings']if n['nm_id']==NM);old=ns['bids_kopecks']['search']
            if old not in[28,30]:raise ValueError('Unexpected bid; no write')
            if cfg['currency']!='CNY'or 30%cfg['cpcStep']or 30>cfg['cpcMaxBid']or cfg['minTopUp']/100>100:raise ValueError('Config incompatible')
            minimum=w.minimums(CID,[NM],'search')[NM]
            if minimum>30:raise ValueError('Minimum exceeds approved target')
            io=IO();prices=current_prices(io,[NM]);pub=published_stock(io,prices,[NM]);stock=read_stock(['549-GloriaBag-darkbrown'])
            if not stock['coverage_complete']or pub['missing_nm_ids']:raise ValueError('Incomplete stock')
            p=next(r for r in prices['rows']if r['nm_id']==NM);s=stock['rows'][0]
            if p['article']!='549-GloriaBag-darkbrown'or p['currency']!='CNY'or p['seller_price']!=409.5 or s['article']!=p['article']or s['stock']-s['reserve']<=0 or pub['amounts'].get(str(NM),pub['amounts'].get(NM,0))<=0:raise ValueError('Price/stock changed')
            prior=c.get('china_agent:owner_growth_review:2026-11-03:v1')['economics']['rows'][str(NM)]
            margin=prior['expected_margin_before_ads_cny']-prior['buyout']*(s['price']/100-prior['own_cogs_rub'])/12.1714
            if margin<=11.85 or s['price']<=0:raise ValueError('Economics no longer positive')
            b=budget(w)
            if wallet.get('currency')!='CNY':raise ValueError('Wallet currency unknown')
            source=0 if wallet.get('balance',0)>=100 else 1 if wallet.get('net',0)>=100 else None
            if source is None:raise ValueError('Insufficient unsplit wallet')
            e.update(before=before,preflight={'prices':prices,'stock':stock,'published_stock':pub,'minimum_minor':minimum,'config':cfg,'budget':b,'wallet':wallet,'margin_before_ads_cny':margin},status='applying');save()
            # Journal before each request: never replay even if response was lost.
            key=ROOT+':fund:execution'
            step={'status':'submitting','before_budget':budget(w),'amount_cny':100,'source':source,'submitted_at':stamp(),'parent':ROOT+':execution'}
            if step['before_budget']>b+2:raise ValueError('Concurrent funding observed')
            if projection(w.campaigns([CID])[str(CID)])!=projection(before):raise ValueError('Campaign changed')
            if not c.create(key,step):raise ValueError('Funding journal exists; no replay')
            e['steps']['fund']=key;e['wb_writes']+=1;save()
            try:
             step['response']=w.req('/adv/v1/budget/deposit?id=41332083','POST',{'sum':100,'type':source},write=True);step['status']='accepted';put(key,step)
             for n in range(5):
              after=budget(w);step['after_budget']=after
              if step['before_budget']+97<=after<=step['before_budget']+100:break
              if n<4:time.sleep(3)
             else:raise ValueError('Funding uncertain; never replay')
             step.update(status='verified',verified_at=stamp());put(key,step)
            except Exception as ex:
             step.update(status='uncertain',reason=str(ex));put(key,step);raise
            base=w.campaigns([CID])[str(CID)]
            if projection(base)!=projection(before):raise ValueError('Campaign changed after funding')
            if old==30:e['bid_status']='already_target'
            else:
             target=copy.deepcopy(base)
             next(n for n in target['nm_settings']if n['nm_id']==NM)['bids_kopecks']['search']=30
             body={'bids':[{'advert_id':CID,'nm_bids':[{'nm_id':NM,'placement':'search','bid_kopecks':30}]}]}
             key=ROOT+':bid:execution';step={'status':'submitting','before':base,'expected':target,'body':body,'submitted_at':stamp(),'parent':ROOT+':execution'}
             if not c.create(key,step):raise ValueError('Bid journal exists; no replay')
             e['steps']['bid']=key;e['wb_writes']+=1;save()
             try:
              step['response']=w.req('/api/advert/v1/bids','PATCH',body,write=True);step['status']='accepted';put(key,step)
              for n in range(5):
               after=w.campaigns([CID])[str(CID)];step['after']=after
               if projection(after)==projection(target):break
               if n<4:time.sleep(3)
              else:raise ValueError('Bid readback uncertain; never replay')
              step.update(status='verified',verified_at=stamp());put(key,step);e['bid_status']='verified'
              registry=c.get('china_agent:verified_campaign_state:v1')or{};registry[str(CID)]=key;put('china_agent:verified_campaign_state:v1',registry)
             except Exception as ex:
              step.update(status='uncertain',reason=str(ex));put(key,step);raise
            e.update(status='verified',verified_at=stamp(),after=w.campaigns([CID])[str(CID)],final_budget=budget(w));save()
           except Exception as ex:
            e.update(status='partial_or_uncertain'if e['steps']else'blocked',reason=str(ex),completed_at=stamp());save()
           print(json.dumps({k:e.get(k)for k in['status','wb_writes','bid_status','final_budget','reason']}))
          if __name__=='__main__':main()
          PY

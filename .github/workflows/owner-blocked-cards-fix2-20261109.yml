name: Owner blocked gallery preflight recovery
on:
  push:
    paths:
      - '.github/workflows/owner-blocked-cards-fix2-20261109.yml'
permissions:
  contents: read
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  read:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 10ca471ebdc30e8979abeb6286434c51fe218931
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Correct and verify exact gallery with explicit preflight failure
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          """Exact owner-approved remediation of unrelated promotional gallery frames."""
          import os,json,base64,time,hashlib,io as bio
          from datetime import datetime,timezone
          import requests
          from PIL import Image,ImageChops,ImageStat
          from china_loss_execute import IO
          ROOT='china_agent:owner_blocked_cards:2026-11-09:v1:fix:attempt2'
          SCOPE={1473243821:[9,11],1473243826:[9,11],1473246040:[4,9,11,12]}
          def stamp():return datetime.now(timezone.utc).isoformat()
          def get_image(url):
           assert url.startswith('https://basket-47.wbbasket.ru/')
           r=requests.get(url,timeout=30);assert r.ok
           im=Image.open(bio.BytesIO(r.content));assert im.width>=700 and im.height>=900
           return r.content,im.convert('RGB')
          def core(c):return {k:v for k,v in c.items()if k not in ['photos','updatedAt']}
          def main():
           assert os.environ['GITHUB_REPOSITORY']=='Ekaterina11098/veschi-bot-runner'and os.environ['GITHUB_REF']=='refs/heads/main'
           io=IO()
           if io.get(ROOT):return
           p=io.get('china_agent:owner_blocked_cards:2026-11-09:v1:read');assert p['status']=='complete'
           claims=json.loads(base64.urlsafe_b64decode(io.token.split('.')[1]+'='*(-len(io.token.split('.')[1])%4)))
           assert claims.get('t')is False and claims.get('exp',0)>time.time()and not(int(claims.get('s',0))&(1<<30))
           ids=io.db('analytics_snapshots?cabinet=eq.token_3&source=eq.seller_identity&status=eq.complete&select=payload&limit=100')
           assert {x['payload'].get('sid')for x in ids}=={claims.get('sid')}and claims.get('sid')
           cards={str(c['nmID']):c for c in p['cards']};assert set(cards)==set(map(str,SCOPE))
           e=dict(status='prepared',source_quote='Тепрь проверь: заблокированы 3 карточки товаров. Найди причину. Смотри через апи, исправь',source='codex_owner',before=cards,actions=[],wb_writes=0,telegram_calls=0,prepared_at=stamp())
           assert io.create(ROOT,e)
           for nm,removed in SCOPE.items():
            original=cards[str(nm)];current=io.card(nm)
            different=[k for k in set(core(current))|set(core(original))if core(current).get(k)!=core(original).get(k)]
            assert not different,'Card changed fields: '+','.join(different)
            assert current['photos']==original['photos'],'Card photos changed after diagnosis'
            steps=[]
            if nm==1473243821:
             # Preserve existing video: replace only2 promotional image slots.
             for target,source in [(9,3),(11,7)]:
              data,im=get_image(original['photos'][source-1]['big'])
              steps.append(dict(kind='replace_slot',slot=target,source_slot=source,data=data,source_image=im))
            else:
             assert not original.get('video'),'Unexpected video; do not discard it'
             urls=[x['big']for i,x in enumerate(original['photos'],1)if i not in removed]
             source_images=[get_image(url)[1].resize((64,64))for url in urls]
             steps=[dict(kind='remove_frames',removed=removed,urls=urls,source_images=source_images)]
            child=ROOT+':card:'+str(nm);ce=dict(status='prepared',nm_id=nm,removed_or_replaced=removed,before_photo_count=len(original['photos']),steps=[],video_preserved=bool(original.get('video')))
            assert io.create(child,ce)
            for st in steps:
             step={k:v for k,v in st.items()if k not in['data','source_image','source_images']};step['status']='writing';ce['steps'].append(step);ce['status']='writing';io.put(child,ce)
             e['wb_writes']+=1;e['status']='writing';io.put(ROOT,e)
             try:
              if st['kind']=='replace_slot':
               r=requests.post('https://content-api.wildberries.ru/content/v3/media/file',headers={'Authorization':io.token,'X-Nm-Id':str(nm),'X-Photo-Number':str(st['slot'])},files={'uploadfile':('product.webp',st['data'],'image/webp')},timeout=60)
              else:
               r=requests.post('https://content-api.wildberries.ru/content/v3/media/save',headers={'Authorization':io.token},json={'nmId':nm,'data':st['urls']},timeout=60)
              step['http_status']=r.status_code
              if not r.ok:step['status']='rejected';step['error']=r.text[:500];ce['status']='blocked';io.put(child,ce);raise RuntimeError('WB media HTTP '+str(r.status_code))
              j=r.json();assert j.get('error')is False,j.get('errorText','WB media error')
              step['status']='accepted';step['response']=j;io.put(child,ce)
             except Exception as ex:
              if step['status']=='writing':step['status']='uncertain'
              ce['status']='uncertain'if step['status']=='uncertain'else'blocked';ce['error']=type(ex).__name__;io.put(child,ce)
              e['status']=ce['status'];e['error']=type(ex).__name__;io.put(ROOT,e);raise
             time.sleep(2)
            ce['status']='accepted_pending_readback';io.put(child,ce)
            for attempt in range(8):
             time.sleep(8);after=io.card(nm);ce['after']=after;ce['observed_at']=stamp()
             assert core(after)==core(original),'Nonmedia card fields changed'
             if nm==1473243821:
              checks=[]
              for st in steps:
               raw,im=get_image(after['photos'][st['slot']-1]['big']+'?check='+str(int(time.time())))
               diff=ImageStat.Stat(ImageChops.difference(im.resize((64,64)),st['source_image'].resize((64,64)))).mean
               checks.append(dict(slot=st['slot'],mean_pixel_difference=sum(diff)/3))
              ce['image_readback_checks']=checks;ok=len(after['photos'])==len(original['photos'])and all(x['mean_pixel_difference']<10 for x in checks)
             else:
              ok=len(after['photos'])==len(original['photos'])-len(removed)
              if ok:
               checks=[]
               for i,photo in enumerate(after['photos']):
                raw,im=get_image(photo['big']+'?check='+str(int(time.time())))
                diff=ImageStat.Stat(ImageChops.difference(im.resize((64,64)),steps[0]['source_images'][i])).mean
                checks.append(dict(slot=i+1,mean_pixel_difference=sum(diff)/3))
               ce['image_readback_checks']=checks;ok=all(x['mean_pixel_difference']<10 for x in checks)
             if ok:ce['status']='media_verified';break
            io.put(child,ce);e['actions'].append(dict(nm_id=nm,status=ce['status'],receipt_key=child));io.put(ROOT,e)
           e['status']='media_verified_block_status_pending'if all(x['status']=='media_verified'for x in e['actions'])else'media_readback_pending'
           r=requests.get('https://seller-analytics-api.wildberries.ru/api/v1/analytics/banned-products/blocked',params=dict(sort='nmId',order='asc'),headers={'Authorization':io.token},timeout=45)
           e['blocked_readback_http']=r.status_code
           if r.ok:e['blocked_report_after']=r.json();e['blocked_observed_at']=stamp()
           if r.ok and not any(x.get('nmId')in SCOPE for x in r.json().get('report',[])):e['status']='unblocked_verified'
           e['completed_at']=stamp();io.put(ROOT,e)
           print('Private remediation receipts saved; no unblock claim without report readback')
          if __name__=='__main__':
           try:main()
           except Exception as ex:
            io=IO();e=io.get(ROOT)or dict(wb_writes=0,telegram_calls=0)
            e['status']='blocked_before_write'if e.get('wb_writes',0)==0 else'uncertain';e['failure']=type(ex).__name__+':'+str(ex)[:400];e['failed_at']=stamp();io.put(ROOT,e);raise
          PY

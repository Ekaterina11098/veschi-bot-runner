name: Remove approved incorrect China replies once
on:
  push:
    branches: [china-incorrect-replies-cleanup-20261023]
    paths: [.github/workflows/china-incorrect-replies-cleanup-once.yml]
permissions:
  contents: read
concurrency:
  group: china-incorrect-replies-cleanup-20261023
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: python scripts/china_incorrect_replies_cleanup_once.py

name: Issue 10 stage one acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/issue-10-stage-one.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: d68c138f5d9d9ffd288cd3f5b2f6e5f0f78747c9
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 327d7647c857ed0310fd8427d709f832c9e68ad1
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: baseline-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing runner runtime
        run: pip install requests==2.32.5 python-dotenv aiogram apscheduler pillow streamlit openai > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Inspect private workflow triggers without running them
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          unsafe=[]
          for file in Path('private-source/.github/workflows').glob('*.yml'):
              content=file.read_text()
              match=re.search(r'^on:(.*?)(?=^\S|\Z)',content,re.M|re.S)
              trigger=match.group(1) if match else ''
              if re.search(r'\b(pull_request|pull_request_target|push)\b',trigger):unsafe.append(file.name)
          print(json.dumps(dict(private_automatic_workflows=unsafe,private_workflow_files_inspected=len(list(Path('private-source/.github/workflows').glob('*.yml'))))))
          PY
      - name: Full Python regression suite without live credentials
        run: |
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])
          script="""
          import contextlib,json,os,re,unittest
          from pathlib import Path
          with open(os.environ['TEST_LOG'],'w') as log:
              with contextlib.redirect_stdout(log),contextlib.redirect_stderr(log):
                  suite=unittest.defaultTestLoader.discover('tests',pattern=os.environ['TEST_PATTERN'])
                  result=unittest.TextTestRunner(stream=log,verbosity=2).run(suite)
          Path(os.environ['TEST_SUMMARY']).write_text(json.dumps(dict(tests=result.testsRun,
              failures=len(result.failures),errors=len(result.errors),skipped=len(result.skipped),
              failed_ids=[test.id() for test,_ in result.failures+result.errors],
              failed_locations=[dict(test=test.id(),frames=[dict(file=Path(p).name,line=n) for p,n in re.findall(r'File \"(.*?)\", line (\\d+)',trace)]) for test,trace in result.failures+result.errors],
              error_types=[next((line.split(':')[0] for line in trace.splitlines() if re.match(r'^[A-Za-z.]*Error(?::|$)',line)),'TestFailure') for _,trace in result.failures+result.errors])))
          """
          results=[];baseline=[]
          for path in sorted(Path('private-source/tests').glob('test_*.py')):
              name=path.name
              output=folder/('result-'+name+'.json')
              log=folder/('log-'+name)
              env={**os.environ,'TEST_PATTERN':name,'TEST_SUMMARY':str(output),'TEST_LOG':str(log)}
              subprocess.run([sys.executable,'-c',script],cwd='private-source',env=env,check=True)
              result=json.loads(output.read_text());results.append(result)
              if result['failed_ids'] and Path('baseline-source/tests',name).exists():
                  subprocess.run([sys.executable,'-c',script],cwd='baseline-source',env=env,check=True)
                  baseline.append(json.loads(output.read_text()))
          current={x for r in results for x in r['failed_ids']}
          previous={x for r in baseline for x in r['failed_ids']}
          summary=dict(tests=sum(r['tests'] for r in results),failures=sum(r['failures'] for r in results),
              errors=sum(r['errors'] for r in results),skipped=sum(r['skipped'] for r in results),
              failed_ids=sorted(current),baseline_failed_ids=sorted(previous),
              regressions=sorted(current-previous),failed_locations=[x for r in results for x in r.get('failed_locations',[])],error_types=sorted({x for r in results for x in r['error_types']}))
          (folder/'stage-one-tests.json').write_text(json.dumps(summary,indent=2))
          with (folder/'private-tests.log').open('w') as joined:
              for path in folder.glob('log-test_*.py'):joined.write(path.read_text())
          print(json.dumps(summary))
          sys.exit(1 if summary['regressions'] else 0)
          PY
      - name: Save failed test diagnostics in protected backend
        if: failure()
        env:
          TASK: issue-10-stage-one
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os,run_private
          from pathlib import Path
          log=Path(os.environ['RUNNER_TEMP'])/'private-tests.log'
          if log.exists():run_private.save_diagnostic('stage-one regression',log.read_text())
          PY
      - name: Prepare exact missing requests from actual protected cache
        env:
          TASK: issue-10-stage-one
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os,run_private
          run_private.execute('Prepare exact Regina gaps',['-m','analytics.stage_one','--prepare'])
          PY
      - name: Collect confirmed financial MPStats gaps under shared lock
        env:
          TASK: issue-10-financial-recovery
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          script="""
          from datetime import datetime,timedelta,timezone
          from analytics.collect import database
          from analytics.stage_one import cache,read
          import analytics.mpstats_gaps as gaps
          now=datetime.now(timezone.utc)
          state=cache(gaps.REQUEST_KEY)
          gaps.ingest_recovery_requests(database,state,now)
          financial={r['key'] for r in cache('analytics:recovery:stage_one_finance:v1').get('mpstats_requests',[])}
          diagnoses=read('analytics_snapshots',dict(source='eq.mpstats_stage_one_finance_diagnosis',order='id.desc',select='payload',limit=1)) or []
          original={r['key'] for r in diagnoses[0]['payload'][0].get('requests',[])} if diagnoses else set()
          state['requests']=[r for r in state.get('requests',[]) if r['key'] not in original or r['key'] in financial]
          def priority(r):
              if r['key'] not in financial:return 6
              if r['tool']=='lk_wb_products':return 0
              if r['cabinet']=='token_3' and r['tool']=='wbbidder_campaign_stats':return 0
              if r['tool']=='lk_wb_card_table' and r['arguments'].get('value') in ('124392259','124391875','124391842','124392075'):return 1
              if r['cabinet']=='token_3' and r['tool']=='lk_wb_card_table':return 2
              if r['cabinet']=='token_1' and r['tool']=='lk_wb_card_table':return 3
              if r['tool']=='lk_wb_card_table':return 4
              if r['tool']=='lk_wb_card_orders':return 5
              return 4
          state['requests']=sorted(state.get('requests',[]),key=priority)
          database('POST','telegram_api_cache',body=dict(cache_key=gaps.REQUEST_KEY,payload=state,
              expires_at=(now+timedelta(days=365)).isoformat()),params={'on_conflict':'cache_key'})
          original_execute=gaps.execute_reads
          for batch in range(24):
              state=cache(gaps.REQUEST_KEY)
              pending=[r for r in state.get('requests',[]) if r['key'] in financial]
              cooldown=read('telegram_api_cache',dict(cache_key='eq.mpstats:cooldown',expires_at='gt.'+datetime.now(timezone.utc).isoformat(),select='cache_key',limit=1)) or []
              if not pending or cooldown:break
              limit=min(24,len(pending))
              def bounded(call,checks,known_tools,requests,bidder_map,save,**kwargs):
                  requests=[r for r in requests if r['key'] in financial]
                  kwargs['max_requests']=limit
                  return original_execute(call,checks,known_tools,requests,bidder_map,save,**kwargs)
              gaps.execute_reads=bounded
              gaps.main()
          """
          run_private.execute('Read bounded confirmed MPStats finance gaps',['-c',script])
          PY
      - name: Read only verified exact Regina query gaps
        env:
          TASK: issue-10-regina-query-gap
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
        run: |
          python - <<'PY'
          import run_private
          run_private.execute('Read exact Regina query gaps after MPStats/cache',['-m','analytics.regina_query_gap'])
          PY
      - name: Audit actual scoped agent cache readers
        env:
          TASK: issue-10-stage-one
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os,run_private
          run_private.execute('Audit actual scoped agent readers',['-m','analytics.stage_one','--summary-path',os.environ['RUNNER_TEMP']+'/stage-one-status.json'])
          PY
      - name: Public acceptance flags only
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'stage-one-status.json'
          if path.exists():
              summary=json.loads(path.read_text())
              print(json.dumps(summary,indent=2))
              raise SystemExit(0 if summary['status']=='complete' else 2)
          print('Acceptance audit unavailable; inspect preceding step status.')
          raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-one-acceptance-flags
          path: |
            ${{ runner.temp }}/stage-one-tests.json
            ${{ runner.temp }}/stage-one-status.json
          if-no-files-found: ignore
          retention-days: 7

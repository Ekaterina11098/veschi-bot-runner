name: Execute owner-requested missed WB batch for November 4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/execute-missed-wb-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fbs-document-chain-production
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Execute exactly the confirmed private supply list
        shell: python
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          FBS_EXECUTION_KIND: manual
          FBS_OWNER_APPROVAL_ID: recover-20261104-1900-20261105
        run: |
          import sys,os,copy
          sys.path.insert(0,'scripts')
          import fbs_document_chain as m
          from fbs_wb_cabinets import ScopedCache
          ROOT='fbs_document_recovery:20261104_1900:'
          START=m.stamp('2026-11-03T16:00:00Z');END=m.stamp('2026-11-04T16:00:00Z')
          master=m.Cache(m.Transport());pre=master.get(ROOT+'summary:v1')
          assert pre['status']=='preflight_complete'
          result=master.get(ROOT+'execution:v1') or {'status':'running','started_at':m.now(),'cabinet_results':{}}
          tokens={k:os.environ['WB_TOKEN_'+v] for k,v in {'china':'3','ip':'2','ooo':'1'}.items()}
          for cabinet in ('ip','ooo','china'):
           if result['cabinet_results'].get(cabinet,{}).get('status')=='complete':continue
           os.environ['WB_TOKEN_3']=tokens[cabinet]
           m.CONFIG='fbs_document_chain:'+cabinet+':config:v1';m.STATE='fbs_document_chain:'+cabinet+':state:v1';m.PREFIX='fbs_document_chain:'+cabinet+':supply:v1:'
           t=m.Transport();db=ScopedCache(t,cabinet);config=db.get(m.CONFIG);w=m.Worker(t,db,config)
           prep=master.get(ROOT+'preflight:'+cabinet+':v1')
           assert prep.get('completed_at') and not prep.get('error')
           cr={'status':'running','started_at':m.now(),'completed':[],'blocked':[],'already_complete':[{'supply_id':x['supply']['id'],'quantity':x['quantity'],'documents':x['existing']} for x in prep['already_complete']]}
           try:
            decision=w.execution_permission(direct=True)
            if decision:raise m.Stop(decision['reason'])
            for candidate in prep['ready']:
             supply=candidate['supply'];key=m.PREFIX+supply['id']
             try:
              assert START<m.stamp(supply['closedAt'])<=END
              state=db.get(key) or copy.deepcopy(candidate['state'])
              assert state['supply']['id']==supply['id'] and sorted(state['order_ids'])==sorted(candidate['order_ids'])
              assert state['positions']==candidate['state']['positions']
              w.process(state)
              final=db.get(key);assert final['status']=='complete'
              annotation=w.order_annotation(final['supply']);checks=[]
              for kind in m.TYPES:
               ext=config.get('document_prefix','fbs-china')+':'+supply['id']+':'+kind
               matches=w.ms_rows('entity/'+kind,{'filter':'externalCode='+ext})
               assert len(matches)==1 and matches[0]['id']==final['documents'][kind]['id']
               body={**config['templates'][kind],'positions':final['positions'],'description':annotation['description']}
               if kind=='demand':body['customerOrder']=final['documents']['customerorder']
               elif kind=='salesreturn':body['demand']=final['documents']['demand']
               w.verify(kind,matches[0],body)
               checks.append({'type':kind,'id':matches[0]['id'],'name':matches[0]['name'],'store':m.href(matches[0]['store']),'posted':matches[0]['applicable'],'sum':matches[0]['sum']})
              cr['completed'].append({'supply_id':supply['id'],'supply_name':supply.get('name'),'quantity':candidate['quantity'],'positions':candidate['positions'],'documents':checks,'verified_at':m.now()})
             except Exception as error:
              fresh=db.get(key) or candidate['state']
              cr['blocked'].append({'supply_id':supply['id'],'error':str(error) if isinstance(error,m.Stop) else type(error).__name__,'stock_shortages':fresh.get('stock_shortages'),'documents':fresh.get('documents',{}),'at':m.now()})
             result['cabinet_results'][cabinet]=cr;master.put(ROOT+'execution:v1',result)
           except Exception as error:cr.update(error=str(error) if isinstance(error,m.Stop) else type(error).__name__)
           cr.update(status='complete' if not cr.get('error') and not cr['blocked'] else 'requires_attention',completed_at=m.now())
           result['cabinet_results'][cabinet]=cr;master.put(ROOT+'execution:v1',result)
          result.update(status='complete' if all(x['status']=='complete' for x in result['cabinet_results'].values()) else 'requires_attention',completed_at=m.now())
          master.put(ROOT+'execution:v1',result)
          print('Owner-requested recovery completed; exact private document verification saved.')

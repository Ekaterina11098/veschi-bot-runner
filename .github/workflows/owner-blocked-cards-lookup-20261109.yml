name: Owner blocked exact vendor lookup
on:
  push:
    paths:
      - '.github/workflows/owner-blocked-cards-lookup-20261109.yml'
permissions:
  contents: read
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  read:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 10ca471ebdc30e8979abeb6286434c51fe218931
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Read exact four SKU inventory and documents
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          from china_loss_execute import IO
          from datetime import datetime,timezone
          io=IO();key='china_agent:owner_blocked_cards:2026-11-09:v1:lookup'
          if io.get(key):raise SystemExit()
          assert io.create(key,dict(status='collecting',wb_writes=0))
          out=dict(status='collecting',lookups=[],wb_writes=0,telegram_calls=0)
          p=io.get('china_agent:owner_blocked_cards:2026-11-09:v1:read')
          for old in p['cards']:
           nm=old['nmID']
           for label,text in [('article',old['vendorCode']),('id',str(nm))]:
            data=io.request('/content/v2/get/cards/list',{'settings':{'cursor':{'limit':100},'filter':{'textSearch':text,'withPhoto':-1}}})
            out['lookups'].append(dict(nm_id=nm,label=label,cursor=data.get('cursor'),returned=[dict(nmID=c.get('nmID'),vendorCode=c.get('vendorCode'))for c in data.get('cards',[])],matched=[c for c in data.get('cards',[])if c.get('nmID')==nm],error=data.get('errorText')))
            io.put(key,out)
          out.update(status='complete',observed_at=datetime.now(timezone.utc).isoformat());io.put(key,out)
          PY

name: Owner restore exact existing midday delivery
on:
  push:
    paths:
      - '.github/workflows/owner-midday-cache-deliver-20261109.yml'
permissions:
  contents: read
concurrency:
  group: china-midday-advertising-report
  cancel-in-progress: false
jobs:
  read:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 10ca471ebdc30e8979abeb6286434c51fe218931
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Deliver reviewed frozen midday PNG only; no WB access
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import os,base64,requests
          from datetime import datetime
          from urllib.parse import urlparse
          from china_price_apply import IO
          from china_advertising_v2 import MSK
          from china_advertising_delivery import deliver,telegram_sender
          from china_daily_ad_actions import plan,bind
          io=IO();day=datetime.now(MSK).date().isoformat();assert day=='2026-11-09'
          delivery_key='china_agent:advertising_midday_delivery:'+day+':v1'
          old=io.get(delivery_key)or{}
          if old.get('status')in['delivered','sending','uncertain','skipped_by_owner']:raise SystemExit('Existing terminal or uncertain delivery; no resend')
          prepared=io.get('china_agent:owner_midday_recovery:'+day+':v1:prepared')
          assert prepared['status']=='prepared_review'and all(not f['actions']for f in prepared['files'])
          art='china_agent:advertising_midday_artifacts:'+day+':v1'
          saved=io.get(art)
          if not saved:
           files=[]
           for i,f in enumerate(prepared['files']):
            p=plan(io,day,f,i,slot='midday')
            files.append(dict(kind=f['kind'],family=f['family'],page=f['page'],total=f['total'],plan_id=p['plan_id'],plan_sha256=p['plan_sha256'],action_count=0,b64=f['b64']))
           value=dict(day=day,status='frozen',bundle=prepared['bundle'],files=files,recovery_source=prepared['source_key'],owner_decisions_deferred=True)
           if io.create(art,value):saved=value
           else:saved=io.get(art)
          assert saved['day']==day and saved['status']=='frozen'
          assert all(f['action_count']==0 for f in saved['files']),'Unexpected executable recommendations'
          original=requests.sessions.Session.request
          def guarded(session,method,url,**kwargs):
           u=urlparse(url);m=method.upper()
           allowed=u.scheme=='https'and u.hostname==urlparse(io.url).hostname and u.path=='/rest/v1/telegram_api_cache'and m in['GET','POST','PATCH']
           if u.scheme=='https'and u.hostname=='api.telegram.org'and m=='POST':
            allowed=u.path in['/bot'+io.bot+'/getMe','/bot'+io.bot+'/sendPhoto']
            if u.path.endswith('/sendPhoto'):allowed=allowed and str((kwargs.get('data')or{}).get('chat_id'))=='-1004342917488'
           if not allowed:raise ValueError('Outside fixed report delivery scope')
           return original(session,method,url,**kwargs)
          requests.sessions.Session.request=guarded
          files=[]
          for f in saved['files']:
           cap='Китай · промежуточный отчёт за9ноября. Плановый15:00; фактический срез15:37МСК. '+str(f['page'])+'/'+str(f['total'])+'. Решения отложены до обсуждения отчёта; действий для исполнения в этом PNG нет.'
           files.append(dict(f,bytes=base64.b64decode(f['b64']),caption=cap))
          r=deliver(io,day,files,telegram_sender(io),binder=lambda f,r:bind(io,f,r),delivery_key=delivery_key,expected_families={'drr'})
          print('Existing midday report delivery state: '+r['status'])
          PY

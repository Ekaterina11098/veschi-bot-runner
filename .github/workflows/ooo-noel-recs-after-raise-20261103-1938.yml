name: OOO Noel recommendations read-only result
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ooo-noel-recs-after-raise-20261103-1938.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wb-ooo-readonly-budget
  cancel-in-progress: false
jobs:
  execute:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 3708405208147b76cb76ad9ae9b432377f652bee
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - run: python -m py_compile scripts/ooo_noel_recs_after_raise_20261103_1938.py
      - name: Read OOO balances and statistics only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
        run: python scripts/ooo_noel_recs_after_raise_20261103_1938.py

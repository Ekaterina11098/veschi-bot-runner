name: Read only morning delivery readiness
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/review-morning-readiness-20261027.yml']
permissions: {contents: read, actions: read}
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check workflow activation, policy scope and Telegram membership without sending
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          async function json(url,headers={}) {
            const r=await fetch(url,{headers,signal:AbortSignal.timeout(20000)});
            if(!r.ok)throw Error('Readiness read failed HTTP '+r.status);
            return r.json();
          }
          const gh='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY;
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          const workflows=[];
          for(const name of ['reviews-morning.yml','questions-morning.yml','review-approved-publication.yml','review-approved-watchdog.yml']){
            const w=await json(gh+'/actions/workflows/'+name,headers);
            workflows.push({workflow:name,state:w.state});
          }
          const key=process.env.SUPABASE_SECRET_KEY;
          const rows=await json(process.env.SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/telegram_api_cache?cache_key=in.(reviews:auto-five-star:config:v1,reviews:telegram-approval:config:v1,reviews:content-group:v1)&select=cache_key,payload',{apikey:key,Authorization:'Bearer '+key});
          const cfg=Object.fromEntries(rows.map(r=>[r.cache_key,r.payload]));
          const auto=cfg['reviews:auto-five-star:config:v1']||{},approval=cfg['reviews:telegram-approval:config:v1']||{},group=cfg['reviews:content-group:v1']||{};
          const autoAll=auto.enabled===true && ['token_1','token_2','token_3'].every(c=>auto.cabinets?.includes(c));
          const delivery=approval.enabled===true && approval.new_notices_enabled===true && approval.publication_enabled===true && group.enabled===true && group.destination_verified===true;
          if(!delivery)throw Error('Morning delivery private configuration disabled');
          const url='https://api.telegram.org/bot'+process.env.TELEGRAM_BOT_TOKEN+'/getChatMember?chat_id='+encodeURIComponent(group.chat_id)+'&user_id='+encodeURIComponent(approval.bot_id);
          const member=await json(url);
          const available=member.ok===true && ['administrator','creator','member'].includes(member.result?.status);
          console.log(JSON.stringify({workflows,automatic_policy_all_three:autoAll,delivery_enabled:delivery,bot_available:available,bot_admin:member.result?.status==='administrator',can_delete_messages:member.result?.can_delete_messages===true,wb_calls:0,telegram_messages_sent:0}));
          if(workflows.some(w=>w.state!=='active')||!autoAll||!available)throw Error('Morning readiness failed');
          JS

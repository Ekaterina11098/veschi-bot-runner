name: Automatic unfinished16Oct stock continuation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stock-managed-continuation-20261016.yml']
# Daily07:00 and16:30MSK;16:40/16:50 recover only an unclaimed evening slot.
# Owner approved daily stock execution and new stock notifications, 2026-10-15.
permissions:
  contents: read
concurrency:
  group: bot-stock
  cancel-in-progress: false
jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 4da9a654fb1085a812b2d98b6536326023d630d5
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline continuation and no-repeat checks
        working-directory: private-source
        run: python -m unittest test_stock_regular_service test_stock_group_execution test_unfinished_stock_20261016 test_stock_batch_transport test_stock_batch_plan test_stock_inventory_notice test_stock_schedule test_owner_low_rule test_order_demand test_stock_notice_policy -q
      - run: pip install requests==2.32.5 python-dotenv==1.1.1 aiogram==3.22.0 simplejson==4.2.0 'psycopg[binary]==3.2.9' cryptography > "$RUNNER_TEMP/daily-install.log" 2>&1
      - name: Fresh stock calculation and newly created stock-only notifications
        env:
          PYTHONPATH: ${{ github.workspace }}/private-source:${{ github.workspace }}
          STOCK_DAILY_ENABLED: 'true'
          STOCK_RUN_SLOT: '1630'
          STOCK_NOTIFICATIONS_ENABLED: 'true'
          STOCK_CLOUD_EXECUTION_ENABLED: 'true'
          STOCK_JOURNAL_IMPORT_ACCEPTED: 'true'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          WB_FINANCE_TOKEN_1: ${{ secrets.WB_FINANCE_TOKEN_1 }}
          WB_FINANCE_TOKEN_2: ${{ secrets.WB_FINANCE_TOKEN_2 }}
          WB_FINANCE_TOKEN_3: ${{ secrets.WB_FINANCE_TOKEN_3 }}
          WB_STOCK_WAREHOUSE_1: ${{ vars.WB_STOCK_WAREHOUSE_1 }}
          WB_STOCK_WAREHOUSE_2: ${{ vars.WB_STOCK_WAREHOUSE_2 }}
          WB_STOCK_WAREHOUSE_3: ${{ vars.WB_STOCK_WAREHOUSE_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          MOYSKLAD_STORE_NAME: МСК
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          AUTO_STOCK_FAIL_FAST: '1'
        run: |
          python - <<'PY'
          from datetime import datetime,timezone,timedelta
          assert datetime.now(timezone(timedelta(hours=3))).date().isoformat()=='2026-10-16'
          PY
          python private-source/owner_managed_continuation_20261016.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-stock-daily-receipt
          path: ${{ runner.temp }}/stock-deploy-proof
          retention-days: 90

name: Inspect historical stock of selected WB supply
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-wb-305007673-historical-stock.yml']
permissions:
  contents: read
concurrency:
  group: fbs-document-chain-production
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Read historical stock; prohibit MS writes
        shell: python
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: |
          import sys,collections
          sys.path.insert(0,"scripts")
          import fbs_document_chain as m
          S="WB-GI-305007673";ROOT="fbs_document_chain:china:repair:"+S+":20261106:"
          class ReadOnly(m.Transport):
           def request(self,base,path,method="GET",body=None,params=None):
            if base in (m.MS,m.WB) and method!="GET":raise m.Stop("Read only")
            return super().request(base,path,method,body,params)
          t=ReadOnly();db=m.Cache(t);c=db.get(m.CONFIG);s=db.get(m.PREFIX+S);w=m.Worker(t,db,c)
          r={"status":"inspecting","at":m.now(),"supply_id":S}
          try:
           store=m.href(c["templates"]["demand"]["store"])
           snapshots={}
           for moment in ("2026-11-05 10:11:00","2026-11-05 10:11:55","2026-11-05 19:00:00"):
            rows=w.ms_rows("report/stock/all",{"filter":"store="+store,"stockMode":"all","quantityMode":"all","moment":moment})
            index={m.href(x).split("?")[0]:x for x in rows};lines=[]
            for p in s["positions"]:
             v=index.get(m.href(p["assortment"]),{})
             lines.append({"product":m.href(p["assortment"]),"article":v.get("article"),"name":v.get("name"),"needed":p["quantity"],"stock":v.get("stock",0),"available":v.get("quantity",0),"reserve":v.get("reserve",0)})
            snapshots[moment]=lines
           r.update(status="inspected",snapshots=snapshots)
          except Exception as e:r.update(status="blocked",error=str(e) if isinstance(e,m.Stop) else type(e).__name__)
          db.put(ROOT+"historical_stock:v1",r)
          print("Exact historical stock inspection:",r["status"])

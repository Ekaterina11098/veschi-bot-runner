name: Owner authorized journal import without execution
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: veshi-storage-maintenance
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: f2c82b7d0f1044886e4a2a3cc2aabd850ff91491
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 88e147f344f7a7492932c6eb812d7d02ee76e224
          path: recovery-input-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography 'psycopg[binary]==3.2.9' > "$RUNNER_TEMP/install.log" 2>&1
      - uses: actions/download-artifact@v4
        with:
          name: offline-restore-receiver
          run-id: 38588520250
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/receiver
      - name: Recover actual unchanged journal only in protected temporary environment
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os,struct,json,hashlib,base64,gzip
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.ciphers import Cipher,algorithms,modes
          root=Path(os.environ['RUNNER_TEMP']);src=root/'receiver/receiver-private.pem.aes'
          assert hashlib.sha256(src.read_bytes()).hexdigest()=='e315bdaf4bcc4ced0733a46a0a6d51c7e352d06fdb1d8ff3f65d51148fe8241e'
          raw=src.read_bytes();magic=b'VESCHI-BACKUP-1\n';offset=len(magic);assert raw[:offset]==magic
          length=struct.unpack('>I',raw[offset:offset+4])[0];offset+=4;encoded=raw[offset:offset+length];offset+=length
          header=json.loads(encoded);decode=lambda k:base64.b64decode(header[k])
          derived=HKDF(algorithm=hashes.SHA256(),length=32,salt=decode('salt'),info=b'veschi-recovery-worker-key-v1').derive(os.environ['SUPABASE_SECRET_KEY'].encode())
          key=AESGCM(derived).decrypt(decode('wrap_nonce'),decode('worker_key'),magic)
          dec=Cipher(algorithms.AES(key),modes.GCM(decode('nonce'),raw[-16:])).decryptor();dec.authenticate_additional_data(encoded)
          pem=dec.update(raw[offset:-16])+dec.finalize();receiver=serialization.load_pem_private_key(pem,password=None)
          folder=Path('recovery-input-source/recovery-input/2026-10-15')
          data=b''.join(p.read_bytes() for p in sorted(folder.glob('local-journal.part-*.aes.txt')))
          assert hashlib.sha256(data).hexdigest()=='735e088e7c8e956ec9577b8c63b9f78670e83b9e72e86e82b36578917ca0241e'
          env=json.loads(data);oaep=padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)
          key=receiver.decrypt(base64.b64decode(env['receiver_wrapped_key']),oaep)
          packed=AESGCM(key).decrypt(base64.b64decode(env['nonce']),base64.b64decode(env['ciphertext'])+base64.b64decode(env['tag']),None)
          raw=gzip.decompress(packed);assert hashlib.sha256(raw).hexdigest()=='16d571eda15598a5965b3d5bbe1b9586155073fa06a460fd9833d158416dc7c0'
          (root/'current-journal.sqlite').write_bytes(raw)
          print('Protected journal staged; no source status or business state modified.')
          PY

      - name: Import and verify all IDs, source states and events twice; no executor
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: aws-0-eu-central-1.pooler.supabase.com
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.abxgjoqlddhtcmjcjwxw
          PGSSLMODE: require
        run: |
          python - <<'PY'
          import os,sqlite3,hashlib,json,sys
          from pathlib import Path
          import psycopg
          from stock_operation_store import Store,digest
          from contextlib import contextmanager
          class DiagnosticStore(Store):
              @contextmanager
              def transaction(self):
                  yield
          Store=DiagnosticStore
          root=Path(os.environ['RUNNER_TEMP']);path=root/'current-journal.sqlite';out=root/'journal-import-proof';out.mkdir(exist_ok=True)
          report={'executor_called':False,'wb_calls':0,'telegram_calls':0,'source_statuses_modified':False,'namespace':'owner20261014','success':False}
          source=None;db=None
          try:
              sha=hashlib.sha256(path.read_bytes()).hexdigest()
              assert sha=='16d571eda15598a5965b3d5bbe1b9586155073fa06a460fd9833d158416dc7c0'
              source=sqlite3.connect(path.as_uri()+'?mode=ro',uri=True);source.execute('pragma query_only=on')
              assert source.execute('pragma quick_check').fetchone()[0]=='ok'
              db=psycopg.connect(connect_timeout=15,application_name='owner_stock_journal_import',options='-c search_path=stock_execution,pg_catalog -c statement_timeout=30000')
              db.execute('SET extra_float_digits=3')
              report['session_setting_after_explicit_set']=db.execute("SELECT current_setting('extra_float_digits')").fetchone()[0]
              store=Store(db,postgres=True)
              assert store.sql("select current_schema()").fetchone()[0]=='stock_execution'
              assert store.sql("select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='stock_execution' and not t.tgisinternal").fetchone()[0]==0
              assert store.sql("select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='stock_execution' and c.relkind='r' and not c.relrowsecurity").fetchone()[0]==0
              for role in ('anon','authenticated','service_role'):
                  assert store.sql("select has_schema_privilege(?, 'stock_execution','USAGE')",(role,)).fetchone()[0] is False
              db.commit()
              def inventory():
                  return {t:store.sql('SELECT * FROM '+t+' ORDER BY '+order).fetchall() for t,order in [('stock_runs','id'),('stock_operations','run,seq'),('stock_events','id'),('stock_sku_locks','article')]}
              store.import_local(source,'owner20261014')
              # Preserve an explicit per-article execution block for unknown outcomes; no state transition.
              with store.transaction():
                  unknown=store.sql("SELECT DISTINCT r.id,r.snapshot FROM stock_operations o JOIN stock_runs r ON r.id=o.run WHERE o.state IN ('sent','uncertain')").fetchall()
                  for run,snapshot in unknown:
                      article=str(json.loads(snapshot)['article']).strip().casefold()
                      store.sql('INSERT INTO stock_sku_locks(article,owner_run) VALUES(?,?) ON CONFLICT(article) DO NOTHING',(article,run))
                      assert store.sql('SELECT owner_run FROM stock_sku_locks WHERE article=?',(article,)).fetchone()[0]==run
              first=inventory()
              for ident,snapshot,plan,checksum,created in source.execute('SELECT id,snapshot,plan,digest,created FROM runs'):
                  assert store.sql('SELECT snapshot,plan,digest,origin,created FROM stock_runs WHERE id=?',('owner20261014:'+ident,)).fetchone()==(snapshot,plan,checksum,'local',created)
              for run,seq,body,state in source.execute('SELECT run,seq,body,state FROM operations'):
                  expected='replan_required' if state=='prepared' else state
                  assert store.sql('SELECT body,source_state,state FROM stock_operations WHERE run=? AND seq=?',('owner20261014:'+run,seq)).fetchone()==(body,state,expected)
              for ident,run,seq,state,at,detail in source.execute('SELECT id,run,seq,state,at,detail FROM events'):
                  assert store.sql('SELECT run,seq,state,at,detail FROM stock_events WHERE id=?',(digest(['owner20261014',run,ident]),)).fetchone()==('owner20261014:'+run,seq,state,at,detail)
              store.import_local(source,'owner20261014')
              second=inventory();assert first==second
              assert [len(first[t]) for t in ('stock_runs','stock_operations','stock_events')]==[1117,879,1733]
              assert hashlib.sha256(path.read_bytes()).hexdigest()==sha
              report.update(diagnostic_rollback_only=True,success=True,source_sqlite_sha256=sha,counts={'runs':1117,'operations':879,'events':1733},source_states=dict(source.execute('SELECT state,count(*) FROM operations GROUP BY state')),target_states=dict(store.sql('SELECT state,count(*) FROM stock_operations GROUP BY state').fetchall()),source_states_in_target=dict(store.sql('SELECT source_state,count(*) FROM stock_operations GROUP BY source_state').fetchall()),all_ids_payloads_events_verified=True,repeat_import_identical=True,uncertain_locks=len(first['stock_sku_locks']),closed_schema_verified=True,execution_enabled=False)
          except Exception as exc:
              report.update(error_type=type(exc).__name__,automatic_retry=False,error_line=__import__('traceback').extract_tb(exc.__traceback__)[-1].lineno,reason=str(exc) if type(exc).__name__=='Stopped' and str(exc) in ['Local plan checksum mismatch','Local operation does not match plan','Unknown local operation state','Conflicting imported run','Conflicting imported operation','Conflicting event history','Stable source namespace required'] else 'see fixed code line')
              if source and db:
                  for ident,snapshot,plan,checksum,created in source.execute('SELECT id,snapshot,plan,digest,created FROM runs ORDER BY created,id'):
                      got=db.execute('SELECT snapshot,plan,digest,origin,created FROM stock_execution.stock_runs WHERE id=%s',('owner20261014:'+ident,)).fetchone()
                      want=(snapshot,plan,checksum,'local',created)
                      if got is not None and got!=want:
                          report['mismatch_fields']=[i for i,(a,b) in enumerate(zip(got,want)) if a!=b]
                          report['target_types']=[type(x).__name__ for x in got]
                          report['source_types']=[type(x).__name__ for x in want]
                          report['float_difference']=got[-1]-want[-1] if type(got[-1]) is float else None
                          report['client_encoding']=db.info.encoding
                          break
          finally:
              if source:source.close()
              if db:db.rollback();db.close()
              path.unlink(missing_ok=True)
          (out/'summary.json').write_text(json.dumps(report,sort_keys=True));print(json.dumps(report,sort_keys=True))
          sys.exit(0 if report['success'] else 1)
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-authorized-journal-import-proof
          path: ${{ runner.temp }}/journal-import-proof
          retention-days: 90

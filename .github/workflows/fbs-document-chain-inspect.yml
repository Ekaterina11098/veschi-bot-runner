name: FBS document chain API inspection
# Verify all managed chain comments without changing quantities
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fbs-document-chain-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bot-stock-and-commands
  cancel-in-progress: false
jobs:
  inspect:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect APIs and retain private results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: |
          python -m unittest discover -s scripts -p 'test_fbs*.py'
          python scripts/fbs_comment_audit.py --all

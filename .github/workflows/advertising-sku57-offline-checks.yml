name: Offline SKU57 durable recovery checks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/advertising-sku57-offline-checks.yml']
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 92ad2cfab01d16d45af2195089e8b3069edf800b
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify exact main merge compatibility without changing a branch
        run: |
          git fetch origin a12826ec5576196e48c94db6c07f541bf07eb2b5 --depth=100
          git fetch --unshallow || true
          git config user.name offline-check
          git config user.email offline-check@example.invalid
          git merge --no-commit --no-ff a12826ec5576196e48c94db6c07f541bf07eb2b5
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: No WB, database or Telegram credentials; mocked ports only
        run: python -m unittest discover -s tests -p test_sku_membership_recovery.py -v
      - uses: actions/checkout@v4
        with:
          path: runner
          persist-credentials: false
      - name: Exact campaign daily gap coverage, offline
        run: python runner/test_campaign_day_gaps.py -v

name: Approved first new review button check
on:
  push:
    paths: ['review_approval_first_new.py']
permissions:
  contents: write
concurrency:
  group: bot-review-replies
  cancel-in-progress: false
jobs:
  controlled:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/veschi-bot-runner
          ref: a66482bc1dba29a54348fee3c1e1ddd581b69de7
          path: approval-core
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 1b4201067880e379d8dacbe5f6ca3f9848d6ffb0
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'psycopg[binary]==3.2.10' cryptography==46.0.2 requests==2.32.5 python-dotenv==1.1.1 openai==1.109.1
      - name: Fresh GET only and one eligible NEW notice
        env:
          PYTHONPATH: ${{ github.workspace }}/private-source
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: python review_approval_first_new.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-review-first-new-and-live-backup
          path: ${{ runner.temp }}/stock-deploy-proof
          retention-days: 90
      - name: Preserve independent ciphertext only
        if: always()
        run: |
          mkdir -p recovery-output/review-approval
          cp "$RUNNER_TEMP/stock-deploy-proof/review-approval-first-new.aes.json" "recovery-output/review-approval/first-new-${{ github.run_id }}.aes.json"
          cp "$RUNNER_TEMP/stock-deploy-proof/approval-live-supplement.aes.json" "recovery-output/review-approval/live-supplement-${{ github.run_id }}.aes.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-output/review-approval/
          git commit -m "Preserve encrypted first new review button check and live approval supplement"
          git pull --rebase origin main
          git push origin HEAD:main

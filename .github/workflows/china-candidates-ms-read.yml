name: China candidate stock read only 23Oct
on:
  push:
    branches: [china-candidates-ms-read-20261023]
    paths: ['.github/workflows/china-candidates-ms-read.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read warehouse and assortment only
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,datetime
          base='https://api.moysklad.ru/api/remap/1.2'
          def get(path,params=None):
              u=base+path+('?' + urllib.parse.urlencode(params) if params else '')
              req=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['MOYSKLAD_API_TOKEN'],'Accept-Encoding':'gzip'})
              with urllib.request.urlopen(req,timeout=70) as f:
                  b=f.read()
                  if f.headers.get('Content-Encoding')=='gzip':
                      import gzip
                      b=gzip.decompress(b)
                  return json.loads(b)
          def pages(path,params=None):
              rows=[];offset=0
              while True:
                  d=get(path,dict(params or {},limit=1000,offset=offset)); part=d.get('rows',[]);rows.extend(part)
                  if offset+len(part)>=d.get('meta',{}).get('size',offset+len(part)) or not part:return rows
                  offset+=len(part)
                  if offset>20000:raise RuntimeError('Pagination guard')
          result={'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'wb_writes':0,'telegram_calls':0}
          try:
              stores=pages('/entity/store')
              chosen=[s for s in stores if s.get('name')=='МСК' and not s.get('archived')]
              if len(chosen)!=1:raise RuntimeError('Exact MSK warehouse not unique')
              store=chosen[0];href=store['meta']['href']
              report=pages('/report/stock/all',{'filter':'store='+href,'stockMode':'all'})
              products=pages('/entity/product',{'filter':'archived=false'})
              result.update(status='read',store={'id':store['id'],'name':store['name']},report=report,products=[{k:p.get(k) for k in ('id','article','code','name','meta')} for p in products])
          except Exception as e:
              result.update(status='blocked',error_type=type(e).__name__,http_status=getattr(e,'code',None),error=str(e)[:180] if not hasattr(e,'code') else 'MoySklad HTTP error')
          key='china_agent:candidate_ms_stock:2026-10-23:v1'
          req=urllib.request.Request(os.environ['SUPABASE_URL']+'/rest/v1/telegram_api_cache?on_conflict=cache_key',data=json.dumps({'cache_key':key,'payload':result,'expires_at':'2026-11-23T00:00:00Z'}).encode(),method='POST',headers={'apikey':os.environ['SUPABASE_SECRET_KEY'],'Authorization':'Bearer '+os.environ['SUPABASE_SECRET_KEY'],'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'})
          with urllib.request.urlopen(req,timeout=60) as f:f.read()
          print(json.dumps({'status':result['status'],'rows':len(result.get('report',[])),'wb_writes':0,'telegram_calls':0}))
          PY

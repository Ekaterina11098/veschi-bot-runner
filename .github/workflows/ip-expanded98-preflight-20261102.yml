name: IP expanded98 exact WB preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ip-expanded98-preflight-20261102.yml']
permissions: {}
concurrency:
  group: wb-ip-advertising-agent
  cancel-in-progress: false
jobs:
  read:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read exact WB configuration and candidate cards
        env:
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import os,json,urllib.request,urllib.error,urllib.parse,datetime,time,gzip
          KEY='ip_agent:expanded98:preflight:2026-11-02:v1'
          SB=os.environ['SUPABASE_URL'].rstrip('/')
          sh={'apikey':os.environ['SUPABASE_SECRET_KEY'],'Authorization':'Bearer '+os.environ['SUPABASE_SECRET_KEY'],'Content-Type':'application/json'}
          wh={'Authorization':os.environ['WB_TOKEN_2'],'Content-Type':'application/json'}
          def stamp():return datetime.datetime.now(datetime.timezone.utc).isoformat()
          class NR(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*a,**k):raise RuntimeError('Redirect blocked')
          opener=urllib.request.build_opener(NR)
          def call(url,headers,method='GET',body=None):
           req=urllib.request.Request(url,headers=headers,method=method,data=None if body is None else json.dumps(body).encode())
           try:
            with opener.open(req,timeout=50) as r:
             b=r.read()
             if r.headers.get('Content-Encoding')=='gzip':b=gzip.decompress(b)
             return json.loads(b) if b else None
           except urllib.error.HTTPError as e:raise RuntimeError('HTTP '+str(e.code)+' RetryAfter '+str(e.headers.get('Retry-After','unknown'))) from None
          def get(key):
           r=call(SB+'/rest/v1/telegram_api_cache?'+urllib.parse.urlencode({'cache_key':'eq.'+key,'select':'payload'}),sh)
           return r[0]['payload'] if r else None
          def save():
           call(SB+'/rest/v1/telegram_api_cache?on_conflict=cache_key',dict(sh,Prefer='resolution=merge-duplicates'),'POST',{'cache_key':KEY,'payload':out,'updated_at':stamp(),'expires_at':'2036-11-02T00:00:00Z'})
          request=get('ip_agent:expanded98:2026-11-02:v1')
          if not request or request.get("status")!="authorized_pending_preflight" or len(request.get("scope",[]))!=98:raise ValueError("Exact scope missing")
          if get(KEY):raise SystemExit("Existing read preserved")
          out={"status":"reading","observed_at":stamp(),"wb_writes":0,"telegram_calls":0,"run_id":os.environ["GITHUB_RUN_ID"],"minimums":[]}
          save()
          try:
           ids=sorted({x["campaign"] for x in request["scope"] if x.get("campaign")})
           out["configuration"]=call("https://advert-api.wildberries.ru/api/advert/v2/adverts?ids="+",".join(map(str,ids)),wh)
           out["status"]="configuration_read";save()
           for ad in out["configuration"].get("adverts",[]):
            nmids=[x["nm"] for x in request["scope"] if x.get("campaign")==ad["id"] and x["kind"] in ("raise_bid","lower_bid")]
            if not nmids:continue
            payment=ad.get("settings",{}).get("payment_type")
            placement="search" if payment=="cpc" else "recommendation"
            time.sleep(2)
            body={"advert_id":ad["id"],"nm_ids":nmids,"payment_type":payment,"placement_types":[placement]}
            out["minimums"].append({"campaign":ad["id"],"result":call("https://advert-api.wildberries.ru/api/advert/v1/bids/min",wh,"POST",body)})
            save()
           out["status"]="complete"
          except Exception as e:
           out["status"]="partial";out["error"]=str(e) if isinstance(e,(ValueError,RuntimeError)) else type(e).__name__
          out["finished_at"]=stamp();save()
          print(json.dumps({"status":out["status"],"wb_writes":0,"telegram_calls":0}))

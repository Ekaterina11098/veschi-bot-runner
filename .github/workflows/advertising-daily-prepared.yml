name: Prepared daily IP advertising, owner activation required
on:
  workflow_dispatch:
# Proposed only, NOT registered: schedule cron '30 4 * * *' =07:30MSK.
permissions:
  contents: write
concurrency:
  group: wb-ip-advertising-agent
  cancel-in-progress: false
jobs:
  daily:
    if: vars.IP_DAILY_ADVERTISING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: cdbde94c5a34c5a22723662c42de09eaf06a9047
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - run: cp -a private-source combined && cp -a private-source pr19
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r combined/requirements.txt cryptography==46.0.2 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Existing stages, dedicated approved day claim
        run: python advertising_daily_owner.py
        env:
          IP_DAILY_ADVERTISING_ENABLED: ${{ vars.IP_DAILY_ADVERTISING_ENABLED || 'false' }}
          APPROVED_SOURCE_SHA: cdbde94c5a34c5a22723662c42de09eaf06a9047
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          ADVERTISING_TELEGRAM_BOT_TOKEN: ${{ secrets.ADVERTISING_TELEGRAM_BOT_TOKEN }}
          IP_LIMITED_ANALYSIS_PUBLISH: 'false'
          IP_LIMITED_TELEGRAM_DELIVERY: 'false'
          ADVERTISING_EXECUTION_ENABLED: 'false'
          SUPABASE_EGRESS_OPTIMIZED: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-advertising-daily
          path: ${{ runner.temp }}/stock-deploy-proof/*.aes.json
          retention-days: 90

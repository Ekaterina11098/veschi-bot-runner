name: IP remaining budgets one bounded read-only recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/advertising-owner-budgets.yml']
permissions:
  contents: write
concurrency:
  group: wb-ip-advertising-agent
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 8bea1186491b2182dc339a6d5ca16ad9ce879760
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 python-dotenv cryptography==46.0.2 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Offline cache retry safety checks
        run: python -m unittest test_budget_cache_retry.py
      - name: Only missing budgets, preserving exact next RetryAfter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          SUPABASE_EGRESS_OPTIMIZED: 'true'
        run: python advertising_budgets_owner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-advertising-budgets
          path: ${{ runner.temp }}/stock-deploy-proof/*.aes.json
          retention-days: 90
      - name: Independent ciphertext
        if: always()
        run: |
          mkdir -p recovery-output/advertising
          cp "$RUNNER_TEMP/stock-deploy-proof/advertising-budgets.aes.json" "recovery-output/advertising/budgets-${{ github.run_id }}.aes.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-output/advertising/
          git commit -m "Preserve encrypted current campaign receipt"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
          done
          exit 1


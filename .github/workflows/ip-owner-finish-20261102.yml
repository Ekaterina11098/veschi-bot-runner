name: IP owner approved remaining scope 2026-11-02
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ip-owner-finish-20261102.yml']
permissions: {}
concurrency:
  group: wb-ip-advertising-agent
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - name: Execute exact private owner approval with shared cooldown and readback
        env:
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_FINANCE_TOKEN_2: ${{ secrets.WB_FINANCE_TOKEN_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import urllib.request,hashlib
          url='https://raw.githubusercontent.com/Ekaterina11098/veschi-bot-runner/356e2247e20d903815f61be5eaf103b8807f31e7/scripts/ip_owner_finish_20261102.py'
          source=urllib.request.urlopen(url,timeout=45).read()
          if hashlib.sha256(source).hexdigest()!='8c6100ff5a6066e63157271ba2f7931155f301e49aaa903fb8296fe5c9ee5c98':raise ValueError('Pinned source checksum differs')
          exec(compile(source,url,'exec'),{'__name__':'__main__'})

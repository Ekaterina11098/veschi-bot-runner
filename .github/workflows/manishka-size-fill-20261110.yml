name: Set owner requested manishka size
on:
  push:
    paths: ['.github/workflows/manishka-size-fill-20261110.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: scripts/fbs_document_chain.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: python
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import sys
          sys.path.insert(0,'scripts')
          from fbs_document_chain import Transport,Cache,Worker,MS,now,Stop
          t=Transport();db=Cache(t);w=Worker(t,db,{})
          targets={'38-FurManizhka-white','39-FurManizhka-black'}
          rows=w.ms_rows('entity/product',{'filter':'archived=false'})
          selected=[p for p in rows if p.get('article') in targets]
          if len(selected)!=2:raise Stop('Target identity mismatch')
          defs=t.request(MS,'entity/product/metadata/attributes')['rows']
          definition=next(a for a in defs if a['name']=='Размер' and a['type']=='string')
          key='label_utility:manishka:size:20261110:apply:v1'
          state={'status':'prepared','at':now(),'done':[]};db.put(key,state)
          for ref in selected:
              path='entity/product/'+ref['id'];p=t.request(MS,path)
              if p.get('article')!=ref['article'] or p.get('archived'):raise Stop('Product changed')
              before={a['name']:a.get('value') for a in p.get('attributes',[])}
              if before.get('Размер') not in (None,'','единый'):raise Stop('Existing size differs')
              state['inflight']={'id':p['id'],'article':p['article'],'before':p.get('attributes',[])};db.put(key,state)
              if before.get('Размер')!='единый':
                  t.request(MS,path,'PUT',{'attributes':[{'meta':definition['meta'],'value':'единый'}]})
              after=t.request(MS,path);actual={a['name']:a.get('value') for a in after.get('attributes',[])}
              if actual.get('Размер')!='единый':raise Stop('Size readback mismatch')
              if after.get('barcodes')!=p.get('barcodes') or after.get('article')!=p.get('article'):raise Stop('Other fields changed')
              for name,value in before.items():
                  if name!='Размер' and actual.get(name)!=value:raise Stop('Other attribute changed')
              state['done'].append({'article':after['article'],'size':actual['Размер']})
              state['inflight']=None;db.put(key,state)
          state.update(status='verified',verified_at=now());db.put(key,state)
          print('Two owner-requested sizes saved and verified')

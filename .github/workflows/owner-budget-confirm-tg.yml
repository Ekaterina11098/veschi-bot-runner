name: Owner authorized budget confirmation Telegram 2 November
on:
  push:
    branches: [main]
    paths: ['scripts/owner_budget_confirm_tg.py']
permissions: {contents: read}
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency: {group: china-dialog-data, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Send one owner-authorized budget confirmation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: PYTHONPATH=scripts:source python scripts/owner_budget_confirm_tg.py

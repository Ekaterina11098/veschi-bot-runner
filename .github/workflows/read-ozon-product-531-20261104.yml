name: Inspect Ozon November 4 product matching
on:
  push:
    branches: [main]
    paths: ['.github/workflows/read-ozon-product-531-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Inspect active and archived product identity and stock only
        shell: python
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: |
          import sys
          sys.path.insert(0,'scripts')
          import fbs_document_chain as m
          class Read(m.Transport):
           def request(self,base,path,method='GET',body=None,params=None):
            if base==m.MS and method!='GET':raise m.Stop('Read only')
            return super().request(base,path,method,body,params)
          t=Read();db=m.Cache(t);w=m.Worker(t,db,{})
          c=db.get('fbs_document_chain:ozon:config:v1')
          result={'at':m.now(),'products':[]}
          for archived in ('false','true'):
           for p in w.ms_rows('entity/product',{'filter':'archived='+archived}):
            if '531' in (p.get('article','')+' '+p.get('code','')+' '+p.get('name','')):
             stock=t.request(m.MS,'report/stock/all',params={'filter':'store='+m.href(c['templates']['demand']['store'])+';product='+m.href(p),'stockMode':'all','quantityMode':'all'})
             result['products'].append({'id':p['id'],'name':p.get('name'),'article':p.get('article'),'code':p.get('code'),'archived':p.get('archived'),'variantsCount':p.get('variantsCount'),'trackingType':p.get('trackingType'),'isSerialTrackable':p.get('isSerialTrackable'),'meta':p['meta'],'stock':stock.get('rows',[])})
          db.put('ozon_document_recovery:20261104:product_531:v1',result)
          print('Private product identity inspection saved; no document writes.')

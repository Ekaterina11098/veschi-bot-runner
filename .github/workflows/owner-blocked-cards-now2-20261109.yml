name: Owner four SKU stock reserve shipment read
on:
  push:
    paths:
      - '.github/workflows/owner-blocked-cards-now2-20261109.yml'
permissions:
  contents: read
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  read:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 10ca471ebdc30e8979abeb6286434c51fe218931
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Read exact four SKU inventory and documents
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import base64,json,time,requests
          from datetime import datetime,timezone
          from urllib.parse import urlparse
          from china_loss_execute import IO
          io=IO();key='china_agent:owner_blocked_cards:2026-11-09:v2:read'
          if io.get(key):raise SystemExit('Existing read')
          original=requests.sessions.Session.request
          def guarded(session,method,url,**kw):
           u=urlparse(url);m=method.upper()
           allowed=u.hostname==urlparse(io.url).hostname and m in ['GET','POST','PATCH'] and u.path in ['/rest/v1/telegram_api_cache','/rest/v1/analytics_snapshots']
           allowed=allowed or(u.hostname=='seller-analytics-api.wildberries.ru'and m=='GET'and u.path=='/api/v1/analytics/banned-products/blocked')
           allowed=allowed or(u.hostname=='content-api.wildberries.ru'and m=='POST'and u.path=='/content/v2/get/cards/list')
           if not allowed:raise ValueError('Outside blocked-card read-only scope')
           return original(session,method,url,**kw)
          requests.sessions.Session.request=guarded
          claims=json.loads(base64.urlsafe_b64decode(io.token.split('.')[1]+'='*(-len(io.token.split('.')[1])%4)))
          ident=io.db('analytics_snapshots?cabinet=eq.token_3&source=eq.seller_identity&status=eq.complete&select=payload&limit=100')
          assert {x['payload'].get('sid')for x in ident}=={claims.get('sid')}and claims.get('sid')
          r=requests.get('https://seller-analytics-api.wildberries.ru/api/v1/analytics/banned-products/blocked',params=dict(sort='nmId',order='asc'),headers={'Authorization':io.token},timeout=50)
          assert r.ok,'Blocked report HTTP '+str(r.status_code)
          data=r.json();assert isinstance(data.get('report'),list)and len(data['report'])<=25
          out=dict(status='report_complete',report=data['report'],report_observed_at=datetime.now(timezone.utc).isoformat(),cabinet='token_3',identity_verified=True,wb_writes=0,telegram_calls=0,cards={},card_errors={})
          assert io.create(key,out)
          prior={1473243821:'670-NoelBag-lgreen',1473243826:'53-NoelBag-beige',1473246040:'606-MadisonBag-beige'}
          wanted={int(x['nmId']):x.get('vendorCode')or x.get('supplierArticle')for x in data['report']}
          wanted.update(prior)
          for nm,article in wanted.items():
           try:
            found=[]
            for search in [article,str(nm)]:
             if not search:continue
             j=io.request('/content/v2/get/cards/list',dict(settings=dict(cursor=dict(limit=100),filter=dict(textSearch=search,withPhoto=-1))))
             found=[c for c in j.get('cards',[])if c.get('nmID')==nm]
             if len(found)==1:break
            if len(found)!=1:raise ValueError('Exact card unavailable')
            c=found[0]
            out['cards'][str(nm)]=c
           except Exception as ex:out['card_errors'][str(nm)]=type(ex).__name__+': '+str(ex)[:100]
          out.update(status='complete',observed_at=datetime.now(timezone.utc).isoformat())
          io.put(key,out)
          print('Fresh blocked report saved; '+str(len(out['report']))+' blocked; no WB writes')
          
          PY

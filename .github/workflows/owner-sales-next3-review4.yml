name: Owner readonly sales next3 preflight4Nov
on:
  push:
    paths: ['.github/workflows/owner-sales-next3-review4.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-sales-next3-review4
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Bounded fresh growth economics; no model or Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: disabled
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json
          from china_cloud_cost_control import Cache,WB,validate_identity,stamp
          from china_advertising_state import AdvertisingIO
          from china_morning_readiness import current_prices,published_stock
          from china_moysklad_read import read_stock
          c=Cache();w=WB();io=AdvertisingIO();validate_identity(c,w)
          nm=1473243091
          p=current_prices(io,[nm]);pub=published_stock(io,p,[nm]);st=read_stock([p['rows'][0]['article']])
          cs=w.campaigns([41055480]);q=w.minimums(41055480,[nm],'recommendations')
          bud=w.req('/api/advert/v2/budget','POST',dict(advertIds=[41055480]))
          m=c.get('china_agent:owner_full_growth_review:2026-11-04:v1:collection')['economics']['rows'][str(nm)]
          s=st['rows'][0];pr=p['rows'][0]
          margin=m['expected_margin_before_ads_cny']+m['buyout']*(pr['seller_price']-m['seller_price_cny'])*(1-m['commission_pct']/100)-m['buyout']*(s['price']/100-m['own_cogs_rub'])/m['fx_rub_per_cny']
          out=dict(observed_at=stamp(),prices=p,published_stock=pub,stock=st,campaigns=cs,minimums=q,budgets=bud,margin_before_ads_cny=margin,wb_writes=0,telegram_calls=0,grants_action_permission=False)
          k='china_agent:owner_sales_next681:2026-11-04:v1:inputs';out=json.loads(json.dumps(out))
          if c.get(k)is None:c.create(k,out)
          else:c.put(k,out)
          assert c.get(k)==out
          print(json.dumps({'status':'readback_ok','at':out['observed_at'],'min':q,'margin':margin,'budgets':bud}))
          
          PY

name: Owner selected eight raises job237 4Nov
on:
  push:
    paths: ['.github/workflows/owner-growth-selected237.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-growth-selected237
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Bounded fresh growth economics; no model or Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: disabled
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import copy,json,os,time,requests
          from datetime import datetime,timezone
          from zoneinfo import ZoneInfo
          from china_cloud_cost_control import Cache,WB,validate_identity,projection,digest,stamp
          from china_advertising_state import AdvertisingIO
          from china_moysklad_read import read_stock
          from china_morning_readiness import current_prices,published_stock
          ROOT='china_agent:owner_growth_selected:2026-11-04:job237:v1:attempt2'
          AUTH='china_agent:owner_growth_selected:2026-11-04:job237:v1:approval'
          c=Cache();io=AdvertisingIO()
          def norm(v):return json.loads(json.dumps(v))
          def put(k,v):c.put(k,norm(v))
          def approve():
           a=c.get(AUTH)or{};p=c.get('china_agent:loss_plan:v1:'+a.get('source_plan_id',''))or{}
           jobs=io.db('business_agent_jobs?id=eq.237&select=id,sender_id,chat_id,request_text,tool_trace,created_at')
           if len(jobs)!=1:raise ValueError('Owner job absent')
           job=jobs[0];m=next(t for t in job['tool_trace']if t.get('name')=='china_saved_question')
           if job['sender_id']!=5122667182 or job['chat_id']!=-1004342917488 or m.get('reply_message_id')!=670 or m.get('message_id')!=673 or m.get('bot_id')!=8780468043:raise ValueError('Owner message binding differs')
           if m.get('original_request_text')!='Сделай только повышение ставок и добавление, ничего не исключай и не понижай ставки':raise ValueError('Owner scope differs')
           selected=[x for x in p['items']if x['kind']=='ad_set_bid'and x['target_minor']>x['old_minor']]
           if a.get('execution_authorized')is not True or a.get('job_id')!=237 or a.get('owner_user_id')!=5122667182 or len(selected)!=8 or a['items']!=selected or p['plan_sha256']!=digest(p['items'])or a['source_plan_sha256']!=p['plan_sha256']:raise ValueError('Exact subset/hash differs')
           if p.get('invalidated_at')or datetime.now(timezone.utc)>=datetime.fromisoformat(p['expires_at'])or datetime.fromisoformat(job['created_at'])<datetime.fromisoformat(p['visible_from']):raise ValueError('Source expired/revoked or predates edit')
           if any(x['nm_id']in[1473245494,1473245510,1473244000]for x in selected):raise ValueError('Owner excluded products')
           return a,selected,p
          a,items,parent=approve()
          class Scoped(WB):
           def req(self,path,method='GET',body=None,write=False):
            if write:
             approve()
             expected=[dict(advert_id=cid,nm_bids=[dict(nm_id=x['nm_id'],placement=x['placement'],bid_kopecks=x['target_minor'])for x in items if x['campaign_id']==cid])for cid in sorted({x['campaign_id']for x in items})]
             if method!='PATCH'or path!='/api/advert/v1/bids'or not isinstance(body,dict)or set(body)!= {'bids'}or len(body['bids'])!=1 or body['bids'][0]not in expected:raise ValueError('Write outside eight exact raises')
            return super().req(path,method,body,write)
          def main():
           if os.environ.get('GITHUB_REPOSITORY')!='Ekaterina11098/veschi-bot-runner'or os.environ.get('GITHUB_REF')!='refs/heads/main':raise ValueError('Public main only')
           if c.get(ROOT+':execution'):print('Existing execution; never replay');return
           w=Scoped();validate_identity(c,w);e=dict(status='preflight',approval_key=AUTH,created_at=stamp(),items=items,steps={},wb_writes=0,telegram_calls=0,budget_writes=0,price_writes=0,stock_writes=0)
           if not c.create(ROOT+':execution',e):return
           def save():put(ROOT+':execution',e)
           try:
            ids=sorted({x['campaign_id']for x in items});cs=w.campaigns(ids)
            prices=current_prices(io,[x['nm_id']for x in items]);pub=published_stock(io,prices,[x['nm_id']for x in items]);stock=read_stock([x['article']for x in items])
            if not stock['coverage_complete']or pub['missing_nm_ids']:raise ValueError('Current stock coverage incomplete')
            pr={r['nm_id']:r for r in prices['rows']};st={r['article']:r for r in stock['rows']}
            cfg=requests.get('https://advert-api.wildberries.ru/api/advert/v1/config',headers={'Authorization':w.token},timeout=45);cfg.raise_for_status();cfg=cfg.json()
            if cfg.get('currency')!='CNY'or not cfg.get('cpcStep'):raise ValueError('CPC config unknown')
            budgets=w.req('/api/advert/v2/budget','POST',dict(advertIds=ids));balances={r['advertId']:r['total']for r in budgets['adverts']if r['currency']=='CNY'}
            full=c.get('china_agent:owner_full_growth_review:2026-11-04:v1:collection')
            reserve={}
            for b in full['source']['batches'].values():
             for cp in b['stats']:
              reserve[cp['advertId']]=sum(d['sum']for d in cp['days']if '2026-11-01'<=d['date'][:10]<='2026-11-03')
            raised=set()
            for key in(c.get('china_agent:verified_campaign_state:v1')or{}).values():
             r=c.get(key)or{};at=r.get('verified_at')
             if r.get('status')!='verified'or not at or datetime.fromisoformat(at.replace('Z','+00:00').replace(' UTC','+00:00')).astimezone(ZoneInfo('Europe/Moscow')).date().isoformat()!='2026-11-04':continue
             before={n['nm_id']:n for n in r.get('before',{}).get('nm_settings',[])}
             for n in r.get('after',{}).get('nm_settings',[]):
              if n['nm_id']in before and any(n['bids_kopecks'].get(z,0)>before[n['nm_id']]['bids_kopecks'].get(z,0)for z in['search','recommendations']):raised.add(n['nm_id'])
            minima={}
            for cid in ids:
             group=[x for x in items if x['campaign_id']==cid];zone=group[0]['placement']
             if len({x['placement']for x in group})!=1:raise ValueError('Mixed placement')
             minima[cid]=w.minimums(cid,[x['nm_id']for x in group],zone)
            for x in items:
             cp=cs[str(x['campaign_id'])];ev=x['growth_evidence'];g=pr[x['nm_id']];s=st[x['article']]
             n=next(n for n in cp['nm_settings']if n['nm_id']==x['nm_id'])
             if cp['status']!=9 or cp['currency']!='CNY'or cp['bid_type']!='manual'or cp['settings']['payment_type']!='cpc'or cp['settings']['placements'].get(x['placement'])is not True:raise ValueError('Campaign mode changed')
             if n['bids_kopecks'][x['placement']]!=x['old_minor']or x['nm_id']in raised:raise ValueError('Bid changed or already raised today; no repeat')
             if g['article']!=x['article']or g['seller_price']!=ev['price_cny']or s['stock']-s['reserve']<=0 or not s['price']or pub['amounts'].get(str(x['nm_id']),0)<=0:raise ValueError('Current price/stock/COGS unavailable')
             delta=ev['buyout']*(s['price']/100-ev['own_cogs_rub'])/ev['fx_rub_per_cny']
             if ev['stress_margin_before_ads_cny']-delta<=ev['modeled_cpa_same_cr']*1.25:raise ValueError('Fresh COGS no longer supports stress economics')
             if x['target_minor']%cfg['cpcStep']or x['target_minor']>cfg['cpcMaxBid']or minima[x['campaign_id']][x['nm_id']]>x['target_minor']:raise ValueError('Minimum/step changed')
             reserve[x['campaign_id']]+=ev['metrics']['clicks']/len(ev['decision_days'])*3*(x['target_minor']-x['old_minor'])/100
            if any(balances.get(cid,-1)<reserve[cid]for cid in ids):raise ValueError('Insufficient three-day campaign reserve; no funding authorized')
            e.update(status='applying',before=cs,preflight=dict(prices=prices,published_stock=pub,stock=stock,budgets=budgets,reserve_3days=reserve,minimums=minima));save()
            for cid in ids:
             approve();group=[x for x in items if x['campaign_id']==cid];before=w.campaigns([cid])[str(cid)]
             if projection(before)!=projection(cs[str(cid)]):raise ValueError('Campaign changed after preflight')
             expected=copy.deepcopy(before)
             for x in group:next(n for n in expected['nm_settings']if n['nm_id']==x['nm_id'])['bids_kopecks'][x['placement']]=x['target_minor']
             body=dict(bids=[dict(advert_id=cid,nm_bids=[dict(nm_id=x['nm_id'],placement=x['placement'],bid_kopecks=x['target_minor'])for x in group])])
             key=ROOT+':'+str(cid)+':execution';step=dict(status='submitting',before=before,expected=expected,items=group,submitted_at=stamp(),parent=ROOT+':execution',approval_key=AUTH)
             if not c.create(key,norm(step)):raise ValueError('Child exists; never replay')
             e['steps'][str(cid)]=key;save()
             try:
              e['wb_writes']+=1;save();step['response']=w.req('/api/advert/v1/bids','PATCH',body,write=True);step['status']='accepted';put(key,step)
              for attempt in range(5):
               after=w.campaigns([cid])[str(cid)];step['after']=after
               if projection(after)==projection(expected):break
               if attempt<4:time.sleep(3)
              else:raise ValueError('Readback uncertain; never replay')
              step.update(status='verified',verified_at=stamp());put(key,step)
              registry=c.get('china_agent:verified_campaign_state:v1')or{};registry[str(cid)]=key;put('china_agent:verified_campaign_state:v1',registry)
             except Exception as ex:step.update(status='uncertain',reason=str(ex));put(key,step);raise
            e.update(status='verified',verified_items=8,verified_at=stamp(),after=w.campaigns(ids));save()
            # Consume parent after the selected subset, so its rejected reductions/exclusions cannot execute later.
            parent.update(invalidated_at=stamp(),invalidation_reason='Owner job237 selected only eight raises, completed. Reductions/exclusions not authorized by that reply.');put('china_agent:loss_plan:v1:'+parent['plan_id'],parent)
           except Exception as ex:e.update(status='partial_or_uncertain'if e['steps']else'blocked',reason=str(ex),completed_at=stamp());save()
           print(json.dumps({k:e.get(k)for k in['status','verified_items','wb_writes','reason']}))
          if __name__=='__main__':main()
          PY

name: Owner correct existing morning growth PNG 4Nov
on:
  push:
    paths: ['.github/workflows/owner-growth-correct4.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-growth-correct4
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Bounded fresh growth economics; no model or Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import base64,copy,hashlib,json,requests
          from datetime import datetime,timezone
          from china_advertising_state import AdvertisingIO
          from china_advertising_v2_png import render
          from china_advertising_growth import merge
          from china_advertising_directions import attach
          from china_daily_ad_actions import plan,BIND
          from china_loss_control import PLAN
          ROOT='china_agent:owner_full_growth_review:2026-11-04:v1';DAY='2026-11-04';MID=670
          io=AdvertisingIO();decision=io.get(ROOT+':decisions');full=io.get(ROOT+':collection')
          if not decision or decision['status']!='reviewed':raise ValueError('Review missing')
          if io.get(ROOT+':correction'):raise ValueError('Correction exists; never replay edit')
          delivery=io.get('china_agent:advertising_delivery:'+DAY+':v1');old=io.get('china_agent:advertising_artifacts:'+DAY+':v2')
          if delivery['status']!='delivered'or [(p['kind'],p['message_id'],p['status'])for p in delivery['parts']]!=[('drr:001',670,'sent'),('budgets:001',671,'sent')]:raise ValueError('Unexpected delivered identity')
          if io.tg('getMe',{})['id']!=8780468043:raise ValueError('Bot identity')
          actions=decision['actions']
          if len(actions)!=8 or any(a['nm_id']in[1473245494,1473245510,1473244000]for a in actions):raise ValueError('Unexpected owner action scope')
          bundle=copy.deepcopy(old['bundle'])
          for cp in bundle['campaigns']:
           for group in ['focus','attention']:
            for r in cp.get(group,[]):
             if r.get('nm')in[1473245494,1473245510,1473244000]:r['action']=None
          bundle=merge(bundle,actions);bundle=attach(bundle,full['source'])
          bundle['recommendation_directions']['raise']['note']=decision['coverage']['raise']
          bundle['recommendation_directions']['add'].update(note=decision['coverage']['add'],status='checked',rows=[],count=0)
          bundle['owner_full_growth_review']=dict(source_key=ROOT+':collection',decision_key=ROOT+':decisions',catalogue_count=315,raise_count=8,add_count=0,reviewed_at=decision['reviewed_at'],wb_writes=0)
          bundle['codex_analysis']['owner_full_growth_review']=bundle['owner_full_growth_review']
          import china_advertising_directions as directions
          original=directions.campaign_table
          def table(b):
           out=original(b);labels={a['article']for a in actions}
           for cp in out['campaigns']:
            cp['direction_recommendations']=[s.replace(': Повысить ',': Тест: повысить ')if any(s.startswith(a+':')for a in labels)else s for s in cp['direction_recommendations']]
           return out
          directions.campaign_table=table
          pages=[p for p in render(bundle)if p['family']=='drr']
          if len(pages)!=1:raise ValueError('Correction must replace exact one existing drr page')
          f=pages[0];p=plan(io,DAY,f,0,slot='owner-growth4-corrected')
          caption='Китай · реклама · 2026-11-04 · 1/1. Обновлено: 8 ограниченных тестов повышения; добавлений пока нет. Всего новых действий: '+str(len(p['items']))+'. Ответьте «Сделай всё» для новых действий только этого обновлённого PNG.'
          newfile=dict(kind=f['kind'],family='drr',page=1,total=1,plan_id=p['plan_id'],plan_sha256=p['plan_sha256'],action_count=len(p['items']),b64=base64.b64encode(f['bytes']).decode())
          archive=dict(artifacts=old,delivery=delivery,binding=io.get(BIND+str(MID)),archived_at=datetime.now(timezone.utc).isoformat())
          if not io.create(ROOT+':original_sent',archive):raise ValueError('Original archive already exists')
          oldpid=archive['binding']['plan_id'];oldplan=io.get(PLAN+oldpid);oldplan.update(invalidated_at=datetime.now(timezone.utc).isoformat(),invalidation_reason='Replaced by owner-requested full cabinet growth review');io.put(PLAN+oldpid,oldplan)
          step=dict(status='editing',message_id=MID,chat_id=-1004342917488,bot_id=8780468043,sha256=hashlib.sha256(f['bytes']).hexdigest(),plan_id=p['plan_id'],plan_sha256=p['plan_sha256'],submitted_at=datetime.now(timezone.utc).isoformat(),wb_writes=0)
          if not io.create(ROOT+':correction',step):raise ValueError('Concurrent correction; no replay')
          try:
           media=json.dumps(dict(type='photo',media='attach://photo',caption=caption),ensure_ascii=False)
           r=requests.post('https://api.telegram.org/bot'+io.bot+'/editMessageMedia',data=dict(chat_id=-1004342917488,message_id=MID,media=media),files={'photo':('growth-review4.png',f['bytes'],'image/png')},timeout=60)
           j=r.json()
           if not r.ok or not j.get('ok'):raise RuntimeError('Telegram edit HTTP '+str(r.status_code))
           receipt=j['result']
           if receipt.get('message_id')!=MID or receipt.get('chat',{}).get('id')!=-1004342917488 or receipt.get('from',{}).get('id')!=8780468043 or not receipt.get('photo'):raise ValueError('Edit receipt identity mismatch')
           at=datetime.now(timezone.utc).isoformat()
           p.update(report_message_ids=[MID],visible_from=at);io.put(PLAN+p['plan_id'],p)
           io.put(BIND+str(MID),dict(plan_id=p['plan_id'],plan_sha256=p['plan_sha256'],chat_id=-1004342917488,family='drr'))
           new=copy.deepcopy(old);new.update(bundle=bundle,files=[newfile]+[x for x in old['files']if x['family']=='budgets'],owner_corrected_at=at)
           io.put('china_agent:advertising_artifacts:'+DAY+':v2',new)
           delivery['parts'][0].update(sha256=step['sha256'],receipt=receipt,edited_at=at,plan_id=p['plan_id'],plan_sha256=p['plan_sha256'])
           delivery['owner_correction_key']=ROOT+':correction';io.put('china_agent:advertising_delivery:'+DAY+':v1',delivery)
           step.update(status='edited_verified',receipt=receipt,verified_at=at,raise_count=8,add_count=0,total_action_count=len(p['items']),old_plan_invalidated=oldpid,archive_key=ROOT+':original_sent')
           io.put(ROOT+':correction',step)
           request=io.get(ROOT);request.update(status='included',hold_delivery_until_reviewed=False,correction_key=ROOT+':correction');io.put(ROOT,request)
          except Exception as ex:
           step.update(status='uncertain',reason=str(ex));io.put(ROOT+':correction',step);raise
          print(json.dumps({k:step[k]for k in ['status','message_id','raise_count','add_count','total_action_count','wb_writes']}))
          PY

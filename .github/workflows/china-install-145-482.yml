name: Install explicitly approved China initial prices 145 482
on:
  push:
    branches: [china-install-145-482-20261019]
permissions: {contents: read}
concurrency:
  group: china-confirmed-wb-price-writes
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Apply only exact owner-approved China initial prices and verify
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: python scripts/china_install_145_482_once.py

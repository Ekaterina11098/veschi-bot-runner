name: China dialogue regression checks
on:
  push:
    branches: [main]
    paths:
      - scripts/china_report_buttons.py
      - scripts/china_report_buttons.mjs
      - scripts/check_report_button_worker.py
      - scripts/test_report_buttons.mjs
      - scripts/china_morning_readiness.py
      - scripts/china_advertising_v2.py
      - scripts/test_china_advertising_readiness.py
      - scripts/china_strategy.py
      - scripts/test_china_strategy31.py
      - scripts/china_budget_context.py
      - scripts/china_budget_reserve.py
      - scripts/china_advertising_v2_png.py
      - scripts/test_china_budget_completed31.py
      - scripts/china_profit_forecast.py
      - scripts/test_china_profit_forecast31.py
      - scripts/test_china_funnel_reply31.py
      - scripts/china_experiment_journal.py
      - scripts/china_experience.py
      - scripts/test_china_experiment_journal31.py
      - scripts/china_advertising_plans.py
      - scripts/china_analytic_evidence.py
      - scripts/china_saved_products.py
      - scripts/china_product_current.py
      - scripts/test_china_pavel_questions31.py
      - scripts/china_pavel_questions31.json
      - scripts/china_ad_expense_table.py
      - scripts/test_china_expense_import31.py
      - scripts/test_china_analytic_evidence.py
      - scripts/china_intraday_analysis.py
      - scripts/china_conversion_context.py
      - scripts/china_single_price_command.py
      - scripts/china_catalog_price_execute.py
      - scripts/test_china_owner_analytics30.py
      - scripts/china_moysklad_read.py
      - scripts/test_china_moysklad_read.py
      - scripts/china_analytic_dialog.py
      - scripts/china_bid_proposals.py
      - scripts/china_article*.py
      - scripts/china_article_pavel_cases.json
      - scripts/china_price_apply.py
      - scripts/china_price_minimum.py
      - scripts/test_china_article*.py
      - scripts/test_china_price_minimum.py
      - scripts/test_china_price_apply.py
      - scripts/test_china_analytic_dialog.py
      - scripts/test_china_bid_proposals.py
      - scripts/china_reply_evidence.py
      - scripts/china_reply_quality.py
      - scripts/china_catalog_price_command.py
      - scripts/china_zero_orders.py
      - scripts/china_zero_orders_stock.py
      - scripts/conversion_watches.py
      - scripts/test_china_reply_*.py
      - scripts/test_china_catalog_price_command.py
      - scripts/test_china_zero_orders*.py
      - .github/workflows/china-dialogue-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 Pillow==12.3.0
      - name: Synthetic persistence and transport only; no credentials or live API calls
        run: |
          python -m unittest discover -s scripts -p 'test_china_reply_*.py'
          python -m unittest discover -s scripts -p test_china_catalog_price_command.py
          python -m unittest discover -s scripts -p test_china_zero_orders.py
          python -m unittest discover -s scripts -p test_china_zero_orders_stock.py
          python -m unittest discover -s scripts -p 'test_china_article*.py'
          python -m unittest discover -s scripts -p test_china_price_minimum.py
          python -m unittest discover -s scripts -p test_china_price_apply.py
          python -m unittest discover -s scripts -p test_china_catalog_price_execute.py
          python -m unittest discover -s scripts -p test_china_advertising_readiness.py
          python -m unittest discover -s scripts -p test_china_strategy31.py
          python -m unittest discover -s scripts -p test_china_profit_forecast31.py
          python -m unittest discover -s scripts -p test_china_funnel_reply31.py
          python -m unittest discover -s scripts -p test_china_conversion_context.py
          python -m unittest discover -s scripts -p test_china_owner_analytics30.py
          python -m unittest discover -s scripts -p test_china_moysklad_read.py
          python -m unittest discover -s scripts -p test_china_experiment_journal31.py
          python -m unittest discover -s scripts -p test_china_experience.py
          python -m unittest discover -s scripts -p test_china_advertising_plans.py
          python -m unittest discover -s scripts -p test_china_budget_completed31.py
          python -m unittest discover -s scripts -p test_china_once_report.py
          python -m unittest discover -s scripts -p test_china_pavel_questions31.py
          python -m unittest discover -s scripts -p test_china_expense_import31.py
          python -m unittest discover -s scripts -p test_china_analytic_evidence.py
          python -m unittest discover -s scripts -p test_china_analytic_dialog.py
          python -m unittest discover -s scripts -p test_china_bid_proposals.py
          python -m py_compile scripts/conversion_watches.py scripts/china_reply_evidence.py scripts/china_reply_quality.py scripts/china_catalog_price_command.py scripts/china_zero_orders_stock.py

      - name: Exact report buttons, mocked transports only
        run: |
          node scripts/test_report_buttons.mjs
          python scripts/check_report_button_worker.py
          python -m unittest discover -s scripts -p test_china_daily_ad_actions.py
          python -m unittest discover -s scripts -p test_china_advertising_delivery.py

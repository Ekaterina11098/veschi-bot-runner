name: Owner additions bounded read-only verification
on:
  push:
    paths: ['.github/workflows/owner-additions-read5.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-additions-read5
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Bounded fresh growth economics; no model or Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: disabled-no-send
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json,time,requests
          from china_cloud_cost_control import Cache,WB,validate_identity,stamp
          ROOT='china_agent:owner_new_additions_read:2026-11-05:v1:categories'
          c=Cache();w=WB();validate_identity(c,w)
          if not c.create(ROOT+':claim',dict(at=stamp())):raise ValueError('Already claimed')
          v=dict(status='collecting',observed_at=stamp(),wb_writes=0,telegram_calls=0,errors={})
          for nm in [1594295903,1473243449]:
           try:
            time.sleep(1)
            r=requests.post('https://content-api.wildberries.ru/content/v2/get/cards/list',headers={'Authorization':w.token},json={'settings':{'cursor':{'limit':10},'filter':{'textSearch':str(nm),'withPhoto':-1}}},timeout=45)
            r.raise_for_status()
            v[str(nm)]=[dict(nmID=x['nmID'],vendorCode=x['vendorCode'],subjectID=x['subjectID'],subjectName=x.get('subjectName'))for x in r.json().get('cards',[])if x.get('nmID')==nm]
           except Exception as e:v['errors'][str(nm)]=str(e)[:200]
           c.put(ROOT,json.loads(json.dumps(v)))
          v.update(status='complete',completed_at=stamp());c.put(ROOT,json.loads(json.dumps(v)))
          print(json.dumps(dict(status=v['status'],wb_writes=0)))
          
          PY

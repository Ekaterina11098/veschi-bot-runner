name: Read-only Ozon document audit November 2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-ozon-documents-20261102.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
          filter: blob:none
      - name: Read actual MS documents and compare saved Ozon acts
        shell: python
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import sys,json,collections
          sys.path.insert(0,"scripts")
          import fbs_document_chain as m
          class R(m.Transport):
           def request(self,base,path,method="GET",body=None,params=None):
            if base==m.MS and method!="GET":raise m.Stop("MS writes prohibited")
            return super().request(base,path,method,body,params)
          t=R();db=m.Cache(t);w=m.Worker(t,db,{})
          root="ozon_document_audit:20261102:"
          request=db.get(root+"request:v1");assert request["read_only"] is True
          out={"status":"reading","at":m.now(),"chains":[]}
          def norm(r):return m.href(r).split("?")[0]
          def positions(kind,ident):return w.ms_rows("entity/"+kind+"/"+ident+"/positions",{"expand":"assortment"})
          for key in request["supply_keys"]:
           state=db.get(key);chain={"source_key":key,"act":state["act"],"order_ids":state["order_ids"],"expected_positions":state["positions"],"documents":[]}
           expected=collections.Counter()
           for p in state["positions"]:expected[norm(p["assortment"])]+=p["quantity"]
           for kind,ref in state["documents"].items():
            d=t.request(m.MS,"entity/"+kind+"/"+ref["id"]);ps=positions(kind,d["id"]);actual=collections.Counter();items=[]
            for p in ps:
             actual[norm(p["assortment"])]+=p["quantity"];items.append({"article":p["assortment"].get("article"),"name":p["assortment"].get("name"),"quantity":p["quantity"],"price":p["price"]})
            entry={k:d.get(k) for k in ("id","name","moment","created","updated","applicable","description","externalCode","sum","customerOrder","demand","demands","returns","store","organization","agent")}
            entry.update(type=kind,quantity=sum(p["quantity"] for p in ps),positions=len(ps),items=items,matches_saved_act=actual==expected,all_prices_zero=all(p["price"]==0 for p in ps))
            chain["documents"].append(entry)
           out["chains"].append(chain);db.put(root+"result:v1",out)
          out["posting_intersection"]=sorted(set(out["chains"][0]["order_ids"])&set(out["chains"][1]["order_ids"]))
          out["status"]="complete";out["completed_at"]=m.now();db.put(root+"result:v1",out)
          print("Read-only Ozon document audit complete; private results saved.")
          

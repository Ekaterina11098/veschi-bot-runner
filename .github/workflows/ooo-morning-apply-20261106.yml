name: Owner approved OOO Nov6 morning actions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ooo-morning-apply-20261106.yml']
permissions:
  contents: read
concurrency:
  group: wb-ooo-advertising-owner
  cancel-in-progress: false
jobs:
  execute:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 3708405208147b76cb76ad9ae9b432377f652bee
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - run: python -m py_compile scripts/ooo_morning_apply_20261106.py
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
        run: python scripts/ooo_morning_apply_20261106.py

name: Replace approved analytical answer with exact PNG
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-answer87-png.yml']
permissions:
  contents: read
concurrency:
  group: bot-business-agent
  cancel-in-progress: false
jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Send frozen approved PNG then remove only superseded bot answer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import os,base64,hashlib,json
          from datetime import datetime,timezone
          import requests
          from conversion_watches import runtime
          w=runtime();key='china_agent:approved_answer_replace:v1:87:price_dates';p=w.get(key)
          assert p and p['job_id']==87 and p['chat_id']==-1004342917488 and p['bot_id']==8780468043 and p['old_message_id']==168
          cfg=w.config();assert cfg['chat_id']==p['chat_id'] and cfg['bot_id']==p['bot_id']
          old=w.get('china_agent:conversion_watch_delivery:v1:question:87:0')
          assert old and old['status']=='sent' and old['message_id']==168 and old['chat_id']==p['chat_id']
          blob=base64.b64decode(p['data'],validate=True)
          assert hashlib.sha256(blob).hexdigest()==p['sha256']=='eaafcc92fc4bc7e4fd2bf49ac0a785d9ba70f83253440e2ca3f162495cbca1fe'
          base='https://api.telegram.org/bot'+os.environ['CHINA_TELEGRAM_BOT_TOKEN'].strip()+'/'
          me=requests.post(base+'getMe',timeout=20).json()
          assert me.get('ok') and me['result']['id']==p['bot_id']
          if p['delivery_status']!='sent':
              assert p['delivery_status']=='prepared','Uncertain or already sending: investigate, never resend blindly'
              p.update(delivery_status='sending',sending_at=datetime.now(timezone.utc).isoformat(),run_id=os.environ['GITHUB_RUN_ID'])
              w.save(key,p)
              try:
                  result=requests.post(base+'sendPhoto',data={'chat_id':p['chat_id'],'caption':p['caption'],'reply_parameters':json.dumps({'message_id':167,'allow_sending_without_reply':True})},files={'photo':('order-decline.png',blob,'image/png')},timeout=40).json()
              except Exception:
                  p['delivery_status']='uncertain';w.save(key,p);raise RuntimeError('PNG delivery uncertain') from None
              if not result.get('ok'):
                  p.update(delivery_status='rejected',error_code=result.get('error_code'));w.save(key,p);raise RuntimeError('PNG rejected')
              msg=result['result']
              assert msg['chat']['id']==p['chat_id'] and isinstance(msg['message_id'],int)
              p.update(delivery_status='sent',message_id=msg['message_id'],sent_at=datetime.now(timezone.utc).isoformat())
              w.save(key,p)
          if p.get('old_message_status')!='deleted':
              assert p.get('old_message_status') not in ('deleting','uncertain'),'Deletion uncertain: inspect first'
              p['old_message_status']='deleting';w.save(key,p)
              try:
                  result=requests.post(base+'deleteMessage',json={'chat_id':p['chat_id'],'message_id':168},timeout=25).json()
              except Exception:
                  p['old_message_status']='uncertain';w.save(key,p);raise RuntimeError('Deletion uncertain') from None
              p.update(old_message_status='deleted' if result.get('ok') else 'rejected',delete_error_code=result.get('error_code'),deleted_at=datetime.now(timezone.utc).isoformat() if result.get('ok') else None)
              w.save(key,p)
          print(json.dumps({'png':p['delivery_status'],'old_answer':p.get('old_message_status'),'wb_writes':0}))
          PY

name: China price intraday report only
on:
  push:
    branches: [main]
    paths: ['china-price-intraday-request.json']
  workflow_call:
    inputs:
      action:
        type: string
        default: run
        required: false
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_SECRET_KEY:
        required: true
      SOURCE_READ_TOKEN:
        required: true
      MPSTATS_API_TOKEN:
        required: true
      WB_TOKEN_3:
        required: true
      CHINA_TELEGRAM_BOT_TOKEN:
        required: true
      OPENAI_API_KEY:
        required: true
      MOYSKLAD_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      action:
        description: Deliver current report or preview without Telegram sends
        type: choice
        options: [run, verify]
        default: verify
  schedule:
    - cron: '0,15,30,45 12 * * *'
permissions:
  contents: read
concurrency:
  group: china-price-reports
  cancel-in-progress: false
jobs:
  report:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: china-price-report-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/
            /*request*.json
      - name: Skip completed reports and check fallback time
        id: due
        env:
          EVENT_NAME: ${{ github.event_name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/china_price_due.py --mode intraday
      - name: Validate exact dated request
        if: steps.due.outputs.allowed == 'true'
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_ACTION: ${{ inputs.action }}
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          with open('china-price-intraday-request.json') as f:value=json.load(f)
          day=datetime.now(ZoneInfo('Europe/Moscow')).date().isoformat()
          automatic=os.environ.get('EVENT_NAME') in ('schedule','workflow_dispatch','workflow_call')
          action=(os.environ.get('REQUESTED_ACTION') or 'run') if automatic else value.get('action')
          allowed=(value.get('source_commit')=='b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c'
                   and action in ('run','verify')
                   and (automatic or (value.get('report_date')==day and value.get('mode')=='intraday'
                        and isinstance(value.get('nonce'),str) and len(value['nonce'])>=8)))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('allowed='+str(allowed).lower()+'\n')
              f.write('action='+str(action)+'\n')
          print(json.dumps(dict(mode='intraday',report_date=day,action=action,authorized_run=allowed)))
          PY
      - uses: actions/checkout@v4
        if: steps.request.outputs.allowed == 'true'
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /analytics/
            /business_agents/
            /advertising_agent/
            /china_agent/
            /tests/
            /*.py
      - uses: actions/setup-python@v5
        if: steps.request.outputs.allowed == 'true'
        with:
          python-version: '3.12'
      - name: Install pinned transport and existing worker dependencies
        if: steps.request.outputs.allowed == 'true'
        run: pip install requests==2.32.5 python-dotenv aiogram apscheduler pillow simplejson==4.2.0 openai==3.42.1 > "$RUNNER_TEMP/install.log" 2>&1
      - name: Deliver exact China intraday report
        if: steps.request.outputs.allowed == 'true'
        working-directory: source
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          PYTHONPATH: ../scripts:.
          REPORT_ACTION: ${{ steps.request.outputs.action }}
        run: |
          python ../scripts/china_chat_migration.py --root .
          python ../scripts/install_china_codex_price.py --root .
          python ../scripts/install_china_order_coverage.py
          python ../scripts/install_china_buyout.py
          python ../scripts/check_china_installed_price_step.py china_agent/demand.py
          python ../scripts/test_china_price_pending.py
          python ../scripts/test_china_price_delivery.py
          python ../scripts/test_price_repair_install.py
          python ../scripts/test_price_review_blocks.py
          python ../scripts/test_price_period.py
          python ../scripts/test_price_selection.py
          cp ../scripts/china_wb_order_gaps.py china_agent/wb_order_gaps.py
          cp ../scripts/china_coverage_worker.py china_agent/coverage_worker.py
          cp ../scripts/china_price_brief.py china_agent/price_brief.py
          cp ../scripts/china_buyer_price_forecast.py china_agent/buyer_price_forecast.py
          cp ../scripts/china_morning_pair.py china_agent/morning_pair.py
          cp ../scripts/china_price_aggregate_control.py china_agent/price_aggregate_control.py
          cp ../scripts/china_daily_expected_control.py china_agent/daily_expected_control.py
          cp ../scripts/china_control_owner_preview.py china_agent/control_owner_preview.py
          cp ../scripts/china_expected_order_profit.py china_agent/expected_order_profit.py
          cp ../scripts/china_price_experiment_result.py china_agent/price_experiment_result.py
          cp ../scripts/china_price_economic_target.py china_agent/price_economic_target.py
          if [ "$REPORT_ACTION" = verify ]; then
            python -m china_agent.coverage_worker --mode intraday --verify
          else
            python -m china_agent.coverage_worker --mode intraday
          fi


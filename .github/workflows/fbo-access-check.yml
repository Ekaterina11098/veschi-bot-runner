name: FBO access check (read only)
on:
  push:
    branches: [verify/fbo-stock-2026-10-13]
    paths: ['.github/workflows/fbo-access-check.yml']
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: fb96f06dd011754bf72e5ed8ebcb0e8832131078
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv aiogram > "$RUNNER_TEMP/deps.log" 2>&1
      - name: Read FBO access without stock writes or business data logging
        env:
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          WB_FINANCE_TOKEN_1: ${{ secrets.WB_FINANCE_TOKEN_1 }}
          WB_FINANCE_TOKEN_2: ${{ secrets.WB_FINANCE_TOKEN_2 }}
        run: |
          python - <<'PY'
          import os, json, base64, re, time
          import requests
          from stock_fbo import URL
          failures = []
          for index in (1, 2, 3):
              primary = os.getenv(f'WB_TOKEN_{index}')
              for kind, token in [('main', primary), ('finance', os.getenv(f'WB_FINANCE_TOKEN_{index}'))]:
                  if not token:
                      continue
                  claims = json.loads(base64.urlsafe_b64decode(token.split('.')[1] + '==='))
                  mask = int(claims.get('s', 0))
                  print(f"Cabinet {index} {kind}: type_acc={claims.get('acc')}, analytics={bool(mask & (1 << 2))}, read_only={bool(mask & (1 << 30))}, expired={claims.get('exp', 0) <= time.time()}")
                  host = URL.replace('.wildberries.ru', '.wildberries.cn') if index == 3 else URL
                  r = requests.post(host, headers={'Authorization': token}, json={'limit': 1, 'offset': 0}, timeout=30)
                  print(f'Cabinet {index} {kind}: HTTP {r.status_code}')
                  if r.status_code != 200:
                      try:
                          body = r.json()
                          reason = str({k: body.get(k) for k in ('title','detail','error','errorText') if k in body})
                      except Exception:
                          reason = 'non-JSON response'
                      for secret in [token, str(claims.get('sid', '')), str(claims.get('id', ''))]:
                          if secret:
                              reason = reason.replace(secret, '[redacted]')
                      reason = re.sub(r'eyJ[A-Za-z0-9_.-]+', '[redacted]', reason)
                      print(f'Cabinet {index} {kind}: {reason[:350]}')
          PY

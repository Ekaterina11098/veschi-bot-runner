name: Read sixth belt stock
on:
  push:
    paths: ['.github/workflows/belt-six-stock-20261110.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read live stock only
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        shell: python
        run: |
          import os,json,urllib.request,urllib.parse,datetime
          article="30-2belts115-chocolate"
          def get(url,token,payload=None):
           req=urllib.request.Request(url,data=None if payload is None else json.dumps(payload).encode(),headers={"Authorization":token,"Accept-Encoding":"gzip","Content-Type":"application/json"})
           with urllib.request.urlopen(req,timeout=45) as r:
            raw=r.read()
            if r.headers.get("Content-Encoding")=="gzip":
             import gzip
             raw=gzip.decompress(raw)
            return json.loads(raw)
          ms="https://api.moysklad.ru/api/remap/1.2"
          token="Bearer "+os.environ["MOYSKLAD_API_TOKEN"]
          try:
           prods=get(ms+"/entity/product?"+urllib.parse.urlencode({"filter":"article="+article}),token)["rows"]
           exact=[x for x in prods if x.get("article","").lower()==article.lower()]
           stores=get(ms+"/entity/store?limit=100",token)["rows"]
           print("MS_PRODUCTS="+json.dumps([{"id":x["id"],"article":x.get("article"),"name":x.get("name"),"archived":x.get("archived")} for x in exact],ensure_ascii=False))
           for x in exact:
            href=x["meta"]["href"]
            for st in stores:
             if st["name"] in ["МСК","Гонконг ВБ ФБО"]:
              report=get(ms+"/report/stock/all?"+urllib.parse.urlencode({"filter":"product="+href+";store="+st["meta"]["href"]+";stockMode=all;quantityMode=all"}),token)
              print("MS_STOCK="+json.dumps({"store":st["name"],"rows":[{k:r.get(k) for k in ["name","article","stock","reserve","inTransit","quantity"]} for r in report.get("rows",[])]},ensure_ascii=False))
          except Exception as e:print("MS_ERROR="+str(e))
          try:
           cards=get("https://content-api.wildberries.cn/content/v2/get/cards/list",os.environ["WB_TOKEN_3"],{"settings":{"cursor":{"limit":100},"filter":{"textSearch":"1560230893","withPhoto":-1}}}).get("cards",[])
           cards=[c for c in cards if c.get("vendorCode","").lower()==article.lower() or c.get("nmID")==1560230893]
           print("WB_CARDS="+json.dumps([{"nmID":c["nmID"],"vendorCode":c["vendorCode"],"sizes":c.get("sizes")} for c in cards],ensure_ascii=False))
           ids=[z["chrtID"] for c in cards for z in c.get("sizes",[])]
           if ids:
            warehouses=get("https://marketplace-api.wildberries.cn/api/v3/warehouses",os.environ["WB_TOKEN_3"])
            for wh in warehouses:
             stocks=get("https://marketplace-api.wildberries.cn/api/v3/stocks/"+str(wh["id"]),os.environ["WB_TOKEN_3"],{"chrtIds":ids})
             print("WB_STOCK="+json.dumps({"warehouse":wh,"stocks":stocks},ensure_ascii=False))
          except Exception as e:print("WB_ERROR="+str(e))
          print("CHECKED_AT="+datetime.datetime.now(datetime.timezone.utc).isoformat())

name: MAYA owner code correction
on:
  push:
    branches: [main]
    paths: ['.github/workflows/maya-ms-codes-20261104.yml']
permissions: {}
concurrency:
  group: maya-ms-products-20261104
  cancel-in-progress: false
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Correct code only and verify preservation
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import os,json,gzip,datetime,urllib.request,urllib.parse,urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*a,**k):raise RuntimeError("Redirect blocked")
          opener=urllib.request.build_opener(NoRedirect)
          sb=os.environ["SUPABASE_URL"].rstrip("/")
          base="https://api.moysklad.ru/api/remap/1.2/"
          sh={"apikey":os.environ["SUPABASE_SECRET_KEY"],"Authorization":"Bearer "+os.environ["SUPABASE_SECRET_KEY"],"Content-Type":"application/json"}
          mh={"Authorization":"Bearer "+os.environ["MOYSKLAD_API_TOKEN"],"Accept-Encoding":"gzip","Accept":"application/json;charset=utf-8","Content-Type":"application/json"}
          def call(url,headers,method="GET",body=None):
           try:
            with opener.open(urllib.request.Request(url,headers=headers,method=method,data=None if body is None else json.dumps(body,ensure_ascii=False).encode()),timeout=60) as r:
             raw=r.read()
             if not raw:return None
             if r.headers.get("Content-Encoding")=="gzip":raw=gzip.decompress(raw)
             return json.loads(raw)
           except urllib.error.HTTPError as e:
            raw=e.read()
            if "api.moysklad.ru" in url:
             payload={"http_status":e.code,"body":raw.decode("utf-8","replace")}
             stamp=datetime.datetime.now(datetime.timezone.utc).isoformat()
             h=dict(sh);h["Prefer"]="resolution=merge-duplicates,return=minimal"
             request=urllib.request.Request(sb+"/rest/v1/telegram_api_cache?on_conflict=cache_key",headers=h,method="POST",data=json.dumps({"cache_key":"maya_cycle:code_error:20261104","payload":payload,"updated_at":stamp,"expires_at":"2026-12-31T23:59:59Z"}).encode())
             with opener.open(request,timeout=30) as stored:stored.read()
            raise RuntimeError("Remote HTTP "+str(e.code)) from None
          import re
          ref=call(sb+"/rest/v1/telegram_api_cache?cache_key=eq.maya_cycle:create_result:20261104&select=payload",sh)[0]["payload"]
          assert ref["status"]=="complete" and len(ref["products"])==18
          all_products=[]
          for archived in ("false","true"):
           offset=0
           while True:
            page=call(base+"entity/product?"+urllib.parse.urlencode({"filter":"archived="+archived,"limit":1000,"offset":offset}),mh)
            all_products.extend(page["rows"]);offset+=len(page["rows"])
            if offset>=page["meta"]["size"]:break
            if not page["rows"] or offset>20000:raise RuntimeError("Incomplete code preflight")
          def normalize_code(value):
           return str(value or "").strip().lower().lstrip("0")
          approved=call(sb+"/rest/v1/telegram_api_cache?cache_key=eq.maya_cycle:code_result:20261104&select=payload",sh)[0]["payload"]
          previous=call(sb+"/rest/v1/telegram_api_cache?cache_key=eq.maya_cycle:code_rename_audit:20261104&select=payload",sh)
          audit=previous[0]["payload"] if previous else {"products":[]}
          targets={x["id"] for x in ref["products"]}
          conflicts=approved.get("conflicts",[])
          for conflict in conflicts:
           for oldref in conflict["existing"]:
            assert oldref["id"] not in targets
            old=call(base+"entity/product/"+oldref["id"],mh)
            newcode=oldref["code"]+"-old"
            assert old.get("article")==oldref.get("article") and old["code"] in (oldref["code"],newcode)
            assert not any(q["id"]!=old["id"] and normalize_code(q.get("code"))==normalize_code(newcode) for q in all_products)
            if old["code"]!=newcode:call(base+"entity/product/"+old["id"],mh,"PUT",{"code":newcode})
            checked=call(base+"entity/product/"+old["id"],mh)
            assert checked["code"]==newcode
            for field in ("article","name","barcodes","description","archived"):
             assert checked.get(field)==old.get(field)
            for q in all_products:
             if q["id"]==old["id"]:q["code"]=newcode
            if not any(x["id"]==old["id"] for x in audit["products"]):
             audit["products"].append({"id":old["id"],"article":old.get("article"),"before":oldref["code"],"code":newcode,"verified":True})
            h=dict(sh);h["Prefer"]="resolution=merge-duplicates,return=minimal"
            call(sb+"/rest/v1/telegram_api_cache?on_conflict=cache_key",h,"POST",{"cache_key":"maya_cycle:code_rename_audit:20261104","payload":audit,"updated_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"expires_at":"2026-12-31T23:59:59Z"})
          out={"run_id":os.environ["GITHUB_RUN_ID"],"status":"in_progress","products":[],"conflicts":[]}
          def save():
           stamp=datetime.datetime.now(datetime.timezone.utc).isoformat()
           h=dict(sh);h["Prefer"]="resolution=merge-duplicates,return=minimal"
           call(sb+"/rest/v1/telegram_api_cache?on_conflict=cache_key",h,"POST",{"cache_key":"maya_cycle:code_result:20261104","payload":out,"updated_at":stamp,"expires_at":"2026-12-31T23:59:59Z"})
          save()
          for item in ref["products"]:
           p=call(base+"entity/product/"+item["id"],mh)
           assert p["article"]==item["article"] and p.get("externalCode")=="veschi-maya-20261104-"+p["article"]
           numbers=re.findall(r"[0-9]+",p["name"])
           assert len(numbers)==1 and p["name"].lower().startswith("сумка")
           code=numbers[0]+"с"
           collisions=[q for q in all_products if q["id"]!=p["id"] and normalize_code(q.get("code"))==normalize_code(code)]
           if collisions:
            out["conflicts"].append({"article":p["article"],"requested_code":code,"existing":[{"id":q["id"],"article":q.get("article"),"name":q["name"],"code":q.get("code"),"archived":q.get("archived")} for q in collisions]});save();continue
           old=p.get("code")
           call(base+"entity/product/"+p["id"],mh,"PUT",{"code":code})
           v=call(base+"entity/product/"+p["id"],mh)
           assert v["code"]==code and v["article"]==p["article"] and v["name"]==p["name"]
           assert v.get("barcodes",[])==p.get("barcodes",[]) and v.get("description")==p.get("description")
           out["products"].append({"article":p["article"],"id":p["id"],"before":old,"code":code,"verified":True});save()
          out["status"]="complete" if not out["conflicts"] else "partial_conflicts";save()
          print("Product code correction verified. Other product fields preserved.")

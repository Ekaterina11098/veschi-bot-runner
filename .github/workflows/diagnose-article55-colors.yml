name: Diagnose article55 picking colors read only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-article55-colors.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: article55-ip-read-only
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read IP card first then exact task identifiers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
        run: python scripts/diagnose_article55_colors.py

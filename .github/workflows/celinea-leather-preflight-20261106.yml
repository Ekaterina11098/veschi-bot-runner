ь сумочку через плечо, оставляя руки свободными. Формат кросс-боди подойдёт для прогулок, встреч и поездок по городу. Модель дополнит гардероб для офиса, повседневных дел или вечернего выхода.\\n\\nНатуральная замша придаёт сумке мягкую ворсистую фактуру. Кофейная замшевая сумка сочетается с джинсами, трикотажем, платьями и жакетами. Металлическая фурнитура дополняет сдержанный и женственный образ.\\n\\nСелинеа подойдёт тем, кто ищет женскую сумку из натуральной замши через плечо с одним отделением и внутренними карманами.\\n\\nВ комплект входят сумка, один ремешок и фирменный пыльник. Для упаковки используются фирменный пыльник и фирменный пакет с бегунком.\\n\\nРазмеры сумочки без упаковки: высота — 19 см, ширина — 31 см, глубина — 11 см. Вес — 650 г.\",\"72-celineabag-zdarkred\":\"Женская сумка через плечо Селинеа станет вашим стильным аксессуаром в повседневной жизни. Модель кросс-боди из натуральной замши подойдёт девушкам и женщинам, которые ценят лаконичный дизайн и выразительные фактуры. Насыщенный тёмно-красный цвет дополнит как повседневный, так и более нарядный образ.\\n\\nВнутри сумки — одно отделение с текстильной подкладкой, внутренний карман на молнии и открытый карман для небольших вещей. Такое устройство помогает удобно разместить повседневные мелочи. Поворотный замок закрывает сумку и подчёркивает её оформление.\\n\\nРемешок позволяет носить сумочку через плечо, оставляя руки свободными. Формат кросс-боди подойдёт для прогулок, встреч и поездок по городу. Модель дополнит гардероб для офиса, повседневных дел или вечернего выхода.\\n\\nНатуральная замша придаёт сумке мягкую ворсистую фактуру. Тёмно-красная замшевая сумка сочетается с джинсами, трикотажем, платьями и жакетами. Металлическая фурнитура дополняет сдержанный и женственный образ.\\n\\nСелинеа подойдёт тем, кто ищет женскую сумку из натуральной замши через плечо с одним отделением и внутренними карманами.\\n\\nВ комплект входят сумка, один ремешок и фирменный пыльник. Для упаковки используются фирменный пыльник и фирменный пакет с бегунком.\\n\\nРазмеры сумочки без упаковки: высота — 19 см, ширина — 31 см, глубина — 11 см. Вес — 650 г.\"}")
          def norm(s):return s.lower().lstrip('0')
          def cache(key):
              k=os.environ['SUPABASE_SECRET_KEY'];h={'apikey':k}

name: Verify approved plain China daily format
on:
  push:
    branches: [china-plain-daily-format-20261019]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          PYTHONPATH=scripts python -m unittest discover -s scripts -p test_china_plain_format.py -v
          PYTHONPATH=scripts python -m unittest discover -s scripts -p test_china_buyer_forecast.py -v
          PYTHONPATH=scripts python -m unittest discover -s scripts -p test_china_price_brief.py -v
          python -m compileall -q scripts/china_price_brief.py scripts/china_morning_pair.py scripts/china_coverage_worker.py
          python - <<'PY'
          from pathlib import Path
          for name in ('china_morning_pair.py','china_coverage_worker.py'):
              assert 'from china_agent.price_brief import render_plain as brief' in Path('scripts',name).read_text()
          PY

name: Apply exact owner approved IP preview18
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wb-ip-advertising-agent
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fe150ee1e101aac89f17fac54260c8ee16553c8b
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ip_apply18_20261106.py
            ip_apply_nine_20261103.py
            ip_daily_png_contract.py
            ip_bags_growth_20261104.py
            advertising_daily_png.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install Pillow==12.3.0 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - run: python ip_apply18_20261106.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          ADVERTISING_EXECUTION_ENABLED: 'false'

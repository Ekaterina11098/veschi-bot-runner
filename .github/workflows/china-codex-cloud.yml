name: China owner-authorized Sol restoration check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-codex-cloud.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: china-persistent-codex-session
  cancel-in-progress: false
jobs:
  conversation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 openai==3.42.1 --quiet
      - name: Verify conversation guards
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p test_china_codex_cloud.py
      - name: Real Sol read-only continuity check against Pavel question270
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/china_sol_restore_check.py

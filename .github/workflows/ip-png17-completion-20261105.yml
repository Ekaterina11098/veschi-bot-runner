name: IP17 verified completion receipt
on:
  workflow_run:
    workflows: ['Apply owner approved IP PNG17 Nov5']
    types: [completed]
permissions:
  contents: read
jobs:
  receipt:
    if: ${{ github.event.workflow_run.id == 41974599635 && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 17b195bf6d9c3d060f8b0e225c68887f7dd46846
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ip_png17_completion_20261105.py
            ip_apply_nine_20261103.py
            ip_daily_png_contract.py
            advertising_daily_png.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install Pillow==12.3.0 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - run: python ip_png17_completion_20261105.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ADVERTISING_TELEGRAM_BOT_TOKEN: ${{ secrets.ADVERTISING_TELEGRAM_BOT_TOKEN }}
          ADVERTISING_EXECUTION_ENABLED: 'false'

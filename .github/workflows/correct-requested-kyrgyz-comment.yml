name: Correct requested Kyrgyz weekly comment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/correct-requested-kyrgyz-comment.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/correct_requested_kyrgyz_comment.py

# Preserve all accounting fields while changing description only.

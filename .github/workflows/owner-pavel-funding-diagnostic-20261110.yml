name: Diagnose exact blocked funding 41270309
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-pavel-funding-diagnostic-20261110.yml']
permissions:
  contents: read
concurrency:
  group: china-dialog-queue
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: china-dialog-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/
            /*request*.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /analytics/
            /business_agents/
            /advertising_agent/
            /china_agent/
            /tests/
            /*.py
      - name: Install pinned read transport
        run: pip install requests==2.32.5 Pillow==12.3.0 openai==3.42.1 > "$RUNNER_TEMP/watch-dependencies.log" 2>&1
      - run: |
          python scripts/install_china_dialog.py
          python scripts/install_china_buyout.py --root source
      - name: Exact approved plans only; no historical queue drain
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          OPENAI_API_KEY: ""
          CHINA_ANALYSIS_BACKEND: managed_codex
          PYTHONPATH: scripts:source
        run: |
          python -u - <<'PY'
          import json
          from china_loss_execute import IO
          from china_morning_readiness import current_prices,published_stock
          from china_moysklad_read import read_stock
          io=IO();p=io.get('china_agent:loss_plan:v1:daily-2026-11-10-budgets-1')
          item=next(x for x in p['items']if x['campaign_id']==41270309);e=item['budget_evidence'];ids=list(map(int,e['expected_bids']))
          prices=current_prices(io,ids);pub=published_stock(io,prices,ids)
          stock=read_stock([r['article']for r in prices['rows']]);by={r['article'].casefold():r for r in stock['rows']}
          rows=[]
          for r in prices['rows']:
              nm=str(r['nm_id']);old=e['member_inputs'][nm];st=by.get(r['article'].casefold(),{})
              rows.append(dict(nm_id=nm,article=r['article'],price=r['seller_price'],old_price=old['price'],msk_free=(st.get('stock',0)-st.get('reserve',0)),published=pub['amounts'].get(nm),cogs=st.get('price'),old_cost=old['cost'],attributed_orders=e['attributed_orders_by_nm'].get(nm,0)))
          from datetime import datetime,timezone
          key='china_agent:owner_pavel_chain:2026-11-10:v1:funding_diagnostic'
          data=dict(status='read_only_complete',observed_at=datetime.now(timezone.utc).isoformat(),campaign_id=41270309,rows=rows,coverage_complete=stock['coverage_complete'],missing_published=pub['missing_nm_ids'],wb_writes=0,telegram_sends=0)
          if io.get(key):raise ValueError('Diagnostic already recorded; do not repeat reads')
          assert io.create(key,data)
          assert io.get(key)==data
          print(json.dumps(dict(status=data['status'],rows=len(rows),wb_writes=0,telegram_sends=0)))
          PY

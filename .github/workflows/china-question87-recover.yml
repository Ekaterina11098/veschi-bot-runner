name: Recover exact answered China question 87
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-question87-recover.yml']
permissions:
  contents: read
concurrency:
  group: bot-business-agent
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: bot-mpstats-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - run: |
          python scripts/install_china_dialog.py
          python scripts/install_china_buyout.py --root source
          pip install requests==2.32.5 Pillow==12.3.0 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Deliver existing exact-job checkpoint, no marketplace or model requests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          PYTHONPATH: scripts:source
        run: |
          python - <<'PY'
          import os,json,requests
          from urllib.parse import urlparse
          from conversion_watches import runtime,saved_network_guard
          w=runtime()
          checkpoint=w.get('china_agent:analytic_checkpoint:v2:87')
          assert checkpoint and checkpoint.get('status')=='answered'
          original=requests.sessions.Session.request
          def narrow(session,method,url,*a,**kw):
              u=urlparse(url)
              assert u.hostname in (urlparse(os.environ['SUPABASE_URL']).hostname,'api.telegram.org'), 'Recovery external read/write forbidden'
              if u.hostname=='api.telegram.org':
                  assert u.path.rsplit('/',1)[-1] in ('sendMessage','getChatMember','getMe'), 'Recovery Telegram scope'
              return original(session,method,url,*a,**kw)
          requests.sessions.Session.request=narrow
          try:
              with saved_network_guard():
                  result=w.question(87)
                  w.save('china_agent:question87_recovery:v1',dict(result=result,run_id=os.environ['GITHUB_RUN_ID'],wb_writes=0,model_requests=0))
                  print(json.dumps(dict(job_id=87,result=result,wb_writes=0,model_requests=0)))
          finally:
              requests.sessions.Session.request=original
          PY

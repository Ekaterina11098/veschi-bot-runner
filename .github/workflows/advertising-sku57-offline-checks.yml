name: Offline SKU57 durable recovery checks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/advertising-sku57-offline-checks.yml']
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 7f9a96d178f09310f89ac8b3d5c63916d2f0c185
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: No WB, database or Telegram credentials; mocked ports only
        run: python -m unittest discover -s tests -p test_sku_membership_recovery.py -v
      - uses: actions/checkout@v4
        with:
          path: runner
          persist-credentials: false
      - name: Exact campaign daily gap coverage, offline
        run: python runner/test_campaign_day_gaps.py -v

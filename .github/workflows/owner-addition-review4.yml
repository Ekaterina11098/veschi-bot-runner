name: Owner readonly addition review 4Nov
on:
  push:
    paths: ['.github/workflows/owner-addition-review4.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-addition-review4
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Bounded fresh growth economics; no model or Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: disabled
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json
          from china_cloud_cost_control import Cache,WB,validate_identity,stamp
          from china_advertising_state import AdvertisingIO
          from china_morning_readiness import current_prices,published_stock
          from china_moysklad_read import read_stock
          c=Cache();w=WB();io=AdvertisingIO();validate_identity(c,w)
          ids=[1473243896,1473243442,1473243897,1473243898,1473243902]
          p=current_prices(io,ids);ps=published_stock(io,p,ids);st=read_stock([r['article']for r in p['rows']])
          states=w.campaigns([40933588,41298169,41332083])
          quotes={};errors={}
          for cid,nms,z in [(40933588,[1473243896,1473243442],'recommendations'),(41298169,[1473243897,1473243898,1473243902],'search')]:
           try:quotes[str(cid)]=w.minimums(cid,nms,z)
           except Exception as e:errors[str(cid)]=str(e)[:400]
          budgets={}
          for cid in states:
           try:budgets[str(cid)]=w.req('/api/advert/v2/budget','POST',{'advertId':int(cid)})
           except Exception as e:budgets[str(cid)]={'error':str(e)[:150]}
          v={'observed_at':stamp(),'cabinet':'VESCHI LIMITED/token_3','prices':p,'published_stock':ps,'stock':st,'campaigns':states,'minimums':quotes,'quote_errors':errors,'budgets':budgets,'wb_writes':0,'telegram_calls':0,'grants_action_permission':False}
          k='china_agent:owner_addition_review:2026-11-04:v1:inputs'
          v=json.loads(json.dumps(v))
          if c.get(k)is None:c.create(k,v)
          else:c.put(k,v)
          assert c.get(k)==v
          print(json.dumps({'status':'readback_ok','observed_at':v['observed_at'],'quote_errors':errors,'wb_writes':0}))
          
          PY

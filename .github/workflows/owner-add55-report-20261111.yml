name: Owner add55 to joint report proposal11Nov
on:
  push:
    paths: ['.github/workflows/owner-add55-report-20261111.yml']
permissions:
  contents: read
concurrency:
  group: china-advertising-daily
  cancel-in-progress: false
jobs:
  proposal:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Publish updated proposal only with fresh membership read and exact page binding
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import copy,json,base64,requests
          from datetime import datetime,timezone
          from china_price_apply import IO
          from china_daily_ad_actions import plan,bind
          from china_advertising_v2_png import render
          from china_advertising_delivery import deliver,telegram_sender
          io=IO();K='china_agent:owner_add55_report:2026-11-11:v1'
          old=io.get(K)
          if old:raise SystemExit('Existing revision; no replay')
          a=io.get('china_agent:advertising_artifacts:2026-11-11:v2');assert a and a['status']=='frozen'
          bundle=copy.deepcopy(a['bundle']);c=next(c for c in bundle['campaigns']if c['id']==41680341)
          r=next(r for r in c['focus'] if r['nm']==1473243908)
          assert r['article']=='55-NoelBag-green' and r['current_bid_minor']==28
          response=requests.get('https://advert-api.wildberries.ru/api/advert/v2/adverts',params={'ids':41680341},headers={'Authorization':io.token},timeout=40);response.raise_for_status()
          cp=response.json()['adverts'];assert len(cp)==1 and cp[0]['id']==41680341 and cp[0]['currency']=='CNY' and cp[0]['status']==9
          assert {n['nm_id']for n in cp[0]['nm_settings']}=={1473243908,1473244355}
          assert all(n['bids_kopecks']=={'search':0,'recommendations':28}for n in cp[0]['nm_settings'])
          action=dict(id='41680341:owner-exclude:1473243908',kind='ad_exclude_sku',campaign_id=41680341,nm_id=1473243908,article=r['article'],placement='recommendations',old_minor=28,owner_selected=True)
          r.update(action=action,decision='Исключить из этой РК по решению владельца.',pending_first_day=False)
          c['attention'].append(copy.deepcopy(r));c['direction_recommendations']=['55-NoelBag-green: Исключить из РК по решению владельца.']
          # Preserve all other checked proposals exactly; only one owner-selected action is added.
          pages=[f for f in render(bundle)if f['family']=='drr'];assert len(pages)==1 and len(pages[0]['actions'])==7
          f=pages[0];p=plan(io,'2026-11-11',f,0,slot='owner55')
          f.update(plan_id=p['plan_id'],plan_sha256=p['plan_sha256'])
          f['caption']='Китай · реклама · 11 ноября. Обновлённый план взамен сообщения854: добавлено исключение55-NoelBag-green из РК41680341. Всего7 действий. Ответьте «Сделай всё» на этот PNG для совместного выполнения. Бюджетный отчёт855 остаётся отдельным.'
          rev=dict(status='prepared',source_artifact='china_agent:advertising_artifacts:2026-11-11:v2',replaces_message_id=854,bundle=bundle,plan_id=p['plan_id'],plan_sha256=p['plan_sha256'],png_b64=base64.b64encode(f['bytes']).decode(),wb_writes=0,owner_quote='добавь в ТГ, уберем все вместе',prepared_at=datetime.now(timezone.utc).isoformat())
          assert io.create(K,rev)
          result=deliver(io,'2026-11-11-owner55',[f],telegram_sender(io),binder=lambda f,r:bind(io,f,r))
          assert result['status']=='delivered'
          rev.update(status='sent',delivery=result,completed_at=datetime.now(timezone.utc).isoformat());io.put(K,rev)
          print(json.dumps({'status':'sent','message_ids':[x['message_id']for x in result['parts']],'actions':7,'wb_writes':0}))
          PY

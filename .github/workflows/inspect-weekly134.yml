name: Inspect requested IP weekly report 134
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-weekly134.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inspect-weekly134
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
          filter: blob:none
      - name: Read products stock and historical return bases
        shell: python
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import sys,json,collections,concurrent.futures
          sys.path.insert(0,"scripts")
          import fbs_document_chain as m
          class ReadOnly(m.Transport):
           def request(self,base,path,method="GET",body=None,params=None):
            if base==m.MS and method!="GET":raise m.Stop("MS writes prohibited")
            return super().request(base,path,method,body,params)
          t=ReadOnly();db=m.Cache(t);w=m.Worker(t,db,{})
          ROOT="weekly_report_review:134:"
          inp=db.get(ROOT+"input:v1")
          out={"at":m.now(),"status":"reading","products":{},"stock":{},"basis":{},"return_costs":{},"demands":[]}
          def save():db.put(ROOT+"prepare:v1",out)
          def norm(x):return m.href(x).split("?")[0]
          def rows(path,params=None):return w.ms_rows(path,params)
          def positions(kind,ident,stock=False):
           if not stock:return rows("entity/"+kind+"/"+ident+"/positions",{"expand":"assortment"})
           result=[];offset=0
           while True:
            data=t.request(m.MS,"entity/"+kind+"/"+ident+"/positions",params={"expand":"assortment","fields":"stock","limit":50,"offset":offset})
            page=data["rows"];result+=page;offset+=len(page)
            if offset>=data["meta"]["size"]:return result
            assert page
          for k,path in {"organization":"entity/organization/61c199c8-fd78-11ee-0a80-1479002a9f95","agent":"entity/counterparty/4cc3ffa2-fd7c-11ee-0a80-0b56002b7934","store":"entity/store/fcf31c2d-07ac-11ef-0a80-014d00489826"}.items():out[k]=t.request(m.MS,path)
          out["currency"]=t.request(m.MS,"entity/currency/3c67e3a6-f25d-11ee-0a80-0c6f000a027f");out["rate"]={"currency":m.meta(out["currency"])}
          out["states"]=t.request(m.MS,"entity/customerorder/metadata").get("states",[])
          assert out["store"]["name"]=="Склад WB FBO"
          flt="organization="+norm(out["organization"])+";agent="+norm(out["agent"])+";store="+norm(out["store"])
          out["duplicates"]=[]
          for typ in ("customerorder","demand","salesreturn"):
           for d in rows("entity/"+typ,{"filter":flt+";moment>=2026-10-26 00:00:00"}):
            if any(n in d.get("name","")+" "+d.get("description","") for n in inp["report_ids"]) or "0(134)" in d.get("description",""):out["duplicates"].append({"type":typ,**d})
          save()
          wanted=set(inp["sales"])|set(inp["returns"])
          def product(a):
           rt=ReadOnly();rw=m.Worker(rt,None,{})
           return a,rw.ms_rows("entity/product",{"filter":"article="+a+";archived=false"})
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
           for a,ps in pool.map(product,sorted(wanted)):out["products"][a]=ps
          save()
          bulk=rows("report/stock/all",{"filter":"store="+norm(out["store"]),"stockMode":"all","quantityMode":"all"})
          byid={norm(r):r for r in bulk}
          for a,ps in out["products"].items():out["stock"][a]=[byid[norm(ps[0])]] if len(ps)==1 and norm(ps[0]) in byid else []
          out["stock_exceptions"]=[]
          for a,q in inp["sales"].items():
           ss=out["stock"][a];s=ss[0] if len(ss)==1 else {}
           if s.get("stock",0)<q or s.get("quantity",s.get("stock",0))<q or s.get("price",0)<=0:out["stock_exceptions"].append({"article":a,"wanted":q,"stock":s})
          for a in inp["returns"]:
           ss=out["stock"][a]
           if len(ss)==1 and ss[0].get("price",0)>0:out["return_costs"][a]={"unit_kopecks":ss[0]["price"],"source":"current FBO stock","at":m.now()}
          save()
          for d in rows("entity/demand",{"filter":flt+";moment>=2026-01-01 00:00:00","order":"moment,desc"}):
           if not d.get("applicable"):continue
           order=d.get("customerOrder",{})
           if not norm(order).startswith(m.MS):continue
           order=t.request(m.MS,norm(order)[len(m.MS):])
           if not ("ВБ ВА" in order.get("description","") or "0(" in order.get("description","")):continue
           if "0(134)" in order.get("description",""):continue
           ps=positions("demand",d["id"])
           match=[p for p in ps if (p["assortment"].get("article") or "").strip().casefold() in inp["returns"] and (p["assortment"].get("article") or "").strip().casefold() not in out["basis"]]
           if not match:continue
           detail=t.request(m.MS,"entity/demand/"+d["id"]);used=collections.Counter()
           for ref in detail.get("returns",[]):
            ret=t.request(m.MS,norm(ref)[len(m.MS):])
            for p in positions("salesreturn",ret["id"]):used[(p["assortment"].get("article") or "").strip().casefold()]+=p["quantity"]
           cap=collections.Counter()
           for p in match:cap[(p["assortment"].get("article") or "").strip().casefold()]+=p["quantity"]
           for a,q in cap.items():
            if q-used[a]>=inp["returns"][a]:
             out["basis"][a]={"id":d["id"],"name":d["name"],"moment":d["moment"],"capacity":q,"returned":used[a],"order_comment":order.get("description")}
           if any(a not in out["return_costs"] for a in cap):
            for p in positions("demand",d["id"],True):
             a=(p["assortment"].get("article") or "").strip().casefold()
             cost=p.get("stock",{}).get("cost") or 0
             if a in cap and a not in out["return_costs"] and cost>0:out["return_costs"][a]={"unit_kopecks":cost/p["quantity"],"source":"historical demand "+d["name"],"moment":d["moment"]}
           out["demands"].append({"id":d["id"],"name":d["name"],"matching":dict(cap),"already_returned":dict(used)});save()
           if set(out["basis"])==set(inp["returns"]) and set(out["return_costs"])==set(inp["returns"]):break
          out["status"]="prepared";out["completed_at"]=m.now();save()
          print("Read-only preflight finished; private results saved.")
          

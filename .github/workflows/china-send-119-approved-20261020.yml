name: Send approved 119 break even calculation once
on:
  push:
    branches: [china-send-119-approved-20261020]
    paths: ['china_send_119_approved_20261020.py']
permissions:
  contents: read
concurrency:
  group: china-owner-119-delivery-20261020
  cancel-in-progress: false
jobs:
  send:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - name: Send approved saved calculation only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          WB_TOKEN_3: disabled
        run: python china_send_119_approved_20261020.py

name: FBO access check (read only)
on:
  push:
    branches: [verify/fbo-stock-2026-10-13]
    paths: ['.github/workflows/fbo-access-check.yml']
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: fb96f06dd011754bf72e5ed8ebcb0e8832131078
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv aiogram > "$RUNNER_TEMP/deps.log" 2>&1
      - name: Read FBO access without stock writes or business data logging
        env:
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          WB_FINANCE_TOKEN_1: ${{ secrets.WB_FINANCE_TOKEN_1 }}
          WB_FINANCE_TOKEN_2: ${{ secrets.WB_FINANCE_TOKEN_2 }}
        run: |
          python - <<'PY'
          import os, json, base64, time
          import requests
          from uuid import UUID
          failures = []
          tasks = []
          for index in (1, 2):
              token = os.getenv(f'WB_TOKEN_{index}')
              base = 'https://seller-analytics-api.wildberries.ru/api/v1/warehouse_remains'
              r = requests.get(base, headers={'Authorization': token}, params={'locale':'ru','groupBySa':'true','groupByNm':'true','groupByBarcode':'false','groupBySize':'false','filterPics':0,'filterVolume':0}, timeout=30)
              print(f'Cabinet {index}: warehouse report create HTTP {r.status_code}')
              if r.status_code != 200:
                  failures.append(index)
                  continue
              task = str(UUID(r.json()['data']['taskId']))
              tasks.append((index, token, base, task))
          time.sleep(20)
          for index, token, base, task in tasks:
              r = requests.get(base+'/tasks/'+task+'/status', headers={'Authorization': token}, timeout=30)
              print(f'Cabinet {index}: report status HTTP {r.status_code}')
              if r.status_code != 200 or r.json().get('data', {}).get('status') != 'done':
                  failures.append(index)
                  continue
              r = requests.get(base+'/tasks/'+task+'/download', headers={'Authorization': token}, timeout=30)
              print(f'Cabinet {index}: report download HTTP {r.status_code}')
              if r.status_code != 200:
                  failures.append(index)
                  continue
              rows = r.json()
              if not isinstance(rows, list) or any(not isinstance(x.get('nmId'), int) or not isinstance(x.get('warehouses'), list) for x in rows):
                  failures.append(index)
                  continue
              if len({x['nmId'] for x in rows}) != len(rows):
                  raise RuntimeError('grouped report has duplicate product identities')
              names = sorted({str(w.get('warehouseName')) for x in rows for w in x['warehouses']})
              print(f'Cabinet {index}: warehouse labels = {names}')
              print(f'Cabinet {index}: rows without physical aggregate = {sum(not any(w.get("warehouseName") == "Всего находится на складах" for w in x["warehouses"]) for x in rows)}')
              print(f'Cabinet {index}: empty warehouse lists = {sum(not x["warehouses"] for x in rows)}')
              print(f'Cabinet {index}: complete grouped FBO report verified')
          if failures:
              raise SystemExit(1)
          PY

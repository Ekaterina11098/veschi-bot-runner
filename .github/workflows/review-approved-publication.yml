name: Publish only confirmed Telegram review answers
# 2026-11-04: activate verified filtered SQL reads and incremental complete backups.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/review-approved-publication.yml']
  schedule:
    - cron: '7-57/5 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: review-approved-publication
  cancel-in-progress: false
jobs:
  approved-replies:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        cabinet: [token_1, token_2, token_3]
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /review-approval-preparation/
            /.github/workflows/
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 18649db15489c3dc77edc22bec5a4ddc5ed6a410
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'psycopg[binary]==3.2.10' cryptography==46.0.2 requests==2.32.5 python-dotenv==1.1.1
      - name: Validate exact approvals, cabinet-bound preflight and no duplicate POST
        run: |
          python -m unittest test_persistent_backup.py
          PYTHONPATH=private-source python -m unittest discover -s private-source/tests -p test_review_rate_budget.py
          python -m unittest test_review_approved_benchmarks.py test_review_approved_worker.py test_review_auto_five_star.py test_review_auto_preflight.py
          python -m unittest discover -s review-approval-preparation -p test_review_telegram.py
          python -m unittest test_review_china_routing_audit.py test_review_semantic_positive.py
          python -m unittest test_review_autonomy.py test_review_cleanup.py test_review_reliability.py
          node review-approval-preparation/test_review_inbox_route.mjs
          python -m unittest test_review_approved_watchdog.py test_review_cabinet_capacity.py
          python -m py_compile review_approved_worker.py
      - name: Restore encrypted incremental backup cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/review-backup-cache
          key: review-backup-v1-${{ matrix.cabinet }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: review-backup-v1-${{ matrix.cabinet }}-
      - name: Resume only post-cutover authenticated Telegram approvals
        env:
          REVIEW_BACKUP_CACHE_PATH: ${{ runner.temp }}/review-backup-cache/state.aes
          REVIEW_WORKER_CABINET: ${{ matrix.cabinet }}
          PYTHONPATH: ${{ github.workspace }}/private-source
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_SEMANTIC_AUTO_FIVE_STAR: '1'
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          WB_FEEDBACK_TOKEN: ${{ secrets.WB_FEEDBACK_TOKEN }}
        run: python review_approved_worker.py
      - name: Save encrypted incremental backup cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/review-backup-cache
          key: review-backup-v1-${{ matrix.cabinet }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-approved-publication-receipts-${{ matrix.cabinet }}
          path: ${{ runner.temp }}/stock-deploy-proof
          retention-days: 90

  continue-approved-work:
    needs: approved-replies
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            review_approved_watchdog.py
            review_approved_worker.py
            test_review_approved_watchdog.py
            review-approval-preparation/review_telegram_approval.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'psycopg[binary]==3.2.10'
      - run: python -m unittest test_review_approved_watchdog.py
      - name: Continue pending approvals after all cabinet processes finish
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          REVIEW_PUBLICATION_FINISHED_RUN_ID: ${{ github.run_id }}
        run: python review_approved_watchdog.py

# Activate verified November 3 positive review fields in all cabinet workers.


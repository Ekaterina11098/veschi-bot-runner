name: Verify morning campaign budget readiness
on:
  push:
    paths: ['.github/workflows/verify-budget-ready4.yml']
permissions:
  contents: read
concurrency:
  group: china-verify-budget-ready4
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /analytics/
            /business_agents/
            /advertising_agent/
            /china_agent/
            /tests/
            /*.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0 python-dotenv simplejson==4.2.0 openai==3.42.1
      - name: Advertising regressions without marketplace, Telegram or model credentials
        run: PYTHONPATH=scripts:source python -m unittest discover -s scripts -p 'test_china_advertising_*.py'

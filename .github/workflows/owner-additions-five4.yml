name: Owner approved five additions and100CNY recommendation funding
on:
  push:
    paths: ['.github/workflows/owner-additions-five4.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-additions-five4
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Bounded fresh growth economics; no model or Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import copy,json,os,time,requests
          from datetime import datetime,timezone
          from china_cloud_cost_control import Cache,WB,validate_identity,digest,stamp
          from china_advertising_state import AdvertisingIO
          from china_morning_readiness import current_prices,published_stock
          from china_moysklad_read import read_stock
          ROOT='china_agent:owner_additions_five:2026-11-04:v1'
          c=Cache();w=WB();io=AdvertisingIO()
          GROUPS={41298169:('search',[1473243898,1473243897,1473243902]),40933588:('recommendations',[1473243442,1473243896])}
          def norm(v):return json.loads(json.dumps(v))
          def put(k,v):
           v=norm(v)
           if c.get(k)is None:
            if not c.create(k,v):raise ValueError('Concurrent receipt creation')
           else:c.put(k,v)
          def auth():
           a=c.get(ROOT+':approval')or{}
           if a.get('execution_authorized')is not True or a.get('owner_user_id')!=5122667182 or a.get('source_channel')!='codex' or a.get('telegram_notice_authorized')is not True:raise ValueError('Exact owner authority missing')
           if datetime.now(timezone.utc)>datetime.fromisoformat(a['expires_at']):raise ValueError('Approval expired')
           actual={(i['campaign_id'],i['nm_id'],i['placement'],i['max_bid_minor'])for i in a['items']if i['kind']=='ad_add_sku'}
           expected={(cid,nm,z,30)for cid,(z,ids)in GROUPS.items()for nm in ids}
           if actual!=expected or [i for i in a['items']if i['kind']=='topup_campaign']!=[dict(kind='topup_campaign',campaign_id=40933588,amount_cny=100)]:raise ValueError('Owner scope changed')
           return a
          def req(path,method='GET',body=None):
           time.sleep(1.5)
           r=requests.request(method,'https://advert-api.wildberries.ru'+path,headers={'Authorization':w.token},json=body,timeout=50)
           if not r.ok:raise RuntimeError('WB HTTP '+str(r.status_code)+' '+r.text[:700])
           return r.json()if r.content else {}
          def campaign(cid):return w.campaigns([cid])[str(cid)]
          def budget(cid):
           rows=w.req('/api/advert/v2/budget','POST',dict(advertIds=[cid]))['adverts']
           if len(rows)!=1 or rows[0]['currency']!='CNY':raise ValueError('Budget currency/coverage')
           return rows[0]['total']
          def fixed_equal(a,b):
           return a['id']==b['id']and a['status']==b['status']and a['settings']==b['settings']and a['currency']==b['currency']and a['bid_type']==b['bid_type']
          def rows(s):return {r['nm_id']:r for r in s['nm_settings']}
          def write_once(e,key,path,method,body):
           auth()
           if key in e['operations']:raise ValueError('Never repeat submitted/uncertain mutation')
           allowed=False
           if key=='fund100':allowed=path=='/adv/v1/budget/deposit?id=40933588'and method=='POST'and body.get('sum')==100 and body.get('type')in[0,1]
           for cid,(z,ids)in GROUPS.items():
            if key=='add:'+str(cid):allowed=path=='/adv/v0/auction/nms'and method=='PATCH'and body==dict(nms=[dict(advert_id=cid,nms=dict(add=ids,delete=[]))])
            if key=='rollback:'+str(cid):allowed=path=='/adv/v0/auction/nms'and method=='PATCH'and body==dict(nms=[dict(advert_id=cid,nms=dict(add=[],delete=ids))])
           if not allowed:raise ValueError('Mutation outside exact five additions and100CNY')
           op=dict(status='submitting',path=path,method=method,body=body,at=stamp());e['operations'][key]=op;put(ROOT+':execution',e)
           try:
            result=req(path,method,body);op.update(status='accepted',response=result,accepted_at=stamp());e['wb_writes']+=1;put(ROOT+':execution',e);return result
           except Exception as ex:
            op.update(status='uncertain',error=type(ex).__name__);put(ROOT+':execution',e);raise
          
          a=auth();validate_identity(c,w)
          e=c.get(ROOT+':execution')
          if e['operations']['add:41298169']['status']!='http400_rejected_absent_readback':raise ValueError('Prior rejected mutation not reconciled')
          if 'add_search_eligible2'in e['operations']:raise ValueError('Corrected request already submitted; never replay')
          cid=41298169;z='search';ids=[1473243897,1473243902];before=campaign(cid);br=rows(before)
          elig=c.get(ROOT+':eligibility')
          if {x['nm']for x in elig['rows']if x['subjectId']==50}&set(ids)!=set(ids)or any(nm in br for nm in ids):raise ValueError('Eligible subset/readback changed')
          if not fixed_equal(c.get(ROOT+':recovery_readback')[str(cid)]['state'],before)or rows(c.get(ROOT+':recovery_readback')[str(cid)]['state'])!=br:raise ValueError('Search campaign changed')
          body=dict(nms=[dict(advert_id=cid,nms=dict(add=ids,delete=[]))])
          op=dict(status='submitting',body=body,path='/adv/v0/auction/nms',method='PATCH',at=stamp(),prior_rejection_resolved_by=ROOT+':recovery_readback',excluded_wrong_category_nm=1473243898)
          e['operations']['add_search_eligible2']=op;put(ROOT+':execution',e)
          try:
           auth();response=req('/adv/v0/auction/nms','PATCH',body)
           op.update(status='accepted',response=response,accepted_at=stamp());e['wb_writes']+=1;put(ROOT+':execution',e)
           for i in range(18):
            after=campaign(cid);ar=rows(after)
            if set(ar)==set(br)|set(ids):break
            time.sleep(5)
           else:raise ValueError('Corrected addition membership uncertain')
           if not fixed_equal(before,after)or any(ar[nm]!=r for nm,r in br.items()):raise ValueError('Other members/settings changed')
           if any(ar[nm]['subject']['id']!=50 or not 0<ar[nm]['bids_kopecks'].get(z,0)<=30 or ar[nm]['bids_kopecks'].get('recommendations',0)!=0 for nm in ids):
            # Remove only new additions if automatic minima violate owner ceiling.
            rollback=dict(nms=[dict(advert_id=cid,nms=dict(add=[],delete=ids))])
            e['operations']['rollback_corrected_search']=dict(status='submitting',body=rollback,at=stamp());put(ROOT+':execution',e)
            req('/adv/v0/auction/nms','PATCH',rollback);e['wb_writes']+=1;put(ROOT+':execution',e)
            raise ValueError('Default search minimum outside approved cap; removed only new products')
           minima=w.minimums(cid,ids,z)
           ck=ROOT+':campaign:'+str(cid);child=dict(status='verified',before=before,after=after,nm_ids=ids,placement=z,exact_minimums=minima,verified_at=stamp(),approval_key=ROOT+':approval');put(ck,child)
           for nm in ids:e['items'].append(dict(kind='ad_add_sku',campaign_id=cid,nm_id=nm,article=next(i['article']for i in a['items']if i.get('nm_id')==nm),placement=z,target_minor=ar[nm]['bids_kopecks'][z],status='verified',receipt_key=ck,verified_at=child['verified_at']))
           registry=c.get('china_agent:verified_campaign_state:v1')or{};registry[str(cid)]=ck;put('china_agent:verified_campaign_state:v1',registry)
          except Exception as ex:
           op.update(status='uncertain'if op['status']=='submitting'else op['status'],error=str(ex));e.update(status='partial_or_uncertain',error=str(ex));put(ROOT+':execution',e);raise
          #119 is a clutch (subject136), not a handbag (50). No existing search campaign in that category.
          clutch=campaign(41155909);member=rows(clutch).get(1473243898)
          if not member or member['subject']['id']!=136:raise ValueError('119 category readback changed')
          block=dict(status='blocked_requires_new_search_campaign_and_budget',nm_id=1473243898,article='119-NoelBag-darkblack',subject_id=136,current_campaign_id=41155909,current_placement='recommendations',reason='No existing search campaign for clutch category136; existing search41298169 is category50. Additional new campaign funding was not authorized.',observed_at=stamp(),current_campaign=clutch)
          try:block['search_minimum_quote_in_current_campaign']=w.minimums(41155909,[1473243898],'search')
          except Exception as ex:block['quote_error']=str(ex)
          put(ROOT+':blocked119',block)
          e.update(status='partial_verified',error=None,verified_at=stamp(),blocked_items=[dict(nm_id=1473243898,receipt_key=ROOT+':blocked119',reason=block['reason'])]);put(ROOT+':execution',e)
          if len(e['items'])!=4 or c.get(ROOT+':funding')['status']!='verified':raise ValueError('Four additions/funding not verified')
          text='Проверено в WB:\n•047 и531 добавлены в поиск, РК41298169 — по0,28CNY.\n•204 и046 добавлены в рекомендации, РК40933588 — по0,28CNY.\n•РК40933588 пополнена на100CNY.\n119 пока не добавлен: категория «клатчи», подходящей поисковой РК нет; для запуска нужны отдельная РК и дополнительный бюджет.\n143 и590 не меняли. Другие ставки не повышали.'
          if io.tg('getMe',{})['id']!=8780468043:raise ValueError('Bot identity differs')
          notice=dict(status='sending',text=text,chat_id=-1004342917488,bot_id=8780468043,execution_key=ROOT+':execution',created_at=stamp())
          if not c.create(ROOT+':delivery',notice):raise ValueError('Existing notice; no duplicate')
          try:
           r=io.tg('sendMessage',dict(chat_id=-1004342917488,text=text))
           if r.get('chat',{}).get('id')!=-1004342917488 or r.get('from',{}).get('id')!=8780468043 or not r.get('message_id'):raise ValueError('Delivery identity mismatch')
           notice.update(status='sent',message_id=r['message_id'],receipt=r,sent_at=stamp());put(ROOT+':delivery',notice)
          except Exception:
           notice['status']='uncertain';put(ROOT+':delivery',notice);raise
          print(json.dumps({'status':e['status'],'items':e['items'],'blocked119':block['status'],'search_minimum119':block.get('search_minimum_quote_in_current_campaign'),'message_id':notice['message_id']}))
          
          PY

name: Owner read-only 36 SKU funnel review28
on:
  push:
    paths: ['ops/china-owner-funnel36-review28.json']
permissions:
  contents: read
concurrency:
  group: china-owner-funnel36-review28
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - run: python -m py_compile scripts/china_owner_funnel36_review28.py
      - name: Read advertising funnel and product cards only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: python scripts/china_owner_funnel36_review28.py

name: Owner all bid changes27and28 review
on:
  push:
    branches: [main]
    paths: ['scripts/china_bid_changes29_read.py','.github/workflows/china-bid-changes29.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: china-bid-changes29
  cancel-in-progress: false
jobs:
  read:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Read bid review orders and advertising only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: PYTHONPATH=scripts python scripts/china_bid_changes29_read.py

name: Requested search query gap read
on:
  push:
    branches: [main]
    paths: ['.github/workflows/requested-search-query-gap-read.yml']
permissions: {contents: read}
concurrency:
  group: china-dialog-data
  cancel-in-progress: false
jobs:
  read:
    if: github.event.head_commit.message == 'Read requested search query gaps without marketplace changes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Read search reports into private cache
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import os,json,time,requests
          from datetime import datetime,timezone,timedelta
          from china_cloud_cost_control import Cache,WB,stamp
          c=Cache();w=WB()
          end=(datetime.now(timezone(timedelta(hours=3))).date()-timedelta(days=1));start=end-timedelta(days=6)
          root='china_agent:semantic_gap_review:'+str(end)+':v1'
          if c.get(root):raise RuntimeError('Existing review; reuse private result')
          config=w.campaigns([41298169,41570073])
          pairs=[]
          for cid,v in config.items():
           if v.get('currency')!='CNY' or not v['settings']['placements'].get('search'):raise RuntimeError('Search scope changed')
           for n in v['nm_settings']:pairs.append({'advertId':int(cid),'nmId':n['nm_id']})
          c.put(root+':campaigns',{'rows':config,'observed_at':stamp()})
          for label,path,body in [('stats','/adv/v1/normquery/stats',{'from':str(start),'to':str(end),'items':pairs}),('list','/adv/v0/normquery/list',{'items':pairs})]:
           r=requests.post('https://advert-api.wildberries.ru'+path,headers={'Authorization':w.token},json=body,timeout=90,allow_redirects=False)
           if r.status_code!=200:
            c.put(root,{'status':'partial','stage':label,'http_status':r.status_code,'wb_writes':0});raise RuntimeError('Query report HTTP '+str(r.status_code))
           c.put(root+':'+label,{'data':r.json(),'period_from':str(start),'period_to':str(end),'observed_at':stamp()})
           time.sleep(7)
          c.put(root,{'status':'complete','period_from':str(start),'period_to':str(end),'pairs':len(pairs),'wb_writes':0,'telegram_sends':0,'observed_at':stamp()})
          print(json.dumps({'status':'complete','pairs':len(pairs),'wb_writes':0,'telegram_sends':0}))
          PY

name: Issue 10 advertised stock verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/issue-10-ad-stock.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue-10-stock-read-only
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 1a55a8443781e51599a2a1fb070a828133dc1237
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv aiogram apscheduler pillow streamlit openai > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Test stock availability and execution lifecycle before rollout
        env:
          TASK: issue-10-stock-tests
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          for pattern in ('test_stock_availability.py','test_price_finance_period_cache.py','test_stock_configuration.py'):
              run_private.execute('Validate stock and scoped finance '+pattern,['-m','unittest','discover','-s','tests','-p',pattern])
          print('Stock/movement/lifecycle and finance period cache tests passed.')
          PY
      - name: Pilot exact Raye SKU before all-active campaign rollout
        env:
          TASK: issue-10-stock-pilot
          STOCK_NOTIFY: 'false'
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          script="""
          import os,sys,time,hashlib
          from datetime import datetime,timezone
          from advertising_agent.run_stock_availability import main,read,SOURCE,store_cache,cache,AD
          from advertising_agent.stock_availability import TARGET_NM,TARGET_CAMPAIGN
          gate_key='advertising:stock_pilot_gate:token_2:v2'
          passed=(cache(gate_key) or {}).get('passed') is True
          if passed:
              # The pilot is already verified. Do not spend a second configuration
              # request just to repeat it before a full-scope read.
              key='wb-pause:'+hashlib.sha256((os.environ['WB_TOKEN_2']+'advert-api.wildberries.ru'+'/api/advert/v2/adverts').encode()).hexdigest()
              deadline=time.monotonic()+3700
              while True:
                  rows=read('telegram_api_cache',dict(cache_key='eq.'+key,expires_at='gt.'+datetime.now(timezone.utc).isoformat(),select='payload',limit=1)) or []
                  remaining=max(0,float(rows[0]['payload'].get('until',0))-time.time()+2) if rows else 0
                  if remaining<=0:break
                  if time.monotonic()+remaining>deadline:raise RuntimeError('WB deferred retry exceeds one bounded cooldown')
                  time.sleep(min(60,remaining))
              sys.argv=['stock']
              main()
          else:
              sys.argv=['stock','--target']
              main()
              rows=read('analytics_snapshots',dict(source='eq.'+SOURCE,cabinet='eq.token_2',select='payload',order='id.desc',limit=1)) or []
              report=rows[0]['payload'][0] if rows else {}
              if report.get('stock_checks_complete') and report.get('campaign_scope_complete'):
                  store_cache(gate_key,dict(passed=True,nm_id=TARGET_NM,campaign_id=TARGET_CAMPAIGN,observed_at=report.get('observed_at')))
              # Full rollout is a later run, respecting configuration request quota.
          """
          run_private.execute('One bounded full-scope stock retry after verified pilot and cooldown',['-c',script])
          print('Protected stock pilot/coverage saved. No WB writes or Telegram.')
          PY
      - name: Validate and recover due IP experiment history gap
        env:
          TASK: issue-10-ip-experiment-history
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          run_private.execute('Validate source gap gate',['-m','unittest','discover','-s','tests','-p','test_ip_history_gap.py'])
          run_private.execute('Bounded missing IP history read',['-m','analytics.ip_experiment_history_gap'])
          run_private.execute('Refresh due checkpoints from saved history',['-m','advertising_agent.experiments'])
          run_private.execute('Refresh protected IP acceptance',['-m','analytics.ip_campaign_audit'])
          print('Protected checkpoint diagnostics saved; no WB writes or Telegram.')
          PY

name: Recover owner-confirmed review646 only
on:
  push:
    branches: [main]
    paths: ['review_approval_recover_646.py']
permissions:
  contents: write
concurrency:
  group: bot-review-replies
  cancel-in-progress: false
jobs:
  approval:
    if: vars.REVIEW_APPROVAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c27c4e34977ff6f78a123dc6fbd45fb78c472d40
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 1b4201067880e379d8dacbe5f6ca3f9848d6ffb0
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/checkout@v4
        with:
          path: recovery-launcher
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'psycopg[binary]==3.2.10' cryptography==46.0.2 requests==2.32.5 python-dotenv==1.1.1
      - name: Process one authenticated new approval, never old queues
        working-directory: review-approval-preparation
        env:
          PYTHONPATH: ${{ github.workspace }}/private-source
          REVIEW_APPROVAL_ENABLED: '1'
          REVIEW_PUBLICATION_ENABLED: ${{ vars.REVIEW_PUBLICATION_ENABLED == 'true' && '1' || '0' }}
          REVIEW_NEW_NOTICES_ENABLED: ${{ vars.REVIEW_NEW_NOTICES_ENABLED == 'true' && '1' || '0' }}
          REVIEW_APPROVAL_CUTOVER: ${{ vars.REVIEW_APPROVAL_CUTOVER }}
          REVIEW_APPROVAL_DSN: ${{ secrets.REVIEW_APPROVAL_DSN }}
          REVIEW_APPROVAL_INGRESS_KEY: ${{ secrets.REVIEW_APPROVAL_INGRESS_KEY }}
          REVIEW_APPROVAL_OWNER_ID: ${{ secrets.REVIEW_APPROVAL_OWNER_ID }}
          REVIEW_APPROVAL_BOT_ID: ${{ secrets.REVIEW_APPROVAL_BOT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          WB_FEEDBACK_TOKEN: ${{ secrets.WB_FEEDBACK_TOKEN }}
        run: |
          export RECOVERY_PUBLIC_KEY="$(PYTHONPATH="$GITHUB_WORKSPACE" python -c 'from stock_deploy_support import OWNER_PUBLIC; print(OWNER_PUBLIC)')"
          python - <<'PY'
          import os,hmac,hashlib,base64
          import psycopg
          from review_approval_process import main
          root=os.environ['SUPABASE_SECRET_KEY'].encode()
          password=hmac.new(root,b'veschi:review-approval-login:20261015:v1',hashlib.sha256).hexdigest()
          dsn=os.environ.get('REVIEW_APPROVAL_DSN') or ('postgresql://review_approval_login_20261015.abxgjoqlddhtcmjcjwxw:'+password+'@aws-0-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require')
          with psycopg.connect(dsn,autocommit=True,connect_timeout=15) as conn:
              row=conn.execute("SELECT payload FROM review_approval.source_cache WHERE cache_key='reviews:telegram-approval:config:v1'").fetchone()
          config=row[0] if row else {}
          if not config.get('enabled') or not config.get('destination_verified'):raise SystemExit('Review integration is disabled or destination unverified')
          os.environ['REVIEW_APPROVAL_DSN']=dsn
          os.environ['REVIEW_APPROVAL_INGRESS_KEY']=os.environ.get('REVIEW_APPROVAL_INGRESS_KEY') or base64.b64encode(hmac.new(root,b'veschi:review-approval-ingress:20261015:v1',hashlib.sha256).digest()).decode()
          os.environ['REVIEW_APPROVAL_OWNER_ID']=str(config['owner_id'])
          os.environ['REVIEW_APPROVAL_BOT_ID']=str(config['bot_id'])
          os.environ['REVIEW_APPROVAL_CUTOVER']=str(config['cutover'])
          os.environ['REVIEW_PUBLICATION_ENABLED']='1' if config.get('publication_enabled') and os.getenv('REVIEW_PUBLICATION_ENABLED')=='1' else '0'
          os.environ['REVIEW_NEW_NOTICES_ENABLED']='1' if config.get('new_notices_enabled') and os.getenv('REVIEW_NEW_NOTICES_ENABLED')=='1' else '0'
          import runpy
          runpy.run_path(os.environ['GITHUB_WORKSPACE']+'/recovery-launcher/review_approval_recover_646.py',run_name='__main__')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-review-approval-supplement
          path: ${{ runner.temp }}/review-approval-output/*.aes.json
          retention-days: 90
      - name: Preserve independent ciphertext only
        if: always()
        run: |
          mkdir -p recovery-output/review-approval
          cp "$RUNNER_TEMP/review-approval-output/approval-supplement.aes.json" "recovery-output/review-approval/approval-${{ github.run_id }}.aes.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-output/review-approval/
          git commit -m "Preserve encrypted new review approval supplement"
          git pull --rebase origin main
          git push origin HEAD:main
# One exact owner-approved recovery only; no schedule, no old queues.


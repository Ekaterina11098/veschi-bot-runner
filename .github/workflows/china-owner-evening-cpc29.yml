name: Owner private evening CPC review29
on:
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: owner-evening-cpc29
  cancel-in-progress: false
jobs:
  reply:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Collect read-only inputs into private cache
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: python scripts/china_owner_evening_cpc29.py

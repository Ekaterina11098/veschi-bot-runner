name: OOO one manual cloud delivery pilot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ooo-cloud-pilot-20261106.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ooo-cloud-pilot-20261106-v1
  cancel-in-progress: false
jobs:
  pilot:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 568022190bc445f0964778fc3015e5476ebabd8d
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0 openai==3.42.1 --quiet
      - name: Offline guard tests without credentials
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p test_ooo_cloud_pilot_20261106.py
      - name: One bounded model call and receipt-verified pilot delivery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OOO_TELEGRAM_BOT_TOKEN: ${{ secrets.OOO_TELEGRAM_BOT_TOKEN }}
        run: python -u scripts/ooo_cloud_pilot_20261106.py

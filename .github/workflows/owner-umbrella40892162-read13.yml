name: Owner umbrella40892162 read13Nov
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: china-owner-umbrella40892162-read13
  cancel-in-progress: false
jobs:
  read:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts

name: Read China belt prices 20261110
on:
  push:
    paths: ['.github/workflows/belts-price-read-20261110.yml']
permissions:
  contents: read
jobs:
  read-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read six belt prices only
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        shell: python
        run: |
          import os,json,urllib.request,datetime
          ids={1560230893,1560230894,1560230895,1560230896,1560230897,1560230898}
          req=urllib.request.Request("https://discounts-prices-api.wildberries.cn/api/v2/list/goods/filter?limit=1000&offset=0",headers={"Authorization":os.environ["WB_TOKEN_3"]})
          with urllib.request.urlopen(req,timeout=45) as r: data=json.load(r)
          rows=[x for x in data["data"]["listGoods"] if x["nmID"] in ids]
          print("BELTS_RESULT="+json.dumps({"checked_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"goods":rows},ensure_ascii=False))
          if len({x["nmID"] for x in rows})!=6: raise RuntimeError("Expected 6 belts; result incomplete")

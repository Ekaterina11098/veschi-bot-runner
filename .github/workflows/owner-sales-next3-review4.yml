name: Owner readonly sales next3 preflight4Nov
on:
  push:
    paths: ['.github/workflows/owner-sales-next3-review4.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-sales-next3-review4
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Bounded fresh growth economics; no model or Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: disabled
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json
          from china_cloud_cost_control import Cache,WB,validate_identity,stamp
          from china_advertising_state import AdvertisingIO
          from china_morning_readiness import current_prices,published_stock
          from china_moysklad_read import read_stock
          c=Cache();w=WB();io=AdvertisingIO();validate_identity(c,w)
          ids=[1535337773,1535337775,1473244341]
          p=current_prices(io,ids);pub=published_stock(io,p,ids);st=read_stock([r['article']for r in p['rows']])
          cs=w.campaigns([40945478,41270309,41325622,41298169])
          qs={};errors={}
          for cid,ns in [(40945478,[1535337773,1535337775]),(41270309,[1473244341])]:
           try:qs[str(cid)]=w.minimums(cid,ns,'search')
           except Exception as e:errors[str(cid)]=str(e)
          bud=w.req('/api/advert/v2/budget','POST',dict(advertIds=[41325622,41298169]))
          models=c.get('china_agent:owner_full_growth_review:2026-11-04:v1:collection')['economics']['rows']
          current={}
          for pr in p['rows']:
           nm=pr['nm_id'];m=models[str(nm)];s=next(x for x in st['rows']if x['article']==pr['article'])
           v=dict(m);v.update(seller_price_cny=pr['seller_price'],own_cogs_rub=s['price']/100,stock_free=s['stock']-s['reserve'],published_stock=pub['amounts'].get(str(nm)),current_observed_at=stamp())
           v['expected_margin_before_ads_cny']=m['expected_margin_before_ads_cny']+m['buyout']*(pr['seller_price']-m['seller_price_cny'])*(1-m['commission_pct']/100)-m['buyout']*(s['price']/100-m['own_cogs_rub'])/m['fx_rub_per_cny']
           current[str(nm)]=v
          out=dict(status='readback',observed_at=stamp(),prices=p,published_stock=pub,stock=st,campaigns=cs,search_minimum_quotes_source_campaign=qs,quote_errors=errors,budgets=bud,economics=current,wb_writes=0,telegram_calls=0,grants_action_permission=False)
          k='china_agent:owner_sales_next3:2026-11-04:v1:inputs';out=json.loads(json.dumps(out))
          if c.get(k)is None:c.create(k,out)
          else:c.put(k,out)
          assert c.get(k)==out
          print(json.dumps({'status':'readback_ok','at':out['observed_at'],'quotes':qs,'errors':errors,'economics':{nm:{k:v[k]for k in ['expected_margin_before_ads_cny','stock_free','published_stock']}for nm,v in current.items()}}))
          
          PY

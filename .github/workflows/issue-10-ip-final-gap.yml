name: Issue 10 bounded missing MPStats attribution source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/issue-10-ip-final-gap.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b8a97ebad08a3ec01b9f5673aa798250babb25fd
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv aiogram apscheduler pillow > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Validate recovered evidence and bounded raw lineage
        env:
          TASK: issue-10-ip-attribution-tape
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          for pattern in ('test_ip_data_preservation.py','test_ip_sku_complete_review.py','test_postclick_evidence_guard.py'):
              run_private.execute('Evidence and safety regression '+pattern,['-m','unittest','discover','-s','tests','-p',pattern])
          run_private.execute('Bounded missing IP MPStats tape schema',['-m','analytics.ip_attribution_tape_probe'])
          print('Missing source schema check and regressions finished; private results saved.')
          PY

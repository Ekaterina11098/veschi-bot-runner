name: China read-only detach eligibility 20261112
on:
  push:
    branches: ['audit/group-detach-readonly-20261112']
    paths: ['.github/workflows/china-detach-readonly-20261112.yml']
permissions:
  contents: read
concurrency:
  group: china-detach-readonly-20261112
  cancel-in-progress: false
jobs:
  audit:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b270f21a0aa08098ad54d485e7aecc2c3d952a00
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv==1.1.1 aiogram==3.22.0 cryptography
      - name: Read only WB and MoySklad; encrypt results for requesting session
        shell: python
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: |
          import os,sys,json,time,re,math,io,contextlib,traceback,base64,secrets
          from urllib.parse import urlparse
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          import requests
          sys.path.insert(0,os.path.join(os.getcwd(),'private-source'))
          RESULTS={}
          REQUEST_COUNTS={}
          SESSION=requests.Session()
          MS_READ_CACHE={}
          def safe_api(method,url,token,wb=True,**kwargs):
              kwargs.pop('retry_rate_limit',None)
              kwargs.pop('retry_read_network',None)
              if wb:url=url.replace('.wildberries.ru','.wildberries.cn')
              host=urlparse(url).netloc
              path=urlparse(url).path
              allowed_wb=host.replace('.wildberries.cn','.wildberries.ru') in ['content-api.wildberries.ru','marketplace-api.wildberries.ru','seller-analytics-api.wildberries.ru','supplies-api.wildberries.ru','statistics-api.wildberries.ru']
              allowed_ms=host=='api.moysklad.ru' and path.startswith('/api/remap/1.2/')
              assert allowed_wb if wb else allowed_ms
              allowed_post=bool(path=='/content/v2/get/cards/list' or re.fullmatch('/api/v3/stocks/[0-9]+',path) or path=='/api/v1/supplies')
              assert method=='GET' or (wb and method=='POST' and allowed_post),'Only read endpoints permitted'
              assert token,'Missing credential'
              cache_key=(url,json.dumps(kwargs,sort_keys=True,default=str))
              if not wb and cache_key in MS_READ_CACHE:return MS_READ_CACHE[cache_key]
              key=host+path
              REQUEST_COUNTS[key]=REQUEST_COUNTS.get(key,0)+1
              for attempt in range(5):
                  time.sleep(.7 if wb else .15)
                  try:
                      r=SESSION.request(method,url,headers={'Authorization':token if wb else 'Bearer '+token,'Accept-Encoding':'gzip'},timeout=90,**kwargs)
                  except requests.RequestException:
                      if attempt==4:raise RuntimeError('Read network failure '+key)
                      time.sleep(3)
                      continue
                  if r.status_code==429:
                      wait=int(float(r.headers.get('X-Ratelimit-Retry') or r.headers.get('Retry-After') or 65))+3
                      assert wait<=180,'API cooldown '+host+': '+str(wait)+' seconds'
                      print('RATE_LIMIT '+host+' wait='+str(wait),flush=True)
                      time.sleep(wait)
                      continue
                  if not r.ok:raise RuntimeError('Read HTTP '+str(r.status_code)+' '+key)
                  if r.status_code==204:return []
                  data=r.json()
                  if isinstance(data,dict) and data.get('error'):raise RuntimeError('Read error '+key)
                  if not wb:MS_READ_CACHE[cache_key]=data
                  return data
              raise RuntimeError('Rate limit retries exhausted '+key)
          
          AUDIT_SOURCE="import os,sys,json,time,collections,requests\nfrom urllib.parse import urlparse\nfrom datetime import datetime,timezone\nsys.path.insert(0,os.getcwd())\nimport tg_agent_new as g\ng.api=safe_api\ng.is_excluded_item=lambda *args:False\ng.is_excluded_item=lambda *args:False\ng.required_tokens('WB_TOKEN_3','MS_TOKEN')\ntoken=g.WB_TOKEN_3\ng.required_tokens('WB_TOKEN_3')\nip=g.get_real_wb_cards_and_scores(g.WB_TOKEN_2,with_photo=-1) if MODE=='OOO' else []\nipindex=collections.defaultdict(list)\nfor c in ip: ipindex[c['vendorCode'].casefold()].append(c)\n\n\ndef request(method,url,**kwargs):\n    return safe_api(method,url,token,**kwargs)\ncards=g.get_real_wb_cards_and_scores(token,with_photo=-1)\nassert cards and len({c['nmID'] for c in cards})==len(cards)\nprint('OOO_CARD_COUNT '+str(len(cards)),flush=True)\ntargets=[c for c in cards if 'furcoat' not in c['vendorCode'].lower()]\nids={c['nmID'] for c in targets}\nwh=g.get_wb_warehouse_ids(token)\nchrt_ids=sorted({int(s['chrtID']) for c in targets for s in c.get('sizes',[])})\nassert all(c.get('sizes') for c in targets)\nfbs_by_chrt=collections.defaultdict(float)\nfbs_missing=set()\nfor warehouse in wh:\n    stock=g.get_real_wb_stocks(token,chrt_ids,warehouse)\n    fbs_missing.update(i for i in chrt_ids if i not in stock)\n    for k,v in stock.items():fbs_by_chrt[k]+=v\nprint('FBS_WAREHOUSES '+json.dumps(wh),flush=True)\ngoods=g.ms_rows(g.MS_API+'/entity/assortment')\nstores=[s for s in g.ms_rows(g.MS_API+'/entity/store') if s.get('name')=='МСК']\nassert len(stores)==1\nselected=stores[0]\nart_paths=collections.defaultdict(set)\nfor p in goods:\n    if p.get('article'):art_paths[p['article'].casefold()].add(urlparse(p['meta']['href']).path)\nstock_by_path={}\nfor row in g.ms_rows(g.MS_API+'/report/stock/bystore',filter='store='+selected['meta']['href']+';stockMode=all'):\n    a=row.get('assortment') or {}\n    path=urlparse((a.get('meta') or row.get('meta') or {}).get('href','')).path\n    assert isinstance(row.get('stockByStore'),list)\n    entries=[e for e in row['stockByStore'] if g.is_exact_ms_store_entry(e,selected)]\n    if entries and all(isinstance(e.get('stock'),(float,int)) for e in entries):\n        stock_by_path[path]=sum(e['stock'] for e in entries)\nrb='https://seller-analytics-api.wildberries.ru/api/v1/warehouse_remains'\ntask=request('GET',rb,params={'groupByNm':'true','groupBySa':'true','locale':'ru'})\ntid=task['data']['taskId']\nfor _ in range(60):\n    time.sleep(6)\n    status=request('GET',rb+'/tasks/'+tid+'/status')\n    if status['data']['status']=='done':break\nelse:raise RuntimeError('Warehouse report incomplete')\nrem=request('GET',rb+'/tasks/'+tid+'/download')\nassert isinstance(rem,list) and rem\nrindex={}\nfor r in rem:\n    if r.get('nmId') in ids:\n        assert r['nmId'] not in rindex\n        assert isinstance(r.get('warehouses'),list)\n        rindex[r['nmId']]=r\nbase='https://supplies-api.wildberries.ru/api/v1/supplies'\nsupplies=[];offset=0\nwhile True:\n    data=request('POST',base,json={'statusIDs':[2,3,4,6]},params={'limit':1000,'offset':offset})\n    assert isinstance(data,list)\n    supplies.extend(data)\n    if len(data)<1000:break\n    offset+=len(data);time.sleep(2.1)\nprint('OOO_OPEN_SUPPLIES '+json.dumps(supplies,ensure_ascii=False),flush=True)\npending=collections.defaultdict(float)\nfor s in supplies:\n    sid=s.get('supplyID') or s.get('preorderID');assert sid\n    offset=0\n    while True:\n        time.sleep(2.1)\n        data=request('GET',base+'/'+str(sid)+'/goods',params={'isPreorderID':'false' if s.get('supplyID') else 'true','limit':1000,'offset':offset})\n        assert isinstance(data,list)\n        for r in data:\n            nm=r.get('nmID')\n            if nm in ids:\n                assert 'quantity' in r\n                pending[nm]+=max(float(r['quantity'])-float(r.get('readyForSaleQuantity') or 0),0)\n        if len(data)<1000:break\n        offset+=len(data)\nconfirmed={'38-Zont-yellow-','122-Zont-blue','3belts-chocolate','167-VeraBag-brown-','224-EloiseBag-beige','463-MonoBag-beige-'}\nrows=[]\nchecked=datetime.now(timezone.utc).isoformat()\nfor c in cards:\n    art=c['vendorCode'];nm=c['nmID']\n    attrs={a['name']:a.get('value') for a in c.get('characteristics',[])}\n    row={'article':art,'nmID':nm,'imtID':c['imtID'],'subjectID':c['subjectID'],'subject':c.get('subjectName'),'title':c.get('title'),'material':attrs.get('Состав'),'dimensions':c.get('dimensions'),'characteristics':{k:v for k,v in attrs.items() if k in ['Модель сумки','Фактура материала','Высота предмета','Ширина предмета','Глубина предмета','Количество отделений']},'checkedAt':checked}\n    if 'furcoat' in art.lower():\n        row.update(MSK=None,FBO=None,toWarehouse=None,toClient=None,status='paused_furcoat',MS_match='Исключено из операций: шубы на паузе')\n    else:\n        paths=art_paths.get(art.casefold(),set())\n        ms=sum(stock_by_path[p] for p in paths) if len(paths)==1 and all(p in stock_by_path for p in paths) else None\n        match='Точный артикул' if paths else 'Ноль подтверждён пользователем 01.10.2026' if art in confirmed else 'Точный артикул в МоёмСкладе не найден'\n        amounts=collections.defaultdict(float)\n        for e in rindex.get(nm,{}).get('warehouses',[]):\n            assert isinstance(e.get('quantity'),(int,float)) and e['quantity']>=0\n            amounts[e['warehouseName']]+=e['quantity']\n        fbo=amounts.get('Всего находится на складах',0)\n        back=amounts.get('В пути возвраты на склад WB',0)\n        client=amounts.get('В пути до получателей',0)\n        inbound=pending[nm]\n        zero=ms==0 and fbo==0 and back==0 and client==0 and inbound==0 and not any(v>0 for v in amounts.values())\n        row.update(MSK=ms,FBO=fbo,toWarehouse=back+inbound,toClient=client,fromClient=back,pendingSupply=inbound,MS_match=match,status='zero' if zero else 'unknown_ms' if ms is None else 'keep')\n    rows.append(row)\nfrom datetime import timedelta\nfrom zoneinfo import ZoneInfo\nnow=datetime.now(ZoneInfo('Europe/Moscow'))\ncutoff=now-timedelta(days=7,seconds=1)\ndatefrom=cutoff.replace(tzinfo=None).isoformat(timespec='seconds')\nmsfrom=cutoff.strftime('%Y-%m-%d %H:%M:%S')\nmoved_paths=set();ms_docs={}\nfor kind in (['supply','demand','enter','loss','move','salesreturn','purchasereturn','retaildemand','retailsalesreturn','processing'] if MODE=='CN' else []):\n    docs=g.ms_rows(g.MS_API+'/entity/'+kind,filter='moment>='+msfrom+';applicable=true')\n    ms_docs[kind]=len(docs)\n    for d in docs:\n        for p in ([] if kind=='processing' else g.ms_rows(d['meta']['href']+'/positions')):\n            ref=(p.get('assortment') or {}).get('meta',{}).get('href')\n            if ref and float(p.get('quantity') or 0)!=0:moved_paths.add(urlparse(ref).path)\n        if kind=='processing':\n            for section in ['materials','products']:\n                for p in g.ms_rows(d['meta']['href']+'/'+section):\n                    ref=(p.get('assortment') or {}).get('meta',{}).get('href')\n                    if ref and float(p.get('quantity') or 0)!=0:moved_paths.add(urlparse(ref).path)\nwb_moved=set();wb_counts={}\nfor kind in (['orders','sales'] if MODE=='CN' else []):\n    cursor=datefrom; seen=set();count=0\n    while True:\n        data=request('GET','https://statistics-api.wildberries.ru/api/v1/supplier/'+kind,params={'dateFrom':cursor,'flag':0})\n        assert isinstance(data,list)\n        for e in data:\n            nm=e.get('nmId')\n            if nm in ids:wb_moved.add(nm)\n        count+=len(data)\n        if len(data)<80000:break\n        newcursor=data[-1]['lastChangeDate']\n        assert newcursor not in seen and newcursor!=cursor\n        seen.add(newcursor);cursor=newcursor\n        time.sleep(61)\n    wb_counts[kind]=count\ncandidates=[];unknown=[]\nbycards={c['nmID']:c for c in cards}\nfor r in rows:\n    if r['status']=='paused_furcoat':continue\n    c=bycards[r['nmID']]\n    sizeids={int(s['chrtID']) for s in c['sizes']}\n    r['FBS']=sum(fbs_by_chrt[i] for i in sizeids) if sizeids and not sizeids.intersection(fbs_missing) and all(i in fbs_by_chrt for i in sizeids) else None\n    r['IP']=[{'article':s['vendorCode'],'nmID':s['nmID']} for s in ipindex[r['article'].casefold()]]\n    r['groupSize']=sum(x['imtID']==r['imtID'] for x in cards)\n    if r['MSK'] is None:unknown.append(r['article']);continue\n    r['movementMS']=any(p in moved_paths for p in art_paths[r['article'].casefold()])\n    r['movementWB']=r['nmID'] in wb_moved\n    eligible_ip=r['MSK']==r['FBS']==r['FBO']==r['toWarehouse']==r['toClient']==0 and not r['movementMS'] and not r['movementWB']\n    eligible_ooo=0<=r['MSK']<5 and r['FBS']==r['FBO']==r['toWarehouse']==r['toClient']==0 and len(r['IP'])==1\n    if r['groupSize']>1 and (eligible_ip if MODE=='CN' else eligible_ooo):\n        candidates.append({k:r[k] for k in ('article','nmID','imtID','groupSize','subject','title','MSK','FBS','FBO','toWarehouse','toClient','movementMS','movementWB')})\nresult={'checkedAt':datetime.now(timezone.utc).isoformat(),'movementFromMoscow':datefrom,'cards':len(cards),'FBSWarehouses':wh,'candidates':sorted(candidates,key=lambda r:r['article']),'unknownMS':unknown,'unknownFBS':[r['article'] for r in rows if r.get('FBS') is None and r['status']!='paused_furcoat'],'supplies':len(supplies),'movementDocuments':ms_docs,'wbEvents':wb_counts}\nRESULTS[MODE]={'summary':result,'rows':rows,'groups':[{k:c.get(k) for k in ('vendorCode','nmID','imtID','createdAt','updatedAt')} for c in cards]}\n"
          PUBLIC_KEY="-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAx9PR+d9KEzaPALBZKGjn\n11fPM3ys8sizyeONkF+2SrmH5QV+NlDXLdbShpmL8W6MlqfGpYzIlXHiDG2eImP9\n6ayqEuaIR7NLknDDe2aBfE2QEjNZmtXcqntqAkpZqWIeSQI8IPhYtdwliO3Ona2m\n9VqUUSqFAqetkLHtdahAYEoBr8p5SkSoE6lFpkgoNeoSqW93hRNEo3qqzDXomIqa\n+QVgGddHm447R4QGZdzC5xHpBkT3NIOfSJSmjYF8VJwPZBxwAXgtEZlldy8EDJqd\nUohN+iy++crNsIqHcZAQrOpfUspsSovF/Bl2eDSL/rH1wi3S4gm0D/mwBcBl4Un3\nzUp0hYgVndOUjWeuaroYYZCh/mXtIQ5A/px5eEGsDGMgSYhBdbdzynmoqGjm/hhh\nVPMoEfT/YV7YKAlbetC6mpA04PnzKj1NfXkV2EPc2LCwUUEKAirsJxHq8b2Dijao\nk7NXp3MRSLUSptCNEuWF3rmamPfYWm72vmEEDfudZ05jAgMBAAE=\n-----END PUBLIC KEY-----\n"
          
          import gzip
          for MODE in ('CN',):
              print('AUDIT_PHASE '+MODE,flush=True)
              capture=io.StringIO()
              try:
                  with contextlib.redirect_stdout(capture),contextlib.redirect_stderr(capture):
                      exec(AUDIT_SOURCE,globals())
                  RESULTS[MODE]['complete']=True
              except Exception as exc:
                  RESULTS[MODE]={'complete':False,'errorType':type(exc).__name__,'error':str(exc),'trace':traceback.format_exc(),'diagnostics':capture.getvalue()[-10000:]}
                  print('AUDIT_PHASE_INCOMPLETE '+MODE,flush=True)
          RESULTS['requests']=REQUEST_COUNTS
          RESULTS['readOnly']=True
          raw=gzip.compress(json.dumps(RESULTS,ensure_ascii=False,default=str).encode())
          key=secrets.token_bytes(32);nonce=secrets.token_bytes(12)
          pub=serialization.load_pem_public_key(PUBLIC_KEY.encode())
          envelope={'key':base64.b64encode(pub.encrypt(key,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))).decode(),'nonce':base64.b64encode(nonce).decode(),'ciphertext':base64.b64encode(AESGCM(key).encrypt(nonce,raw,None)).decode()}
          encoded=base64.b64encode(json.dumps(envelope).encode()).decode()
          for i in range(0,len(encoded),20000):
              print('VESCHI_AUDIT_ENCRYPTED '+str(i//20000)+' '+encoded[i:i+20000],flush=True)
          print('AUDIT_DONE',flush=True)
          

name: MAYA 2 WB title diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/maya2-wb-title-read-20261112.yml']
permissions: {}
concurrency:
  group: maya2-wb-title-read-20261112
  cancel-in-progress: false
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create authorized cards and sync barcodes
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import os,json,gzip,urllib.request,datetime
          sb=os.environ['SUPABASE_URL'].rstrip('/')
          def call(url,headers,body=None):
           with urllib.request.urlopen(urllib.request.Request(url,headers=headers,data=None if body is None else json.dumps(body).encode()),timeout=60) as r:
            raw=r.read()
            if r.headers.get('Content-Encoding')=='gzip':raw=gzip.decompress(raw)
            return json.loads(raw) if raw else None
          wh={'Authorization':os.environ['WB_TOKEN_3'],'Content-Type':'application/json','Accept-Encoding':'gzip'}
          data=call('https://content-api.wildberries.cn/content/v2/cards/error/list',wh,{'cursor':{'limit':100},'order':{'ascending':False}})
          sh={'apikey':os.environ['SUPABASE_SECRET_KEY'],'Authorization':'Bearer '+os.environ['SUPABASE_SECRET_KEY'],'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'}
          call(sb+'/rest/v1/telegram_api_cache?on_conflict=cache_key',sh,{'cache_key':'maya2:title_error_snapshot:20261112','payload':data,'updated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'expires_at':'2099-01-01T00:00:00Z'})
          print('Read-only diagnostic saved.')
          
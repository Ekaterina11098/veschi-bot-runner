name: Owner recovery 044 177 and 41779660 read
on:
  push:
    branches: [main]
    paths: [.github/workflows/owner-recovery13-read.yml]
permissions: {contents: read}
jobs:
  verify:
    if: github.run_attempt == 1 && github.event.head_commit.message == '[owner-recovery13-v2] Read bounded evidence without repository clone'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Install HTTP reader
        run: python3 -m pip install requests==2.32.5
      - name: Read exact owner scope without mutations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,urllib.request,pathlib,subprocess,sys
          names=['china_cloud_cost_control','china_analytic_dialog','china_product_current','china_article_diagnostic','china_moysklad_read','moysklad_warehouses','china_hourly_sales_read','china_wb_evidence','owner_recovery13_read']
          root=pathlib.Path('reader');root.mkdir()
          for name in names:
              url='https://raw.githubusercontent.com/Ekaterina11098/veschi-bot-runner/'+os.environ['GITHUB_SHA']+'/scripts/'+name+'.py'
              (root/(name+'.py')).write_bytes(urllib.request.urlopen(url,timeout=45).read())
          subprocess.run([sys.executable,str(root/'owner_recovery13_read.py')],check=True)
          PY

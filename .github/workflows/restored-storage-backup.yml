name: Verify restored backup checkpoint without source reads
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restored-storage-backup.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: veshi-storage-maintenance
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 99ab899dd306835642d4b33ef8bb6254644ea17c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv simplejson cryptography > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Resume verified owner-encrypted partial; never start again
        uses: actions/download-artifact@v4
        with:
          name: owner-encrypted-storage-backup
          run-id: 38527562171
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/recovery-resume
      - name: Verify encrypted checkpoint and report numeric coverage only
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os,sqlite3,json,tempfile
          from pathlib import Path
          from analytics.storage_backup_crypto import restore
          from analytics.storage_archive import Archive
          source=Path(os.environ['RUNNER_TEMP'])/'recovery-resume'/'original.partial.sqlite.aes'
          with tempfile.TemporaryDirectory() as tmp:
              db=Path(tmp)/'verified.sqlite'
              digest=restore(source,db,secret=os.environ['SUPABASE_SECRET_KEY'])
              arc=Archive(str(db))
              coverage={}
              for table in ('analytics_snapshots','telegram_api_cache'):
                  state=arc.state(table)
                  coverage[table]=None if state is None else dict(saved=state.get('saved'),expected=len(state.get('manifest',[])),verified=state.get('verified'))
              print(json.dumps(dict(full_database_backup=False,plaintext_sha256=digest,coverage=coverage,saved_records=arc.db.execute('select count(*) from records').fetchone()[0])))
              print('guard_state_names='+json.dumps([name for (name,) in arc.db.execute('select name from state') if 'guard' in name or 'read' in name]))
              arc.db.close()
          PY

name: Owner requested saved PNG readback
on:
  push:
    branches: [ip-saved-png-readback-20261020]
    paths: ['.github/workflows/ip-saved-png-readback-20261020.yml']
permissions: {contents: write}
jobs:
  saved:
    if: false # Saved raw and alternatives verified; no collection authorized.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 2f798a9509b72030d6fb5ec68fb915c5d216c31b
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r private-source/requirements.txt cryptography==46.0.2 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - run: python scripts/saved_ad_response401_20261020.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ADVERTISING_EXECUTION_ENABLED: 'false'
      - name: Preserve only owner encrypted saved readback
        if: always()
        run: |
          mkdir -p recovery-output/advertising
          cp "$RUNNER_TEMP/stock-deploy-proof/saved-401-raw.aes.json" "recovery-output/advertising/saved-401-raw-${{ github.run_id }}.aes.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-output/advertising/saved-401-raw-*.aes.json
          git diff --cached --quiet || git commit -m "Preserve owner encrypted saved report inputs"
          git push origin HEAD:ip-saved-png-readback-20261020

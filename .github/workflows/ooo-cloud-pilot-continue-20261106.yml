name: OOO same pilot binding continuation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ooo-cloud-pilot-continue-20261106.yml']
permissions:
  contents: read
concurrency:
  group: ooo-cloud-pilot-20261106-v1
  cancel-in-progress: false
jobs:
  continue:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 777973248307a6a9afd6afe230d4cf6af3b70a89
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0 openai==3.42.1 --quiet
      - run: PYTHONPATH=scripts python -m unittest discover -s scripts -p test_ooo_cloud_pilot_20261106.py
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OOO_TELEGRAM_BOT_TOKEN: ${{ secrets.OOO_TELEGRAM_BOT_TOKEN }}
        run: python -u scripts/ooo_cloud_pilot_20261106.py --continue-binding

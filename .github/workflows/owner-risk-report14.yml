name: Owner risk report supplement, no WB writes
on:
  push:
    branches: [main]
    paths: [.github/workflows/owner-risk-report14.yml]
permissions: {contents: read}
jobs:
  deliver:
    if: github.run_attempt == 1 && github.event.head_commit.message == '[owner-risk-unified14] Replace the two complete reports and remove supplement'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: python3 -m pip install requests==2.32.5 pillow==11.3.0
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ''
        run: |
          python3 - <<'PY'
          import os,sys,pathlib,urllib.request,importlib.abc,importlib.util,unittest
          root=pathlib.Path('checked');root.mkdir();sys.path.insert(0,str(root))
          base='https://raw.githubusercontent.com/Ekaterina11098/veschi-bot-runner/'+os.environ['GITHUB_SHA']+'/scripts/'
          class Finder(importlib.abc.MetaPathFinder):
              def find_spec(self,fullname,path=None,target=None):
                  if '.' in fullname or not fullname.startswith(('china_','moysklad_','owner_risk_report14')):return None
                  p=root/(fullname+'.py')
                  if not p.exists():p.write_bytes(urllib.request.urlopen(base+fullname+'.py',timeout=45).read())
                  return importlib.util.spec_from_file_location(fullname,p)
          sys.meta_path.insert(0,Finder())
          tests=[]
          for name in ['test_china_campaign_financial_review','test_china_campaign_recovery']:
              p=root/(name+'.py');p.write_bytes(urllib.request.urlopen(base+name+'.py',timeout=45).read());tests.append(__import__(name))
          suite=unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromModule(m)for m in tests)
          if not unittest.TextTestRunner().run(suite).wasSuccessful():raise SystemExit(1)
          from owner_risk_report14_unify import main
          main()
          PY

name: Restore saved participant rework after history move
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/review-saved-rework-recover-20261109.yml']
permissions:
  contents: read
concurrency:
  group: review-saved-rework-recover-20261109
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /review-approval-preparation/
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 18649db15489c3dc77edc22bec5a4ddc5ed6a410
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'psycopg[binary]==3.2.10' cryptography==46.0.2 requests==2.32.5 python-dotenv==1.1.1
      - run: python -m unittest test_review_saved_rework_recovery.py
      - name: Restore exact saved text through native revision handling only
        env:
          PYTHONPATH: ${{ github.workspace }}/private-source
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python -u - <<'PY'
          import os,sys,json,hmac,hashlib,base64,time
          from pathlib import Path
          sys.path.insert(0,'review-approval-preparation')
          import psycopg
          from review_telegram_approval import Approval,Repository,sha
          from review_telegram_runtime import TelegramTransport
          from review_approval_bridge import DurableBridge,SQLSource
          from review_approval_process import process,acquire_ui_lock
          from review_approval_backup import snapshot,encrypt
          from stock_deploy_support import OWNER_PUBLIC
          from review_saved_rework_recovery import rebind_saved_rework
          root=os.environ['SUPABASE_SECRET_KEY'].encode()
          password=hmac.new(root,b'veschi:review-approval-login:20261015:v1',hashlib.sha256).hexdigest()
          token='57c0838c3fc87f05e8006cf814af9fef'
          recovery='saved-rework-recovery:20261109:831229623'
          with psycopg.connect(host='aws-0-eu-central-1.pooler.supabase.com',port=5432,dbname='postgres',user='review_approval_login_20261015.abxgjoqlddhtcmjcjwxw',password=password,sslmode='require',autocommit=True,connect_timeout=15,options='-c statement_timeout=30000') as conn:
              row=conn.execute("SELECT payload FROM review_approval.source_cache WHERE cache_key='reviews:telegram-approval:config:v1'").fetchone()
              cfg=row[0] if row else {}
              if not cfg.get('enabled') or not cfg.get('destination_verified') or not cfg.get('new_notices_enabled'):raise SystemExit('Revision delivery disabled')
              secret=base64.b64encode(hmac.new(root,b'veschi:review-approval-ingress:20261015:v1',hashlib.sha256).digest()).decode()
              app=Approval(Repository(conn,postgres=True),secret,cfg['owner_id'],cfg['chat_id'],cfg['bot_id'],enabled=True)
              if app.group_chat()!='-1003932246120':raise SystemExit('Wrong group')
              if not acquire_ui_lock(conn):raise SystemExit('Native UI handler busy; no recovery attempted')
              if app.repo.get('events',recovery):raise SystemExit('Recovery already claimed; read-only reconciliation required')
              card=app.repo.get('cards',token)
              migration=app.repo.get('events','history-resurface:employee-history-20261109-v1:'+token)
              edit_key='telegram-ingress:24222032a4e99a319b3f55656c5fe2d90d6ebb3249fd87362ff8824960384918'
              reply_key='telegram-ingress:afa0ce92c9a5275e3e5be5d85a24e3940b084c1bcc2d4539cdad5772119b8d4c'
              saved_edit=app.repo.get('events',edit_key)['update']
              saved_reply=app.repo.get('events',reply_key)['update']
              edit,reply=rebind_saved_rework(card,token,migration,saved_edit,saved_reply,app.group_chat(),app.bot)
              intents=conn.execute("SELECT count(*) FROM review_approval.intents WHERE payload::jsonb->>'ref'=%s",(card['ref'],)).fetchone()[0]
              if intents:raise SystemExit('Existing publication intent blocks recovery')
              output=Path(os.environ['RUNNER_TEMP'])/'saved-rework-recovery';output.mkdir(exist_ok=True)
              def preserve():
                  (output/'backup.aes.json').write_text(json.dumps(encrypt(snapshot(app.repo),OWNER_PUBLIC.encode())))
              bridge=DurableBridge(app,SQLSource(conn))
              transport=TelegramTransport(os.environ['TELEGRAM_BOT_TOKEN'])
              class NoWB:
                  def __getattr__(self,name):raise RuntimeError('Recovery may not access WB')
              with app.repo.transaction():
                  app.repo.put('events',recovery,dict(status='processing',card_token=token,original_edit_event=edit_key,original_reply_event=reply_key,created_at=time.time()))
              preserve()
              first=process(app,bridge,transport,NoWB(),edit,publication_enabled=False,preserve=preserve,new_notices_enabled=True,cutover=float(cfg['cutover']))
              if first.get('result',{}).get('decision')!='rework':raise RuntimeError('Rework decision not restored')
              result=process(app,bridge,transport,NoWB(),reply,publication_enabled=False,preserve=preserve,new_notices_enabled=True,cutover=float(cfg['cutover']))
              delivered=result.get('revision_delivery') or {}
              if delivered.get('status')!='confirmed' or delivered.get('buttons')!='confirmed':raise RuntimeError('Revision delivery not confirmed; do not replay')
              new=app.repo.get('cards',delivered['card_token'])
              if new.get('texts')!=[saved_reply['message']['text'].strip()]:raise RuntimeError('Exact saved text mismatch')
              if conn.execute("SELECT count(*) FROM review_approval.intents WHERE payload::jsonb->>'ref'=%s",(card['ref'],)).fetchone()[0]!=intents:raise RuntimeError('Unexpected publication intent')
              with app.repo.transaction():
                  app.repo.put('events',recovery,dict(status='confirmed',card_token=token,new_card_token=delivered['card_token'],message_id=delivered['message_id'],buttons='confirmed',answer_sha256=sha(saved_reply['message']['text'].strip()),original_edit_event=edit_key,original_reply_event=reply_key,checked_at=time.time()))
              preserve()
              print(json.dumps(dict(status='confirmed',message_id=delivered['message_id'],buttons='confirmed',publication_created=False)))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-rework-recovery-encrypted-proof
          path: ${{ runner.temp }}/saved-rework-recovery/*.aes.json
          if-no-files-found: ignore
          retention-days: 90

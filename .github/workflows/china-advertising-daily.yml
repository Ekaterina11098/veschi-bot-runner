name: Daily China advertising PNG reports 07:30 MSK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-advertising-daily.yml']
  schedule:
    - cron: '55 3 * * *'
    - cron: '0,15,30,45 4 * * *'
    - cron: '0,15 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: china-advertising-daily
  cancel-in-progress: false
jobs:
  prepare:
    if: github.run_attempt == 1
    concurrency:
      group: bot-mpstats-data
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/
            /*request*.json
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /analytics/
            /business_agents/
            /advertising_agent/
            /china_agent/
            /tests/
            /*.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0 python-dotenv simplejson==4.2.0 openai==3.42.1
      - name: Check advertising arithmetic and duplicate safeguards
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_china_advertising_*.py'
      - name: Read alternative China campaign evidence once
        env:
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: |
          PYTHONPATH=scripts:source python - <<'PY'
          import os
          from analytics.mpstats_probe import discover,unpack_tool
          from china_advertising_state import AdvertisingIO
          io=AdvertisingIO();key='china_agent:owner_morning_alt_sources:2026-11-12:v2'
          if io.get(key):print('Existing alternative evidence preserved');raise SystemExit(0)
          def read(call,checks,seen):
              def tool(name,args):return unpack_tool(call('tools/call',{'name':name,'arguments':args}))
              cabinets=io.get('china_agent:owner_morning_alt_sources:2026-11-12:v1:cabinets')['cabinets']['data']
              assert any(c['id']==939742 and c['name']=='VESCHI Гонконг' and c['info']['currency']=='CNY' for c in cabinets)
              listing=tool('wbbidder_campaigns',dict(tokens=[939742],report='stats',d1='2026-11-09',d2='2026-11-11',limit=100))
              io.create(key+':listing',dict(result=listing,wb_writes=0))
              rows=listing.get('data',[])
              output={}
              for c in rows:
                  if c.get('wb_id') not in (41756218,41779660):continue
                  cid=c['id'];output[str(c['wb_id'])]=dict(identity=c)
                  for report in ('days','products'):
                      output[str(c['wb_id'])][report]=tool('wbbidder_campaign_stats',dict(campaign_id=cid,report=report,d1='2026-11-09',d2='2026-11-11',zone='all'))
                      io.create(key+':campaign:'+str(c['wb_id'])+':'+report,output[str(c['wb_id'])])
              return dict(campaigns=output)
          result=discover(os.environ['MPSTATS_API_TOKEN'],read_checks=True,extra_reader=read)
          io.create(key,{k:v for k,v in result.items() if k!='tools'})
          print({'status':result['status'],'model_calls':0,'wb_writes':0})
          PY
      - name: Prepare and freeze the existing daily identity without Telegram calls
        env:
          CHINA_AD_PREPARE_ONLY: 'true'
          OPENAI_API_KEY: "" # Owner: no paid model API
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: PYTHONPATH=scripts:source python scripts/china_advertising_daily.py
  daily:
    needs: prepare
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/
            /*request*.json
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Wait for 07:30 MSK after preparation
        run: |
          python - <<'PY'
          import time
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          target = now.replace(hour=4, minute=30, second=0, microsecond=0)
          while (remaining := (target - datetime.now(timezone.utc)).total_seconds()) > 0:
              time.sleep(min(remaining, 15))
          PY
      - name: Deliver only frozen pages with the existing receipt and part identities
        env:
          CHINA_AD_FROZEN_ONLY: 'true'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: PYTHONPATH=scripts python scripts/china_advertising_daily.py
  followup:
    needs: daily
    if: github.run_attempt == 1
    concurrency:
      group: bot-mpstats-data
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/
            /*request*.json
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /analytics/
            /business_agents/
            /advertising_agent/
            /china_agent/
            /tests/
            /*.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 python-dotenv simplejson==4.2.0 pillow==11.3.0 > "$RUNNER_TEMP/install.log" 2>&1
      - name: Cache published China Finance and all-source funnel, no marketplace writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          WB_FINANCE_TOKEN_3: ${{ secrets.WB_FINANCE_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          PYTHONPATH: scripts:source
        run: python scripts/china_wb_evidence.py
      - name: Observe verified price and advertising changes, no marketplace writes
        env:
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          PYTHONPATH: scripts:source
        run: python scripts/china_change_observation.py --budget 60

# Scoped recovery: validate each new campaign from its actual launch date.

name: Replace interim execution images with final verified owner result
on:
  push:
    paths:
      - '.github/workflows/owner-report9-final-result-images.yml'
permissions:
  contents: read
concurrency:
  group: owner-report9-final-result-images
  cancel-in-progress: false
jobs:
  present:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1fc94106bc8e208169b1bd32a670b474e2e08d82
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Existing result messages only, archived originals, no marketplace token or writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import os,json,time,base64,hashlib,copy,io as bio,textwrap
          from datetime import datetime,timezone
          from urllib.parse import quote
          import requests
          from china_loss_control import PLAN,CHAT,BOT
          from china_daily_ad_actions import EXEC
          ROOT='china_agent:owner_report_apply:2026-11-09:v1:final-presentation'
          class IO:
           def __init__(self):
            self.url=os.environ['SUPABASE_URL'].rstrip('/')+'/rest/v1/telegram_api_cache';self.bot=os.environ['CHINA_TELEGRAM_BOT_TOKEN'];key=os.environ['SUPABASE_SECRET_KEY'];self.headers={'apikey':key,'Content-Type':'application/json'}
            if not key.startswith('sb_secret_'):self.headers['Authorization']='Bearer '+key
           def get(self,k):
            r=requests.get(self.url,headers=self.headers,params={'cache_key':'eq.'+k,'select':'payload'},timeout=40);r.raise_for_status();rows=r.json();return rows[0]['payload']if rows else None
           def create(self,k,v):
            r=requests.post(self.url,headers=dict(self.headers,Prefer='resolution=ignore-duplicates,return=representation'),json=dict(cache_key=k,payload=v,expires_at='2036-11-09T00:00:00Z'),timeout=45);r.raise_for_status();return bool(r.json())
           def put(self,k,v):
            r=requests.post(self.url,headers=dict(self.headers,Prefer='resolution=merge-duplicates,return=representation'),json=dict(cache_key=k,payload=v,expires_at='2036-11-09T00:00:00Z',updated_at=datetime.now(timezone.utc).isoformat()),timeout=45);r.raise_for_status()
          io=IO()
          def addition_proven(item,s):
           if s.get('status')!='verified':return False
           b=s.get('before',{});a=s.get('after',{});old={x['nm_id']:x for x in b.get('nm_settings',[])};new={x['nm_id']:x for x in a.get('nm_settings',[])};nm=item['nm_id']
           return b.get('id')==a.get('id')==item['campaign_id'] and b.get('settings')==a.get('settings')and b.get('status')==a.get('status')and set(new)==set(old)|{nm}and all(new[k]==v for k,v in old.items())and new[nm]['subject']['id']==item['subject_id']and new[nm]['bids_kopecks'].get(item['placement'])==item['target_minor']
          def edit_result(p,e,mid):
           from china_execution_notice import proven
           from PIL import Image,ImageDraw,ImageFont
           byid={x['id']:x for x in p['items']};records=[];verified=[];blocked=[];uncertain=[]
           for s in e['items']:
            item=byid[s['id']];ok=addition_proven(item,s)if item['kind']=='ad_add_sku'else proven(item,s)
            if ok:verified.append(item)
            elif s.get('status')=='blocked':blocked.append(item)
            else:uncertain.append(item)
            label=item.get('article','РК '+str(item['campaign_id']))
            action=('Пополнить +'+str(item['amount_cny'])+' CNY')if item['kind']=='topup_campaign'else 'Добавить '+str(item['target_minor']/100)+' CNY'if item['kind']=='ad_add_sku'else 'Исключить'if item['kind']=='ad_exclude_sku'else str(item['old_minor']/100)+' → '+str(item['target_minor']/100)+' CNY'
            result='Проверено WB'+(' · уже выполнено, без повторной записи'if s.get('already_done')else '')if ok else 'Не выполнено: '+s.get('reason','проверка не пройдена')if s.get('status')=='blocked'else 'Требуется проверка результата; повторной записи нет'
            records.append((label,str(item['campaign_id']),action,result))
           family=p['family'];caption='Результат выполнения '+('бюджетов'if family=='budgets'else 'рекламных рекомендаций')+' 09.11: проверено WB '+str(len(verified))+' из '+str(len(p['items']))+'.'
           if family=='budgets':caption+=' Подтверждённые пополнения: '+str(sum(x['amount_cny']for x in verified if x['kind']=='topup_campaign'))+' CNY.'
           if blocked:caption+=' Не выполнено: '+str(len(blocked))+', причины в таблице.'
           if uncertain:caption+=' Неподтверждённый результат: '+str(len(uncertain))+'. Повторно не запускал.'
           font='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf';normal=ImageFont.truetype(font,22);bold=ImageFont.truetype(font,25)
           wrapped=[(textwrap.wrap(a,29),b,c,textwrap.wrap(d,58))for a,b,c,d in records];heights=[max(len(a),len(d),1)*30+28 for a,b,c,d in wrapped];im=Image.new('RGB',(1900,150+sum(heights)), 'white');dr=ImageDraw.Draw(im);dr.text((25,20),'\n'.join(textwrap.wrap(caption,110)),font=bold,fill='#122e44');y=100
           for (a,b,c,d),h in zip(wrapped,heights):
            dr.rectangle((20,y,1880,y+h-4),fill='#eff5f7');dr.text((30,y+10),'\n'.join(a),font=normal,fill='black');dr.text((450,y+10),b,font=normal,fill='black');dr.text((650,y+10),c,font=normal,fill='black');dr.text((1030,y+10),'\n'.join(d),font=normal,fill='#166534'if d[0].startswith('Проверено')else '#a31a1a');y+=h
           out=bio.BytesIO();im.save(out,format='PNG');raw=out.getvalue();key=ROOT+':delivery:'+str(mid)
           record=dict(target_message_id=mid,status='editing',caption=caption,sha256=hashlib.sha256(raw).hexdigest(),verified_count=len(verified),blocked_count=len(blocked),uncertain_count=len(uncertain),verified_amount_cny=sum(x.get('amount_cny',0)for x in verified),created_at=stamp(),chat_id=CHAT,bot_id=BOT)
           if not io.create(key,record):return
           io.put(ROOT+':result_artifact:'+family,dict(b64=base64.b64encode(raw).decode(),records=records,sha256=record['sha256']))
           try:
            response=requests.post('https://api.telegram.org/bot'+io.bot+'/editMessageMedia',data={'chat_id':CHAT,'message_id':mid,'media':json.dumps(dict(type='photo',media='attach://photo',caption=caption),ensure_ascii=False)},files={'photo':('execution-final.png',raw,'image/png')},timeout=50).json()
            if not response.get('ok'):raise RuntimeError('Telegram result rejected')
            r=response['result'];assert r['chat']['id']==CHAT and r['from']['id']==BOT and r.get('message_id')==mid
            record.update(status='sent',message_id=r['message_id'],receipt=r,sent_at=stamp());io.put(key,record)
           except Exception:
            record['status']='uncertain';io.put(key,record);raise RuntimeError('Telegram result uncertain; no blind retry')from None
           return record
          if io.get(ROOT):print('Existing final presentation; no blind edit replay');raise SystemExit(0)
          assert io.create(ROOT,dict(status='editing',created_at=datetime.now(timezone.utc).isoformat()))
          me=requests.post('https://api.telegram.org/bot'+io.bot+'/getMe',timeout=30).json();assert me['ok']and me['result']['id']==BOT
          try:
           receipts=[]
           for family,mids in [('budgets',[808]),('drr',[809,811])]:
            p=io.get(PLAN+'daily-2026-11-09-owner-v4-'+family);e=io.get(EXEC+p['plan_id'])
            assert e['status']=='done'and not any(s['status']not in('verified','blocked')for s in e['items'])
            expected=5 if family=='budgets'else 29;assert len(e['items'])==expected
            for mid in mids:
             originalkey='china_agent:owner_report_apply:2026-11-09:v1:delivery:'+family if mid in(808,809)else'china_agent:owner_report_apply:2026-11-09:v1:recovery2:delivery:drr'
             original=io.get(originalkey);assert original['status']=='sent'and original['message_id']==mid and original['receipt']['chat']['id']==CHAT and original['receipt']['from']['id']==BOT
             assert io.create(ROOT+':before:'+str(mid),original)
             r=edit_result(p,e,mid);assert r and r['status']=='sent'
             original.update(status='sent',receipt=r['receipt'],caption=r['caption'],sha256=r['sha256'],verified_count=r['verified_count'],blocked_count=r['blocked_count'],uncertain_count=r['uncertain_count'],verified_amount_cny=r['verified_amount_cny'],edited_at=r['sent_at'],final_presentation_key=ROOT)
             io.put(originalkey,original);receipts.append(dict(message_id=mid,status='edited',verified_count=r['verified_count'],blocked_count=r['blocked_count']))
           io.put(ROOT,dict(status='completed',receipts=receipts,completed_at=datetime.now(timezone.utc).isoformat(),wb_writes=0));print('Final result images replaced in existing Telegram messages; exact receipts private')
          except Exception as ex:
           io.put(ROOT,dict(status='attention_required',error_type=type(ex).__name__));print('Final presentation requires receipt review, no blind retries');raise SystemExit(1)
          
          PY

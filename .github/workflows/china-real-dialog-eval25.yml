name: China real-dialog evaluation without delivery
on:
  push:
    branches: [china-real-dialog-eval25]
    paths: ['.github/workflows/china-real-dialog-eval25.yml']
permissions:
  contents: read
concurrency:
  group: china-real-dialog-eval25
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - run: python scripts/install_china_dialog.py
      - run: pip install requests==2.32.5 Pillow==12.3.0 > /tmp/dependencies.log 2>&1
      - run: python scripts/evaluate_real_china_dialog25.py
        env:
          PYTHONPATH: scripts:source
          EVAL_PHASE: before
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: disabled
          WB_TOKEN_3: disabled
          MPSTATS_API_TOKEN: disabled
          MOYSKLAD_API_TOKEN: disabled

name: Verify all cabinet reviews
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reviews-cabinets.yml']
permissions:
  contents: read
concurrency:
  group: bot-review-replies
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: main
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: pip install requests python-dotenv openai streamlit pandas > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Validate review isolation and refresh saved inboxes
        run: |
          python - <<'PY'
          import run_private
          run_private.execute('Validate review scope and existing cooldowns',['-m','unittest','discover','-s','tests','-p','test_review*.py'])
          run_private.execute('Validate daily task UI',['-m','unittest','discover','-s','tests','-p','test_dashboard_tasks*.py'])
          run_private.execute('Validate all cabinet pages',['-m','unittest','discover','-s','tests','-p','test_cabinet_dashboard.py'])
          run_private.execute('Compile review modules',['-m','py_compile','review_manager.py','review_scope.py','review_inbox_cache.py','wildberries.py','review_queue.py','refresh_review_inbox.py','openai_client.py','validator.py'])
          run_private.execute('Read inboxes without sending answers',['-c','from refresh_review_inbox import refresh_all; refresh_all()'])
          PY
        env:
          TASK: review-inbox-verification
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          WB_FEEDBACK_TOKEN: ${{ secrets.WB_FEEDBACK_TOKEN }}

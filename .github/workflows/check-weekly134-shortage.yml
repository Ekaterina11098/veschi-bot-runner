name: Check requested IP weekly stock shortage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-weekly134-shortage.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
          filter: blob:none
      - name: Read exact products and complete store stock
        shell: python
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import sys
          sys.path.insert(0,"scripts")
          import fbs_document_chain as m
          class R(m.Transport):
           def request(self,base,path,method="GET",body=None,params=None):
            if base==m.MS and method!="GET":raise m.Stop("Read only")
            return super().request(base,path,method,body,params)
          t=R();db=m.Cache(t);w=m.Worker(t,db,{})
          root="weekly_report_review:134:"
          p=db.get(root+"prepare:v1");product=p["products"]["52-zont-red"][0]
          out={"at":m.now(),"product":product,"stock_fbo":w.ms_rows("report/stock/all",{"filter":"store="+m.href(p["store"])+";product="+m.href(product),"stockMode":"all","quantityMode":"all"}),"stock_all":w.ms_rows("report/stock/all",{"filter":"product="+m.href(product),"stockMode":"all","quantityMode":"all"})}
          db.put(root+"shortage_check:v1",out)
          print("Read-only shortage check saved privately.")
          
name: Owner-requested morning correction source27Oct
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-morning-correction27-source.yml']
permissions:
  contents: read
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  collect:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python - <<'PY'
          import os,pathlib,urllib.request
          root=pathlib.Path('scripts');root.mkdir(exist_ok=True)
          for name in ['china_morning_correction27_source.py','china_advertising_state.py','china_price_apply.py','china_advertising_v2.py','china_advertising_cards.py']:
              root.joinpath(name).write_bytes(urllib.request.urlopen('https://raw.githubusercontent.com/Ekaterina11098/veschi-bot-runner/'+os.environ['GITHUB_SHA']+'/scripts/'+name,timeout=40).read())
          PY
      - run: pip install requests==2.32.5 > /tmp/dependencies.log 2>&1
      - run: PYTHONPATH=scripts python scripts/china_morning_correction27_source.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}

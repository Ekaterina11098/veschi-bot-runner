name: Create authorized China weekly report 2001161878
on:
  push:
    branches: [main]
    paths: ['.github/workflows/create-china-weekly-2001161878.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: china-weekly-2001161878-documents
  cancel-in-progress: false
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
          filter: blob:none
      - name: Create authorized weekly chain and verify actual documents
        shell: python
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import sys,json,collections,datetime,time
          from decimal import Decimal,ROUND_FLOOR
          sys.path.insert(0,'scripts')
          import fbs_document_chain as m
          ROOT='weekly_report_review:china:20261101:'
          class Scoped(m.Transport):
           def request(self,base,path,method='GET',body=None,params=None):
            if base==m.MS and method!='GET':
             permitted=(method=='POST' and path in ('entity/customerorder','entity/demand','entity/salesreturn')) or (method=='PUT' and path=='entity/salesreturn/new') or (method=='PUT' and path.startswith('entity/demand/') and set(body or {})=={'description'})
             if not permitted:raise m.Stop('Write outside authorized weekly documents')
            return super().request(base,path,method,body,params)
          t=Scoped();db=m.Cache(t);w=m.Worker(t,db,{})
          plan=db.get(ROOT+'plan:v1');prep=db.get(ROOT+'ms_preflight:v1');inp=plan
          assert plan['authorized'] is True and plan['excel_verified'] is True
          assert plan['prepared_on']==datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=3))).date().isoformat()
          assert prep['status']=='read_verified' and prep['store']['name']=='Гонконг WB FBO' and prep['currency']['name']=='руб'
          assert plan['sales']==inp['sales'] and plan['returns']==inp['returns'] and sum(plan['sales'].values())==138
          assert not prep['duplicate_orders']
          proof_source=db.get(ROOT+'source_proof:v1');assert proof_source['status']=='complete_reconciled' and proof_source['control_totals_match'] is True
          raw=[]
          for chunk in proof_source['chunks']:raw.extend(db.get(chunk['key']))
          assert len(raw)==447 and {r['reportId'] for r in raw}=={2001161878}
          red_ids=set(plan['ids']['red']);source_sales=collections.Counter();source_returns=collections.Counter()
          for r in raw:
           if str(r['rrdId']) in red_ids:continue
           article=r['vendorCode'].strip().casefold()
           if r['docTypeName']=='销售' and r['sellerOperName']=='销售':
            assert r['quantity']==1;source_sales[article]+=1
           elif r['docTypeName']=='退货' and r['sellerOperName']=='退货':
            assert r['quantity']==1;source_returns[article]+=1
          assert dict(source_sales)==plan['sales'] and dict(source_returns)==plan['returns']
          result=db.get(ROOT+'ms_documents:v1') or {'status':'preflight','documents':[],'started_at':m.now()}
          def save():db.put(ROOT+'ms_documents:v1',result)
          def norm(x):return m.href(x).split('?')[0]
          def rows(path,params=None):return w.ms_rows(path,params)
          def doc(kind,uid):return t.request(m.MS,'entity/'+kind+'/'+uid)
          def positions(kind,uid,stock=False):
           path='entity/'+kind+'/'+uid+'/positions'
           if not stock:return rows(path,{'expand':'assortment'})
           out=[];offset=0
           while True:
            page=t.request(m.MS,path,params={'expand':'assortment','fields':'stock','limit':50,'offset':offset});batch=page['rows'];out+=batch;offset+=len(batch)
            if offset==page['meta']['size']:return out
            if not batch or offset>page['meta']['size']:raise m.Stop('Incomplete demand valuation page')
          def counts(ps):
           c=collections.Counter()
           for p in ps:c[(p['assortment'].get('article') or '').strip().casefold()]+=p['quantity']
           return dict(c)
          sales=plan['sales'];prefix='weekly-china-2001161878-'
          common={k:m.meta(prep[k]) for k in ('organization','agent','store')}
          common.update(applicable=True,vatEnabled=True,vatIncluded=True,rate={'currency':m.meta(prep['currency'])})
          def scope(d):return all(norm(d.get(k,{}))==norm(common[k]) for k in ('organization','agent','store')) and norm(d.get('rate',{}).get('currency',{}))==norm(prep['currency'])
          products=prep['products']
          for a in set(sales)|set(plan['returns']):assert len(products.get(a,[]))==1
          flt='organization='+norm(prep['organization'])+';agent='+norm(prep['agent'])+';store='+norm(prep['store'])+';moment>=2026-10-26 00:00:00'
          for kind in ('customerorder','demand','salesreturn'):
           for d in rows('entity/'+kind,{'filter':flt}):
            matches_report=any(n in d.get('name','')+' '+d.get('description','') for n in inp['report_ids']) or plan['comment'] in d.get('description','')
            if matches_report:assert d.get('externalCode','').startswith(prefix),'Existing weekly document requires reconciliation'
          existing_order=rows('entity/customerorder',{'filter':'name='+inp['name']})
          assert len(existing_order)<=1
          if existing_order:assert existing_order[0].get('externalCode')==prefix+'order','Existing order requires reconciliation'
          existing_demand=rows('entity/demand',{'filter':'externalCode='+prefix+'demand'});assert len(existing_demand)<=1
          if not existing_demand:
           exceptions=[]
           bulk=rows('report/stock/all',{'filter':'store='+norm(prep['store']),'stockMode':'all','quantityMode':'all'});byid={norm(r):r for r in bulk};assert len(byid)==len(bulk)
           for a,q in sales.items():
            s=byid.get(norm(products[a][0]),{})
            if s.get('stock',0)<q or s.get('quantity',0)<q or s.get('price',0)<=0:exceptions.append(a)
           result['stock_exceptions']=exceptions;result['fresh_stock_at']=m.now();save()
           if exceptions:raise m.Stop('Insufficient actual stock or cost; no documents created')
          groups=collections.defaultdict(dict)
          for a,q in plan['returns'].items():groups[plan['basis'][a]][a]=q
          for ident,items in groups.items():
           d=doc('demand',ident);assert scope(d) and d.get('applicable')
           cap=collections.Counter(counts(positions('demand',ident)));used=collections.Counter()
           for ref in d.get('returns',[]):
            r=t.request(m.MS,norm(ref)[len(m.MS):])
            if r.get('externalCode')==prefix+'return-'+ident:continue
            used.update(counts(positions('salesreturn',r['id'])))
           for a,q in items.items():assert cap[a]-used[a]>=q,('Insufficient return capacity',a)
          states=[s for s in t.request(m.MS,'entity/customerorder/metadata').get('states',[]) if s['name']=='Доставлен'];assert len(states)==1
          def makepos(a,q):return {'quantity':q,'price':0,'discount':0,'vat':0,'assortment':m.meta(products[a][0])}
          def ensure(kind,tag,body,wanted):
           ext=prefix+tag;found=rows('entity/'+kind,{'filter':'externalCode='+ext});assert len(found)<=1
           if found:d=found[0]
           else:
            if result.get('pending_write'):raise m.Stop('Pending write requires explicit reconciliation before retry')
            result['pending_write']={'kind':kind,'externalCode':ext,'at':m.now()};result['status']='creating';save()
            try:d=t.request(m.MS,'entity/'+kind,'POST',{**body,'externalCode':ext})
            except Exception:
             result['status']='write_outcome_requires_reconciliation';save();raise
            result['pending_write']=None
           ps=positions(kind,d['id'])
           assert scope(d) and d.get('applicable') is True and d['sum']==0 and counts(ps)==wanted and all(p['price']==0 for p in ps)
           ref={'type':kind,'id':d['id'],'name':d['name']}
           if ref not in result['documents']:result['documents'].append(ref)
           save();return d
          order=ensure('customerorder','order',{**common,'name':inp['name'],'description':plan['comment'],'state':m.meta(states[0]),'positions':[makepos(a,q) for a,q in sales.items()]},sales)
          for ref in doc('customerorder',order['id']).get('demands',[]):
           d=t.request(m.MS,norm(ref)[len(m.MS):]);assert d.get('externalCode')==prefix+'demand','Unexpected linked demand'
          demand=ensure('demand','demand',{**common,'description':plan['comment'],'customerOrder':m.meta(order),'positions':[makepos(a,q) for a,q in sales.items()]},sales)
          proof=[]
          for attempt in range(3):
           proof=[];bad=[]
           for p in positions('demand',demand['id'],True):
            q=Decimal(str(p['quantity']));cost=Decimal(str(p.get('stock',{}).get('cost') or 0));unit=(cost/q).to_integral_value(rounding=ROUND_FLOOR)
            if unit<=0:bad.append(p['assortment']['article'])
            proof.append({'article':p['assortment']['article'],'quantity':str(q),'actual_stock_cost_kopecks':str(cost),'unit_price_kopecks':str(unit)})
           if not bad:break
           time.sleep(2)
          result['valuation_positions']=proof;save()
          if bad:raise m.Stop('Actual demand valuation requires clarification; prices remain zero')
          total=sum(Decimal(p['unit_price_kopecks'])*Decimal(p['quantity']) for p in proof)/100
          ck=Decimal(str(plan['returns_rub']))
          def money(v):return format(v,',.2f').replace(',',' ').replace('.',',')
          comment='Опт: '+money(total)+' руб − рыжие возвраты '+money(ck)+' руб = '+money(total-ck)+' руб'
          t.request(m.MS,'entity/demand/'+demand['id'],'PUT',{'description':comment});result['demand_comment']=comment;save()
          for ident,items in groups.items():
           basis=doc('demand',ident)
           existing=rows('entity/salesreturn',{'filter':'externalCode='+prefix+'return-'+ident});assert len(existing)<=1
           if existing:
            body={}
           else:
            template=t.request(m.MS,'entity/salesreturn/new','PUT',{'demand':m.meta(basis)})
            tps=template['positions']['rows'];rps=[]
            if 'meta' in template['positions']:assert len(tps)==template['positions']['meta']['size'],'Incomplete return template'
            for a,q in items.items():
             matched=[p for p in tps if norm(p['assortment'])==norm(products[a][0])];assert len(matched)==1 and matched[0]['quantity']>=q
             p=matched[0];rps.append({**makepos(a,q),'vat':p.get('vat',0),'vatEnabled':p.get('vatEnabled',template.get('vatEnabled',False))})
            body={**common,'vatEnabled':template.get('vatEnabled',False),'vatIncluded':template.get('vatIncluded',True),'description':'рыжие возвраты из '+plan['comment'],'demand':m.meta(basis),'positions':rps}
           ensure('salesreturn','return-'+ident,body,items)
          checks=[];returned=collections.Counter()
          for e in result['documents']:
           kind=e['type'];d=doc(kind,e['id']);ps=positions(kind,d['id']);items=counts(ps)
           assert scope(d) and d['applicable'] is True and d['sum']==0 and all(p['price']==0 for p in ps)
           assert len(rows('entity/'+kind,{'filter':'externalCode='+d['externalCode']}))==1
           if kind=='customerorder':
            assert items==sales and norm(d.get('state',{}))==norm(states[0]) and d.get('description')==plan['comment'] and [norm(x) for x in d.get('demands',[])]==[norm(demand)]
           elif kind=='demand':assert items==sales and d.get('description')==comment and norm(d['customerOrder'])==norm(order)
           else:
            ident=norm(d['demand']).split('/')[-1];assert items==groups[ident] and d.get('description')=='рыжие возвраты из '+plan['comment'];returned.update(items)
           checks.append({**e,'quantity':sum(items.values()),'positions':len(ps),'all_prices_zero':True,'posted':True,'comment':d['description'],'basis':norm(d.get('demand',{})) if kind=='salesreturn' else None,'state':'Доставлен' if kind=='customerorder' else None,'store':prep['store']['name']})
          assert dict(returned)==plan['returns'] and len(checks)==2+len(groups)
          assert len(rows('entity/customerorder',{'filter':'name='+inp['name']}))==1
          result.update(status='complete',completed_at=m.now(),checks=checks,wholesale_rub=str(total),returns_rub=str(ck),net_rub=str(total-ck),sales_units=sum(sales.values()),return_units=sum(returned.values()),all_prices_zero=True,all_posted=True,duplicate_check=True)
          save();db.put(ROOT+'document_status:v1',{'status':'complete','documents_created':True,'completed_at':result['completed_at'],'documents':result['documents']});print('Authorized China weekly report documents created and verified; results saved privately.')
          
          

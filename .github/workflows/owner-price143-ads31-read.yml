name: Owner143 ad and total-order economics31
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-price143-ads31-read.yml']
permissions: {contents: read}
jobs:
  read:
    if: ${{ github.event.head_commit.message == 'Read complete143 advertising costs31' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - run: python -m py_compile scripts/owner_price143_ads31_read.py
      - name: Read bounded costs and total funnel, save privately
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: python scripts/owner_price143_ads31_read.py

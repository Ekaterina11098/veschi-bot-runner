name: IP owner approved expanded98 application 2026-11-02
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ip-owner-expanded98-apply-20261102.yml']
permissions:
  contents: read
concurrency:
  group: wb-ip-advertising-agent
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3cc5083cef578cc7693a54c898fe82a48f9a2710
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact authorized scope, provider wait, durable journal and WB readback
        run: python scripts/ip_owner_expanded98_apply_20261102.py
        env:
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

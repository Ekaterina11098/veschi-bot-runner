name: Remove owner-rejected price report messages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-china-menu12.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: china-owner-menu12
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from china_advertising_state import AdvertisingIO
          io=AdvertisingIO();chat=-1004342917488;root='china_agent:owner_remove_price_reports:2026-11-12:v1'
          assert io.tg('getMe',{})['id']==8780468043
          targets=[('morning',0,967),('morning-corrected',0,968)]+[('control',i,969+i) for i in range(19)]
          for mode,part,mid in targets:
              source='china_agent:price_delivery:v2:2026-11-12:'+mode+':part:'+str(part)
              sent=io.get(source);receipt=sent['receipt']
              assert sent['status']=='sent' and sent['message_id']==mid
              assert receipt['chat']['id']==chat and receipt['from']['id']==8780468043
              key=root+':'+str(mid);old=io.get(key)
              if old:
                  assert old['status']=='deleted'
                  continue
              assert io.create(key,dict(status='deleting',message_id=mid,source_receipt=source,owner_id=5122667182,wb_writes=0))
              result=io.tg('deleteMessage',dict(chat_id=chat,message_id=mid))
              assert result is True
              io.put(key,dict(status='deleted',message_id=mid,source_receipt=source,telegram_result=result,owner_id=5122667182,wb_writes=0))
          print(dict(status='deleted',messages=[x[2] for x in targets],wb_writes=0,model_calls=0))
          PY

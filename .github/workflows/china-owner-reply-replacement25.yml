name: Replace four owner-approved China bot replies
on:
  push:
    branches: [china-owner-reply-replacement25]
    paths: ['.github/workflows/china-owner-reply-replacement25.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-reply-replacement25
  cancel-in-progress: false
jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 > /tmp/dependencies.log 2>&1
      - run: python -m py_compile scripts/replace_owner_replies25.py
      - run: python scripts/replace_owner_replies25.py
        env:
          PYTHONPATH: scripts
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: disabled
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}

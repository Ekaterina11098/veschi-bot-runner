name: Owner read-only evening budget economic review
on:
  push:
    paths: ['.github/workflows/owner-budget-review4.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-budget-review4
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Bounded fresh growth economics; no model or Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import copy,json,os
          os.environ['CHINA_TELEGRAM_BOT_TOKEN']='disabled-read-only-no-token'
          from china_cloud_cost_control import Cache,WB,validate_identity,stamp
          from china_advertising_state import AdvertisingIO
          from china_morning_readiness import current_prices,published_stock
          from china_moysklad_read import read_stock
          from china_advertising_v2 import refresh_budget_context
          c=Cache();w=WB();io=AdvertisingIO()
          KEY='china_agent:owner_budget_economy_review:2026-11-04:evening:v1'
          if c.get(KEY):raise ValueError('Immutable review already collected')
          validate_identity(c,w)
          base=c.get('china_agent:owner_budget_ready_check:2026-11-04:v1')
          ptr=c.get('china_agent:hourly_sales_api:v1:latest');live=c.get(ptr['source_key'])
          ids=sorted(int(x)for x,s in live['advertising']['campaigns'].items()if s['status']==9)
          cs=w.campaigns(ids)
          nms=sorted({r['nm_id']for s in cs.values()for r in s['nm_settings']})
          prices=current_prices(io,nms)
          stock=read_stock([r['article']for r in prices['rows']])
          pub=published_stock(io,prices,nms)
          q={}
          for cid,nmids in {41296363:[1473242577,1473246055]}.items():
           q[str(cid)]=w.minimums(cid,nmids,'recommendations')
          out=dict(status='complete',cabinet='token_3',observed_at=stamp(),campaigns=cs,prices=prices,stock=stock,published_stock=pub,minimums=q,source_key=ptr['source_key'],source=refresh_budget_context(io,base['source'],'2026-11-04'),economics=base['economics'],own=base['own'],config=base['config'],budgets=live['budgets'],wb_writes=0,telegram_calls=0,grants_action_permission=False)
          if not c.create(KEY,out):raise ValueError('Immutable cache creation failed')
          r=c.get(KEY)
          if r['status']!='complete'or len(r['prices']['rows'])!=len(nms):raise ValueError('Readback incomplete')
          print(json.dumps(dict(status=r['status'],source_key=KEY,nms=len(nms),campaigns=len(cs),observed_at=r['observed_at'],wb_writes=0)))
          PY

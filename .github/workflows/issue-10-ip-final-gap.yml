name: Issue 10 pending IP Finance identifiers safe resume
on:
  push:
    branches: [main]
    paths: ['.github/workflows/issue-10-ip-final-gap.yml']
  workflow_dispatch:
  schedule:
    - cron: '45 * * * *'
permissions:
  contents: read
concurrency:
  group: issue-10-stock-read-only
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 7373e08612ea6f8a3577b304ab79e99e159a0ba1
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv aiogram apscheduler pillow > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Check narrow scope, preservation and durable resume gate
        env:
          TASK: ip-finance-resume-tests
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          for pattern in ('test_ip_finance_identifier_gap.py','test_ip_completed_investigations.py'):
              run_private.execute('IP read-only recovery regression',['-m','unittest','discover','-s','tests','-p',pattern])
          PY
      - name: Resume only pending proven Finance gap after Retry-After
        env:
          TASK: ip-finance-pending-resume
          WB_FINANCE_TOKEN_2: ${{ secrets.WB_FINANCE_TOKEN_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          script="""import time
          from analytics.ip_finance_identifier_gap import run
          for attempt in range(16):
              result=run() or {}
              retry=result.get('retry_after')
              if result.get('status')!='pending' or type(retry) not in (int,float) or retry>60:break
              time.sleep(max(1,retry))
          """
          run_private.execute('Exact proven seven-day identifier gap; long cooldown stops immediately',['-c',script])
          PY

name: Owner Pavel saved questions repair 8Nov
on:
  push:
    branches: [main]
    paths: ['owner-pavel-replies8-request.json']
permissions:
  contents: read
concurrency:
  group: owner-pavel-replies8
  cancel-in-progress: false
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Answer only exact saved questions, without WB or paid API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: python scripts/owner_pavel_pending_reply8.py

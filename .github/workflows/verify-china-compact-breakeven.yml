name: Verify compact break even and edit approved message74
on:
  push:
    branches: [china-compact-break-even-20261020]
    paths: ['scripts/china_break_even.py']
permissions:
  contents: read
jobs:
  verify-edit:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - name: Test compact output, article resolution and actual buyout
        run: |
          PYTHONPATH=scripts python -m unittest discover -s scripts -p test_china_buyout_policy.py
          python -m py_compile scripts/conversion_watches.py
      - name: Edit exact approved Telegram message without WB access
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          WB_TOKEN_3: disabled
        run: python china_compact_edit_74_20261020.py

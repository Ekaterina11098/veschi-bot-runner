name: Execute exact Codex-approved three category tests
on:
  push:
    branches: [china-free-analytic-dialog]
    paths: ['.github/workflows/china-confirmed-three.yml']
permissions:
  contents: read
concurrency:
  group: bot-business-agent
  cancel-in-progress: false
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    concurrency:
      group: bot-mpstats-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 > /dev/null
      - name: Offline duplicate and funding safety checks
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p test_launch_confirmed_three.py
      - name: Execute only private exact new approval and verify WB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          PYTHONPATH: scripts
        run: python scripts/launch_confirmed_three.py

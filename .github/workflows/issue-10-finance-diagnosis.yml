name: Issue 10 saved finance diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/issue-10-finance-diagnosis.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue-10-read-only-finance-diagnosis
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 053d7739651ad64dd70afc684b7c0a2c8772fce8
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv aiogram > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Verify and read proven China postclick gap only
        env:
          TASK: issue-10-china-postclick-gap
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          run_private.execute('Validate guarded read-only China gap',['-m','unittest','discover','-s','tests','-p','test_china_postclick_gap.py'])
          run_private.execute('Read verified China postclick gap',['-m','analytics.china_postclick_gap'])
          PY
      - name: Diagnose existing protected observations only
        env:
          TASK: issue-10-saved-finance-diagnosis
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os,run_private
          script="""
          import json,os
          from collections import Counter
          from datetime import datetime,timedelta,timezone
          from zoneinfo import ZoneInfo
          from pathlib import Path
          from analytics.stage_one import read,snapshots
          from analytics.collect import database,RUN_ID
          from analytics.mpstats_composition import compose
          from advertising_agent.mpstats_economics import calculate
          now=datetime.now(timezone.utc)
          end=now.astimezone(ZoneInfo('Europe/Moscow')).date()-timedelta(days=1);start=end-timedelta(days=6)
          components=[snapshots(read,('mpstats_lk_wb_products',),'token_2',str(start+timedelta(days=i)),str(start+timedelta(days=i)))[0] for i in range(7)]
          maps=[{int(r['p_id']):r for r in s['payload'][0]['data']['data']['data']} for s in components]
          common=set.intersection(*(set(m) for m in maps))
          reasons=Counter();details=[]
          for pid in common:
              scoped=[]
              for snapshot,mapping in zip(components,maps):
                  original=snapshot['payload'][0]
                  obs=dict(original,data=dict(original['data'],data=dict(original['data']['data'],data=[mapping[pid]],total=1)))
                  scoped.append(dict(snapshot,payload=[obs]))
              try:
                  observation=compose(scoped,'token_2',start,end)
                  article=maps[0][pid]['sa_name']
                  calc=calculate(observation,{article:0},start,end)
                  reason='calculated' if calc else 'expense_equation_unverified'
              except (ValueError,KeyError,TypeError) as exc:
                  reason=str(exc) if isinstance(exc,ValueError) else type(exc).__name__+':'+str(exc.args[0])
              reasons[reason]+=1
              if reason!='calculated':details.append(dict(product_id=pid,nm_id=maps[0][pid]['nm_id'],article=maps[0][pid]['sa_name'],reason=reason))
          database('POST','analytics_snapshots',body=dict(source='mpstats_stage_one_daily_sku_diagnosis',cabinet='token_2',
              run_id=RUN_ID,period_from=str(start),period_to=str(end),status='complete',payload=[dict(reasons=dict(reasons),details=details)]))
          Path(os.environ['RUNNER_TEMP']+'/composition-diagnosis.json').write_text(json.dumps(dict(reasons=dict(reasons),protected_diagnosis_saved=True)))
          """
          run_private.execute('Diagnose protected saved financial composition',['-c',script])
          PY
      - name: Print schema diagnosis only
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          print((Path(os.environ['RUNNER_TEMP'])/'composition-diagnosis.json').read_text())
          PY

name: Advertising exact Dblack primary detail gap
on:
  push:
    branches: [main]
    paths: ['.github/workflows/advertising-owner-dblack-gap.yml']
permissions:
  contents: write
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 1b4201067880e379d8dacbe5f6ca3f9848d6ffb0
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install cryptography==46.0.2 -r private-source/requirements.txt > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Fetch only exact primary-source detail after storage readback
        env:
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_EGRESS_OPTIMIZED: 'true'
        run: python advertising_dblack_gap_owner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-advertising-dblack-gap
          path: ${{ runner.temp }}/stock-deploy-proof/*.aes.json
          retention-days: 90
      - name: Independent ciphertext only
        if: always()
        run: |
          mkdir -p recovery-output/advertising
          cp "$RUNNER_TEMP/stock-deploy-proof/advertising-dblack-gap.aes.json" "recovery-output/advertising/dblack-gap-${{ github.run_id }}.aes.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-output/advertising/
          git commit -m "Preserve encrypted advertising operation diagnosis"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
          done
          exit 1


# Reuse deployed source/storage components; prior import failure occurred before all source calls.

name: Issue 10 advertised stock verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/issue-10-ad-stock.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue-10-stock-read-only
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 2ce1c3c71c0661bae2db3dc8d681d3bab64e6e78
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv aiogram > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Verify exact target inventory and campaign source gaps read-only
        env:
          TASK: issue-10-stock-target-probe
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          script="""
          import os,requests
          from datetime import datetime,timezone
          from analytics.stage_one import read
          from analytics.collect import _fetch_transport,database,RUN_ID
          token=os.environ['WB_TOKEN_2']
          def save(source,payload):
              database('POST','analytics_snapshots',body=dict(source=source,cabinet='token_2',run_id=RUN_ID,
                  period_from=datetime.now(timezone.utc).date().isoformat(),period_to=datetime.now(timezone.utc).date().isoformat(),
                  status='complete',payload=[dict(observed_at=datetime.now(timezone.utc).isoformat(),
                  owner_cabinet='token_2',nm_id=432727735,chrt_id=614925915,article='471-RayeBag-brown',data=payload,
                  source_gap='MPStats cached historical aggregate lacks current all-warehouse inventory proof; saved WB inventory is older than one hour')]))
          def wb(method,url,params=None,body=None):
              return _fetch_transport(method,url,token,params=params,body=body,max_retry_wait=0)
          try:
              save('advertising_stock_fbo_probe',wb('POST','https://seller-analytics-api.wildberries.ru/api/analytics/v1/stocks-report/wb-warehouses',body=dict(nmIds=[432727735],chrtIds=[614925915],limit=1000,offset=0)))
          except RuntimeError as error:
              save('advertising_stock_fbo_probe_error',dict(reason=str(error)))
              if str(error)!='Source HTTP 403':raise
              import analytics.collect as collector
              def stock_report_read(method,url,token,params=None,body=None,**kwargs):
                  if method!='GET' or not url.startswith('https://seller-analytics-api.wildberries.ru/api/v1/warehouse_remains'):raise ValueError('Unexpected stock report request')
                  return _fetch_transport(method,url,token,params=params,body=body,max_retry_wait=0)
              collector.fetch=stock_report_read
              collector.warehouse_stocks('token_2',token)
          warehouses=wb('GET','https://marketplace-api.wildberries.ru/api/v3/warehouses')
          save('advertising_stock_fbs_warehouses_probe',warehouses)
          if not isinstance(warehouses,list):raise ValueError('Invalid warehouse list')
          for warehouse in warehouses:
              if warehouse.get('isDeleting') is True:continue
              ident=warehouse.get('id')
              if type(ident) is not int:raise ValueError('Invalid warehouse identity')
              response=wb('POST','https://marketplace-api.wildberries.ru/api/v3/stocks/'+str(ident),body={'chrtIds':[614925915]})
              save('advertising_stock_fbs_probe',dict(warehouse_id=ident,response=response))
          save('advertising_stock_membership_probe',wb('GET','https://advert-api.wildberries.ru/api/advert/v2/adverts',params={'ids':'40428689'}))
          stores=requests.get('https://api.moysklad.ru/api/remap/1.2/entity/store',
              headers={'Authorization':'Bearer '+os.environ['MOYSKLAD_API_TOKEN'],'Accept-Encoding':'gzip'},
              params={'limit':100},timeout=(10,45))
          stores.raise_for_status()
          body=stores.json();rows=body.get('rows')
          if not isinstance(rows,list) or len(rows)>=100:raise ValueError('Incomplete stores list')
          matching=[r for r in rows if str(r.get('name','')).strip().casefold()=='мск']
          if len(matching)!=1:raise ValueError('MSK store is ambiguous')
          href=matching[0]['meta']['href']
          response=requests.get('https://api.moysklad.ru/api/remap/1.2/entity/assortment',
              headers={'Authorization':'Bearer '+os.environ['MOYSKLAD_API_TOKEN'],'Accept-Encoding':'gzip'},
              params={'limit':100,'filter':'stockStore='+href,'search':'471-RayeBag-brown'},timeout=(10,45))
          response.raise_for_status()
          save('advertising_stock_msk_probe',dict(store_name='МСК',store_href=href,response=response.json()))
          """
          run_private.execute('Read exact target stock source gaps with shared WB cooldown',['-c',script])
          print('Protected exact-SKU inventory observations saved; no WB writes or Telegram.')
          PY

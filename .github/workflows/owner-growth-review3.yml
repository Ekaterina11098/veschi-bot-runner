name: Owner China growth economics review 3Nov
on:
  push:
    paths: ['.github/workflows/owner-growth-review3.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-growth-review3
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Bounded fresh growth economics; no model or Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: disabled
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json
          from datetime import datetime,timezone
          from china_price_apply import IO
          from china_moysklad_read import read_stock
          from china_morning_readiness import current_prices,published_stock
          from china_loss_ads import current,http
          from china_advertising_economic_review import model_rows
          targets={"1473242763":"330-BeatriceBag-blue","1473243894":"044-NoelBag-black","1473243896":"046-NoelBag-blue","1473243897":"047-NoelBag-darkred","1473243908":"55-NoelBag-green","1473243916":"64-NoelBag-zchocolate","1473244000":"549-GloriaBag-darkbrown","1473244337":"177-AngelaBag-brown","1473244338":"208-AngelaBag-black","1473244340":"447-AngelaBag-burgundy","1473244344":"446-AngelaBag-ginger","1473244345":"523-AngelaBag-black","1473246049":"643-MelanieBag-brown","1556488203":"111-Zont-black"}
          targets={int(k):v for k,v in targets.items()}
          if {1473245494,1473245510}&set(targets):raise ValueError('143/590 excluded by owner')
          root='china_agent:owner_growth_review:2026-11-03:v1'
          class ReadIO(IO):
              def wb(self,path,method='GET',body=None):
                  if method!='GET':raise ValueError('No WB writes')
                  return super().wb(path,method,body)
              def tg(self,*a,**kw):raise ValueError('No Telegram')
          io=ReadIO()
          if io.get(root):raise ValueError('Existing immutable review; do not repeat collection')
          stock=read_stock(list(targets.values()))
          prices=current_prices(io,list(targets));pub=published_stock(io,prices,list(targets))
          if any(targets[r['nm_id']]!=r['article']for r in prices['rows']):raise ValueError('Article identity mismatch')
          own=io.get('china_agent:analytic_read:v1:a6599bcd005727cbc1360cef0c944def3c7e6bac497e5335b0ea1c378ba647d2')
          source=io.get('china_agent:cloud_migration:2026-11-03:v1:live_completed')['source']
          fx=next(v['fx_rub_per_cny']for v in source['economics']['rows'].values()if v.get('fx_date')=='2026-11-03')
          policy=io.get('china_agent:new_ad_economics_policy:v1');shipping=io.get('china_agent:expected_profit_delivery_model:v1')
          econ=model_rows(dict(products=own,prices=prices,stock=stock,fx=dict(rub_per_cny=fx)),policy,shipping)
          cs=current(io);config=http(io,'/api/advert/v1/config')
          membership=[dict(campaign_id=c['id'],nm_id=n['nm_id'],article=targets[n['nm_id']],current_minor=n['bids_kopecks']['search'if c['settings']['placements'].get('search')else'recommendations'],placement='search'if c['settings']['placements'].get('search')else'recommendations',subject_id=n['subject']['id'])for c in cs.values()for n in c['nm_settings']if n['nm_id']in targets]
          minima={};errors={}
          for cid in sorted({r['campaign_id']for r in membership}):
              ids=[r['nm_id']for r in membership if r['campaign_id']==cid];zone='search'if cs[cid]['settings']['placements'].get('search')else'recommendation'
              try:minima[str(cid)]=http(io,'/api/advert/v1/bids/min','POST',dict(advert_id=cid,nm_ids=ids,payment_type='cpc',placement_types=[zone]))
              except Exception as ex:errors[str(cid)]=str(ex)if isinstance(ex,RuntimeError)else type(ex).__name__
          cids=sorted({r['campaign_id']for r in membership});budgets=http(io,'/api/advert/v2/budget','POST',dict(advertIds=cids))
          value=dict(status='complete'if stock['coverage_complete']and not pub['missing_nm_ids']and not errors else'partial',cabinet='token_3',targets=targets,economics=econ,stock=stock,prices=prices,published_stock=pub,membership=membership,minimums=minima,quote_errors=errors,config=config,budgets=budgets,campaigns=cs,observed_at=datetime.now(timezone.utc).isoformat(),fx_rub_per_cny=fx,own_period=[own['period_from'],own['period_to']],own_rows=[r for r in own['rows']if r['nm_id']in targets],source_day_to=source['period_to'],wb_writes=0,moysklad_writes=0,telegram_calls=0,model_calls=0,grants_action_permission=False)
          if not io.create(root,value):raise ValueError('Concurrent review')
          if io.get(root)!=value:raise ValueError('Readback mismatch')
          print('Targeted growth economics saved privately; zero model/marketplace/Telegram mutations')
          PY

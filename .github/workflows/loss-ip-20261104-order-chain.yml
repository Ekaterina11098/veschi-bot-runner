name: Create authorized order then shipment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/loss-ip-20261104-order-chain.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loss-ip-20261104-penza-simferopol
  cancel-in-progress: false
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Post customer order before creating its shipment
        shell: python
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import sys,collections,time
          from decimal import Decimal,ROUND_FLOOR
          sys.path.insert(0,'scripts')
          import fbs_document_chain as m
          ROOT='loss_report:ip:20261104:penza_simferopol:'
          ORDER_EXT='loss-ip-20261104-penza-simferopol-order'
          OLD_EXT='loss-ip-20261104-penza-simferopol-demand'
          DEMAND_EXT='loss-ip-20261104-penza-simferopol-demand-from-order'
          class Scoped(m.Transport):
           def request(self,base,path,method='GET',body=None,params=None):
            if base==m.MS and method!='GET':
             ok=(method=='POST' and ((path=='entity/customerorder' and (body or {}).get('externalCode')==ORDER_EXT) or (path=='entity/demand' and (body or {}).get('externalCode')==DEMAND_EXT and 'customerOrder' in (body or {}))))
             ok=ok or (method=='PUT' and path==getattr(self,'demand_path',None) and set(body or {})=={'description'})
             if not ok:raise m.Stop('Write outside authorized order-first chain')
            return super().request(base,path,method,body,params)
          t=Scoped();db=m.Cache(t);w=m.Worker(t,db,{})
          req=db.get(ROOT+'order_chain_request:v1');inp=db.get(ROOT+'input:v1');prep=db.get(ROOT+'preflight:v1')
          prev=db.get(ROOT+'documents:v1')
          assert req and req['authorized'] and req['create_demand_from_order'] and req['previous_demand_confirmed_deleted']
          assert prev['source_sha256']==inp['source_sha256']
          wanted=prep['wanted'];assert sum(wanted.values())==inp['units']
          def norm(x):return m.href(x).split('?')[0]
          def rows(path,params=None):return w.ms_rows(path,params)
          def ps(kind,uid,stock=False):
           out=[];offset=0
           while True:
            params={'expand':'assortment','limit':50,'offset':offset}
            if stock:params['fields']='stock'
            data=t.request(m.MS,'entity/'+kind+'/'+uid+'/positions',params=params)
            batch=data['rows'];out+=batch;offset+=len(batch)
            if offset==data['meta']['size']:return out
            if not batch or offset>data['meta']['size']:raise m.Stop('Incomplete positions')
          def counts(positions):
           c=collections.Counter()
           for p in positions:c[norm(p['assortment'])]+=p['quantity']
           return dict(c)
          def scope(doc):
           return all(norm(doc.get(k,{}))==norm(prep[k]) for k in ('organization','agent','store')) and norm(doc.get('rate',{}).get('currency',{}))==norm(prep['currency'])
          def verify(doc,positions):
           assert scope(doc) and not doc.get('deleted') and doc['applicable'] is True and doc['sum']==0
           assert counts(positions)==wanted and len(positions)==len(wanted) and all(p['price']==0 for p in positions)
          old_id=db.get(ROOT+'order_chain_diagnostic:v1')['by_id']['id']
          old=t.request(m.MS,'entity/demand/'+old_id)
          assert old.get('deleted') and old['applicable'] is False and scope(old)
          assert not rows('entity/demand',{'filter':'externalCode='+OLD_EXT}),'Prior direct shipment is active'
          assert prep['store']['name']=='Склад WB FBO'
          state=db.get(ROOT+'order_chain:v1') or {'status':'preflight','started_at':m.now()}
          def save():db.put(ROOT+'order_chain:v1',state)
          common={k:m.meta(prep[k]) for k in ('organization','agent','store')}
          common.update(applicable=True,vatEnabled=True,vatIncluded=True,rate={'currency':m.meta(prep['currency'])})
          position_body=[{'quantity':q,'price':0,'discount':0,'vat':0,'assortment':{'meta':{'href':href,'type':'product','mediaType':'application/json'}}} for href,q in wanted.items()]
          named=rows('entity/customerorder',{'filter':'name='+req['order_name']})
          byext=rows('entity/customerorder',{'filter':'externalCode='+ORDER_EXT})
          assert len(named)<=1 and len(byext)<=1
          if named and byext:assert named[0]['id']==byext[0]['id']
          existing=named or byext
          states=t.request(m.MS,'entity/customerorder/metadata').get('states',[])
          delivered=[s for s in states if s['name']==req['order_state']];assert len(delivered)==1
          if existing:order=t.request(m.MS,'entity/customerorder/'+existing[0]['id'])
          else:
           if state.get('pending_order'):raise m.Stop('Uncertain order write requires reconciliation')
           state.update(status='creating_order',pending_order={'externalCode':ORDER_EXT,'at':m.now()});save()
           try:order=t.request(m.MS,'entity/customerorder','POST',{**common,'externalCode':ORDER_EXT,'name':req['order_name'],'description':req['order_comment'],'state':m.meta(delivered[0]),'positions':position_body})
           except Exception:
            state['status']='order_write_requires_reconciliation';save();raise
           state['pending_order']=None
          order_positions=ps('customerorder',order['id']);verify(order,order_positions)
          assert order['name']==req['order_name'] and order['description']==req['order_comment'] and norm(order['state'])==norm(delivered[0])
          state.update(status='order_posted',order={'id':order['id'],'name':order['name']},order_posted=True,order_posted_verified_at=m.now());save()
          found=rows('entity/demand',{'filter':'externalCode='+DEMAND_EXT});assert len(found)<=1
          order=t.request(m.MS,'entity/customerorder/'+order['id'])
          refs=[norm(d) for d in order.get('demands',[])]
          if found:assert all(ref==norm(found[0]) for ref in refs)
          else:assert not refs,'Order already has another shipment'
          if found:demand=t.request(m.MS,'entity/demand/'+found[0]['id'])
          else:
           bulk=rows('report/stock/all',{'filter':'store='+norm(prep['store']),'stockMode':'all','quantityMode':'all'})
           byid={norm(s):s for s in bulk};bad=[]
           for href,q in wanted.items():
            s=byid.get(href,{})
            if s.get('stock',0)<q or s.get('quantity',0)<q or s.get('price',0)<=0:bad.append({'product_href':href,'needed':q,'stock':s.get('stock',0),'available':s.get('quantity',0),'cost_kopecks':s.get('price',0)})
           state.update(stock_exceptions=bad,fresh_stock_at=m.now());save()
           if bad:
            state['status']='order_posted_waiting_stock';save();print('Posted order verified; shipment awaits private stock exceptions.');sys.exit(0)
           if state.get('pending_demand'):raise m.Stop('Uncertain shipment write requires reconciliation')
           # Derive the shipment positions only from the freshly read posted order.
           order_positions=ps('customerorder',order['id']);verify(order,order_positions)
           derived=[{'quantity':p['quantity'],'price':0,'discount':0,'vat':0,'assortment':m.meta(p['assortment'])} for p in order_positions]
           state.update(status='creating_shipment_from_order',pending_demand={'externalCode':DEMAND_EXT,'at':m.now()});save()
           try:demand=t.request(m.MS,'entity/demand','POST',{**common,'externalCode':DEMAND_EXT,'description':req['order_comment'],'customerOrder':m.meta(order),'positions':derived})
           except Exception:
            state['status']='demand_write_requires_reconciliation';save();raise
           state['pending_demand']=None
          verify(demand,ps('demand',demand['id']))
          assert norm(demand['customerOrder'])==norm(order)
          state.update(status='shipment_created_from_order',demand={'id':demand['id'],'name':demand['name']},quantity=inp['units'],positions=len(wanted),all_prices_zero=True);save()
          proof=[];bad=[]
          for attempt in range(3):
           proof=[];bad=[]
           for p in ps('demand',demand['id'],True):
            q=Decimal(str(p['quantity']));cost=Decimal(str(p.get('stock',{}).get('cost') or 0));unit=(cost/q).to_integral_value(rounding=ROUND_FLOOR)
            if unit<=0:bad.append(p['assortment'].get('article'))
            proof.append({'article':p['assortment'].get('article'),'quantity':str(q),'actual_cost_kopecks':str(cost),'unit_kopecks':str(unit)})
           if not bad:break
           time.sleep(2)
          state.update(valuation_positions=proof,valuation_exceptions=bad);save()
          if bad:raise m.Stop('Actual valuation has exceptions; prices remain zero')
          total=sum(Decimal(p['unit_kopecks'])*Decimal(p['quantity']) for p in proof)/100
          comment='Опт: '+format(total,',.2f').replace(',',' ').replace('.',',')+' руб.'
          t.demand_path='entity/demand/'+demand['id']
          t.request(m.MS,t.demand_path,'PUT',{'description':comment})
          final_order=t.request(m.MS,'entity/customerorder/'+order['id']);final_demand=t.request(m.MS,t.demand_path)
          verify(final_order,ps('customerorder',order['id']));verify(final_demand,ps('demand',demand['id']))
          assert norm(final_demand['customerOrder'])==norm(final_order)
          assert [norm(d) for d in final_order.get('demands',[])]==[norm(final_demand)]
          assert final_demand['description']==comment
          assert final_order['name']==req['order_name'] and final_order['description']==req['order_comment'] and norm(final_order['state'])==norm(delivered[0])
          assert len(rows('entity/customerorder',{'filter':'name='+req['order_name']}))==1 and len(rows('entity/demand',{'filter':'externalCode='+DEMAND_EXT}))==1
          old=t.request(m.MS,'entity/demand/'+old_id);assert old.get('deleted') and not old['applicable']
          state.update(status='complete',completed_at=m.now(),order_comment=final_order['description'],demand_comment=comment,wholesale_rub=str(total),demand_posted=True,linked_both_ways=True,prior_demand_deleted=True,prior_demand_id=old_id)
          save()
          prev.update(status='complete',demand=state['demand'],customer_order=state['order'],completed_at=state['completed_at'],wholesale_rub=str(total),demand_comment=comment,valuation_positions=proof,order_chain_verified_at=state['completed_at'],superseded_deleted_demand_id=old_id)
          db.put(ROOT+'documents:v1',prev)
          print('Posted order created before shipment; order-derived shipment and valuation verified privately.')

name: Validate scoped Sol restoration against Pavel dialogue without delivery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-sol-restore-validate-20261110.yml']
permissions:
  contents: read
jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts
      - name: Offline protocol, scope and model-budget regressions
        run: |
          PYTHONPATH=scripts python3 -m unittest discover -s scripts -p 'test_china_scoped_paid_restore.py'
          PYTHONPATH=scripts python3 -m unittest discover -s scripts -p 'test_bounded_sol_dialog.py'
          PYTHONPATH=scripts python3 -m unittest discover -s scripts -p 'test_china_codex_cloud.py'
      - name: Two bounded Sol replay probes; no marketplace or Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: scripts
        run: |
          python3 - <<'PY'
          import json,datetime
          from china_codex_cloud import DB,Worker,INSTRUCTIONS,envelope,ROOT,CLOUD,CHAT
          from bounded_sol_dialog import BoundedSol,compact_message
          from china_no_paid import require_paid_api
          class CachedDB(DB):
           def __init__(self):self.memo={}
           def get(self,k):
            if k.startswith("china_agent:owner_sol_restore:"):return super().get(k)
            if k not in self.memo:self.memo[k]=super().get(k)
            return self.memo[k]
          db=CachedDB()
          policy=dict(db.get(CLOUD+"policy")or{},enabled=True,paid_api_allowed=True)
          require_paid_api(policy)
          outcomes=[]
          for jid in (283,289):
           job=db.api("GET","business_agent_jobs",{"id":"eq."+str(jid),"chat_id":"eq."+str(CHAT),"select":"id,sender_id,request_text,tool_trace"})[0]
           text=job["request_text"].removeprefix("/codex ")
           if jid==289:text="41680341 кампания: какие товары уже убраны по решению Екатерины?"
           inbox=dict(job_id=jid,request_text=text,sender_id=job["sender_id"])
           ctx=Worker(db).context(inbox)
           resolution=db.get("china_agent:owner_dialog_resolution:v1:job:"+str(jid))
           if resolution:ctx["owner_verified_resolution"]=resolution
           msg=compact_message(dict(runtime_scope=dict(today_msk="2026-11-10",sender_id=job["sender_id"],chat_id=CHAT,wb_action_permission=False,validation_only=True),dated_work_context=ctx,untrusted_telegram_question=text))
           identity="owner-sol-restore10-validation-v2-"+str(jid)
           model=BoundedSol(db,"china_agent:owner_sol_restore:2026-11-10:v1:")
           answer=model.answer(identity,INSTRUCTIONS,msg)
           e=envelope(answer)
           assert e["kind"]!="prepare_advertising","Maintenance incorrectly became acquisition"
           if jid==289:
            assert e["kind"]=="answer" and "144"in e["answer"] and "578"in e["answer"],"Verified removals not explained"
           outcomes.append(dict(original_job_id=jid,kind=e["kind"],answer=e.get("answer"),read_request=e if e["kind"]=="read"else None,model_receipt_key=model.key(identity),validation_only=True))
          value=dict(status="verified",cases=outcomes,observed_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),wb_reads=0,wb_writes=0,telegram_sends=0,model_calls=2)
          key="china_agent:owner_sol_restore:2026-11-10:v1:validation-v2"
          db.once(key,value)
          print(json.dumps(dict(status="verified",cases=len(outcomes),wb_writes=0,telegram_sends=0)))
          
          PY

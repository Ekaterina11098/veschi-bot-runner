name: Backfill and verify owner-approved reply examples
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/review-approved-benchmarks.yml','review_approved_benchmarks.py','test_review_approved_benchmarks.py']
permissions: {contents: read}
concurrency:
  group: review-benchmark-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'psycopg[binary]==3.2.10'
      - run: python -m unittest test_review_approved_benchmarks.py
      - name: Persist exact approved revisions without WB or Telegram calls
        env:
          PYTHONPATH: review-approval-preparation
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python review_approved_benchmarks.py

name: Replace only incomplete initial China collection bundle
on:
  push:
    paths: ['.github/workflows/reviews-china-bootstrap-replace-20261104.yml']
permissions:
  contents: read
  actions: write
jobs:
  stop-initial-collector-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Stop only the read-only-WB blocked source-retry collector; leave publisher and every other workflow untouched
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          base='https://api.github.com/repos/'+os.environ['REPOSITORY']+'/actions/runs/41823396947'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          with urllib.request.urlopen(urllib.request.Request(base,headers=headers),timeout=30) as r:run=json.load(r)
          if run['head_sha']!='90279b8b17911545ec3363a06d8b7eb01d8f6913' or run['path']!='.github/workflows/reviews-china-two-hour.yml':
              raise RuntimeError('Unexpected run identity; no cancellation')
          if run['status'] in ('in_progress','queued','pending','waiting','requested'):
              with urllib.request.urlopen(urllib.request.Request(base+'/cancel',headers=headers,method='POST'),timeout=30) as r:
                  if r.status!=202:raise RuntimeError('Cancellation not accepted')
              print('Requested cancellation of only initial China collector 41823396947')
          else:print('Blocked source-retry collector already stopped; no action')
          PY

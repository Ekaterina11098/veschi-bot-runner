name: Owner scoped reserve diagnosis 637
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-china-menu12.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owner-reserve637-read
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from datetime import datetime,timezone
          from china_advertising_state import AdvertisingIO
          from china_advertising_v2 import http
          io=AdvertisingIO();key='china_agent:owner_reserve637:2026-11-12:v1:current'
          if not io.get(key):
              budget=http(io,'/api/advert/v2/budget','POST',dict(advertIds=[41298169]))
              adverts=http(io,'/api/advert/v2/adverts?ids=41298169')['adverts']
              assert len(adverts)==1 and adverts[0]['id']==41298169
              v=dict(observed_at=datetime.now(timezone.utc).isoformat(),campaign_id=41298169,budget=budget,sku_present=any(n['nm_id']==1473242577 for n in adverts[0]['nm_settings']),campaign_status=adverts[0]['status'],required_cny=1392.34,wb_writes=0,telegram_calls=0,model_calls=0)
              assert io.create(key,v)
              assert io.get(key)==v
          print(dict(status='saved',wb_writes=0,telegram_calls=0,model_calls=0))
          PY

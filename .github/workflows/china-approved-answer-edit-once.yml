name: Apply one approved China message revision
on:
  push:
    branches: [china-approved-answer-edit-20261023]
    paths: [.github/workflows/china-approved-answer-edit-once.yml]
permissions:
  contents: read
concurrency:
  group: china-approved-answer-edit-20261023
  cancel-in-progress: false
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply only durable owner-approved Telegram operations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: python scripts/china_approved_answer_edit_once.py

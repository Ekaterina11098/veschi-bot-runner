name: Owner stock repair offline regression 2026-10-15
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stock-repair-tests-20261015.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 4bbcba142ece7d6a4de6be6bcba441884a518c8d
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest test_stock_presence_two test_stock_furcoat_exclusion test_stock_read_retries test_stock_automatic_recovery test_stock_reduction_credit test_stock_regular_service test_stock_group_execution test_unfinished_stock_20261016 test_stock_batch_transport test_stock_batch_plan test_stock_inventory_notice test_stock_schedule test_owner_low_rule test_order_demand test_stock_notice_policy -v

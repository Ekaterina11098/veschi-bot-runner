name: Owner authorized clarification to Pavel 28Oct
on:
  push:
    paths: ['.github/workflows/china-pavel-clarify30-28.yml']
permissions:
  contents: read
concurrency:
  group: china-pavel-clarify30-28
  cancel-in-progress: false
jobs:
  clarify:
    if: github.repository == 'Ekaterina11098/veschi-bot-runner' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,requests
          from datetime import datetime,timezone,timedelta
          from urllib.parse import quote
          if (datetime.now(timezone.utc)+timedelta(hours=3)).date().isoformat()!='2026-10-28':raise ValueError('Dated only')
          key='china_agent:pavel_clarify30:2026-10-28:v2'
          url=os.environ['SUPABASE_URL'].rstrip('/')+'/rest/v1/telegram_api_cache'
          secret=os.environ['SUPABASE_SECRET_KEY']
          h={'apikey':secret,'Content-Type':'application/json','Prefer':'return=representation'}
          if not secret.startswith('sb_secret_'):h['Authorization']='Bearer '+secret
          def db(method,suffix,body=None):
              r=requests.request(method,url+suffix,headers=h,json=body,timeout=30)
              if not r.ok:raise ValueError('State HTTP '+str(r.status_code))
              return r.json() if r.content else []
          suffix='?cache_key=eq.'+quote(key,safe='')
          old=db('GET',suffix+'&select=payload')
          if old:
              print(json.dumps({'status':old[0]['payload']['status'],'duplicate_prevented':True}));raise SystemExit()
          bot='https://api.telegram.org/bot'+os.environ['BOT_TOKEN']+'/'
          me=requests.post(bot+'getMe',json={},timeout=25).json()
          if not me.get('ok') or me['result']['id']!=8780468043:raise ValueError('Bot identity')
          text='Павел, сейчас у нас всего 4 предложения. Ты имеешь в виду выполнить 30% из этих четырёх предложений или выбрать 30% товаров?'
          e={'status':'submitting','text':text,'chat_id':-1004342917488,'bot_id':8780468043,'created_at':datetime.now(timezone.utc).isoformat(),'authorization':'explicit_owner_codex28Oct_clarify_two_options_only','wb_writes':0}
          if not db('POST','?on_conflict=cache_key',{'cache_key':key,'payload':e,'expires_at':'2036-10-28T00:00:00Z'}):raise ValueError('Journal race')
          try:
              answer=requests.post(bot+'editMessageText',json={'chat_id':e['chat_id'],'message_id':381,'text':text},timeout=40).json()
          except Exception:raise RuntimeError('Delivery uncertain; no retry') from None
          if not answer.get('ok'):raise ValueError('Telegram rejected '+str(answer.get('error_code')))
          receipt=answer['result']
          if receipt['message_id']!=381 or not receipt.get('edit_date') or receipt['chat']['id']!=e['chat_id'] or receipt['from']['id']!=e['bot_id']:raise ValueError('Receipt identity')
          e.update(status='sent',receipt=receipt,message_id=receipt['message_id'],sent_at=datetime.now(timezone.utc).isoformat())
          db('PATCH',suffix,{'payload':e,'updated_at':e['sent_at']})
          print(json.dumps({'status':'sent','message_id':e['message_id'],'wb_writes':0}))
          PY

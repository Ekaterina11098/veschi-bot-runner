name: Frozen Pavel questions production model evaluation
on:
  push:
    branches: [main]
    paths: [.github/workflows/china-pavel-quality31.yml]
permissions: {contents: read}
concurrency: {group: china-pavel-quality31, cancel-in-progress: false}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - run: PYTHONPATH=scripts python -m unittest discover -s scripts -p test_china_pavel_questions31.py
      - name: Real model, frozen private sources, no delivery or marketplace access
        env:
          PYTHONPATH: scripts
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/evaluate_china_pavel31.py

name: PR20 offline stock parity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stock-pr20-offline.yml']
permissions:
  contents: read
concurrency:
  group: stock-pr20-offline
  cancel-in-progress: false
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: eb08ba9feba01b1dd574b10880f0a5013a4607f2
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Standard-library-only tests; deny all sockets
        run: |
          python - <<'PY'
          import socket,unittest,sys
          def blocked(*args,**kwargs):
              raise AssertionError('External network disabled for offline stock audit')
          socket.socket.connect=blocked
          socket.socket.connect_ex=blocked
          socket.create_connection=blocked
          sys.path.insert(0,'tests')
          from test_stock_local_cloud_parity import ParityTests
          suite=unittest.TestSuite(ParityTests(name) for name in ('test_signed_zero_and_missing_row','test_cloud_loop_blocks_all_automatic_low_stock_changes','test_shared_batch_uses_same_completed_moscow_window'))
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(not result.wasSuccessful())
          PY

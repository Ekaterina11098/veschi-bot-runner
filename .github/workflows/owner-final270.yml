name: Complete Pavel270 checks after exact549 economics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-final270.yml']
permissions:
  contents: read
concurrency:
  group: china-dialog-data
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          sparse-checkout: |
            analytics
            china_agent
            business_agents
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 Pillow==12.3.0
      - name: Verify consent with natural clarification
        run: |
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_ad_proposal_consent.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_sol_proposals.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_proposal_final_review.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_ad_retest.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_fewer_proposals.py
      - name: Accept original consent and calculate scoped proposals without execution
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          PYTHONPATH: scripts:source
        run: python scripts/owner_final270_check.py

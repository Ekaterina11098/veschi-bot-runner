name: Owner three product read-only traffic diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-lowtraffic-read-20261106.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-lowtraffic-read-20261106
  cancel-in-progress: false
jobs:
  read:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from china_cloud_cost_control import Cache
          code=Cache().get('china_agent:owner_lowtraffic_diagnostic:2026-11-06:v1:script')['code']
          exec(compile(code,'private-read-only-diagnosis','exec'),{'__name__':'__main__'})
          PY

name: Owner agent — MPStats gap recovery acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['owner_agent/mpstats-request.json']
permissions: {contents: read}
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
  queue: max
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 29f6e3f4a59e87c43a085f18d69f8509fe1cf6c1
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 > "$RUNNER_TEMP/owner-dependencies.log" 2>&1
      - run: python -m py_compile owner_agent/mpstats_collect.py
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --test owner_agent/test.mjs
      - name: Collect missing MPStats scope and verify actual owner question without Telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OWNER_AI_MODEL: ${{ vars.OWNER_AI_MODEL || 'gpt-4.1-mini' }}
        run: node owner_agent/mpstats-acceptance.mjs

name: Owner blocked card exact photo inspection
on:
  push:
    paths:
      - '.github/workflows/owner-blocked-cards-photos-20261109.yml'
permissions:
  contents: read
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  read:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 10ca471ebdc30e8979abeb6286434c51fe218931
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Read exact blocked photos to private cache
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import io as bio,base64,requests
          from PIL import Image,ImageDraw,ImageFont
          from urllib.parse import urlparse
          from datetime import datetime,timezone
          from china_loss_execute import IO
          io=IO();key='china_agent:owner_blocked_cards:2026-11-09:v1:photos'
          if io.get(key):raise SystemExit('Existing images; no replay')
          assert io.create(key,dict(status='collecting',wb_writes=0,telegram_calls=0))
          p=io.get('china_agent:owner_blocked_cards:2026-11-09:v1:read');assert p['status']=='complete'
          assert {c['nmID']for c in p['cards']}=={1473243821,1473243826,1473246040}
          panels=[];errors=[];images=[]
          for c in p['cards']:
           for i,photo in enumerate(c['photos'],1):
            url=photo['big'];u=urlparse(url);assert u.scheme=='https'and u.hostname.endswith('.wbbasket.ru')
            try:
             r=requests.get(url,timeout=30);assert r.ok
             im=Image.open(bio.BytesIO(r.content)).convert('RGB')
             buf=bio.BytesIO();im.save(buf,format='JPEG',quality=88)
             images.append(dict(nm_id=c['nmID'],index=i,image_b64=base64.b64encode(buf.getvalue()).decode()))
             tile=Image.new('RGB',(240,345),'white');im.thumbnail((230,310));tile.paste(im,((240-im.width)//2,30));ImageDraw.Draw(tile).text((5,5),str(c['vendorCode'].split('-')[0])+' photo '+str(i),fill='black')
             panels.append(tile)
            except Exception as ex:errors.append(dict(nm_id=c['nmID'],index=i,error=type(ex).__name__))
          cols=7;sheet=Image.new('RGB',(cols*240,((len(panels)+cols-1)//cols)*345),'#dddddd')
          for i,tile in enumerate(panels):sheet.paste(tile,((i%cols)*240,(i//cols)*345))
          buf=bio.BytesIO();sheet.save(buf,format='JPEG',quality=90)
          io.put(key,dict(status='complete'if not errors else'partial',sheet_b64=base64.b64encode(buf.getvalue()).decode(),images=images,errors=errors,observed_at=datetime.now(timezone.utc).isoformat(),wb_writes=0,telegram_calls=0))
          PY

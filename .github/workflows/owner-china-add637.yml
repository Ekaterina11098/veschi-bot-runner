name: Owner add only637 at agreed bid
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-china-add637.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: china-price-reports-actions
  cancel-in-progress: false
jobs:
  add637:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    concurrency:
      group: china-daily-ad-actions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Exact owner action with before and after WB receipts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: PYTHONPATH=scripts python scripts/owner_add637_20261112.py

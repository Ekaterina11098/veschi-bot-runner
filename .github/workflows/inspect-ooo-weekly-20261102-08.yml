name: Inspect requested Kyrgyzstan weekly November 2-8
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-ooo-weekly-20261102-08.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inspect-ooo-weekly-20261102-08
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Read requested report accounting preflight privately
        shell: python
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import sys,json,collections,concurrent.futures
          sys.path.insert(0,"scripts")
          import fbs_document_chain as m
          class ReadOnly(m.Transport):
           def request(self,base,path,method="GET",body=None,params=None):
            if base==m.MS and method!="GET":raise m.Stop("MS writes prohibited")
            return super().request(base,path,method,body,params)
          t=ReadOnly();db=m.Cache(t);w=m.Worker(t,db,{})
          ROOT="weekly_report_review:ooo:20261102_20261108:"
          request=db.get(ROOT+"request:v1") or {}
          assert request.get("source_requests_authorized") is True and request.get("writes_authorized") is True,"Owner request disabled"
          import decimal
          from decimal import Decimal,ROUND_FLOOR
          proof=db.get(ROOT+"source_proof:v1")
          assert proof and proof["rows"]>0
          raw=[]
          for chunk in proof["chunks"]:raw+=db.get(chunk["key"])
          assert len(raw)==proof["rows"] and len({str(r["rrdId"]) for r in raw})==len(raw)
          assert set(r["currency"] for r in raw)=={"KGS"} and all(r["dateFrom"][:10]=="2026-11-02" and r["dateTo"][:10]=="2026-11-08" for r in raw)
          source=raw
          assert len(source)==len(raw)
          groups=collections.defaultdict(lambda:{"s":[],"r":[]});operations=collections.Counter();issues=[]
          for i,r in sorted(enumerate(source),key=lambda p:(Decimal(str(p[1].get("forPay") or 0)),p[0])):
           j=(r.get("docTypeName") or "").strip().casefold();k=(r.get("sellerOperName") or "").strip().casefold();operations[(j,k)]+=1
           typ="s" if j=="продажа" and k in ("продажа","добровольная компенсация при возврате") else "r" if j=="возврат" and k=="возврат" else None
           if typ:
            if r["quantity"]!=1:issues.append({"id":str(r["rrdId"]),"quantity":r["quantity"],"article":r["vendorCode"]})
            a=r["vendorCode"].strip().casefold();assert a;groups[a][typ].append(i)
          sales={};returns={};red=[];orange=[];unpaired=[]
          for a,g in groups.items():
           paired=min(len(g["s"]),len(g["r"]));red+=g["s"][:paired]+g["r"][:paired]
           if len(g["s"])>paired:sales[a]=len(g["s"])-paired;unpaired+=g["s"][paired:]
           if len(g["r"])>paired:returns[a]=len(g["r"])-paired;orange+=g["r"][paired:]
          ids=sorted({str(r["reportId"]) for r in raw});name=", ".join(ids)
          comment="Киргизия ВБ 021126-081126"
          inp={"status":"source_complete" if proof.get("pagination_exhausted") else "provisional_waiting_completeness","sales":sales,"returns":returns,"name":name,"comment":comment,"filename":comment+".xlsx","report_ids":ids,"source_rows":len(raw),"source_complete":proof.get("pagination_exhausted") is True,"red_pairs":len(red)//2,"sales_units":sum(sales.values()),"sales_articles":len(sales),"return_units":sum(returns.values()),"ids":{"red":[str(source[i]["rrdId"]) for i in red],"orange":[str(source[i]["rrdId"]) for i in orange],"unpaired_sales":[str(source[i]["rrdId"]) for i in unpaired]},"operations":[{"J":j,"K":k,"rows":n} for (j,k),n in operations.items()],"quantity_issues":issues}
          db.put(ROOT+"input:v1",inp)
          assert not issues,"Source row quantities require owner clarification"
          
          out={"at":m.now(),"status":"reading","products":{},"stock":{},"basis":{},"return_costs":{},"demands":[]}
          def save():db.put(ROOT+"prepare:v1",out)
          def norm(x):return m.href(x).split("?")[0]
          def rows(path,params=None):return w.ms_rows(path,params)
          def positions(kind,ident,stock=False):
           if not stock:return rows("entity/"+kind+"/"+ident+"/positions",{"expand":"assortment"})
           result=[];offset=0
           while True:
            data=t.request(m.MS,"entity/"+kind+"/"+ident+"/positions",params={"expand":"assortment","fields":"stock","limit":50,"offset":offset})
            page=data["rows"];result+=page;offset+=len(page)
            if offset>=data["meta"]["size"]:return result
            assert page
          for k,path in {"organization":"entity/organization/61c199c8-fd78-11ee-0a80-1479002a9f95","agent":"entity/counterparty/4cc3ffa2-fd7c-11ee-0a80-0b56002b7934","store":"entity/store/f80e10e7-13be-11f1-0a80-0fd5000adca1"}.items():out[k]=t.request(m.MS,path)
          out["currency"]=t.request(m.MS,"entity/currency/3c67e3a6-f25d-11ee-0a80-0c6f000a027f");out["rate"]={"currency":m.meta(out["currency"])}
          out["states"]=t.request(m.MS,"entity/customerorder/metadata").get("states",[])
          assert out["store"]["name"]=="Киргизия WB FBO"
          flt="organization="+norm(out["organization"])+";agent="+norm(out["agent"])+";store="+norm(out["store"])
          out["duplicates"]=[]
          for typ in ("customerorder","demand","salesreturn"):
           for d in rows("entity/"+typ,{"filter":flt+";moment>=2026-11-01 00:00:00"}):
            if any(n in d.get("name","")+" "+d.get("description","") for n in inp["report_ids"]) or inp["comment"] in d.get("description",""):out["duplicates"].append({"type":typ,**d})
          save()
          wanted=set(inp["sales"])|set(inp["returns"])
          def product(a):
           rt=ReadOnly();rw=m.Worker(rt,None,{})
           return a,rw.ms_rows("entity/product",{"filter":"article="+a+";archived=false"})
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
           for a,ps in pool.map(product,sorted(wanted)):out["products"][a]=ps
          save()
          bulk=rows("report/stock/all",{"filter":"store="+norm(out["store"])+";stockMode=all;quantityMode=all"})
          byid={norm(r):r for r in bulk}
          for a,ps in out["products"].items():out["stock"][a]=[byid[norm(ps[0])]] if len(ps)==1 and norm(ps[0]) in byid else []
          out["stock_exceptions"]=[]
          for a,q in inp["sales"].items():
           ss=out["stock"][a];s=ss[0] if len(ss)==1 else {}
           if s.get("stock",0)<q or s.get("quantity",s.get("stock",0))<q or s.get("price",0)<=0:out["stock_exceptions"].append({"article":a,"wanted":q,"stock":s})
          for a in inp["returns"]:
           ss=out["stock"][a]
           if len(ss)==1 and ss[0].get("price",0)>0:out["return_costs"][a]={"unit_kopecks":ss[0]["price"],"source":"current FBO stock","at":m.now()}
          save()
          for d in rows("entity/demand",{"filter":flt+";moment>=2026-01-01 00:00:00","order":"moment,desc"}):
           if set(out["basis"])==set(inp["returns"]) and set(out["return_costs"])==set(inp["returns"]):break
           if not d.get("applicable"):continue
           if any(rid in d.get("name","")+" "+d.get("description","") for rid in inp["report_ids"]):continue
           ps=positions("demand",d["id"]);cap=collections.Counter()
           for p in ps:
            a=(p["assortment"].get("article") or "").strip().casefold()
            if a in inp["returns"] and a not in out["basis"]:cap[a]+=p["quantity"]
           if not cap:continue
           detail=t.request(m.MS,"entity/demand/"+d["id"]);used=collections.Counter()
           for ref in detail.get("returns",[]):
            r=t.request(m.MS,norm(ref)[len(m.MS):])
            if not r.get("applicable"):continue
            for p in positions("salesreturn",r["id"]):used[(p["assortment"].get("article") or "").strip().casefold()]+=p["quantity"]
           for a,q in cap.items():
            if q-used[a]>=inp["returns"][a]:out["basis"][a]={"id":d["id"],"name":d["name"],"moment":d["moment"],"capacity":q,"returned":used[a]}
           for p in positions("demand",d["id"],True):
            a=(p["assortment"].get("article") or "").strip().casefold();cost=p.get("stock",{}).get("cost") or 0
            if a in cap and a not in out["return_costs"] and cost>0:out["return_costs"][a]={"unit_kopecks":str(Decimal(str(cost))/Decimal(str(p["quantity"]))),"source":"historical demand "+d["name"],"moment":d["moment"]}
           save()
          out["CK"]={};out["CK_RUB"]={}
          import datetime as dt,urllib.request,xml.etree.ElementTree as ET
          from decimal import ROUND_HALF_UP
          today=dt.datetime.now(dt.timezone(dt.timedelta(hours=3))).date()
          url="https://www.cbr.ru/scripts/XML_daily.asp?date_req="+today.strftime("%d/%m/%Y")
          with urllib.request.urlopen(url,timeout=45) as response:fxroot=ET.fromstring(response.read())
          val=next(v for v in fxroot.findall("Valute") if v.findtext("CharCode")=="KGS")
          fx={"nominal":val.findtext("Nominal"),"rub":val.findtext("Value").replace(",","."),"date":fxroot.attrib["Date"],"url":url}
          assert dt.datetime.strptime(fx["date"],"%d.%m.%Y").date()<=today
          out["fx"]=fx;out["prepared_on"]=today.isoformat()
          exact_factor=Decimal(fx["nominal"])/Decimal(fx["rub"])
          out["comment_factor"]=str(exact_factor.quantize(Decimal(".01"),rounding=ROUND_HALF_UP))
          for a,cost in out["return_costs"].items():
           rub=Decimal(str(cost["unit_kopecks"]))/100
           if a=="4-furpanama-white":rub=Decimal(201)
           assert rub>0
           out["CK_RUB"][a]=int(rub.to_integral_value(rounding=ROUND_FLOOR))
           out["CK"][a]=int((rub*exact_factor).to_integral_value(rounding=ROUND_FLOOR))
          out["source_complete"]=inp["source_complete"]
          out["missing_basis"]=sorted(set(inp["returns"])-set(out["basis"]))
          out["missing_costs"]=sorted(set(inp["returns"])-set(out["CK"]))
          
          out["status"]="prepared";out["completed_at"]=m.now();save()
          print("Read-only preflight finished; private results saved.")

# Recheck complete source and live accounting 2026-11-11.

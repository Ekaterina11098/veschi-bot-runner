name: Recover explicit China price reply 83
on:
  push:
    branches: [china-price-83-recovery-20261023]
    paths: [.github/workflows/china-price-83-recovery.yml]
permissions:
  contents: read
  actions: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/china_price_83_recovery.mjs

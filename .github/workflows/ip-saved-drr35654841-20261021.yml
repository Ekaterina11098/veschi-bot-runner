name: Saved campaign DRR reconciliation, no sources
on:
  push:
    branches: [ip-saved-drr35654841-20261021]
    paths: ['.github/workflows/ip-saved-drr35654841-20261021.yml']
permissions: {contents: write}
jobs:
  saved:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 2f798a9509b72030d6fb5ec68fb915c5d216c31b
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r private-source/requirements.txt cryptography==46.0.2 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - run: python scripts/saved_drr35654841_20261021.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Preserve encrypted saved report
        if: always()
        run: |
          mkdir -p recovery-output/advertising
          cp "$RUNNER_TEMP/stock-deploy-proof/saved-noorders.aes.json" "recovery-output/advertising/saved-noorders-${{ github.run_id }}.aes.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-output/advertising/saved-noorders-*.aes.json
          git diff --cached --quiet || git commit -m "Preserve encrypted exact retained DRR reconciliation"
          git push origin HEAD:ip-saved-drr35654841-20261021

name: Owner read-only MS scarf20 document audit22Oct
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-scarf20-ms-audit-20261022.yml']
permissions:
  contents: read
concurrency:
  group: bot-stock
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: ad2977d37a675ef92137cfe6a5b655200b1a65c2
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv==1.1.1 aiogram==3.22.0 simplejson==4.2.0 'psycopg[binary]==3.2.9' cryptography > "$RUNNER_TEMP/read-install.log" 2>&1
      - name: Read one article warehouse documents only
        env:
          PYTHONPATH: ${{ github.workspace }}/private-source:${{ github.workspace }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: python owner_scarf20_audit_20261022.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-scarf20-ms-audit
          path: ${{ runner.temp }}/stock-deploy-proof
          retention-days: 30

name: Owner Panama campaign read only 3Nov
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-panama-read3.yml']
permissions: {contents: read}
jobs:
  read:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - run: |
          mkdir -p scripts
          curl --fail --location --retry 2 --max-time 60 https://raw.githubusercontent.com/Ekaterina11098/veschi-bot-runner/3e274a5b76ce819e33ad4983f366560da390d250/scripts/china_cloud_cost_control.py -o scripts/china_cloud_cost_control.py
          python -m pip install requests==2.32.5
      - name: Bounded read of exactly two Panama SKUs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import os,time,requests
          from china_cloud_cost_control import Cache,WB,validate_identity,stamp
          c=Cache();w=WB();key='china_agent:owner_panama41325622_read:2026-11-03:v1'
          if c.get(key):raise SystemExit('Existing immutable read; no repeat')
          validate_identity(c,w)
          out=dict(observed_at=stamp(),status='partial',wb_writes=0,telegram_calls=0,errors={})
          def read(name,url,method='GET',body=None):
           try:
            time.sleep(1.5)
            r=requests.request(method,url,headers={'Authorization':w.token},json=body,timeout=45)
            if not r.ok:raise RuntimeError('HTTP '+str(r.status_code))
            out[name]=r.json()
           except Exception as e:out['errors'][name]=str(e)
          read('campaign','https://advert-api.wildberries.ru/api/advert/v2/adverts?ids=41325622')
          read('budget','https://advert-api.wildberries.ru/api/advert/v2/budget','POST',{'advertIds':[41325622]})
          read('minimums','https://advert-api.wildberries.ru/api/advert/v1/bids/min','POST',{'advert_id':41325622,'nm_ids':[1535337780,1535337770],'payment_type':'cpc','placement_types':['search']})
          read('config','https://advert-api.wildberries.ru/api/advert/v1/config')
          read('published_stock','https://marketplace-api.wildberries.ru/api/v3/stocks/2126188','POST',{'chrtIds':[2381216383,2381216373]})
          for nm in [1535337780,1535337770]:
           read('price_'+str(nm),'https://discounts-prices-api.wildberries.ru/api/v2/list/goods/filter?limit=1&filterNmID='+str(nm))
          out['completed_at']=stamp();out['status']='complete' if not out['errors'] else 'partial'
          c.create(key,out)
          print(out['status'])
          
          PY

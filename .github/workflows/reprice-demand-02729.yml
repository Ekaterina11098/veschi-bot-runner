name: Verify and restore requested demand pricing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reprice-demand-02729.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bot-stock-and-commands
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact document cost and restore zero prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: python scripts/reprice_demand_02729.py

name: FBO access check (read only)
on:
  push:
    branches: [verify/fbo-stock-2026-10-13]
    paths: ['.github/workflows/fbo-access-check.yml']
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 9872c8d3678f80af3ecb41f843c110990eb0af58
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv aiogram > "$RUNNER_TEMP/deps.log" 2>&1
      - name: Read FBO access without stock writes or business data logging
        env:
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          WB_FINANCE_TOKEN_1: ${{ secrets.WB_FINANCE_TOKEN_1 }}
          WB_FINANCE_TOKEN_2: ${{ secrets.WB_FINANCE_TOKEN_2 }}
          WB_FINANCE_TOKEN_3: ${{ secrets.WB_FINANCE_TOKEN_3 }}
        run: |
          python -u - <<'PY'
          import time
          import tg_agent_new as g
          values = {}
          g._CACHE_GET = values.get
          g._CACHE_SET = lambda k, v, ttl: values.update({k: v})
          g.RUN_DEADLINE = time.monotonic() + 22 * 60
          failures = []
          for index, token in enumerate(g.cabinet_tokens(), 1):
              try:
                  cards = g.get_real_wb_cards_and_scores(token)
                  if not cards:
                      raise RuntimeError('incomplete card catalog')
                  for attempt in range(3):
                      try:
                          result = g.load_cabinet_fbo(token, cards)
                          print(f'Cabinet {index}: full FBO loader verified, matched report to current cards')
                          break
                      except g.RateLimited as exc:
                          if attempt == 2 or exc.wait > 1200:
                              raise
                          print(f'Cabinet {index}: respecting WB permitted retry interval')
                          until = time.monotonic() + exc.wait
                          while time.monotonic() < until:
                              g.check_run_budget()
                              time.sleep(min(30, until - time.monotonic()))
                  if any('_fbo_quantity' not in c or '_fbo_observed_at' not in c for c in cards):
                      raise RuntimeError('FBO coverage incomplete')
              except Exception as exc:
                  failures.append(index)
                  print(f'Cabinet {index}: FBO loader failed ({type(exc).__name__}: {exc})')
          if failures:
              raise SystemExit(1)
          PY

name: Verify daily source repair and preserve prior diagnostic ciphertext
on:
  push:
    branches: [prepare-daily-source-repair-20261017]
    paths: ['.github/workflows/advertising-daily-cache-diagnostic.yml']
permissions: {contents: write}
concurrency:
  group: advertising-retained-cache-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 6eb5f990aecfa1a92909169ffd76f05ac6da469d
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install simplejson==3.20.2 requests==2.32.5 python-dotenv cryptography==46.0.2 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Compile prepared repair only, no production credentials
        run: |
          python -m py_compile advertising_source_owner.py advertising_daily_owner.py
          python -m unittest test_advertising_daily_repair -v
          cd private-source
          python -m unittest discover -s tests -p 'test_ip_daily_recommendations.py'
          python -m unittest discover -s tests -p 'test_ip_delivery_boundary.py'
      - name: Measure only the remaining retained funnel cache, GET only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python advertising_daily_cache_diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-funnel-diagnostic
          path: ${{ runner.temp }}/stock-deploy-proof/*.aes.json
          retention-days: 90
      - name: Preserve owner cipher only
        if: always()
        run: |
          mkdir -p recovery-output/advertising
          cp "$RUNNER_TEMP/stock-deploy-proof/daily-funnel-diagnostic.aes.json" "recovery-output/advertising/daily-funnel-diagnostic-${{ github.run_id }}.aes.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-output/advertising/
          git diff --cached --quiet || git commit -m "Preserve owner cipher for one retained funnel-cache measurement"
          git push origin HEAD:prepare-daily-source-repair-20261017

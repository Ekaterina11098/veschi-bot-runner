name: Finalize approved weekly chain
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-approved-weekly-chain.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize explicitly approved documents
        env:
          WEEKLY_REVIEW_ROOT: 'weekly_report_review:133:'
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/finalize_approved_weekly_chain.py

# Preserve existing tax settings on approved price reset.

name: Saved financial risk preview, no source collection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/advertising-owner-risk-preview.yml']
permissions:
  contents: write
concurrency:
  group: advertising-owner-preparation
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 8bea1186491b2182dc339a6d5ca16ad9ce879760
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install simplejson==3.20.2 requests==2.32.5 python-dotenv cryptography==46.0.2 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Bounded MPStats reads, no WB or Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_EGRESS_OPTIMIZED: 'false'
          BUDGET_REASSESSMENT: 'false'
          FOCUS_FOLLOWUP: 'true'
        run: python advertising_risk_preview_owner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-advertising-risk-preview
          path: ${{ runner.temp }}/stock-deploy-proof/*.aes.json
          retention-days: 90
      - name: Independent ciphertext
        if: always()
        run: |
          mkdir -p recovery-output/advertising
          cp "$RUNNER_TEMP/stock-deploy-proof/advertising-risk-preview.aes.json" "recovery-output/advertising/risk-preview-${{ github.run_id }}.aes.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-output/advertising/
          git commit -m "Preserve encrypted IP source readback receipts"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
          done
          exit 1


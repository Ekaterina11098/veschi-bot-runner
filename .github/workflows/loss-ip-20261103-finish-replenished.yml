name: Finish authorized loss demand after replenishment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/loss-ip-20261103-finish-replenished.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loss-ip-20261103
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Create authorized chain and verify zero prices
        shell: python
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import sys,collections
          sys.path.insert(0,'scripts')
          import fbs_document_chain as m
          ROOT='loss_report:ip:20261103:'
          class Read(m.Transport):
           def request(self,base,path,method='GET',body=None,params=None):
            if base==m.MS and method!='GET':raise m.Stop('Read only preflight')
            return super().request(base,path,method,body,params)
          t=Read();db=m.Cache(t);w=m.Worker(t,db,{})
          inp=db.get(ROOT+'input:v1');assert inp['authorized'] and inp['units']==sum(inp['sales'].values())
          def norm(x):return m.href(x).split('?')[0]
          prep={'at':m.now(),'status':'reading'}
          for k,kind,uid in [('organization','organization','61c199c8-fd78-11ee-0a80-1479002a9f95'),('agent','counterparty','4cc3ffa2-fd7c-11ee-0a80-0b56002b7934'),('store','store','fcf31c2d-07ac-11ef-0a80-014d00489826'),('currency','currency','3c67e3a6-f25d-11ee-0a80-0c6f000a027f')]:
           prep[k]=t.request(m.MS,'entity/'+kind+'/'+uid)
          allp=w.ms_rows('entity/product',{'filter':'archived=false'})
          mapping=db.get(ROOT+'approved_mapping:v1');resolved=collections.Counter();products={};audit=[];exceptions=[]
          for a,q in inp['sales'].items():
           rule=mapping.get(a,{'article':a})
           if 'code' in rule:candidates=[p for p in allp if p.get('code','').replace(' ','').casefold()==rule['code'].replace(' ','').casefold()]
           else:candidates=[p for p in allp if (p.get('article') or '').strip().casefold()==rule['article'].strip().casefold()]
           if len(candidates)!=1:
            exceptions.append({'article':a,'matches':len(candidates)});continue
           p=candidates[0];target=(p.get('article') or '').strip().casefold();assert target
           resolved[target]+=q
           if target in products:assert products[target][0]['id']==p['id']
           products[target]=[p];audit.append({'source_article':a,'target_article':p['article'],'code':p['code'],'product_id':p['id'],'quantity':q})
          prep['matching_exceptions']=exceptions;prep['mapping_audit']=audit
          if exceptions:
           prep['status']='matching_blocked';db.put(ROOT+'approved_preflight:v1',prep);raise m.Stop('Approved product mapping is not unique')
          assert sum(resolved.values())==inp['units']
          inp={**inp,'sales':dict(resolved),'mapping_approved':True,'mapping_audit':audit};db.put(ROOT+'resolved_input:v1',inp)
          prep['products']=dict(products)
          prep['matching_exceptions']=[{'article':a,'matches':len(products[a])} for a in inp['sales'] if len(products[a])!=1]
          bulk=w.ms_rows('report/stock/all',{'filter':'store='+norm(prep['store']),'stockMode':'all','quantityMode':'all'})
          byid={norm(r):r for r in bulk};prep['stocks']={};prep['stock_exceptions']=[]
          for a,q in inp['sales'].items():
           if len(products[a])!=1:continue
           p=products[a][0];s=byid.get(norm(p),{});prep['stocks'][a]=s
           if s.get('stock',0)<q or s.get('quantity',0)<q or s.get('price',0)<=0:prep['stock_exceptions'].append({'article':p['article'],'needed':q,'stock':s.get('stock',0),'available':s.get('quantity',0),'cost_kopecks':s.get('price',0)})
          prep['existing_orders']=w.ms_rows('entity/customerorder',{'filter':'name='+inp['name']})
          prep['existing_demands']=w.ms_rows('entity/demand',{'filter':'externalCode=loss-ip-20261103-demand'})
          prep['states']=t.request(m.MS,'entity/customerorder/metadata').get('states',[])
          prep['status']='read_verified';prep['completed_at']=m.now();db.put(ROOT+'approved_preflight:v1',prep)
          print('Private preflight saved. No document writes performed.')
          import sys,collections,datetime,time
          from decimal import Decimal,ROUND_FLOOR
          sys.path.insert(0,'scripts')
          import fbs_document_chain as m
          ROOT='loss_report:ip:20261103:';PREFIX='loss-ip-20261103-'
          class Scoped(m.Transport):
           def request(self,base,path,method='GET',body=None,params=None):
            if base==m.MS and method!='GET':
             permitted=(method=='POST' and path in ('entity/customerorder','entity/demand')) or (method=='PUT' and path==getattr(self,'demand_path',None) and set(body or {})=={'description'})
             if not permitted:raise m.Stop('Write outside authorized loss documents')
            return super().request(base,path,method,body,params)
          t=Scoped();db=m.Cache(t);w=m.Worker(t,db,{})
          inp=db.get(ROOT+'resolved_input:v1');prep=db.get(ROOT+'approved_preflight:v1')
          assert inp['mapping_approved'] is True and inp['mapping_audit']==prep['mapping_audit']
          assert (datetime.datetime.now(datetime.timezone.utc)-m.stamp(prep['completed_at'])).total_seconds()<900
          assert inp['authorized'] and inp['units']==sum(inp['sales'].values()) and 'wh-service-podmena' not in inp['sales']
          assert prep['status']=='read_verified' and not prep['matching_exceptions']
          assert datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=3))).date().isoformat()=='2026-11-03'
          def norm(x):return m.href(x).split('?')[0]
          def rows(path,params=None):return w.ms_rows(path,params)
          def positions(kind,uid,stock=False):
           path='entity/'+kind+'/'+uid+'/positions';out=[];offset=0
           while True:
            args={'expand':'assortment','limit':50,'offset':offset}
            if stock:args['fields']='stock'
            page=t.request(m.MS,path,params=args);batch=page['rows'];out+=batch;offset+=len(batch)
            if offset==page['meta']['size']:return out
            if not batch or offset>page['meta']['size']:raise m.Stop('Incomplete positions')
          def counts(ps):
           c=collections.Counter()
           for p in ps:c[(p['assortment'].get('article') or '').strip().casefold()]+=p['quantity']
           return dict(c)
          common={k:m.meta(prep[k]) for k in ('organization','agent','store')}
          common.update(applicable=True,vatEnabled=True,vatIncluded=True,rate={'currency':m.meta(prep['currency'])})
          assert prep['store']['name']=='Склад WB FBO' and prep['currency']['name']=='руб'
          products=prep['products'];wanted=inp['sales']
          for a in wanted:
           assert len(products[a])==1 and not products[a][0].get('archived')
           assert not products[a][0].get('variantsCount',0)
          result=db.get(ROOT+'documents:v1') or {'status':'preflight','started_at':m.now(),'documents':[]}
          def save():db.put(ROOT+'documents:v1',result)
          def scope(d):return all(norm(d.get(k,{}))==norm(common[k]) for k in ('organization','agent','store')) and norm(d.get('rate',{}).get('currency',{}))==norm(prep['currency'])
          named=rows('entity/customerorder',{'filter':'name='+inp['name']});assert len(named)<=1
          if named:assert named[0].get('externalCode')==PREFIX+'order','Existing order requires reconciliation'
          existing=rows('entity/demand',{'filter':'externalCode='+PREFIX+'demand'});assert len(existing)<=1
          if not existing:
           bulk=rows('report/stock/all',{'filter':'store='+norm(prep['store']),'stockMode':'all','quantityMode':'all'});byid={norm(r):r for r in bulk};bad=[]
           for a,q in wanted.items():
            s=byid.get(norm(products[a][0]),{})
            if s.get('stock',0)<q or s.get('quantity',0)<q or s.get('price',0)<=0:bad.append({'article':products[a][0]['article'],'needed':q,'stock':s.get('stock',0),'available':s.get('quantity',0),'price':s.get('price',0)})
           result['stock_exceptions']=bad;result['fresh_stock_at']=m.now();save()
          states=[s for s in prep['states'] if s['name']=='Доставлен'];assert len(states)==1
          ps=[{'quantity':q,'price':0,'discount':0,'vat':0,'assortment':m.meta(products[a][0])} for a,q in wanted.items()]
          def ensure(kind,tag,body):
           ext=PREFIX+tag;found=rows('entity/'+kind,{'filter':'externalCode='+ext});assert len(found)<=1
           if found:d=found[0]
           else:
            if result.get('pending_write'):raise m.Stop('Uncertain write requires reconciliation')
            result['pending_write']={'kind':kind,'externalCode':ext,'at':m.now()};result['status']='creating';save()
            try:d=t.request(m.MS,'entity/'+kind,'POST',{**body,'externalCode':ext})
            except Exception:
             result['status']='write_outcome_requires_reconciliation';save();raise
            result['pending_write']=None
           actual=positions(kind,d['id'])
           assert scope(d) and d['applicable'] is True and d['sum']==0 and counts(actual)==wanted and all(p['price']==0 for p in actual)
           ref={'type':kind,'id':d['id'],'name':d['name']}
           if ref not in result['documents']:result['documents'].append(ref)
           save();return d
          order=ensure('customerorder','order',{**common,'name':inp['name'],'description':inp['order_comment'],'state':m.meta(states[0]),'positions':ps})
          for ref in t.request(m.MS,'entity/customerorder/'+order['id']).get('demands',[]):
           d=t.request(m.MS,norm(ref)[len(m.MS):]);assert d.get('externalCode')==PREFIX+'demand'
          if not existing and result.get('stock_exceptions'):
           result.update(status='order_created_waiting_stock',order_verified_at=m.now(),order_quantity=inp['units'],order_positions=len(ps),order_comment=inp['order_comment'],all_prices_zero=True)
           save();print('Order created and verified; demand held for private stock exceptions.');sys.exit(0)
          demand=ensure('demand','demand',{**common,'description':inp['order_comment'],'customerOrder':m.meta(order),'positions':ps})
          t.demand_path='entity/demand/'+demand['id']
          proof=[]
          for attempt in range(3):
           proof=[];bad=[]
           for p in positions('demand',demand['id'],True):
            q=Decimal(str(p['quantity']));cost=Decimal(str(p.get('stock',{}).get('cost') or 0));unit=(cost/q).to_integral_value(rounding=ROUND_FLOOR)
            if unit<=0:bad.append(p['assortment']['article'])
            proof.append({'article':p['assortment']['article'],'quantity':str(q),'actual_cost_kopecks':str(cost),'unit_kopecks':str(unit)})
           if not bad:break
           time.sleep(2)
          result['valuation_positions']=proof;result['valuation_exceptions']=bad;save()
          if bad:raise m.Stop('Actual valuation has exceptions; prices remain zero')
          total=sum(Decimal(p['unit_kopecks'])*Decimal(p['quantity']) for p in proof)/100
          comment='Опт: '+format(total,',.2f').replace(',',' ').replace('.',',')+' руб.'
          t.request(m.MS,t.demand_path,'PUT',{'description':comment})
          checks=[]
          for ref in result['documents']:
           kind=ref['type'];d=t.request(m.MS,'entity/'+kind+'/'+ref['id']);actual=positions(kind,d['id'])
           assert scope(d) and d['applicable'] is True and d['sum']==0 and counts(actual)==wanted and all(p['price']==0 for p in actual)
           assert len(rows('entity/'+kind,{'filter':'externalCode='+d['externalCode']}))==1
           if kind=='customerorder':assert d['name']==inp['name'] and d['description']==inp['order_comment'] and norm(d['state'])==norm(states[0]) and [norm(x) for x in d.get('demands',[])]==[norm(demand)]
           else:assert d['description']==comment and norm(d['customerOrder'])==norm(order)
           checks.append({**ref,'comment':d['description'],'posted':True,'all_prices_zero':True,'quantity':sum(counts(actual).values()),'positions':len(actual)})
          assert len(checks)==2 and len(rows('entity/customerorder',{'filter':'name='+inp['name']}))==1
          result.update(status='complete',completed_at=m.now(),checks=checks,wholesale_rub=str(total),demand_comment=comment,excluded_units=inp['excluded_units'],source_sha256=inp['source_sha256'])
          save();print('Authorized loss documents created and verified; results private.')
          

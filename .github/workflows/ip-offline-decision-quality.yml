name: IP offline decision quality
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ip-offline-decision-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ip-offline-decision-quality
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: ddeb4a4e1a0bc8bddefd9371e6060571e7d71c8c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: revised
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 755b69c266ad39beafd334e60aa900c07814cae8
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 99ab899dd306835642d4b33ef8bb6254644ea17c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: prepared-storage
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies only
        run: pip install simplejson -r revised/requirements.txt > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Identical baseline inputs without source credentials
        run: |
          cp revised/tests/test_ip_offline_decision_quality.py baseline/tests/
          cp revised/tests/ip_offline_decision_comparison.py baseline/tests/
          cd baseline
          python tests/ip_offline_decision_comparison.py "$RUNNER_TEMP/baseline.json"
      - name: Revised offline control cases and same-input comparison
        working-directory: revised
        run: |
          python -m unittest discover -s tests -p test_ip_offline_decision_quality.py -v
          python tests/ip_offline_decision_comparison.py "$RUNNER_TEMP/revised.json"
      - name: Existing decision, lifecycle and experiment regressions with network disabled
        working-directory: revised
        run: |
          python - <<'PY'
          import socket,unittest,sys
          from unittest.mock import patch
          suite=unittest.TestSuite()
          loader=unittest.TestLoader()
          for pattern in ('test_ip_daily_recommendations.py','test_advertising_experiments.py','test_experiment_data_quality.py','test_experiment_journal_coverage.py','test_profit_stability.py'):
              suite.addTests(loader.discover('tests',pattern=pattern))
          with patch.object(socket.socket,'connect',side_effect=AssertionError('External network forbidden')):
              result=unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Compatibility with prepared PR16 readers without modifying PR16
        working-directory: revised
        run: |
          python - <<'PY'
          import sys,socket,gzip,base64,hashlib
          from pathlib import Path
          from unittest.mock import patch
          import analytics
          from analytics import ip_daily_recommendations as d
          sys.path.insert(0,'tests')
          import test_ip_offline_decision_quality as q
          analytics.__path__=list(analytics.__path__)+[str(Path('../prepared-storage/analytics').resolve())]
          from analytics.storage_archive import canonical
          from analytics.storage_working_reader import CompatibleRead
          p,c,r,f=q.inputs();p['correction_model']=q.model()
          value=dict(p=p,c=c,r=r,f=f)
          raw=canonical(value);digest=hashlib.sha256(raw).hexdigest()
          gzip_value=dict(storage_format='veschi-json-gzip-v1',sha256=digest,data=base64.b64encode(gzip.compress(raw)).decode())
          ref=dict(storage_format='veschi-json-ref-v1',sha256=digest)
          results=[]
          with patch.object(socket.socket,'connect',side_effect=AssertionError('External network forbidden')):
              for stored in (value,gzip_value,ref):
                  reader=CompatibleRead(lambda table,params:[dict(id=1,payload=stored)],resolver=lambda key:value)
                  v=reader('analytics_snapshots',{'select':'*'})[0]['payload']
                  actions=d._pair_actions_one(v['c'],v['p'],v['r'],v['f'],{},q.NOW)
                  results.append([(a['kind'],a['correction']['target']) for a in actions])
          assert results==[[('bid_test',4.4)]]*3,results
          print('Prepared reader plain/gzip/reference: identical bounded bid recommendation; no source calls')
          PY
      - name: Comparison evidence
        if: always()
        run: |
          cat "$RUNNER_TEMP/baseline.json" || true
          cat "$RUNNER_TEMP/revised.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-decision-comparison
          path: ${{ runner.temp }}/*.json
          retention-days: 7

name: WB and Ozon FBS document chains
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fbs-document-chain.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: Status, read-only preview, one-time activation baseline, or gated execution
        type: choice
        options: [status, preview, run]
        default: status
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: read
concurrency:
  group: fbs-document-chain-production
  cancel-in-progress: false
jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
          filter: blob:none
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Verify retry and duplicate-protection tests
        run: |
          python -m unittest discover -s scripts -p test_fbs_read_retries.py -v
          python -m unittest discover -s scripts -p test_fbs_picking_scope.py -v
      - name: Execute selected mode with backend-only secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MODE: ${{ inputs.mode || 'run' }}
        run: |
          if [ "$MODE" != "run" ]; then
            exec python scripts/fbs_wb_cabinets.py "$MODE"
          fi
          for attempt in 1 2 3; do
            if python scripts/fbs_wb_cabinets.py "$MODE"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 20))"
            fi
          done
          exit 1
      - name: Process new Ozon act delivery transitions independently
        if: ${{ always() && steps.python.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'run') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: python scripts/fbs_ozon_chain.py run
      - name: Verify and restore comments on completed WB and Ozon chains
        if: ${{ always() && steps.python.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'run') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: python scripts/fbs_comment_audit.py

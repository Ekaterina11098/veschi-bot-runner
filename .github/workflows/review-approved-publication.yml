name: Publish only confirmed Telegram review answers
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/review-approved-publication.yml']
  schedule:
    - cron: '7-57/5 * * * *'
permissions:
  contents: read
concurrency:
  group: review-approved-publication
  cancel-in-progress: false
jobs:
  approved-replies:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 73ecafcd12d9c38b194eaf289b38bfb1e39e31fd
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'psycopg[binary]==3.2.10' cryptography==46.0.2 requests==2.32.5 python-dotenv==1.1.1
      - name: Validate exact approvals, all cabinets and no duplicate POST
        run: |
          python -m unittest test_review_approved_worker.py test_review_auto_five_star.py
          python -m unittest discover -s review-approval-preparation -p test_review_telegram.py
          python -m unittest test_review_autonomy.py test_review_cleanup.py test_review_reliability.py
          node review-approval-preparation/test_review_inbox_route.mjs
          python -m py_compile review_approved_worker.py
      - name: Resume only post-cutover authenticated Telegram approvals
        env:
          PYTHONPATH: ${{ github.workspace }}/private-source
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          WB_FEEDBACK_TOKEN: ${{ secrets.WB_FEEDBACK_TOKEN }}
        run: python review_approved_worker.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-approved-publication-receipts
          path: ${{ runner.temp }}/stock-deploy-proof
          retention-days: 90

# Durable inbox, idempotent Telegram UI repair and actual WB rate headers; no legacy queues.


name: China morning delivery diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-morning-diagnose-20261016.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv > "$RUNNER_TEMP/install.log" 2>&1
      - name: Read exact morning job and isolated audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import json
          from advertising_agent.notify import db,cache_get
          from datetime import datetime,date,timedelta
          from zoneinfo import ZoneInfo
          state=cache_get('china_agent:demand_watch:v1') or {}
          result=[]
          for nm,e in state.get('price_history',{}).items():
              change=e.get('last_price_change') or e.get('increase') or {}
              stamp=str(change.get('detected_at',''))
              if '2026-10-12' <= stamp[:10] <= '2026-10-15':
                  result.append(dict(nm_id=nm,article=e.get('article'),change={k:v for k,v in change.items() if k!='baseline_group'},increase={k:v for k,v in (e.get('increase') or {}).items() if k!='baseline_group'}))
          print('FOUR_DAY_CHANGES',json.dumps(result,ensure_ascii=False))
          rows=db('GET','business_agent_jobs',params={'agent_id':'eq.china','created_at':'gte.2026-10-12T00:00:00+03:00','select':'id,request_text,created_at,answer','order':'id.asc','limit':100}) or []
          print('PRICE_JOURNAL_NOTICES',json.dumps([r for r in rows if any(s in (r.get('answer') or '') for s in ('повышение цены замечено','цена повышена','изменения цен'))],ensure_ascii=False))
          PY

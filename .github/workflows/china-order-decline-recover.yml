name: Recover China questions70and71 from saved evidence
on:
  push:
    branches: [china-order-decline-recover-20261023]
    paths: ['.github/workflows/china-order-decline-recover.yml']
permissions:
  contents: read
concurrency:
  group: china-question-recovery-70-71
  cancel-in-progress: false
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify startup fix and answer scope without credentials
        run: |
          python scripts/install_china_dialog.py
          python scripts/install_china_buyout.py --root source
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_loss_ads.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_order_decline.py
      - run: pip install requests==2.32.5 Pillow==12.3.0
      - name: Process exact pending questions with shared leases and at-most-once receipts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          PYTHONPATH: scripts:source
        run: |
          python - <<'PY'
          import json
          from conversion_watches import runtime,saved_network_guard
          w=runtime();w.collect=None
          w.bot_check()
          with saved_network_guard():
            for job in [70,71]:
              print(json.dumps(dict(job_id=job,status=w.question(job),wb_writes=0)))
          PY

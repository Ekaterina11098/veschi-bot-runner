name: Independent protected recovery copy from existing ciphertext only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recovery-independent-copy.yml']
permissions:
  contents: read
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 99ab899dd306835642d4b33ef8bb6254644ea17c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: helper
      - uses: actions/checkout@v4
        with:
          ref: 88e147f344f7a7492932c6eb812d7d02ee76e224
          persist-credentials: false
          path: runner
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography > "$RUNNER_TEMP/install.log" 2>&1
      - uses: actions/download-artifact@v4
        with:
          name: fixed-point-encrypted-part-00
          run-id: 38627314223
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/independent-copy/parts
      - uses: actions/download-artifact@v4
        with:
          name: fixed-point-encrypted-part-01
          run-id: 38627314223
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/independent-copy/parts
      - uses: actions/download-artifact@v4
        with:
          name: fixed-point-encrypted-part-02
          run-id: 38627314223
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/independent-copy/parts
      - uses: actions/download-artifact@v4
        with:
          name: owner-encrypted-consistent-point
          run-id: 38592132657
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/independent-copy/point
      - uses: actions/download-artifact@v4
        with:
          name: owner-encrypted-portable-vault
          run-id: 38605166518
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/independent-copy/vault
      - uses: actions/download-artifact@v4
        with:
          name: offline-restore-receiver
          run-id: 38588520250
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/independent-copy/receiver
      - uses: actions/download-artifact@v4
        with:
          name: owner-encrypted-external-recovery-kit
          run-id: 38682827798
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/independent-copy/external

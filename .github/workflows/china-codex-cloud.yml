name: China persistent cloud Codex conversation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-codex-cloud.yml']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: china-persistent-codex-session
  cancel-in-progress: false
jobs:
  conversation:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e2e6482db05518d27b90513fa57cc46b2536ef86
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify scope, deduplication, profit broker and cache transport
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p test_china_codex_cloud.py
      - run: pip install openai==3.42.1 --quiet
      - name: Continue persistent work conversation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -u scripts/china_codex_cloud.py --bootstrap
          python -u scripts/china_codex_cloud.py

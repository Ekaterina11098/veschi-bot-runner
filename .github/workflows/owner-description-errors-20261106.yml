name: Verify description update errors
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-description-errors-20261106.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: 55b20385ba58e6f2e8567e112aed0b2ea7e61980, persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Read update errors only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          from owner_description_append_20261106_v2 import Run,ROOT,stamp
          r=Run()
          data=r.read('/content/v2/cards/error/list',{'cursor':{'limit':100},'order':{'ascending':False}})
          r.c.put(ROOT+':update_errors',{'response':data,'observed_at':stamp()})
          print('Private update error report saved; no marketplace writes')
          PY

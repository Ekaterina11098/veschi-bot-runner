name: Apply exact approved bid increase without funding
on:
  push:
    branches: [china-free-analytic-dialog]
    paths: ['.github/workflows/china-approved-bid-raise.yml']
permissions:
  contents: read
concurrency:
  group: bot-business-agent
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: bot-mpstats-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 > /dev/null
      - name: Validate exact bid readback helper offline
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p test_china_ad_rule.py
      - name: Apply exact private human-approved bid then read WB result
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          PYTHONPATH: scripts
        run: python scripts/apply_confirmed_bid_raise.py

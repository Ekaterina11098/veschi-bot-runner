name: Validate owner-authorized automatic five-star policy
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/review-auto-five-star-checks.yml','review_auto_five_star.py','test_review_auto_five_star.py']
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'psycopg[binary]==3.2.10'
      - name: Verify qualification, manual exclusions and duplicate protection
        run: |
          python -m unittest test_review_auto_five_star.py test_review_morning.py test_review_approved_worker.py test_review_autonomy.py test_review_cleanup.py test_review_reliability.py
          python -m unittest discover -s review-approval-preparation -p test_review_telegram.py
          python -m py_compile review_auto_five_star.py review_morning.py review_approved_worker.py
      - name: Verify private policy activation without WB or Telegram calls
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os,sys,hmac,hashlib,json,time,psycopg
          sys.path.insert(0,'review-approval-preparation')
          from review_auto_five_star import CONFIG_KEY,POLICY_VERSION,policy_allows
          from types import SimpleNamespace
          root=os.environ['SUPABASE_SECRET_KEY'].encode()
          pw=hmac.new(root,b'veschi:review-approval-login:20261015:v1',hashlib.sha256).hexdigest()
          with psycopg.connect(host='aws-0-eu-central-1.pooler.supabase.com',port=5432,dbname='postgres',user='review_approval_login_20261015.abxgjoqlddhtcmjcjwxw',password=pw,sslmode='require',autocommit=True,connect_timeout=15) as conn:
              cfg=conn.execute("SELECT payload FROM review_approval.source_cache WHERE cache_key='reviews:telegram-approval:config:v1'").fetchone()[0]
              policy=conn.execute("SELECT payload FROM review_approval.source_cache WHERE cache_key=%s",(CONFIG_KEY,)).fetchone()[0]
              a=SimpleNamespace(owner=str(cfg['owner_id']),chat=str(cfg['chat_id']))
              enabled=[c for c in ('token_1','token_2','token_3') if policy_allows(policy,a,c,time.time())]
              if len(enabled)!=3:raise RuntimeError('Three-cabinet owner policy activation mismatch')
              receipt=dict(status='verified',policy_version=POLICY_VERSION,cabinets=enabled,checked_at=time.time(),run_id=os.getenv('GITHUB_RUN_ID'),wb_writes=0,telegram_sends=0,existing_cards_untouched=True)
              conn.execute("INSERT INTO review_approval.events(id,payload) VALUES(%s,%s) ON CONFLICT(id) DO UPDATE SET payload=EXCLUDED.payload",('automatic-five-star:activation:20261021:v1',json.dumps(receipt)))
          print('Owner policy verified for all three cabinets; no WB or Telegram calls.')
          PY

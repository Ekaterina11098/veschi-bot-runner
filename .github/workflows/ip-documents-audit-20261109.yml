name: Current IP document audit owner request
on:
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: ip-content-documents-owner, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Read current cards only and save protected evidence
        env:
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import os,time,requests,datetime,json
          root='ip_agent:documents_audit:2026-11-09:v1'
          url=os.environ['SUPABASE_URL'].rstrip('/')+'/rest/v1/telegram_api_cache'
          secret=os.environ['SUPABASE_SECRET_KEY'].strip()
          headers={'apikey':secret,'Authorization':'Bearer '+secret,'Prefer':'resolution=merge-duplicates'}
          def save(key,value):
           r=requests.post(url,params={'on_conflict':'cache_key'},headers=headers,json={'cache_key':key,'payload':value,'updated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'expires_at':'2027-11-09T00:00:00Z'},timeout=45);r.raise_for_status()
          def wb(host,path,body=None):
           for attempt in range(3):
            r=requests.request('POST' if body else 'GET','https://'+host+path,headers={'Authorization':os.environ['WB_TOKEN_2'].strip()},json=body,timeout=60)
            if r.status_code==429:
             delay=int(r.headers.get('Retry-After')or r.headers.get('X-Ratelimit-Retry')or 60)
             save(root,{'status':'waiting_429','retry_after':delay,'wb_writes':0})
             if delay>120:raise RuntimeError('Provider cooldown '+str(delay)+'s')
             time.sleep(delay+1);continue
            if not r.ok:raise RuntimeError('WB HTTP '+str(r.status_code))
            return r.json()
           raise RuntimeError('Read retries exhausted')
          try:
           identity=wb('common-api.wildberries.ru','/api/v1/seller-info')
           old=requests.get(url,headers=headers,params={'cache_key':'eq.ip_agent:documents_restore:2026-10-29:v1:approval','select':'payload'},timeout=30);old.raise_for_status()
           if identity.get('sid')!=old.json()[0]['payload']['seller_sid']:raise RuntimeError('Seller identity mismatch')
           cursor={'limit':100};cards={}
           for page in range(40):
            j=wb('content-api.wildberries.ru','/content/v2/get/cards/list',{'settings':{'sort':{'ascending':True},'cursor':cursor,'filter':{'withPhoto':-1}}})
            if not isinstance(j.get('cards'),list)or not isinstance(j.get('cursor'),dict):raise RuntimeError('Incomplete page')
            for c in j['cards']:
             if c['nmID'] in cards:raise RuntimeError('Duplicate page')
             cards[c['nmID']]=c
            save(root+':page:'+str(page),j)
            if int(j['cursor'].get('total',-1))<100:break
            cursor={k:j['cursor'][k]for k in('updatedAt','nmID')};cursor['limit']=100;time.sleep(1)
           else:raise RuntimeError('Page bound')
           items=[]
           for c in cards.values():
            d=c.get('documents')
            items.append({'nm':c['nmID'],'sku':c.get('vendorCode'),'subject':c.get('subjectName'),'documents':d,'composition':[x for x in c.get('characteristics',[])if x.get('name')=='Состав']})
           save(root+':summary',{'items':items,'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat()})
           save(root,{'status':'complete','total':len(cards),'pages':page+1,'completed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'wb_writes':0,'run_id':os.environ['GITHUB_RUN_ID']})
           print('Current IP document audit complete; protected receipt saved.')
          except Exception as e:
           save(root,{'status':'blocked','error':str(e)if isinstance(e,RuntimeError)else type(e).__name__,'wb_writes':0,'run_id':os.environ['GITHUB_RUN_ID']})
           raise SystemExit(1)

name: Apply owner-amended umbrella27 only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-owner-growth-apply27.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-growth-apply27
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python - <<'PY'
          import os,pathlib,urllib.request,concurrent.futures
          root=pathlib.Path('scripts');root.mkdir(exist_ok=True)
          names=['china_owner_umbrella27.py','china_owner_growth_reconcile27.py','china_owner_growth_apply27.py','china_price_apply.py','china_cloud_cost_control.py','china_advertising_plans.py','china_bid_proposals.py','china_loss_control.py']
          def fetch(name):
              root.joinpath(name).write_bytes(urllib.request.urlopen('https://raw.githubusercontent.com/Ekaterina11098/veschi-bot-runner/'+os.environ['GITHUB_SHA']+'/scripts/'+name,timeout=40).read())
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:list(pool.map(fetch,names))
          PY
      - run: pip install requests==2.32.5 > /tmp/dependencies.log 2>&1
      - name: Apply only exact7 owner-approved items and verify WB
        run: PYTHONPATH=scripts python scripts/china_owner_umbrella27.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: disabled

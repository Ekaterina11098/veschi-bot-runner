name: Read IP basic finance detail November 1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/read-ip-finance-basic-20261101.yml']
  workflow_dispatch:
permissions: {}
concurrency:
  group: ip-basic-finance-20261101
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read complete period details into private storage
        shell: python
        env:
          WB_FINANCE_TOKEN_2: ${{ secrets.WB_FINANCE_TOKEN_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import os,json,gzip,time,datetime,urllib.request,urllib.error
          ROOT="weekly_report_review:ip:20261101:finance_basic:"
          URL="https://finance-api.wildberries.ru/api/finance/v1/sales-reports/detailed"
          SB=os.environ["SUPABASE_URL"].rstrip("/")
          def now():return datetime.datetime.now(datetime.timezone.utc).isoformat()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs):raise RuntimeError("Redirect blocked")
          op=urllib.request.build_opener(NoRedirect)
          def put(key,payload):
           h={"apikey":os.environ["SUPABASE_SECRET_KEY"],"Authorization":"Bearer "+os.environ["SUPABASE_SECRET_KEY"],"Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=minimal"}
           data={"cache_key":ROOT+key,"payload":payload,"updated_at":now(),"expires_at":"2099-01-01T00:00:00Z"}
           req=urllib.request.Request(SB+"/rest/v1/telegram_api_cache?on_conflict=cache_key",headers=h,method="POST",data=json.dumps(data).encode())
           with op.open(req,timeout=60) as r:assert r.status in (200,201,204)
          proof={"status":"reading","started_at":now(),"run_id":os.environ["GITHUB_RUN_ID"],"dateFrom":"2026-11-01","dateTo":"2026-11-01","method":"POST sales-reports/detailed","secret_name":"WB_FINANCE_TOKEN_2","chunks":[],"pages":[],"rows":0}
          put("source_proof:v1",proof)
          cursor=0;seen=set();last_request=0
          while True:
           body={"dateFrom":"2026-11-01","dateTo":"2026-11-01","limit":100000,"rrdId":cursor}
           for attempt in range(4):
            time.sleep(max(0,62-(time.monotonic()-last_request)))
            last_request=time.monotonic()
            req=urllib.request.Request(URL,method="POST",data=json.dumps(body).encode(),headers={"Authorization":os.environ["WB_FINANCE_TOKEN_2"],"Content-Type":"application/json","Accept-Encoding":"gzip"})
            try:
             with op.open(req,timeout=120) as r:
              status=r.status;raw=r.read()
              if r.headers.get("Content-Encoding")=="gzip":raw=gzip.decompress(raw)
              data=json.loads(raw) if raw else []
             break
            except urllib.error.HTTPError as e:
             status=e.code;raw=e.read()
             if e.headers.get("Content-Encoding")=="gzip":raw=gzip.decompress(raw)
             try:data=json.loads(raw)
             except Exception:data={"error":"non-json error"}
             if status not in (429,500,502,503,504) or attempt==3:break
           proof["pages"].append({"at":now(),"http":status,"cursor":cursor})
           if status==204 or (status==200 and data==[]):
            proof.update(status="complete",pagination_exhausted=True,completed_at=now());put("source_proof:v1",proof);break
           if status!=200:
            proof.update(status="source_error",http_status=status,error=data);put("source_proof:v1",proof);raise RuntimeError("Detail HTTP "+str(status))
           if not isinstance(data,list) or not data:
            proof.update(status="unexpected_shape",response=data);put("source_proof:v1",proof);raise RuntimeError("Unexpected finance representation")
           for row in data:
            rid=str(row["rrdId"])
            if rid in seen:raise RuntimeError("Repeated row identity")
            seen.add(rid)
           for offset in range(0,len(data),100):
            key="source_rows:"+str(proof["rows"]+offset);batch=data[offset:offset+100];put(key,batch);proof["chunks"].append({"key":ROOT+key,"rows":len(batch)})
           proof["rows"]+=len(data)
           next_cursor=data[-1]["rrdId"]
           if next_cursor==cursor:raise RuntimeError("Cursor did not advance")
           cursor=next_cursor;proof["last_rrd_id"]=cursor;proof["keys"]=list(data[0]);put("source_proof:v1",proof)
          print("Finance read finished; private proof and all rows saved.")
          

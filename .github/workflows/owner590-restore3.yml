name: Owner590 restore preflight 3Nov
on:
  push:
    paths: ['.github/workflows/owner590-restore3.yml']
permissions:
  contents: read
concurrency:
  group: china-owner590-restore3
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Exact read-only preflight without model or Telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: disabled
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json
          from datetime import datetime,timezone
          from china_price_apply import IO
          from china_moysklad_read import read_stock
          from china_morning_readiness import current_prices,published_stock
          from china_loss_ads import current,http
          root='china_agent:owner_590_restore:2026-11-03:v1';nm=1473245510;cid=40933588;article='590-PamelaBag-brown'
          class ReadIO(IO):
              def wb(self,path,method='GET',body=None):
                  if method!='GET':raise ValueError('No WB mutations in preflight')
                  return super().wb(path,method,body)
              def tg(self,*args,**kwargs):raise ValueError('No Telegram')
          io=ReadIO()
          if io.get(root+':preflight'):raise ValueError('Existing dated preflight; do not duplicate')
          cp=current(io,[cid])[cid]
          cfg=http(io,'/api/advert/v1/config')
          budgets=http(io,'/api/advert/v2/budget','POST',dict(advertIds=[cid]))
          prices=current_prices(io,[nm]);g=prices['rows'][0]
          if g['article']!=article:raise ValueError('Exact article mismatch')
          stock=read_stock([article])
          if not stock['coverage_complete'] or len(stock['rows'])!=1:raise ValueError('Current MSK stock or COGS incomplete')
          st=stock['rows'][0];pub=published_stock(io,prices,[nm])
          own=io.get('china_agent:analytic_read:v1:a6599bcd005727cbc1360cef0c944def3c7e6bac497e5335b0ea1c378ba647d2')
          p=next(r for r in own['rows']if r['nm_id']==nm)
          source=io.get('china_agent:cloud_migration:2026-11-03:v1:live_completed')['source']
          fx=next(e['fx_rub_per_cny']for e in source['economics']['rows'].values()if e.get('fx_date')=='2026-11-03')
          q=p['is_payed']/p['finished_orders'];cogs=st['price']/100
          policy=io.get('china_agent:new_ad_economics_policy:v1')
          log=policy['logistics_by_nm'][str(nm)]['delivery_cny']
          fee=p['total_commission_without_spp_in_sales']
          margin=q*(g['seller_price']*(1-(fee+policy['tax_pct'])/100)-cogs/fx)-log-policy['handling_rub']/fx
          metrics=dict(spend=0,clicks=0,orders=0,amount=0,views=0)
          for batch in source['batches'].values():
              for c in batch['stats']:
                  if c['advertId']!=cid:continue
                  for d in c.get('days',[]):
                      if d['date'][:10] not in ['2026-10-30','2026-10-31']:continue
                      for app in d.get('apps',[]):
                          for r in app.get('nms',[]):
                              if r['nmId']!=nm:continue
                              for k,f in [('spend','sum'),('clicks','clicks'),('orders','orders'),('amount','sum_price'),('views','views')]:metrics[k]+=r[f]
          minima={};minimum_error=None
          try:minima=http(io,'/api/advert/v1/bids/min','POST',dict(advert_id=cid,nm_ids=[nm],payment_type='cpc',placement_types=['recommendation']))
          except RuntimeError as ex:minimum_error=str(ex)
          peer=cp['nm_settings'][0]['nm_id']
          peer_min=http(io,'/api/advert/v1/bids/min','POST',dict(advert_id=cid,nm_ids=[peer],payment_type='cpc',placement_types=['recommendation']))
          cpa=metrics['spend']/metrics['orders'] if metrics['orders'] else None
          result=dict(status='review_ready',observed_at=datetime.now(timezone.utc).isoformat(),campaign=cp,config=cfg,budgets=budgets,current_price=g,price_observed_at=prices['observed_at'],msk=stock,published_stock=pub,own_period=[own['period_from'],own['period_to']],own_paid=p['is_payed'],own_finished=p['finished_orders'],own_buyout=q,own_cogs_rub=cogs,fx_rub_per_cny=fx,commission_pct=fee,tax_pct=policy['tax_pct'],logistics_cny=log,handling_rub=policy['handling_rub'],margin_before_ads_cny=margin,ad_completed_days=['2026-10-30','2026-10-31'],ad_metrics=metrics,historical_cpa_cny=cpa,modeled_margin_after_historical_ads_cny=margin-cpa if cpa is not None else None,exact_minimum=minima,exact_minimum_error=minimum_error,peer_minimum=peer_min,unknown_reverse_and_shared_costs=True,preliminary=True,wb_writes=0,telegram_calls=0,model_calls=0)
          if not io.create(root+':preflight',result):raise ValueError('Concurrent preflight')
          if io.get(root+':preflight')!=result:raise ValueError('Readback mismatch')
          print('Exact current590 restore preflight saved privately; no mutations')
          PY

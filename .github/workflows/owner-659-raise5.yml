name: Owner659 exact approved bid raise
on:
  push:
    paths: ['.github/workflows/owner-659-raise5.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-659-raise5
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Exact owner659 preflight and single bid PATCH
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: disabled-no-send
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import copy,json,time,requests
          from datetime import datetime,timezone
          from zoneinfo import ZoneInfo
          from china_cloud_cost_control import Cache,WB,validate_identity,stamp
          from china_advertising_state import AdvertisingIO
          from china_morning_readiness import current_prices,published_stock
          from china_moysklad_read import read_stock
          ROOT='china_agent:owner_659_raise:2026-11-05:v1'
          CID=41055480;NM=1473246056;ARTICLE='659-FioreBag-green'
          c=Cache();w=WB();io=AdvertisingIO()
          def put(k,v):
           v=json.loads(json.dumps(v))
           if c.get(k) is None:
            if not c.create(k,v):raise ValueError('Concurrent creation')
           else:c.put(k,v)
          def auth():
           a=c.get(ROOT+':approval')or{}
           exact=[dict(kind='ad_set_bid',campaign_id=CID,nm_id=NM,article=ARTICLE,placement='recommendations',old_minor=28,target_minor=30)]
           if a.get('owner_user_id')!=5122667182 or a.get('execution_authorized')is not True or a.get('telegram_notice_authorized')is not False or a.get('items')!=exact:raise ValueError('Exact one-item owner approval required')
           if datetime.now(timezone.utc)>datetime.fromisoformat(a['expires_at'])or datetime.now(ZoneInfo('Europe/Moscow')).date().isoformat()!='2026-11-05':raise ValueError('Approval expired')
           return a
          def read():return w.campaigns([CID])[str(CID)]
          def ns(s):return {n['nm_id']:n for n in s['nm_settings']}
          def project(s):return {k:s[k]for k in ['id','status','bid_type','currency','settings','nm_settings']}
          auth();validate_identity(c,w)
          if c.get(ROOT+':execution'):raise ValueError('Existing journal; no replay')
          e=dict(status='preflight',created_at=stamp(),approval_key=ROOT+':approval',wb_writes=0,budget_writes=0,price_writes=0,telegram_calls=0)
          if not c.create(ROOT+':execution',e):raise ValueError('Concurrent executor')
          try:
           before=read();e['before']=before;put(ROOT+':execution',e)
           if before['status']!=9 or before['currency']!='CNY' or before['bid_type']!='manual' or before['settings']['payment_type']!='cpc' or not before['settings']['placements']['recommendations']:raise ValueError('Campaign not active CPC recommendations')
           if ns(before)[NM]['bids_kopecks']['recommendations']!=28 or ns(before)[NM]['subject']['id']!=50:raise ValueError('Bid/member/category changed')
           # Do not compound a same-day verified raise in any placement.
           for key in (c.get('china_agent:verified_campaign_state:v1')or{}).values():
            rc=c.get(key)or{};at=rc.get('verified_at')or rc.get('submitted_at')
            if rc.get('status')!='verified' or not at:continue
            dt=datetime.fromisoformat(at.replace(' UTC','+00:00').replace('Z','+00:00'))
            if dt.tzinfo is None:raise ValueError('Canonical receipt timezone unknown')
            if dt.astimezone(ZoneInfo('Europe/Moscow')).date().isoformat()!='2026-11-05':continue
            b=ns(rc.get('before')or{'nm_settings':[]}).get(NM);n=ns(rc.get('after')or{'nm_settings':[]}).get(NM)
            if n and (not b or any(n['bids_kopecks'].get(z,0)>b['bids_kopecks'].get(z,0)for z in ['search','recommendations'])):raise ValueError('Product already raised today')
           p=current_prices(io,[NM]);st=read_stock([ARTICLE]);pub=published_stock(io,p,[NM]);minimum=w.minimums(CID,[NM],'recommendations')
           rr=requests.get('https://advert-api.wildberries.ru/api/advert/v1/config',headers={'Authorization':w.token},timeout=45);rr.raise_for_status();cfg=rr.json()
           budget=w.req('/api/advert/v2/budget','POST',dict(advertIds=[CID]))['adverts']
           econ=(c.get('china_agent:advertising_full_growth:2026-11-05:v1:inputs')or{})['economics']['rows'][str(NM)]
           if len(p['rows'])!=1 or p['rows'][0]['seller_price']!=299.5 or p['rows'][0]['article']!=ARTICLE or p['rows'][0]['currency']!='CNY':raise ValueError('Current price changed')
           stock=next(x for x in st['rows']if x['article']==ARTICLE)
           free=stock['stock']-stock['reserve'];cost=stock['price']/100
           published=pub['amounts'].get(str(NM),pub['amounts'].get(NM))
           if free<=0 or not cost or published is None or published<=0:raise ValueError('Current stock/COGS unavailable')
           if abs(cost-econ['own_cogs_rub'])>0.05:raise ValueError('Current COGS changed; recalculate')
           if cfg['currency']!='CNY' or cfg['cpcStep']!=1 or 30>cfg['cpcMaxBid'] or minimum[NM]>30:raise ValueError('Minimum/step/max changed')
           if len(budget)!=1 or budget[0]['currency']!='CNY' or budget[0]['total']<653.08:raise ValueError('Three-day budget reserve insufficient')
           margin=econ['expected_margin_before_ads_cny']-38.91/5*30/28
           if margin<=0 or econ['sample_size']!=4 or econ['buyout']!=0.5:raise ValueError('Approved preliminary economics changed')
           e['preflight']=dict(prices=p,stock=st,published_stock=pub,minimum=minimum,config=cfg,budget=budget,economics=econ,target_cpa_same_cr=38.91/5*30/28,margin_after_target=margin,observed_at=stamp());put(ROOT+':execution',e)
           auth()
           if project(read())!=project(before):raise ValueError('Campaign changed during preflight')
           expected=copy.deepcopy(before);ns(expected)[NM]['bids_kopecks']['recommendations']=30
           body=dict(bids=[dict(advert_id=CID,nm_bids=[dict(nm_id=NM,placement='recommendations',bid_kopecks=30)])])
           e.update(status='submitting',submitted_at=stamp(),request=body);put(ROOT+':execution',e)
           # Exactly one mutation attempt; empty 2xx is valid. Never retry uncertain.
           e['wb_writes']=1;put(ROOT+':execution',e)
           r=requests.patch('https://advert-api.wildberries.ru/api/advert/v1/bids',headers={'Authorization':w.token},json=body,timeout=50)
           if not r.ok:raise ValueError('WB HTTP '+str(r.status_code))
           e['status']='accepted';put(ROOT+':execution',e)
           for _ in range(10):
            after=read()
            if project(after)==project(expected):break
            time.sleep(4)
           else:raise ValueError('Readback mismatch; no retry')
           child=dict(status='verified',kind='ad_set_bid',items=auth()['items'],before=before,after=after,verified_at=stamp(),submitted_at=e['submitted_at'],approval_key=ROOT+':approval',budget_writes=0,price_writes=0,telegram_calls=0)
           ck=ROOT+':campaign:'+str(CID);put(ck,child)
           registry=c.get('china_agent:verified_campaign_state:v1')or{};registry[str(CID)]=ck;put('china_agent:verified_campaign_state:v1',registry)
           e.update(status='verified',after=after,verified_at=child['verified_at'],receipt_key=ck);put(ROOT+':execution',e)
           print(json.dumps(dict(status='verified',wb_writes=1,telegram_calls=0)))
          except Exception as ex:
           e.update(status='uncertain'if e['wb_writes']else'blocked',error=str(ex)[:350],failed_at=stamp());put(ROOT+':execution',e);raise
          PY

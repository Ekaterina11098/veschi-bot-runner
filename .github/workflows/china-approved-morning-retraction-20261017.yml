name: China approved report retraction 20261017
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-approved-morning-retraction-20261017.yml']
permissions:
  contents: read
concurrency:
  group: bot-business-agent
  cancel-in-progress: false
jobs:
  retract:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 > "$RUNNER_TEMP/install.log" 2>&1
      - name: Delete exact owner-authorized report IDs without sending messages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: python scripts/china_approved_morning_retraction.py

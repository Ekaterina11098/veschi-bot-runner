name: Authorized summary return move 20261110
on:
  push:
    branches: [main]
    paths: ['.github/workflows/returns-move-20261110-summary65.yml']
permissions:
  contents: read
concurrency:
  group: bot-stock
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5f3342361b041a14b15e484cd0a4380aa11b96c1
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify previous deletion and post exact summary
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/returns_move_20261110_summary65.py

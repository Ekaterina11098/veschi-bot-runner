name: Issue 10 completed IP investigations and two profit types
on:
  push:
    branches: [main]
    paths: ['.github/workflows/issue-10-ip-final-gap.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue-10-stock-read-only
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: ad9b17cc9ed78066579299f06404dad17c325480
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv aiogram apscheduler pillow > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Validate recovered evidence and bounded raw lineage
        env:
          TASK: ip-completed-investigations
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          for pattern in ('test_ip_completed_investigations.py','test_ip_investigation_sources.py','test_profit_math.py','test_mpstats_economics.py'):
              run_private.execute('Evidence and safety regression '+pattern,['-m','unittest','discover','-s','tests','-p',pattern])
          run_private.execute('Complete saved all-campaign IP investigations',['-m','analytics.ip_completed_investigations'])
          print('Bounded lineage audit and evidence regressions passed; private results saved.')
          PY

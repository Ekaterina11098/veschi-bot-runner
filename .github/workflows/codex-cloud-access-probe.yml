name: Codex cloud API access probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/codex-cloud-access-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check existing API credential without inference or external tools
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          key=os.environ.get('OPENAI_API_KEY','')
          if not key:
              print(json.dumps({'credential_present':False}));raise SystemExit(0)
          print(json.dumps({'credential_present':True}))
          for name,url,beta in [('models','https://api.openai.com/v1/models',False),('agent_sessions','https://api.openai.com/v1/agents/sessions?limit=1',True)]:
              headers={'Authorization':'Bearer '+key}
              if beta:headers['OpenAI-Beta']='agents=v1'
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:
                      response.read();result={'check':name,'http_status':response.status}
              except urllib.error.HTTPError as e:
                  result={'check':name,'http_status':e.code}
                  try:
                      error=json.loads(e.read()).get('error',{})
                      result['error_type']=error.get('type');result['error_code']=error.get('code')
                  except Exception:pass
              except Exception as e:result={'check':name,'transport_error':type(e).__name__}
              print(json.dumps(result))
          PY

name: OOO bounded Sol group dialogue
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ooo-sol-dialog.yml', 'scripts/ooo_sol_dialog.py', 'scripts/bounded_sol_dialog.py', 'scripts/test_ooo_sol_dialog.py', 'scripts/test_bounded_sol_dialog.py', 'ooo-sol-dialog-request.json', 'scripts/ooo_report_executor.py', 'scripts/ooo_report_command.py', 'scripts/test_ooo_report_executor.py']
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions: {contents: read}
concurrency:
  group: ooo-sol-dialog-single-consumer
  cancel-in-progress: false
jobs:
  dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 Pillow==12.3.0 --quiet
      - name: Offline bounded-dialogue regression without credentials
        run: |
          PYTHONPATH=scripts python -m unittest discover -s scripts -p test_bounded_sol_dialog.py
          PYTHONPATH=scripts python -m unittest discover -s scripts -p test_ooo_sol_dialog.py
          PYTHONPATH=scripts python -m unittest discover -s scripts -p test_china_codex_cloud.py
          PYTHONPATH=scripts python -m unittest discover -s scripts -p test_china_no_paid.py
      - name: Verify exact OOO destination; no model calls
        env:
          OOO_TELEGRAM_BOT_TOKEN: ${{ secrets.OOO_TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/ooo_sol_dialog.py --verify
      - name: Answer only newly addressed OOO questions using bounded Sol
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[ooo-dialog-consume]')
        env:
          OOO_TELEGRAM_BOT_TOKEN: ${{ secrets.OOO_TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/ooo_sol_dialog.py

  execute-reports:
    needs: dialogue
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: ooo-token1-owner-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 --quiet
      - name: Offline exact-report execution regression
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p test_ooo_report_executor.py
      - name: Resume approved private reports; never replay accepted or uncertain writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
        run: python scripts/ooo_report_executor.py
  confirm-reports:
    needs: execute-reports
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 --quiet
      - name: Confirm actual terminal results once in current OOO group
        env:
          OOO_TELEGRAM_BOT_TOKEN: ${{ secrets.OOO_TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/ooo_report_executor.py --notify

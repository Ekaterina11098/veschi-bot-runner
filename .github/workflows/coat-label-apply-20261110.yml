name: Complete verified China coat label fields
on:
  push:
    paths: ['.github/workflows/coat-label-apply-20261110.yml']
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: scripts/fbs_document_chain.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: python
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import sys,re
          sys.path.insert(0,'scripts')
          from fbs_document_chain import Transport,Cache,Worker,MS,now,Stop
          t=Transport();db=Cache(t);w=Worker(t,db,{})
          pre=db.get('label_utility:coats:20261110:preflight:v1')
          definitions={a['name']:a for a in t.request(MS,'entity/product/metadata/attributes')['rows']}
          def norm(s):return re.sub(r'\s+','',s).casefold()
          def vals(p):return {a['name']:a.get('value') for a in p.get('attributes',[])}
          stock={s['meta']['href'].split('?')[0].rsplit('/',1)[-1]:s['stock'] for s in w.ms_rows('report/stock/all')}
          plan=[];issues=[]
          colorforms={'шоколадная':'шоколадный','бежевая':'бежевый','серая':'серый','черная':'черный'}
          for card in pre['wb_coats']:
              matches=[p for p in pre['ms_coats'] if norm(p.get('article',''))==norm(card['vendorCode'])]
              if len(matches)!=1:issues.append({'article':card['vendorCode'],'reason':'article ambiguous'});continue
              p=matches[0]
              if stock.get(p['id'],0)<=0:issues.append({'article':card['vendorCode'],'reason':'no positive stock'});continue
              sizes=card.get('sizes',[])
              if len(sizes)!=1:issues.append({'article':card['vendorCode'],'reason':'multiple sizes need variant mapping'});continue
              codes=sizes[0].get('skus',[])
              if not codes or not all(re.fullmatch(r'\d{13}',c) for c in codes):raise Stop('Unexpected coat barcode format')
              for code in codes:
                  owners=w.ms_rows('entity/assortment',{'filter':'barcode='+code})
                  if any(o['id']!=p['id'] for o in owners):raise Stop('Barcode already belongs to another product')
              m=re.search(r'эко(?:мех)?\s+\d+\s+(.+)$',p['name'],re.I)
              if not m:raise Stop('Coat color unclear')
              color=colorforms.get(m[1].lower(),m[1].lower())
              desired={'Цвет':color,'ВендорКод':re.match(r'^(\d+)-',norm(card['vendorCode']))[1],
                       'Категория товара':'Шуба','Размер':sizes[0]['wbSize']}
              plan.append({'id':p['id'],'article':p['article'],'codes':codes,'desired':desired})
          if len(plan)!=6 or issues:raise Stop('Coat scope requires review')
          key='label_utility:coats:20261110:apply:v1'
          audit={'status':'prepared','at':now(),'plan':plan,'done':[],'issues':issues};db.put(key,audit)
          for item in plan:
              path='entity/product/'+item['id'];p=t.request(MS,path);fields=vals(p)
              if p.get('article')!=item['article'] or p.get('archived'):raise Stop('Product identity changed')
              attrs=[]
              for name,value in item['desired'].items():
                  if fields.get(name) is None or not str(fields[name]).strip():
                      attrs.append({'meta':definitions[name]['meta'],'value':value})
              barcodes=list(p.get('barcodes',[]));old={str(v) for b in barcodes for v in b.values()}
              barcodes += [{'ean13':code} for code in item['codes'] if code not in old]
              body={}
              if attrs:body['attributes']=attrs
              if barcodes!=p.get('barcodes',[]):body['barcodes']=barcodes
              audit['inflight']={'id':p['id'],'before':p,'body':body};db.put(key,audit)
              if body:t.request(MS,path,'PUT',body)
              after=t.request(MS,path);actual=vals(after)
              if not all(str(actual.get(n,'')).strip() for n in item['desired']):raise Stop('Required label field missing')
              if after.get('barcodes')!=barcodes or after.get('article')!=p.get('article'):raise Stop('Barcode or article readback mismatch')
              for a in p.get('attributes',[]):
                  if a.get('value') is not None and str(a['value']).strip() and actual.get(a['name'])!=a['value']:raise Stop('Existing field changed')
              for a in attrs:
                  name=next(n for n,d in definitions.items() if d['meta']['href']==a['meta']['href'])
                  if actual.get(name)!=a['value']:raise Stop('New attribute readback mismatch')
              audit['done'].append({'id':after['id'],'article':after['article'],'name':after['name'],'barcodes':after['barcodes'],'fields':actual,'stock':stock[item['id']]})
              audit['inflight']=None;db.put(key,audit)
          audit.update(status='verified',verified_at=now());db.put(key,audit)
          catalog=db.get('label_utility:catalog:auto:v1')
          for done in audit['done']:
              p=next(p for p in catalog['products'] if p['id']==done['id'])
              p['barcodes']=done['barcodes']
              p['attributes']=[{'name':n,'value':str(v)} for n,v in done['fields'].items() if n in ('Цвет','ВендорКод','Категория товара')]
          catalog['last_patch_at']=now();db.put('label_utility:catalog:auto:v1',catalog)
          print('Six stocked China coat label cards verified. Old barcodes preserved.')


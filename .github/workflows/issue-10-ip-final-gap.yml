name: Issue 10 deferred sales causes plan validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/issue-10-ip-final-gap.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue-10-stock-read-only
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 96e32084fb8f1e988f5646b1fb272b4b74db311f
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv aiogram apscheduler pillow > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Validate deferred plan and save common knowledge only
        env:
          TASK: issue-10-sales-causes-plan
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          script = r"""
          import json
          from datetime import datetime,timezone,timedelta
          from business_agents.knowledge import shared_knowledge
          from analytics.collect import database
          from analytics.stage_one import read
          knowledge=shared_knowledge()
          plan=knowledge['planned_modules']['sales_change_causes']
          assert plan['status']=='planned_after_IP_stage_one'
          assert plan['owner']=='advertising_agent'
          for flag in ('telegram_enabled','wb_writes_enabled','additional_review_question_collection_enabled','mass_buyer_collection_enabled','private_actions_allowed'):
              assert plan['guards'][flag] is False
          assert plan['pilot']['article']=='447-AngelaBag-burgundy'
          assert plan['sequence'][0]=='Завершить текущий этап рекламного агента ИП'
          assert len(plan['reuse'])>=6 and len(plan['signals'])==7
          key='veschi:shared_knowledge:v1'
          existing=read('telegram_api_cache',dict(cache_key='eq.'+key,select='payload',limit=1))
          assert existing and isinstance(existing[0]['payload'],dict)
          payload=existing[0]['payload']
          payload.setdefault('planned_modules',{})['sales_change_causes']=plan
          payload['sales_causes_plan_source_commit']='96e32084fb8f1e988f5646b1fb272b4b74db311f'
          database('POST','telegram_api_cache',body=dict(cache_key=key,payload=payload,expires_at=(datetime.now(timezone.utc)+timedelta(days=365)).isoformat()),params={'on_conflict':'cache_key'})
          verify=read('telegram_api_cache',dict(cache_key='eq.'+key,select='payload',limit=1))
          assert verify[0]['payload']['planned_modules']['sales_change_causes']==plan
          print(json.dumps(dict(plan_checks_passed=11,common_knowledge_saved=True,source_requests=0,telegram_sent=False,wb_writes=False,module_activated=False)))
          """
          run_private.execute('Validate and save deferred sales causes plan without source collection',['-c',script])
          PY

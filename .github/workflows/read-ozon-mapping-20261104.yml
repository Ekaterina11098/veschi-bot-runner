name: Complete read-only Ozon November 4 matching review
on:
  push:
    branches: [main]
    paths: ['.github/workflows/read-ozon-mapping-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Verify every product, current stocks and duplicate protection
        shell: python
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: |
          import sys,collections
          sys.path.insert(0,'scripts')
          import fbs_document_chain as m
          import fbs_ozon_chain as oz
          class Read(m.Transport):
           def request(self,base,path,method='GET',body=None,params=None):
            if base==m.MS and method!='GET':raise m.Stop('Read only')
            return super().request(base,path,method,body,params)
          t=Read();db=m.Cache(t);c=db.get(oz.CONFIG);w=m.Worker(t,db,c)
          prior=db.get('ozon_document_recovery:20261104:preflight:v1')['blocked'][0]
          act=prior['act'];scope=prior['scope']
          allp=w.ms_rows('entity/product',{'filter':'archived=false'})
          stock=w.ms_rows('report/stock/all',{'filter':'store='+m.href(c['templates']['demand']['store']),'stockMode':'all','quantityMode':'all'})
          byid={m.href(s).split('?')[0]:s for s in stock}
          result={'at':m.now(),'act_id':act['id'],'products':[],'documents':{}}
          for article,q in sorted(scope['counts'].items()):
           exact=[p for p in allp if (p.get('article') or '').strip().casefold()==article]
           candidates=exact or [p for p in allp if p.get('code','').replace(' ','').casefold()=='531с' and article=='531-noelbag-cream']
           rows=[]
           for p in candidates:
            s=byid.get(m.href(p),{})
            rows.append({'id':p['id'],'code':p.get('code'),'article':p.get('article'),'name':p.get('name'),'barcodes':p.get('barcodes',[]),'archived':p.get('archived'),'variantsCount':p.get('variantsCount',0),'trackingType':p.get('trackingType','NOT_TRACKED'),'stock':s.get('stock',0),'available':s.get('quantity',0),'meta':p['meta']})
           result['products'].append({'source_article':article,'quantity':q,'exact_matches':len(exact),'candidates':rows,'confirmation_required':not exact})
          for kind in m.TYPES:
           matches=w.ms_rows('entity/'+kind,{'filter':'externalCode='+c['document_prefix']+':OZON-ACT-'+str(act['id'])+':'+kind})
           result['documents'][kind]=[{'id':d['id'],'name':d['name'],'comment':d.get('description'),'posted':d.get('applicable')} for d in matches]
          raw=oz.ozon('/v2/posting/fbs/act/get-postings',{'id':act['id']})
          result['ozon_source_products']=[p for row in raw.get('result',[]) for p in row.get('products',[]) if (p.get('offer_id') or '').casefold()=='531-noelbag-cream']
          result['orders_by_name']=[{'id':d['id'],'name':d['name'],'comment':d.get('description'),'externalCode':d.get('externalCode')} for d in w.ms_rows('entity/customerorder',{'filter':'name=041126 Озон'})]
          db.put('ozon_document_recovery:20261104:matching_review:v1',result)
          print('Read-only matching, availability and duplicate review saved privately.')

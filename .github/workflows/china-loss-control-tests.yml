name: China loss control regression tests
on:
  push:
    branches: [china-loss-control-20261022, china-loss-107-binding-20261022]
  pull_request:
    paths: ['scripts/china_loss*', 'scripts/conversion_watches.py']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python scripts/install_china_dialog.py
          python scripts/install_china_buyout.py --root source
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_loss_control.py -v
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_loss_ads.py -v
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_conversion_watches.py -v
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_search_analytics.py -v

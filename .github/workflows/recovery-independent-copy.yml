          root=Path(os.environ['RUNNER_TEMP']);out=root/'independent-copy'
          expected=['935f11497da24133b89bd95688e34493cb8a64d29ad8944710385a60b86c9ee7','daf337767e7a3626cb8a554cc37b0fca1b2b465788cc89247b10c32481985da5','323a4cbc0c5a40893b309123f26f2bcf8b9a6e58e449a30bfa7c032fc191c481c']

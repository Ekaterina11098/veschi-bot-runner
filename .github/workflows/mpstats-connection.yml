name: MPSTATS alternate expense report verification
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/mpstats-connection.yml']
permissions:
  contents: read
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: main
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Validate and check MPSTATS access
        run: |
          python - <<'PY'
          import run_private
          run_private.execute('Validate MPSTATS connection check',['-m','unittest','discover','-s','tests','-p','test_mpstats_probe.py'])
          run_private.execute('Validate advertising agent read access',['-m','unittest','discover','-s','tests','-p','test_advertising_conversation.py'])
          run_private.execute('Validate MPSTATS gap reads',['-m','unittest','discover','-s','tests','-p','test_mpstats*.py'])
          run_private.execute('Collect additional MPSTATS data',['-m','analytics.mpstats_gaps'])
          run_private.execute('Verify recovered data and price analysis',['-m','analytics.mpstats_recovery','--verify'])
          PY
        env:
          TASK: mpstats-connection
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}

name: Owner full catalogue fixed buyout economics evidence
on:
  push:
    paths: ['.github/workflows/owner-fixed-buyout-profit5.yml']
permissions:
  contents: read
concurrency:
  group: owner-fixed-buyout-profit5
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /analytics/
            /business_agents/
            /advertising_agent/
            /china_agent/
            /*.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 python-dotenv simplejson==4.2.0 pillow==11.3.0
      - name: Owner authorized evidence only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: disabled-no-send
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
        run: |
          PYTHONPATH=scripts:source python - <<'PY'
          import json,os,requests,base64
          from datetime import datetime,timezone
          from china_cloud_cost_control import Cache,stamp
          from china_moysklad_read import read_stock
          from analytics.mpstats_probe import discover
          from analytics.mpstats_gaps import execute_reads
          ROOT='china_agent:owner_fixed_buyout_profit:2026-11-05:v1'
          c=Cache()
          if not c.create(ROOT+':claim',dict(at=stamp(),wb_writes=0)):raise ValueError('Already collected')
          v=dict(status='collecting',cabinet='token_3',observed_at=stamp(),errors={},wb_writes=0,telegram_calls=0,grants_action_permission=False)
          def save():c.put(ROOT,json.loads(json.dumps(v)))
          def read(k,f):
           try:v[k]=f()
           except Exception as e:v['errors'][k]=str(e)[:350]
           save()
          def prices():
           rows=[]
           for off in range(0,20000,1000):
            r=requests.get('https://discounts-prices-api.wildberries.ru/api/v2/list/goods/filter',headers={'Authorization':os.environ['WB_TOKEN_3']},params=dict(limit=1000,offset=off),timeout=60);r.raise_for_status()
            part=r.json()['data']['listGoods'];rows+=part
            if len(part)<1000:break
           else:raise ValueError('Price pagination')
           return dict(cabinet='token_3',rows=rows,observed_at=stamp())
          read('prices',prices)
          if 'prices'in v:read('stock',lambda:read_stock([r['vendorCode'] for r in v['prices']['rows']]))
          def products():
           tasks=[dict(cabinet='token_3',tool='lk_wb_products',key='owner-fixed-buyout-profit-5nov',priority=80,arguments=dict(date_from='2026-10-06',date_to='2026-11-04',start_row=0,end_row=1500))]
           obs=[]
           def persist(cab,ob):
            if cab=='token_3' and ob.get('scope_verified') is True and ob.get('status')=='received':obs.append(ob)
           def extra(call,checks,known):return execute_reads(call,checks,known,tasks,{},persist,max_requests=1)
           discover(os.environ['MPSTATS_API_TOKEN'],read_checks=True,extra_reader=extra)
           if len(obs)!=1:raise ValueError('No verified complete MPStats source')
           body=obs[0]['data']['data'];rows=body['data']
           if body.get('need_update')!=0 or body.get('total')!=len(rows):raise ValueError('Incomplete financial source')
           return dict(period_from='2026-10-06',period_to='2026-11-04',observed_at=stamp(),rows=rows,complete=True,observation=obs[0])
          read('products',products)
          v.update(status='complete' if not v['errors'] else 'partial',completed_at=stamp());save()
          print(json.dumps(dict(status=v['status'],errors=v['errors'],products=len(v.get('products',{}).get('rows',[])),prices=len(v.get('prices',{}).get('rows',[])))))
          
          PY

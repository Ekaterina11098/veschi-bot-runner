name: Read-only article143 difference20 investigation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-article143-difference20.yml']
permissions:
  contents: read
concurrency:
  group: owner-article143-read-audit
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            owner_article143_difference20_20261104.py
            stock_deploy_support.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 45355eaef9587e153a7d32011c55a8857e9dd0ee
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv==1.1.1 aiogram==3.22.0 simplejson==4.2.0 'psycopg[binary]==3.2.9' cryptography > "$RUNNER_TEMP/read-install.log" 2>&1
      - name: Read inventories and all article143 movements since October1
        env:
          PYTHONPATH: ${{ github.workspace }}/private-source:${{ github.workspace }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: python owner_article143_difference20_20261104.py

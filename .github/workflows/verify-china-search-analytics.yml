name: Verify China search analytics integration
on:
  push:
    branches: [china-search-analytics-agent-20261021]
permissions:
  contents: read
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 python-dotenv simplejson==4.2.0 > "$RUNNER_TEMP/search-install.log" 2>&1
      - name: Test scoped data and existing dialog
        run: |
          python scripts/install_china_dialog.py
          python scripts/install_china_buyout.py --root source
          python scripts/china_chat_migration.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_search_analytics.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_conversion_watches.py
          python -m py_compile scripts/china_search_analytics.py scripts/conversion_watches.py
      - name: Preview actual search answer without sending or changing WB
        env:
          PYTHONPATH: scripts:source
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: disabled
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BUSINESS_AI_MODEL: ${{ vars.BUSINESS_AI_MODEL || 'gpt-4o-mini' }}
        run: python scripts/china_search_preview.py

name: Create authorized weekly report 133 documents
on:
  push:
    branches: [main]
    paths: ['.github/workflows/create-weekly133.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bot-stock-and-commands
  cancel-in-progress: false
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create and verify the approved weekly chain
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: python scripts/create_weekly133.py

name: Read catalog for owner requested label utility
on:
  push:
    paths: ['.github/workflows/label-utility-catalog-20261106.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: scripts/fbs_document_chain.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: python
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import sys,os
          sys.path.insert(0,"scripts")
          from fbs_document_chain import Transport,Cache,Worker,now
          t=Transport();db=Cache(t);w=Worker(t,db,{})
          out={"generated_at":now(),"products":[],"source":"МойСклад"}
          for typ in ("product","variant","bundle"):
              for p in w.ms_rows("entity/"+typ):
                  if p.get("archived"):continue
                  out["products"].append({k:p.get(k) for k in ("id","name","article","code","barcodes","attributes","archived")}|{"entity_type":typ})
          db.put("label_utility:catalog:20261106:v1",out)
          print("Private label catalog exported without inventory changes")
          

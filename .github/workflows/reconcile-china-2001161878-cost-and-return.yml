name: Audit China demand valuation and finish verified return
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reconcile-china-2001161878-cost-and-return.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: china-weekly-2001161878-documents
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
          filter: blob:none
      - name: Read valuation proof and finish only authorized unmatched return
        shell: python
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import sys,json,collections,datetime
          from decimal import Decimal,ROUND_FLOOR
          sys.path.insert(0,"scripts")
          import fbs_document_chain as m
          ROOT="weekly_report_review:china:20261101:"
          class T(m.Transport):
           def request(self,base,path,method="GET",body=None,params=None):
            if base==m.MS and method!="GET" and not ((method=="POST" and path=="entity/salesreturn") or (method=="PUT" and path=="entity/salesreturn/new")):raise m.Stop("Only verified unmatched return may be created")
            return super().request(base,path,method,body,params)
          t=T();db=m.Cache(t);w=m.Worker(t,db,{})
          plan=db.get(ROOT+"plan:v1");prep=db.get(ROOT+"ms_preflight:v1");result=db.get(ROOT+"ms_documents:v1")
          assert plan["authorized"] and plan["excel_verified"] and plan["returns"]=={"19-furscarf-leo":1}
          def norm(x):return m.href(x).split("?")[0]
          def ps(kind,uid,stock=False):
           if not stock:return w.ms_rows("entity/"+kind+"/"+uid+"/positions",{"expand":"assortment"})
           out=[];offset=0
           while True:
            p=t.request(m.MS,"entity/"+kind+"/"+uid+"/positions",params={"expand":"assortment","fields":"stock","limit":50,"offset":offset});batch=p["rows"];out+=batch;offset+=len(batch)
            if offset==p["meta"]["size"]:return out
            assert batch
          def cnt(p):
           c=collections.Counter()
           for v in p:c[(v["assortment"].get("article") or "").strip().casefold()]+=v["quantity"]
           return dict(c)
          dref=[d for d in result["documents"] if d["type"]=="demand"];assert len(dref)==1
          demand=t.request(m.MS,"entity/demand/"+dref[0]["id"])
          target="525-samirabag-ginger";product=prep["products"][target][0]
          audit={"at":m.now(),"status":"reading","current_demand":{"id":demand["id"],"name":demand["name"],"moment":demand["moment"]},"history":[]}
          audit["current_positions"]=[p for p in ps("demand",demand["id"],True) if (p["assortment"].get("article") or "").strip().casefold()==target]
          flt="store="+norm(prep["store"])+";product="+norm(product)
          audit["stock_now"]=w.ms_rows("report/stock/all",{"filter":flt,"stockMode":"all","quantityMode":"all"})
          before=(datetime.datetime.fromisoformat(demand["moment"])-datetime.timedelta(seconds=1)).isoformat(sep=" ",timespec="seconds")
          audit["stock_before_moment"]=before
          audit["stock_before"]=w.ms_rows("report/stock/all",{"filter":flt+";moment="+before,"stockMode":"all","quantityMode":"all"})
          db.put(ROOT+"valuation_audit:v1",audit)
          for d in prep["demand_history"]:
           if d["id"]==demand["id"] or not d.get("applicable"):continue
           positions=[p for p in ps("demand",d["id"],True) if (p["assortment"].get("article") or "").strip().casefold()==target]
           if positions:audit["history"].append({"id":d["id"],"name":d["name"],"moment":d["moment"],"positions":positions})
           db.put(ROOT+"valuation_audit:v1",audit)
           if len(audit["history"])>=2:break
          a="19-furscarf-leo";bid=plan["basis"][a];basis=t.request(m.MS,"entity/demand/"+bid)
          assert basis["applicable"] and all(norm(basis[k])==norm(prep[k]) for k in ("organization","agent","store"))
          cap=cnt(ps("demand",bid));used=collections.Counter();ext="weekly-china-2001161878-return-"+bid
          for ref in basis.get("returns",[]):
           r=t.request(m.MS,norm(ref)[len(m.MS):])
           if r.get("externalCode")==ext:continue
           used.update(cnt(ps("salesreturn",r["id"])))
          assert cap.get(a,0)-used[a]>=1
          found=w.ms_rows("entity/salesreturn",{"filter":"externalCode="+ext});assert len(found)<=1
          if found:r=found[0]
          else:
           template=t.request(m.MS,"entity/salesreturn/new","PUT",{"demand":m.meta(basis)})
           matches=[p for p in template["positions"]["rows"] if norm(p["assortment"])==norm(prep["products"][a][0])];assert len(matches)==1 and matches[0]["quantity"]>=1
           source=matches[0]
           body={k:m.meta(prep[k]) for k in ("organization","agent","store")}
           body.update(applicable=True,rate={"currency":m.meta(prep["currency"])},vatEnabled=template.get("vatEnabled",False),vatIncluded=template.get("vatIncluded",True),demand=m.meta(basis),description="рыжие возвраты из "+plan["comment"],externalCode=ext,positions=[{"quantity":1,"price":0,"discount":0,"vat":source.get("vat",0),"vatEnabled":source.get("vatEnabled",template.get("vatEnabled",False)),"assortment":m.meta(prep["products"][a][0])}])
           assert not result.get("pending_write")
           result["pending_write"]={"kind":"salesreturn","externalCode":ext,"at":m.now()};db.put(ROOT+"ms_documents:v1",result)
           try:r=t.request(m.MS,"entity/salesreturn","POST",body)
           except Exception:
            result["status"]="write_outcome_requires_reconciliation";db.put(ROOT+"ms_documents:v1",result);raise
           result["pending_write"]=None
          r=t.request(m.MS,"entity/salesreturn/"+r["id"]);positions=ps("salesreturn",r["id"])
          assert r["applicable"] and r["sum"]==0 and cnt(positions)=={a:1} and all(p["price"]==0 for p in positions)
          assert norm(r["demand"])==norm(basis) and all(norm(r[k])==norm(prep[k]) for k in ("organization","agent","store"))
          ref={"type":"salesreturn","id":r["id"],"name":r["name"]}
          if ref not in result["documents"]:result["documents"].append(ref)
          bad=[p for p in audit["current_positions"] if not (p.get("stock",{}).get("cost") or 0)>0]
          result["status"]="needs_valuation" if bad else "ready_to_resume_finalization"
          result["zero_cost_articles"]=[target] if bad else []
          db.put(ROOT+"ms_documents:v1",result)
          audit.update(status="complete",completed_at=m.now(),return_verified=ref,still_zero=bool(bad));db.put(ROOT+"valuation_audit:v1",audit)
          print("Verified unmatched return saved and zero-cost audit completed privately.")
          

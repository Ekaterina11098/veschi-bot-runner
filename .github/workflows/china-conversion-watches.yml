name: China free-form agent and daily tasks
on:
  push:
    branches: [main]
    paths: ['china-conversion-watches-request.json']
  workflow_dispatch:
    inputs:
      action:
        description: Process owner commands and due watches, or verify without sending
        type: choice
        options: [run, verify, smoke, dialog, dialog_free, reports]
        default: run
      job_id:
        description: Exact saved-data question job
        type: string
        default: ""
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: china-dialog-queue
  cancel-in-progress: false
jobs:
  watches:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: china-dialog-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/
            /*request*.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /analytics/
            /business_agents/
            /advertising_agent/
            /china_agent/
            /tests/
            /*.py
      - name: Install pinned read transport
        run: pip install requests==2.32.5 Pillow==12.3.0 openai==3.42.1 > "$RUNNER_TEMP/watch-dependencies.log" 2>&1
      - name: Adapt isolated dialog and test without credentials
        run: |
          python scripts/install_china_dialog.py
          python scripts/install_china_buyout.py --root source
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_buyout_policy.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_search_analytics.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_loss_control.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_loss_ads.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_order_decline.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_new_ads.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_free_diagnostics.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_ad_retest.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_free_ads.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_sol_proposals.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_proposal_final_review.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_codex_ad_review.py
          node --test scripts/test_codex_inbox.mjs scripts/test_codex_route.mjs
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_experience.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_analytic_dialog.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_profit_forecast31.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_conversion_context.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_analytic_evidence.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_product_diagnosis.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_growth_candidates.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_advertising_plans.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_bid_proposals.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_agent_reports.py
          python scripts/china_chat_migration.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_conversion_watches.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_once_report.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_advertising_scheduled_png.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_advertising_report_autonomy.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p 'test_china_reply_*.py'
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_catalog_price_command.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_zero_orders_stock.py
      - name: Install pinned native Codex for incoming requests
        if: github.event_name != 'schedule'
        run: npm install --global @openai/codex@0.167.1 > "$RUNNER_TEMP/codex-install.log" 2>&1
      - name: Continue owner-authorized persistent cloud Codex conversation
        id: cloud_initial
        if: github.event_name == 'push' || inputs.action == 'dialog' || inputs.action == 'dialog_free'
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          DIALOG_JOB_ID: ${{ inputs.job_id }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          WB_FINANCE_TOKEN_3: ${{ secrets.WB_FINANCE_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # Owner10Nov: scoped bounded Sol dialogue only
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          PYTHONPATH=scripts python -m unittest discover -s scripts -p test_china_menu_analytics.py
          PYTHONPATH=scripts python -m unittest discover -s scripts -p test_china_codex_cloud.py
          PYTHONPATH=scripts python -m unittest discover -s scripts -p test_china_no_paid.py
          set -o pipefail
          if [ "$EVENT_NAME" = push ]; then
            DIALOG_JOB_ID=$(python -c "import json;print(json.load(open('china-conversion-watches-request.json')).get('job_id',''))")
          fi
          CLOUD_ARGS=()
          if [ -n "$DIALOG_JOB_ID" ]; then CLOUD_ARGS=(--job-id "$DIALOG_JOB_ID"); fi
          python -u scripts/china_codex_cloud.py "${CLOUD_ARGS[@]}" | tee "$RUNNER_TEMP/china-cloud-initial.json"
          python -c "import json,os; r=json.load(open(os.environ['RUNNER_TEMP']+'/china-cloud-initial.json')); f=open(os.environ['GITHUB_OUTPUT'],'a'); f.write('status='+str(r['status'])+'\\njob_id='+str(r.get('job_id',''))+'\\n')"

      - name: Process owner watch commands and due conversion reports
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ inputs.action }}
          DIALOG_JOB_ID: ${{ inputs.job_id }}
          WB_FINANCE_TOKEN_3: ${{ secrets.WB_FINANCE_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          OPENAI_API_KEY: "" # Ordinary deterministic workers have no model credential
          NATIVE_CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHINA_ANALYSIS_BACKEND: managed_codex
          PYTHONPATH: source
        run: |
          MODE="$ACTION"
          if [ "$EVENT_NAME" = push ]; then
            MODE=$(python -c "import json;print(json.load(open('china-conversion-watches-request.json'))['action'])")
            DIALOG_JOB_ID=$(python -c "import json;print(json.load(open('china-conversion-watches-request.json')).get('job_id',''))")
          fi
          if [ "$MODE" = dialog_free ]; then
            python scripts/conversion_watches.py --exact-dialog-job "$DIALOG_JOB_ID"
            PYTHONPATH=scripts:source python scripts/china_free_ad_work.py --job-id "$DIALOG_JOB_ID"
          elif [ "$MODE" = codex_setup ]; then
            PYTHONPATH=scripts:source python scripts/china_codex_runtime.py --setup-notice
          elif [ "$MODE" = economics_complete ]; then
            PYTHONPATH=scripts:source python scripts/china_codex_runtime.py --economics-only
          elif [ "$MODE" = codex_probe ]; then
            OPENAI_API_KEY="$NATIVE_CODEX_API_KEY" PYTHONPATH=scripts:source python scripts/china_codex_runtime.py --probe
            PYTHONPATH=scripts:source python scripts/china_codex_runtime.py --economics-only
          elif [ "$MODE" = menu_result ]; then
            PYTHONPATH=scripts:source python scripts/china_menu_analytics.py --recover-job "$DIALOG_JOB_ID"
          elif [ "$MODE" = dialog ]; then
            python scripts/conversion_watches.py --exact-dialog-job "$DIALOG_JOB_ID"
          elif [ "$MODE" = reports ]; then
            python scripts/conversion_watches.py --reports-only
          elif [ "$MODE" = verify ]; then
            python scripts/conversion_watches.py --verify
          elif [ "$MODE" = smoke ]; then
            python scripts/conversion_watches.py --smoke
          else
            python scripts/conversion_watches.py
          fi


      - name: Collect or deliver exact initial chat job
        if: success() && steps.cloud_initial.outputs.job_id != '' && contains(fromJSON('["collecting","waiting_analytics","ready","existing_outbox"]'), steps.cloud_initial.outputs.status)
        env:
          DIALOG_JOB_ID: ${{ steps.cloud_initial.outputs.job_id }}
          WB_FINANCE_TOKEN_3: ${{ secrets.WB_FINANCE_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_ANALYSIS_BACKEND: managed_codex
          PYTHONPATH: source
        run: python scripts/conversion_watches.py --exact-dialog-job "$DIALOG_JOB_ID"


      - name: Continue collected chat analytics 1 of 3
        id: cloud_continue_1
        if: success() && contains(fromJSON('["collecting","waiting_analytics"]'), steps.cloud_initial.outputs.status)
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # Owner10Nov: scoped bounded Sol dialogue only
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -o pipefail
          python -u scripts/china_codex_cloud.py --job-id "${{ steps.cloud_initial.outputs.job_id }}" | tee "$RUNNER_TEMP/china-cloud-1.json"
          python -c "import json,os; r=json.load(open(os.environ['RUNNER_TEMP']+'/china-cloud-1.json')); f=open(os.environ['GITHUB_OUTPUT'],'a'); f.write('status='+str(r['status'])+'\\njob_id='+str(r.get('job_id',''))+'\\n')"
      - name: Collect or deliver exact continued chat job 1
        if: success() && steps.cloud_continue_1.outputs.job_id != '' && contains(fromJSON('["collecting","waiting_analytics","ready","existing_outbox"]'), steps.cloud_continue_1.outputs.status)
        env:
          DIALOG_JOB_ID: ${{ steps.cloud_continue_1.outputs.job_id }}
          WB_FINANCE_TOKEN_3: ${{ secrets.WB_FINANCE_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_ANALYSIS_BACKEND: managed_codex
          PYTHONPATH: source
        run: python scripts/conversion_watches.py --exact-dialog-job "$DIALOG_JOB_ID"

      - name: Continue collected chat analytics 2 of 3
        id: cloud_continue_2
        if: success() && contains(fromJSON('["collecting","waiting_analytics"]'), steps.cloud_continue_1.outputs.status)
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # Owner10Nov: scoped bounded Sol dialogue only
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -o pipefail
          python -u scripts/china_codex_cloud.py --job-id "${{ steps.cloud_initial.outputs.job_id }}" | tee "$RUNNER_TEMP/china-cloud-2.json"
          python -c "import json,os; r=json.load(open(os.environ['RUNNER_TEMP']+'/china-cloud-2.json')); f=open(os.environ['GITHUB_OUTPUT'],'a'); f.write('status='+str(r['status'])+'\\njob_id='+str(r.get('job_id',''))+'\\n')"
      - name: Collect or deliver exact continued chat job 2
        if: success() && steps.cloud_continue_2.outputs.job_id != '' && contains(fromJSON('["collecting","waiting_analytics","ready","existing_outbox"]'), steps.cloud_continue_2.outputs.status)
        env:
          DIALOG_JOB_ID: ${{ steps.cloud_continue_2.outputs.job_id }}
          WB_FINANCE_TOKEN_3: ${{ secrets.WB_FINANCE_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_ANALYSIS_BACKEND: managed_codex
          PYTHONPATH: source
        run: python scripts/conversion_watches.py --exact-dialog-job "$DIALOG_JOB_ID"

      - name: Continue collected chat analytics 3 of 3
        id: cloud_continue_3
        if: success() && contains(fromJSON('["collecting","waiting_analytics"]'), steps.cloud_continue_2.outputs.status)
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # Owner10Nov: scoped bounded Sol dialogue only
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -o pipefail
          python -u scripts/china_codex_cloud.py --job-id "${{ steps.cloud_initial.outputs.job_id }}" | tee "$RUNNER_TEMP/china-cloud-3.json"
          python -c "import json,os; r=json.load(open(os.environ['RUNNER_TEMP']+'/china-cloud-3.json')); f=open(os.environ['GITHUB_OUTPUT'],'a'); f.write('status='+str(r['status'])+'\\njob_id='+str(r.get('job_id',''))+'\\n')"
      - name: Collect or deliver exact continued chat job 3
        if: success() && steps.cloud_continue_3.outputs.job_id != '' && contains(fromJSON('["collecting","waiting_analytics","ready","existing_outbox"]'), steps.cloud_continue_3.outputs.status)
        env:
          DIALOG_JOB_ID: ${{ steps.cloud_continue_3.outputs.job_id }}
          WB_FINANCE_TOKEN_3: ${{ secrets.WB_FINANCE_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_ANALYSIS_BACKEND: managed_codex
          PYTHONPATH: source
        run: python scripts/conversion_watches.py --exact-dialog-job "$DIALOG_JOB_ID"

      - name: Apply only newly owner-approved loss plan items and report gaps
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.action == 'dialog' || github.event_name == 'push' && contains(github.event.head_commit.message, '[dialog-recovery]'))
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          PYTHONPATH: scripts:source
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
        run: python scripts/china_loss_execute.py




  explicit_cohort_prices:
    needs: watches
    if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.action == 'dialog')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: china-confirmed-wb-price-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/
            /*request*.json
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 Pillow==11.3.0
      - run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_china_zero_order_price_command.py'
      - name: Execute only exact human percent commands bound to delivered reports
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          PYTHONPATH: scripts
        run: |
          python -m unittest discover -s scripts -p 'test_china_catalog_price_*.py'
          python scripts/china_zero_order_price_execute.py --drain
          python scripts/china_catalog_price_execute.py --drain

  hourly-sales-fallback:
    name: Recover missing hourly read-only sales snapshot
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/china-hourly-sales-read.yml
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
      OPENAI_API_KEY: "" # Owner: no paid model API




  price-morning-fallback:
    name: Recover due China price morning report
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/china-price-morning.yml
    secrets: inherit

  price-intraday-fallback:
    name: Recover due China price intraday report
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/china-price-intraday.yml
    secrets: inherit

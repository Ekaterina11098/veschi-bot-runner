name: Finish only verified blocked owner report actions 09Nov
on:
  push:
    paths:
      - '.github/workflows/owner-report9-recover-blocked-v1.yml'
permissions:
  contents: read
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1fc94106bc8e208169b1bd32a670b474e2e08d82
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Known preflight blockers only, exact original grant and amounts, fresh verification and final Telegram receipt
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import os,json,copy,time,base64,hashlib,io as bio,textwrap
          from datetime import datetime,timezone
          import requests
          from china_loss_execute import IO as BaseIO
          from china_loss_control import PLAN,CHAT,BOT,OWNER,digest
          from china_daily_ad_actions import execute,EXEC
          from china_daily_report_validity import require
          AUTH_ROOT='china_agent:owner_report_apply:2026-11-09:v1'
          ROOT=AUTH_ROOT+':recovery1'
          class IO(BaseIO):
           def put(self,k,v):
            if self.get(k) is None:
             if not self.create(k,v):raise RuntimeError('Concurrent state creation')
            else:super().put(k,v)
           def validate_owner(self,a):
            grant=self.get(AUTH_ROOT+':authorization')or{}
            if grant.get('status')!='owner_approved' or grant.get('author_id')!=OWNER or a.get('owner_command_key')!=AUTH_ROOT+':authorization':raise ValueError('Explicit Codex owner grant missing')
            parent=self.get(PLAN+a['parent_plan_id']);child=self.get(PLAN+a['plan_id'])
            if grant['plan_hashes'].get(a['family'])!=parent['plan_sha256']or child['plan_sha256']!=a['plan_sha256']or any(i not in parent['items']for i in child['items']):raise ValueError('Exact recovery subset changed')
            super().validate_owner(a)
          def stamp():return datetime.now(timezone.utc).isoformat()
          def funding_preflight(io,item,before):
           """Same exact approved amount; complete missing inputs with dated current reads."""
           from china_morning_readiness import current_prices,published_stock
           from china_moysklad_read import read_stock
           e=copy.deepcopy(item.get('budget_evidence')or{})
           if not e or e.get('coverage',0)<.9 or e.get('modeled_after_ads_cny',0)<=0 or e.get('stress_after_ads_cny',0)<=0:raise ValueError('Funding conservative economics not positive')
           actual={str(n['nm_id']):n['bids_kopecks']for n in before['nm_settings']}
           expected=copy.deepcopy(e['expected_bids'])
           for family in ['budgets','drr']:
            source=io.get(PLAN+'daily-2026-11-09-owner-v4-'+family);ledger=io.get(EXEC+source['plan_id']);items={x['id']:x for x in source['items']}
            for state in ledger['items']:
             action=items[state['id']]
             if state['status']!='verified'or action['campaign_id']!=item['campaign_id']:continue
             nm=str(action.get('nm_id',''))
             if action['kind']=='ad_set_bid':expected[nm][action['placement']]=action['target_minor']
             elif action['kind']=='ad_exclude_sku':expected.pop(nm,None)
           if actual!=expected:raise ValueError('Campaign differs from original plus verified owner changes')
           prices=current_prices(io,list(map(int,actual)));pub=published_stock(io,prices,list(map(int,actual)))
           stock=read_stock([r['article']for r in prices['rows']]);rows={r['article'].casefold():r for r in stock['rows']}
           if not stock['coverage_complete']or pub['missing_nm_ids']:raise ValueError('Current funding input coverage incomplete')
           delta=0;filled=[];checks=[]
           for r in prices['rows']:
            nm=str(r['nm_id']);old=e['member_inputs'][nm];st=rows[r['article'].casefold()];free=st['stock']-st['reserve'];published=pub['amounts'][nm]
            if free<=0 and published==0 and e['attributed_orders_by_nm'].get(nm,0)==0:
             checks.append(dict(nm_id=nm,stock_free=free,published_stock=published,unavailable=True,unknown_COGS_retained=old.get('cost')is None));continue
            if old.get('price')is None or old.get('cost')is None or old.get('stock_free')is None:
             if not st.get('price')or st['price']<=0:raise ValueError('Missing current own COGS')
             old.update(price=r['seller_price'],cost=st['price']/100,stock_free=free,published_stock=published);filled.append(nm)
            if r['seller_price']!=old['price']:raise ValueError('Funding seller price changed for '+r['article'])
            # Owner08Nov: MSK free stock is availability source; published WB zero is retained, not an automatic veto.
            if free<=0:
             if e['attributed_orders_by_nm'].get(nm,0)>0:raise ValueError('No free MSK stock for attributed member '+r['article'])
             checks.append(dict(nm_id=nm,stock_free=free,published_stock=published,unavailable=True));continue
            if not st.get('price')or st['price']<=0:raise ValueError('Funding current COGS missing')
            q=old.get('buyout');fx=float(old['fx'])
            if q is None and st['price']/100>old['cost']:raise ValueError('Higher COGS with unknown own buyout')
            if q is not None:delta+=e['attributed_orders_by_nm'].get(nm,0)*q*(st['price']/100-old['cost'])/fx
            checks.append(dict(nm_id=nm,stock_free=free,published_stock=published,price=r['seller_price'],cost=st['price']/100))
           if min(e['modeled_after_ads_cny'],e['stress_after_ads_cny'])-delta<=0:raise ValueError('Current COGS no longer supports conservative funding economics')
           proof=dict(status='verified',observed_at=stamp(),campaign_id=item['campaign_id'],amount_cny=item['amount_cny'],filled_member_inputs=filled,checks=checks,conservative_after_ads_cny=e['stress_after_ads_cny']-delta,wb_writes=0)
           io.put(ROOT+':funding_preflight:'+str(item['campaign_id']),proof)
          def addition_proven(item,s):
           if s.get('status')!='verified':return False
           b=s.get('before',{});a=s.get('after',{});old={x['nm_id']:x for x in b.get('nm_settings',[])};new={x['nm_id']:x for x in a.get('nm_settings',[])};nm=item['nm_id']
           return b.get('id')==a.get('id')==item['campaign_id'] and b.get('settings')==a.get('settings')and b.get('status')==a.get('status')and set(new)==set(old)|{nm}and all(new[k]==v for k,v in old.items())and new[nm]['subject']['id']==item['subject_id']and new[nm]['bids_kopecks'].get(item['placement'])==item['target_minor']
          def send_result(p,e):
           from china_execution_notice import proven
           from PIL import Image,ImageDraw,ImageFont
           byid={x['id']:x for x in p['items']};records=[];verified=[];blocked=[];uncertain=[]
           for s in e['items']:
            item=byid[s['id']];ok=addition_proven(item,s)if item['kind']=='ad_add_sku'else proven(item,s)
            if ok:verified.append(item)
            elif s.get('status')=='blocked':blocked.append(item)
            else:uncertain.append(item)
            label=item.get('article','РК '+str(item['campaign_id']))
            action=('Пополнить +'+str(item['amount_cny'])+' CNY')if item['kind']=='topup_campaign'else 'Добавить '+str(item['target_minor']/100)+' CNY'if item['kind']=='ad_add_sku'else 'Исключить'if item['kind']=='ad_exclude_sku'else str(item['old_minor']/100)+' → '+str(item['target_minor']/100)+' CNY'
            result='Проверено WB'+(' · уже выполнено, без повторной записи'if s.get('already_done')else '')if ok else 'Не выполнено: '+s.get('reason','проверка не пройдена')if s.get('status')=='blocked'else 'Требуется проверка результата; повторной записи нет'
            records.append((label,str(item['campaign_id']),action,result))
           family=p['family'];caption='Результат выполнения '+('бюджетов'if family=='budgets'else 'рекламных рекомендаций')+' 09.11: проверено WB '+str(len(verified))+' из '+str(len(p['items']))+'.'
           if family=='budgets':caption+=' Подтверждённые пополнения: '+str(sum(x['amount_cny']for x in verified if x['kind']=='topup_campaign'))+' CNY.'
           if blocked:caption+=' Не выполнено: '+str(len(blocked))+', причины в таблице.'
           if uncertain:caption+=' Неподтверждённый результат: '+str(len(uncertain))+'. Повторно не запускал.'
           font='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf';normal=ImageFont.truetype(font,22);bold=ImageFont.truetype(font,25)
           wrapped=[(textwrap.wrap(a,29),b,c,textwrap.wrap(d,58))for a,b,c,d in records];heights=[max(len(a),len(d),1)*30+28 for a,b,c,d in wrapped];im=Image.new('RGB',(1900,150+sum(heights)), 'white');dr=ImageDraw.Draw(im);dr.text((25,20),caption[:115],font=bold,fill='#122e44');y=100
           for (a,b,c,d),h in zip(wrapped,heights):
            dr.rectangle((20,y,1880,y+h-4),fill='#eff5f7');dr.text((30,y+10),'\n'.join(a),font=normal,fill='black');dr.text((450,y+10),b,font=normal,fill='black');dr.text((650,y+10),c,font=normal,fill='black');dr.text((1030,y+10),'\n'.join(d),font=normal,fill='#166534'if d[0].startswith('Проверено')else '#a31a1a');y+=h
           out=bio.BytesIO();im.save(out,format='PNG');raw=out.getvalue();key=ROOT+':delivery:'+family
           record=dict(status='sending',caption=caption,sha256=hashlib.sha256(raw).hexdigest(),verified_count=len(verified),blocked_count=len(blocked),uncertain_count=len(uncertain),verified_amount_cny=sum(x.get('amount_cny',0)for x in verified),created_at=stamp(),chat_id=CHAT,bot_id=BOT)
           if not io.create(key,record):return
           io.put(ROOT+':result_artifact:'+family,dict(b64=base64.b64encode(raw).decode(),records=records,sha256=record['sha256']))
           try:
            response=requests.post('https://api.telegram.org/bot'+io.bot+'/sendPhoto',data={'chat_id':CHAT,'caption':caption,'reply_parameters':json.dumps(dict(message_id=p['report_message_ids'][0],allow_sending_without_reply=True))},files={'photo':('execution-result.png',raw,'image/png')},timeout=50).json()
            if not response.get('ok'):raise RuntimeError('Telegram result rejected')
            r=response['result'];assert r['chat']['id']==CHAT and r['from']['id']==BOT and r.get('message_id')
            record.update(status='sent',message_id=r['message_id'],receipt=r,sent_at=stamp());io.put(key,record)
           except Exception:
            record['status']='uncertain';io.put(key,record);raise RuntimeError('Telegram result uncertain; no blind retry')from None
           return record
          
          def minimum_preflight_addition(io,item,before):
           """Execution preflight only; this function makes no marketplace writes."""
           import requests
           from china_advertising_v2 import http
           from china_morning_readiness import current_prices,published_stock
           from china_moysklad_read import read_stock
           from china_advertising_growth import fresh
           e=item.get('growth_evidence')or{};now=datetime.now(timezone.utc)
           if item.get('direction')!='add'or item.get('exact_addition_quote')is not True or (not fresh(e.get('observed_at'),now,2)and not getattr(io,'daily_report_current_revalidation',False))or e.get('period_to','9999')>=str(now.astimezone(ZoneInfo('Europe/Moscow')).date()):raise ValueError('Addition evidence stale or not exact')
           nm=item['nm_id'];cid=item['campaign_id']
           if before['id']!=cid or before['status']!=9 or before['currency']!='CNY'or before['bid_type']!='manual'or before['settings']['payment_type']!='cpc'or before['settings']['placements'].get(item['placement'])is not True or not before.get('restrictions',{}).get('can_change_nms')or len(before['nm_settings'])>=50:raise ValueError('Addition campaign changed')
           if {n['subject']['id']for n in before['nm_settings']}!={item['subject_id']}:raise ValueError('Addition category changed')
           prices=current_prices(io,[nm]);p=prices['rows'][0];stock=read_stock([item['article']]);pub=published_stock(io,prices,[nm])
           if p['article'].casefold()!=item['article'].casefold()or p['seller_price']!=e['price_cny']or not stock['coverage_complete']or stock['rows'][0]['stock']-stock['rows'][0]['reserve']<=0 or pub['amounts'].get(str(nm),0)<=0:raise ValueError('Addition price/stock unknown or changed')
           st=stock['rows'][0];delta=e['buyout']*(st['price']/100-e['own_cogs_rub'])/e['fx_rub_per_cny']
           if st['price']<=0 or e['expected_margin_before_ads_cny']-delta<=0:raise ValueError('Addition current economics no longer positive')
           cfg=http(io,'/api/advert/v1/config')
           if cfg['currency']!='CNY'or item['target_minor']%cfg['cpcStep']or item['target_minor']>cfg['cpcMaxBid']:raise ValueError('Addition bid step changed')
           if item.get('minimum_source')!='saved_same_campaign_category_placement':raise ValueError('Owner-reviewed saved category minimum unavailable')
           reference=min(before['nm_settings'],key=lambda n:n['bids_kopecks'][item['placement']])['nm_id']
           q=http(io,'/api/advert/v1/bids/min','POST',dict(advert_id=cid,nm_ids=[reference],payment_type='cpc',placement_types=['recommendation']))
           vals=[b['value']for row in q.get('bids',[])if row['nm_id']==reference for b in row['bids']if b['currency']=='CNY'and b['type']=='recommendation']
           if len(vals)!=1 or vals[0]>item['target_minor']:raise ValueError('Compatible campaign/category minimum changed')
           io.put(ROOT+':minimum_preflight:'+str(nm),dict(observed_at=stamp(),reference_nm_id=reference,new_nm_id=nm,minimum_minor=vals[0],approved_minor=item['target_minor'],basis='Owner-approved saved same-campaign/category placement minimum, checked on existing member; exact new member minimum checked after adding before approved bid write',exact_new_member_quote=False))
          
           balance=http(io,'/api/advert/v2/budget','POST',dict(advertIds=[cid]))['adverts']
           if len(balance)!=1 or balance[0]['currency']!='CNY'or balance[0]['total']<e['campaign_reserve_required_cny']:raise ValueError('Addition three-day reserve unavailable')
          
          
          _original_request=requests.request
          _last_min=0
          def paced_request(method,url,**kwargs):
           global _last_min
           path=url.split('wildberries.ru',1)[-1]
           if method.upper()=='PATCH'and path=='/api/advert/v1/bids':
            for group in (kwargs.get('json')or{}).get('bids',[]):
             for bid in group.get('nm_bids',[]):
              if bid['nm_id']not in approved_add_ids:continue
              q=paced_request('POST','https://advert-api.wildberries.ru/api/advert/v1/bids/min',headers=kwargs['headers'],json=dict(advert_id=group['advert_id'],nm_ids=[bid['nm_id']],payment_type='cpc',placement_types=['recommendation']),timeout=45)
              if not q.ok:raise ValueError('Exact added-member minimum read unavailable')
              vals=[b['value']for row in q.json().get('bids',[])if row['nm_id']==bid['nm_id']for b in row['bids']if b['type']=='recommendation'and b['currency']=='CNY']
              if len(vals)!=1 or vals[0]>bid['bid_kopecks']:raise ValueError('Exact added-member minimum exceeds approved bid')
              io.put(ROOT+':minimum_after_add:'+str(bid['nm_id']),dict(observed_at=stamp(),minimum_minor=vals[0],approved_minor=bid['bid_kopecks'],exact_new_member_quote=True))
           if method.upper()=='POST'and path=='/api/advert/v1/bids/min':
            time.sleep(max(0,15-(time.monotonic()-_last_min)))
            for attempt in range(2):
             r=_original_request(method,url,**kwargs);_last_min=time.monotonic()
             if r.status_code!=429 or attempt==1:return r
             time.sleep(45)
            return r
           return _original_request(method,url,**kwargs)
          
          def adjusted_addition(io,item,before):
           clone=copy.deepcopy(item);original=clone['growth_evidence']['campaign_reserve_required_cny'];removed=0;details=[]
           source=io.get(PLAN+'daily-2026-11-09-owner-v4-drr');ledger=io.get(EXEC+source['plan_id']);actions={x['id']:x for x in source['items']}
           artifact=io.get('china_agent:owner_report_replace:2026-11-09:v4:before_artifacts')
           campaign=next(c for c in artifact['bundle']['campaigns']if c['id']==item['campaign_id'])
           for state in ledger['items']:
            action=actions[state['id']]
            if state['status']!='verified'or action['kind']!='ad_exclude_sku'or action['campaign_id']!=item['campaign_id']:continue
            if any(n['nm_id']==action['nm_id']for n in before['nm_settings']):raise ValueError('Excluded SKU returned')
            row=next((r for r in campaign['focus']if r['nm']==action['nm_id']),None)
            if not row or not row.get('period'):raise ValueError('Excluded SKU completed-day spend missing')
            spend=row['period']['spend'];removed+=spend;details.append(dict(nm_id=action['nm_id'],spend_cny=spend))
           clone['growth_evidence']['campaign_reserve_required_cny']=round(max(0,original-removed),2)
           io.put(ROOT+':reserve:'+str(item['nm_id']),dict(original_need=original,removed_forecast=details,revised_need=clone['growth_evidence']['campaign_reserve_required_cny'],reason='Future reserve excludes verified removed traffic; historical spend preserved'))
           return original_addition(io,clone,before)
          
          io=IO()
          if io.get(ROOT):print('Existing recovery; no replay');raise SystemExit(0)
          root=dict(status='preflight',started_at=stamp(),plans={},wb_writes=0)
          assert io.create(ROOT,root)
          try:
           assert (io.get(AUTH_ROOT)or{}).get('status')=='completed'
           grant=io.get(AUTH_ROOT+':authorization');assert grant['status']=='owner_approved'
           import china_budget_ready_model,china_advertising_full_growth
           china_budget_ready_model.validate_funding=funding_preflight
           original_addition=minimum_preflight_addition
           approved_add_ids={i['nm_id']for i in io.get(PLAN+'daily-2026-11-09-owner-v4-drr')['items']if i['kind']=='ad_add_sku'}
           requests.request=paced_request
           china_advertising_full_growth.validate_addition=adjusted_addition
           for family in ['budgets','drr']:
            parent=io.get(PLAN+'daily-2026-11-09-owner-v4-'+family);require(io,parent)
            old=io.get(EXEC+parent['plan_id']);byid={x['id']:x for x in parent['items']}
            if any(s['status']in('submitting','accepted','uncertain','preflight')for s in old['items']):raise ValueError('Uncertain original state; no retry')
            eligible=[s for s in old['items']if s['status']=='blocked'and(s.get('reason')=='Missing current own COGS'or s.get('reason') in ('Addition three-day reserve unavailable','China advertising read HTTP 400','China advertising read HTTP 429','WB advertising HTTP 429'))]
            child=None;recovered=None
            if eligible:
             child=copy.deepcopy(parent);child.update(plan_id=parent['plan_id']+'-recovery1',items=[byid[s['id']]for s in eligible],parent_plan_id=parent['plan_id'],parent_plan_sha256=parent['plan_sha256'])
             child['plan_sha256']=digest(child['items']);assert io.create(PLAN+child['plan_id'],child)
             a=dict(sender_id=OWNER,chat_id=CHAT,bot_id=BOT,job_id=278 if family=='budgets'else 277,input_message_id=None,reply_message_id=parent['report_message_ids'][0],created_at=grant['created_at'],plan_id=child['plan_id'],plan_sha256=child['plan_sha256'],family=family,parent_plan_id=parent['plan_id'],owner_command_key=AUTH_ROOT+':authorization')
             root['current_family']=family;io.put(ROOT,root);recovered=execute(io,a,child)
             root['plans'][family]=dict(execution_key=EXEC+child['plan_id'],items=[{k:s.get(k)for k in('id','status','reason')}for s in recovered['items']]);root['wb_writes']+=recovered['wb_writes'];io.put(ROOT,root)
             assert io.create(ROOT+':before_ledger:'+family,old)
             merged=copy.deepcopy(old);new={s['id']:s for s in recovered['items']}
             for i,s in enumerate(merged['items']):
              if s['id']in new:
               replacement=copy.deepcopy(new[s['id']]);replacement.update(original_attempt=s,recovery_execution_key=EXEC+child['plan_id']);merged['items'][i]=replacement
             merged.update(wb_writes=old['wb_writes']+recovered['wb_writes'],recovery_execution_key=EXEC+child['plan_id'],completed_at=stamp())
             io.put(EXEC+parent['plan_id'],merged)
            final=io.get(EXEC+parent['plan_id']);record=send_result(parent,final)
            root['plans'].setdefault(family,{})['final_delivery']=record
            if family=='drr'and recovered:
             registry=io.get('china_agent:verified_campaign_state:v1')or{}
             for cid in sorted({byid[s['id']]['campaign_id']for s in recovered['items']if s['status']=='verified'}):
              states=[s for s in recovered['items']if s['status']=='verified'and byid[s['id']]['campaign_id']==cid]
              previous=io.get(registry.get(str(cid),''))or{}
              key=ROOT+':campaign:'+str(cid);io.put(key,dict(status='verified',before=previous.get('before',states[0]['before']),after=states[-1]['after'],verified_at=stamp(),previous_receipt_key=registry.get(str(cid)),source_execution=ROOT,items=states));registry[str(cid)]=key
             io.put('china_agent:verified_campaign_state:v1',registry)
            io.put(ROOT,root)
           root.update(status='completed',completed_at=stamp());io.put(ROOT,root);print('Recovery completed; exact WB and TG receipts private')
          except Exception as ex:
           root.update(status='attention_required',error_type=type(ex).__name__,error=str(ex)if isinstance(ex,(ValueError,RuntimeError))else type(ex).__name__);io.put(ROOT,root);print('Recovery stopped; inspect journal');raise SystemExit(1)
          
          PY

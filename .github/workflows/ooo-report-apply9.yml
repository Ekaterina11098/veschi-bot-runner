name: OOO one approved midday manifest
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ooo-report-apply9.yml']
permissions:
  contents: read
concurrency:
  group: ooo-token1-owner-writes
  cancel-in-progress: false
jobs:
  apply:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 54a58b9d8f0f253a2fe03bf8e8456b0f1d7f9bd6
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 --quiet
      - run: python -m py_compile scripts/ooo_report_apply9.py
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
        run: python -u scripts/ooo_report_apply9.py

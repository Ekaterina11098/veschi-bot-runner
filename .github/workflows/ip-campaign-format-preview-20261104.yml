name: Verify approved IP campaign layout from retained data only
on:
  push:
    branches: [main]
    paths: ['.github/disabled/ip-campaign-format-preview-20261104.never']
permissions:
  contents: read
concurrency:
  group: ip-daily-format-preview-only
  cancel-in-progress: true
jobs:
  retained:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2ec826507f2b7a3d550ad3842bd4420c422d9c55
          sparse-checkout: |
            advertising_daily_tables_owner.py
            ip_daily_png_contract.py
            ip_campaign_table_png.py
            ip_budget_table_png.py
            ip_daily_retained_review.py
            advertising_daily_png.py
            advertising_budget_evidence.py
            stock_deploy_support.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 2f798a9509b72030d6fb5ec68fb915c5d216c31b
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 cryptography==46.0.2 Pillow==12.3.0 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Existing daily main, preview before delivery claims; no WB or Telegram token
        run: |
          python - <<'PY'
          import advertising_daily_tables_owner as daily
          result = daily.main()
          daily.store.cache_set('advertising:ip:daily-format-preview:v1:2026-11-04', result, ttl_days=14)
          if result.get('business_status') != 'complete':
              raise SystemExit(1)
          assert result.get('telegram_calls') == 0 and result.get('wb_writes') == 0
          assert result.get('notification_status') == 'saved_preview_only_no_claims_no_telegram'
          PY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          IP_DAILY_FORMAT_PREVIEW_ONLY: 'true'
          ADVERTISING_EXECUTION_ENABLED: 'false'

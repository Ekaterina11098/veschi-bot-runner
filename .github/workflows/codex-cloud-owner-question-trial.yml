name: One-shot cloud Telegram owner question trial
on:
  push:
    branches: [main]
    paths: ['.github/workflows/codex-cloud-owner-question-trial.yml']
permissions:
  contents: read
concurrency:
  group: codex-cloud-one-owner-trial
  cancel-in-progress: false
jobs:
  question:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ca996dd983ce2294feda886471d36d78347fe41d
          persist-credentials: false
          sparse-checkout: scripts/codex_cloud_owner_question_trial.py
          sparse-checkout-cone-mode: false
      - run: pip install openai==3.42.1 --quiet
      - name: Wait for one exact owner test question
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -u scripts/codex_cloud_owner_question_trial.py

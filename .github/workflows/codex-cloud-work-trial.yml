name: Codex isolated work-memory continuity trial
on:
  push:
    branches: [main]
    paths: ['.github/workflows/codex-cloud-work-trial.yml']
permissions:
  contents: read
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b095015c3ba131f01054361becb45cbd2038218d
          persist-credentials: false
          sparse-checkout: scripts/codex_cloud_work_trial.py
          sparse-checkout-cone-mode: false
      - run: pip install openai==3.42.1 --quiet
      - name: start private work-only session
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TRIAL_PHASE: start
        run: python -u scripts/codex_cloud_work_trial.py
  resume:
    needs: start
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b095015c3ba131f01054361becb45cbd2038218d
          persist-credentials: false
          sparse-checkout: scripts/codex_cloud_work_trial.py
          sparse-checkout-cone-mode: false
      - run: pip install openai==3.42.1 --quiet
      - name: resume private work-only session
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TRIAL_PHASE: resume
        run: python -u scripts/codex_cloud_work_trial.py

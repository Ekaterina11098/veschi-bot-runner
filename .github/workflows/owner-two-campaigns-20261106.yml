name: Owner two campaign approval 6 November
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-two-campaigns-20261106.yml']
permissions:
  contents: read
concurrency:
  group: china-confirmed-advertising-writes
  cancel-in-progress: false
jobs:
  apply:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Apply exact private approval without Telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from china_cloud_cost_control import Cache
          code=Cache().get('china_agent:owner_two_campaigns_apply:2026-11-06:v1:script')['code']
          exec(compile(code,'private-owner-approval','exec'),{'__name__':'__main__'})
          PY

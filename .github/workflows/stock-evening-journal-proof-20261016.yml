name: Read evening stock journal only, no source execution
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stock-evening-journal-proof-20261016.yml']
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'psycopg[binary]==3.2.9' cryptography==46.0.2 > "$RUNNER_TEMP/read-install.log" 2>&1
      - name: Read-only transaction, no WB or Telegram credentials
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import json
          from stock_deploy_support import runtime_db,seal,error
          result={'wb_calls':0,'source_calls':0,'db_writes':0,'telegram_calls':0}
          try:
              with runtime_db() as db:
                  db.execute('SET TRANSACTION READ ONLY')
                  row=db.execute('SELECT snapshot,created FROM stock_runs WHERE id=%s',('technical:stock-daily:2026-10-16',)).fetchone()
                  if row is None:raise RuntimeError('Evening technical claim absent')
                  snap=json.loads(row[0]);started=snap['started']
                  result['technical']={k:v for k,v in snap.items() if k not in ('cache','source_snapshot')}
                  source=snap.get('source_snapshot') or {}
                  result['source_observation']={k:source.get(k) for k in ('received_at','moscow_status','catalog_proofs','unresolved')}
                  ops=db.execute("SELECT r.id,r.snapshot,o.seq,o.body,o.state FROM stock_runs r JOIN stock_operations o ON o.run=r.id WHERE r.origin='cloud' AND r.created>=%s ORDER BY r.created,o.seq",(started,)).fetchall()
                  result['operations']=[dict(run=r[0],article=json.loads(r[1]).get('article'),seq=r[2],body=json.loads(r[3]),state=r[4]) for r in ops]
                  events=db.execute("SELECT id,run,state,detail FROM stock_events WHERE at>=%s ORDER BY at",(started,)).fetchall()
                  result['events']=[dict(id=r[0],run=r[1],state=r[2],detail=json.loads(r[3])) for r in events]
                  result['success']=True
          except Exception as exc:result.update(success=False,error=error(exc))
          finally:seal('stock-evening-journal',result)
          print(json.dumps({'success':result['success'],'operations':len(result.get('operations',[])),'source_calls':0,'db_writes':0}))
          raise SystemExit(0 if result['success'] else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-evening-journal-readonly
          path: ${{ runner.temp }}/stock-deploy-proof/*.aes.json
          retention-days: 90
      - name: Ciphertext only
        if: always()
        run: |
          mkdir -p recovery-output/2026-10-16
          cp "$RUNNER_TEMP/stock-deploy-proof/stock-evening-journal.aes.json" "recovery-output/2026-10-16/stock-evening-journal-${{ github.run_id }}.aes.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-output/2026-10-16/
          git commit -m "Preserve encrypted existing evening stock journal read only"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
          done
          exit 1

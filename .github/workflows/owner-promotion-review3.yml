name: Owner promotion review read only 3Nov
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-promotion-review3.yml']
permissions: {contents: read}
jobs:
  read:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: |
          mkdir -p scripts
          for f in china_cloud_cost_control.py china_moysklad_read.py owner_promotion_review3.py; do
            curl --fail --location --retry 2 --max-time 60 https://raw.githubusercontent.com/Ekaterina11098/veschi-bot-runner/afeb266f608e24bda88068bf70de363d8cdcc08a/scripts/$f -o scripts/$f
          done
          python -m pip install requests==2.32.5
      - name: Read current exact file scope without marketplace mutations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          PYTHONPATH: scripts
        run: python -u scripts/owner_promotion_review3.py

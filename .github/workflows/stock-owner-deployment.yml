name: Owner approved PR20 deployment only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stock-owner-deployment.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: veshi-storage-maintenance
  cancel-in-progress: false
jobs:
  deploy:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b1f54e3770fba9aabbe7773c2106fc6d56c92911
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'psycopg[binary]==3.2.9' cryptography > "$RUNNER_TEMP/deploy-install.log" 2>&1
      - name: Limited role and committed technical journal readback only
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PYTHONPATH: ${{ github.workspace }}/private-source
        run: python stock_owner_provision.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-owner-deployment-proof
          path: ${{ runner.temp }}/stock-deploy-proof
          retention-days: 90
      - name: Retain only sealed evidence independent of owner computer
        if: always()
        run: |
          mkdir -p recovery-output/2026-10-15
          cp "$RUNNER_TEMP/stock-deploy-proof/deployment.aes.json" "recovery-output/2026-10-15/deployment-$GITHUB_RUN_ID.aes.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovery-output/2026-10-15
          git commit -m "Preserve sealed owner approved stock deployment proof" && git push

name: FBS document chain API inspection
# JSON and gzip transport verified
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fbs-document-chain-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fbs-document-chain
  cancel-in-progress: false
jobs:
  inspect:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect APIs and retain private results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: python scripts/fbs_document_chain_inspect.py

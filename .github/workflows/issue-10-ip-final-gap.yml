name: Issue 10 bounded IP data lineage audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/issue-10-ip-final-gap.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue-10-stock-read-only
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 416a7724b03709c876df0f12e2ac2659cfd7528e
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv aiogram apscheduler pillow > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Validate recovered evidence and bounded raw lineage
        env:
          TASK: issue-10-ip-lineage-repair
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          for pattern in ('test_ip_data_preservation.py','test_ip_sku_complete_review.py','test_postclick_evidence_guard.py'):
              run_private.execute('Evidence and safety regression '+pattern,['-m','unittest','discover','-s','tests','-p',pattern])
          run_private.execute('Bounded raw lineage audit and recovered pilot report',['-m','analytics.ip_data_quality_audit'])
          print('Bounded lineage audit and evidence regressions passed; private results saved.')
          PY

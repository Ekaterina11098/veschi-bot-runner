name: Recover owner requested morning report 10Nov
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-morning-recovery-20261110.yml']
permissions:
  actions: write
  contents: read
jobs:
  dispatch-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch existing report workflow on main; preserve schedule and receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,os,json
          req=urllib.request.Request("https://api.github.com/repos/Ekaterina11098/veschi-bot-runner/actions/workflows/china-advertising-daily.yml/dispatches",data=json.dumps({"ref":"main"}).encode(),headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=30) as r:print("dispatch_http_status",r.status)
          PY

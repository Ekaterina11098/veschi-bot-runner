name: Verify inline product links in China table
on:
  push:
    branches: [china-table-inline-links-20261019]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          PYTHONPATH=scripts python -m unittest discover -s scripts -p test_china_price_table.py -v
          PYTHONPATH=scripts python -m unittest discover -s scripts -p test_china_buyer_forecast.py -v
          PYTHONPATH=scripts python -m unittest discover -s scripts -p test_china_price_brief.py -v
          python -m compileall -q scripts/china_price_brief.py

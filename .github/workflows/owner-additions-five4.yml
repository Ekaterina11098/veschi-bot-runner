name: Owner approved five additions and100CNY recommendation funding
on:
  push:
    paths: ['.github/workflows/owner-additions-five4.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-additions-five4
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Bounded fresh growth economics; no model or Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import copy,json,os,time,requests
          from datetime import datetime,timezone
          from china_cloud_cost_control import Cache,WB,validate_identity,digest,stamp
          from china_advertising_state import AdvertisingIO
          from china_morning_readiness import current_prices,published_stock
          from china_moysklad_read import read_stock
          ROOT='china_agent:owner_additions_five:2026-11-04:v1'
          c=Cache();w=WB();io=AdvertisingIO()
          GROUPS={41298169:('search',[1473243898,1473243897,1473243902]),40933588:('recommendations',[1473243442,1473243896])}
          def norm(v):return json.loads(json.dumps(v))
          def put(k,v):
           v=norm(v)
           if c.get(k)is None:
            if not c.create(k,v):raise ValueError('Concurrent receipt creation')
           else:c.put(k,v)
          def auth():
           a=c.get(ROOT+':approval')or{}
           if a.get('execution_authorized')is not True or a.get('owner_user_id')!=5122667182 or a.get('source_channel')!='codex' or a.get('telegram_notice_authorized')is not True:raise ValueError('Exact owner authority missing')
           if datetime.now(timezone.utc)>datetime.fromisoformat(a['expires_at']):raise ValueError('Approval expired')
           actual={(i['campaign_id'],i['nm_id'],i['placement'],i['max_bid_minor'])for i in a['items']if i['kind']=='ad_add_sku'}
           expected={(cid,nm,z,30)for cid,(z,ids)in GROUPS.items()for nm in ids}
           if actual!=expected or [i for i in a['items']if i['kind']=='topup_campaign']!=[dict(kind='topup_campaign',campaign_id=40933588,amount_cny=100)]:raise ValueError('Owner scope changed')
           return a
          def req(path,method='GET',body=None):
           time.sleep(1.5)
           r=requests.request(method,'https://advert-api.wildberries.ru'+path,headers={'Authorization':w.token},json=body,timeout=50)
           if not r.ok:raise RuntimeError('WB HTTP '+str(r.status_code)+' '+r.text[:700])
           return r.json()if r.content else {}
          def campaign(cid):return w.campaigns([cid])[str(cid)]
          def budget(cid):
           rows=w.req('/api/advert/v2/budget','POST',dict(advertIds=[cid]))['adverts']
           if len(rows)!=1 or rows[0]['currency']!='CNY':raise ValueError('Budget currency/coverage')
           return rows[0]['total']
          def fixed_equal(a,b):
           return a['id']==b['id']and a['status']==b['status']and a['settings']==b['settings']and a['currency']==b['currency']and a['bid_type']==b['bid_type']
          def rows(s):return {r['nm_id']:r for r in s['nm_settings']}
          def write_once(e,key,path,method,body):
           auth()
           if key in e['operations']:raise ValueError('Never repeat submitted/uncertain mutation')
           allowed=False
           if key=='fund100':allowed=path=='/adv/v1/budget/deposit?id=40933588'and method=='POST'and body.get('sum')==100 and body.get('type')in[0,1]
           for cid,(z,ids)in GROUPS.items():
            if key=='add:'+str(cid):allowed=path=='/adv/v0/auction/nms'and method=='PATCH'and body==dict(nms=[dict(advert_id=cid,nms=dict(add=ids,delete=[]))])
            if key=='rollback:'+str(cid):allowed=path=='/adv/v0/auction/nms'and method=='PATCH'and body==dict(nms=[dict(advert_id=cid,nms=dict(add=[],delete=ids))])
           if not allowed:raise ValueError('Mutation outside exact five additions and100CNY')
           op=dict(status='submitting',path=path,method=method,body=body,at=stamp());e['operations'][key]=op;put(ROOT+':execution',e)
           try:
            result=req(path,method,body);op.update(status='accepted',response=result,accepted_at=stamp());e['wb_writes']+=1;put(ROOT+':execution',e);return result
           except Exception as ex:
            op.update(status='uncertain',error=type(ex).__name__);put(ROOT+':execution',e);raise
          
          auth();validate_identity(c,w)
          e=c.get(ROOT+':execution');fund=c.get(ROOT+':funding')
          if fund.get('status')!='verified' or e['operations'].get('fund100',{}).get('status')!='accepted':raise ValueError('Existing funding receipt unavailable')
          states=w.campaigns(list(GROUPS))
          proof={}
          for cid,(z,ids)in GROUPS.items():
           s=states[str(cid)];proof[str(cid)]=dict(observed_at=stamp(),present=[nm for nm in ids if nm in rows(s)],state=s)
          put(ROOT+':recovery_readback',proof)
          # Fresh read proves the rejected search addition did not change membership. Do not replay it.
          if proof['41298169']['present']:raise ValueError('Search partial membership; needs reconciliation')
          e['operations']['add:41298169']['status']='http400_rejected_absent_readback'
          e['operations']['add:41298169']['readback_key']=ROOT+':recovery_readback'
          put(ROOT+':execution',e)
          # Only the never-submitted recommendation addition may proceed here.
          cid=40933588;z,ids=GROUPS[cid];before=states[str(cid)];br=rows(before)
          if any(nm in br for nm in ids):raise ValueError('Recommendation candidate already present')
          try:
           write_once(e,'add:'+str(cid),'/adv/v0/auction/nms','PATCH',dict(nms=[dict(advert_id=cid,nms=dict(add=ids,delete=[]))]))
           for i in range(18):
            after=campaign(cid);ar=rows(after)
            if set(ar)==set(br)|set(ids):break
            time.sleep(5)
           else:raise ValueError('Recommendation membership uncertain')
           if not fixed_equal(before,after)or any(ar[nm]!=r for nm,r in br.items()):raise ValueError('Other campaign settings changed')
           if any(not 0<ar[nm]['bids_kopecks'].get(z,0)<=30 for nm in ids):
            write_once(e,'rollback:'+str(cid),'/adv/v0/auction/nms','PATCH',dict(nms=[dict(advert_id=cid,nms=dict(add=[],delete=ids))]))
            raise ValueError('Default bid outside cap; new products removed')
           minima=w.minimums(cid,ids,z)
           child=dict(status='verified',before=before,after=after,verified_at=stamp(),nm_ids=ids,placement=z,exact_minimums=minima,approval_key=ROOT+':approval')
           ck=ROOT+':campaign:'+str(cid);put(ck,child)
           for nm in ids:e['items'].append(dict(kind='ad_add_sku',campaign_id=cid,nm_id=nm,article=next(i['article']for i in auth()['items']if i.get('nm_id')==nm),placement=z,target_minor=ar[nm]['bids_kopecks'][z],status='verified',receipt_key=ck,verified_at=child['verified_at']))
           registry=c.get('china_agent:verified_campaign_state:v1')or{};registry[str(cid)]=ck;put('china_agent:verified_campaign_state:v1',registry)
           e.update(status='partial_verified',error='Search addition rejected, absent on readback');put(ROOT+':execution',e)
           print(json.dumps({'status':e['status'],'verified_items':len(e['items'])}))
          except Exception as ex:
           e.update(status='partial_verified_funding_only'if not e['items']else'partial_verified',error=str(ex),updated_at=stamp());put(ROOT+':execution',e)
           print(json.dumps({'status':e['status'],'error':e['error']}))
          # One bounded read to determine whether WB currently exposes these five cards as eligible.
          r=requests.post('https://advert-api.wildberries.ru/adv/v2/supplier/nms',headers={'Authorization':w.token},json=[50],timeout=50)
          wanted={nm for z,ns in GROUPS.values()for nm in ns}
          v=dict(observed_at=stamp(),http_status=r.status_code)
          if r.ok:v['rows']=[x for x in r.json()if x.get('nm')in wanted]
          else:v['error']=r.text[:700]
          put(ROOT+':eligibility',v)
          print(json.dumps({'eligibility':v}))
          
          PY

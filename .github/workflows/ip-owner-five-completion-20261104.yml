name: IP five verified completion receipt
on:
  workflow_run:
    workflows: ['Recover only five approved IP actions after400']
    types: [completed]
permissions:
  contents: read
jobs:
  receipt:
    if: ${{ github.event.workflow_run.id == 41887045933 && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 11207bd9d3df711d14e0a248d5241bb2050e6f73
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ip_owner_five_completion_20261104.py
            ip_apply_nine_20261103.py
            ip_daily_png_contract.py
            advertising_daily_png.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install Pillow==12.3.0 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Final verified result only; no WB key, collectors, error messages or resend
        run: python ip_owner_five_completion_20261104.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ADVERTISING_TELEGRAM_BOT_TOKEN: ${{ secrets.ADVERTISING_TELEGRAM_BOT_TOKEN }}
          ADVERTISING_EXECUTION_ENABLED: 'false'

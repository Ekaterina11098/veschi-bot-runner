name: Owner preliminary profit31 read-only
on:
  push:
    branches: [main]
    paths: [.github/workflows/owner-profit-now31.yml]
permissions: {contents: read}
concurrency: {group: owner-profit-now31, cancel-in-progress: false}
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - run: pip install requests==2.32.5 Pillow==12.3.0
      - name: Owner-requested bounded read and preliminary private calculation
        env:
          PYTHONPATH: scripts:source
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
        run: python scripts/owner_profit_now31.py

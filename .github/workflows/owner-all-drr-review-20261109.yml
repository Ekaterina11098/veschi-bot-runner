name: Owner full cabinet DRR review completed days read only
on:
  push:
    paths:
      - '.github/workflows/owner-all-drr-review-20261109.yml'
permissions:
  contents: read
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  fund:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 10ca471ebdc30e8979abeb6286434c51fe218931
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Read all campaign completed days and current state
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          from datetime import datetime,timezone
          from china_loss_execute import IO
          from china_advertising_v2 import http
          io=IO();key='china_agent:owner_all_drr_review:2026-11-09:v1:closed'
          if io.get(key):raise SystemExit('Existing dated read; no replay')
          assert io.create(key,dict(status='collecting',wb_writes=0,telegram_calls=0))
          try:
           inv=http(io,'/adv/v1/promotion/count')
           ids=sorted({r['advertId']for g in inv.get('adverts',[])if g['status']in[7,9,11]for r in g.get('advert_list',[])})
           assert len(ids)<=50
           cps=http(io,'/api/advert/v2/adverts?ids='+','.join(map(str,ids)))['adverts']
           assert {c['id']for c in cps}==set(ids)and all(c['currency']=='CNY'for c in cps)
           rows=http(io,'/adv/v3/fullstats?ids='+','.join(map(str,ids))+'&beginDate=2026-11-02&endDate=2026-11-08')
           bid=[c['id']for c in cps if c['status']in[9,11]]
           budgets=http(io,'/api/advert/v2/budget','POST',dict(advertIds=bid))['adverts']
           config=http(io,'/api/advert/v1/config')
           io.put(key,dict(status='complete',inventory=inv,campaigns=cps,stats=rows,budgets=budgets,config=config,missing_stats_ids=sorted(set(ids)-{r['advertId']for r in rows}),observed_at=datetime.now(timezone.utc).isoformat(),period_from='2026-11-02',period_to='2026-11-08',wb_writes=0,telegram_calls=0))
           print('All campaign closed days and exact current state saved privately; no mutations')
          except Exception as ex:
           io.put(key,dict(status='blocked',error=type(ex).__name__,wb_writes=0,telegram_calls=0));raise
          
          PY

name: One-off bounded green report analysis completion
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-green-analysis-completion-20261110.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: china-green-analysis-completion-20261110
  cancel-in-progress: false
jobs:
  daily:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/
            /*request*.json
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /analytics/
            /business_agents/
            /advertising_agent/
            /china_agent/
            /tests/
            /*.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 python-dotenv simplejson==4.2.0 pillow==11.3.0 openai==3.42.1 > "$RUNNER_TEMP/install.log" 2>&1
      - name: Check advertising arithmetic and duplicate safeguards
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_china_advertising_*.py'
      - name: Read current China day and verify complete catalogue economics and deliver agreed green midday report
        working-directory: source
        env:
          CHINA_AD_ANALYSIS_PREFILL: '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: |
          PYTHONPATH=../scripts:. python - <<'PY'
          from datetime import datetime
          from china_price_apply import IO
          from china_advertising_v2 import MSK
          from china_advertising_midday import prepare_midday
          from china_midday_completed_review import attach
          from china_advertising_bounded_review import PrefillComplete
          io=IO();day=datetime.now(MSK).date().isoformat()
          current=io.get('china_agent:advertising_midday_inclusive:'+day+':v1')
          try:
              attach(io,prepare_midday(io,day,current),day)
          except PrefillComplete as ex:
              print(str(ex))
          PY

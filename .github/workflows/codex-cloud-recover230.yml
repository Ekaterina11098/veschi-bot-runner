name: Recover saved cloud owner answer once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/codex-cloud-recover230.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 828251d15ccd5f29b8ccf6553e10fd48db758909
          persist-credentials: false
          sparse-checkout: scripts
      - run: pip install openai==3.42.1 --quiet
      - name: Recover saved turn and prepare exact outbox
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -u scripts/codex_cloud_owner_question_recover.py

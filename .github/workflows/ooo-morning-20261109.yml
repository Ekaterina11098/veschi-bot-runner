name: OOO Nov9 morning report read only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ooo-morning-20261109.yml']
permissions:
  contents: read
concurrency:
  group: wb-ooo-statistics-readonly
  cancel-in-progress: false
jobs:
  collect:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with: {ref: 60c93017a4754ee55afacf3ab101d3f4c82387b1, persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 3708405208147b76cb76ad9ae9b432377f652bee
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
        run: python scripts/ooo_morning_20261109.py

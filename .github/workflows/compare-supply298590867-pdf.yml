name: Compare requested supply picking PDF
on:
  push:
    branches: [main]
    paths: ['.github/workflows/compare-supply298590867-pdf.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-document-read-only
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read exact supply documents and compare privately
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: python scripts/compare_supply298590867_pdf.py

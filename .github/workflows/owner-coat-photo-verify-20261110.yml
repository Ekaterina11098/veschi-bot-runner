name: Owner read-only coat media verification10Nov
on:
  push:
    paths: ['.github/workflows/owner-coat-photo-verify-20261110.yml']
permissions:
  contents: read
concurrency:
  group: owner-coat-media
  cancel-in-progress: false
jobs:
  read:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 10ca471ebdc30e8979abeb6286434c51fe218931
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Install video preservation dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /tmp/ffmpeg-install.log 2>&1
      - name: Verify exact retained media without replaying write
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: unused-no-telegram
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import os,json,time,hashlib,base64,subprocess,shutil,io as bio
          from datetime import datetime,timezone
          from urllib.parse import urljoin
          import requests
          from PIL import Image,ImageChops,ImageStat
          from china_loss_execute import IO
          io=IO();K='china_agent:owner_coat_photo:2026-11-10:v1:execution';nm=2215883910
          
          assert shutil.which('ffmpeg') and shutil.which('ffprobe')
          def stamp():return datetime.now(timezone.utc).isoformat()
          def card():
           r=requests.post('https://content-api.wildberries.ru/content/v2/get/cards/list',headers={'Authorization':io.token},json={'settings':{'cursor':{'limit':100},'filter':{'textSearch':'5-furcoat-beige','withPhoto':-1}}},timeout=40);r.raise_for_status()
           rows=[c for c in r.json().get('cards',[]) if c.get('nmID')==nm and c.get('vendorCode')=='5-furcoat-beige'];assert len(rows)==1;return rows[0]
          def core(c):
           out={k:v for k,v in c.items() if k not in ['photos','video','updatedAt']}
           if 'characteristics' in out:out['characteristics']=sorted(out['characteristics'],key=lambda x:x['id'])
           return out
          
          e=io.get(K);assert e and e.get('wb_writes')==1 and e.get('http_status')==200
          if e.get('status')=='verified':raise SystemExit('Already verified')
          before=e['before']
          def stored(path):
           r=requests.get(io.url+'/storage/v1/object/'+path,headers=io.headers,timeout=40);r.raise_for_status();return r.content
          originals=[]
          for i in range(1,20):
           if i==17:continue
           originals.append(Image.open(bio.BytesIO(stored('owner-media-recovery/coat2215883910-20261110/'+str(i)+'.webp'))).convert('RGB').resize((64,64)))
          data=stored(e['video_backup_object']);assert hashlib.sha256(data).hexdigest()==e['video_backup_sha256'];open('/tmp/coat-original.mp4','wb').write(data)
          for attempt in range(12):
           after=card();e['after']=after;e['observed_at']=stamp()
           assert core(after)==core(before),'Substantive nonmedia change'
           e.pop('error',None)
           if len(after['photos'])==18 and after.get('video'):
            checks=[]
            for i,p in enumerate(after['photos']):
             r=requests.get(p['big']+'?check='+str(int(time.time())),timeout=25);r.raise_for_status();im=Image.open(bio.BytesIO(r.content)).convert('RGB').resize((64,64))
             checks.append(sum(ImageStat.Stat(ImageChops.difference(im,originals[i])).mean)/3)
            e['photo_mean_pixel_differences']=checks
            if max(checks)<10:
             differences=[]
             for sec in (1,8,16):
              ims=[]
              for v in ['/tmp/coat-original.mp4',after['video']]:
               raw=subprocess.run(['ffmpeg','-v','error','-ss',str(sec),'-i',v,'-frames:v','1','-vf','scale=64:64','-f','image2pipe','-vcodec','png','-'],check=True,timeout=45,stdout=subprocess.PIPE,stderr=subprocess.PIPE).stdout
               ims.append(Image.open(bio.BytesIO(raw)).convert('RGB'))
              differences.append(sum(ImageStat.Stat(ImageChops.difference(*ims)).mean)/3)
             e['video_frame_mean_pixel_differences']=differences
             if max(differences)<15:
              e.update(status='verified',completed_at=stamp(),readback_wb_writes=0);io.put(K,e);print('Verified18orderedphotosandvideo');break
           io.put(K,e);time.sleep(15)
          else:print('Still awaiting WBmedia; no repeat write')
          PY

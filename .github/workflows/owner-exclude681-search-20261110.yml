name: Owner confirmed 681 search exclusion 10Nov
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-exclude681-search-20261110.yml']
permissions:
  contents: read
concurrency:
  group: china-confirmed-wb-advertising-writes
  cancel-in-progress: false
jobs:
  exact-owner-scope:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7cea2b8e5e4565902b069d01f8228fd19dc2943f
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Verify private exact scope and execute once; no Telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import os,requests,hashlib
          url=os.environ['SUPABASE_URL'].rstrip('/')
          key=os.environ['SUPABASE_SECRET_KEY']
          h={'apikey':key}
          if not key.startswith('sb_secret_'): h['Authorization']='Bearer '+key
          r=requests.get(url+'/rest/v1/telegram_api_cache',headers=h,params={'cache_key':'eq.china_agent:owner_exclude681_search:2026-11-10:v1:script','select':'payload'},timeout=30)
          assert r.ok, 'Private script unavailable'
          rows=r.json(); assert len(rows)==1
          p=rows[0]['payload'];code=p['code']
          assert p['sha256']=='bf4f820af8614775596a8b45dba42bd32e2dee07e162ed81d33394b4a2c06f3d' and hashlib.sha256(code.encode()).hexdigest()==p['sha256'],'Script hash mismatch'
          exec(compile(code,'owner_exclude681_search10.py','exec'),{'__name__':'__main__'})
          PY

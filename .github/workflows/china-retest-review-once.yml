name: China advertising candidate review once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-retest-review-once.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: china-dialog-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          sparse-checkout: |
            analytics
            business_agents
            advertising_agent
            china_agent
      - run: pip install requests==2.32.5 Pillow==12.3.0 python-dotenv==1.1.1 simplejson==3.20.2
      - name: Verify retest evidence and delivery guards without credentials
        run: PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_ad_retest.py
      - name: Review only saved question 268 and deliver analytical PNGs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          PYTHONPATH: scripts:source
        run: |
          python - <<'PY'
          import json
          from china_loss_execute import IO
          from china_new_ads import REQUEST
          from china_new_ad_reports import process_requests
          io=IO();key=REQUEST+'268';req=io.get(key) or {}
          assert req.get('job_id')==268 and req.get('chat_id')==-1004342917488 and req.get('review_only') is True
          if req.get('status')=='pending':process_requests(io,job_id=268)
          result=io.get(key) or {}
          print(json.dumps(dict(status=result.get('status'),summary=result.get('candidate_review'),paid_model_calls=0,wb_writes=0)))
          if result.get('status')!='reviewed':raise SystemExit('Candidate review incomplete; inspect private request state')
          PY

name: Owner China samehour API read31
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-weekago-sales31-read.yml']
permissions: {contents: read}
jobs:
  read:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - run: python -m py_compile scripts/owner_weekago_sales31_read.py
      - name: Read exact China orders and advertising; no writes or messages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: python scripts/owner_weekago_sales31_read.py

name: Owner correct existing morning ready-budget PNG 4Nov
on:
  push:
    paths: ['.github/workflows/owner-budget-correct4.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-budget-correct4
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Bounded fresh growth economics; no model or Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import base64,copy,hashlib,json,requests
          from datetime import datetime,timezone
          from china_advertising_state import AdvertisingIO
          from china_advertising_v2_png import render
          from china_advertising_v2 import history
          from china_budget_reserve import attach_completed_evidence,apply
          from china_daily_ad_actions import plan,BIND
          from china_loss_control import PLAN
          ROOT='china_agent:owner_budget_ready_recommendations:2026-11-04:v1';DAY='2026-11-04';MID=671
          io=AdvertisingIO()
          if io.get(ROOT+':delivery'):raise ValueError('Existing edit journal; never replay')
          fresh=io.get('china_agent:owner_budget_ready_check:2026-11-04:v1')
          if fresh['status']!='complete' or (datetime.now(timezone.utc)-datetime.fromisoformat(fresh['observed_at'])).total_seconds()>7200:raise ValueError('Fresh source unavailable')
          old=io.get('china_agent:advertising_artifacts:'+DAY+':v2');delivery=io.get('china_agent:advertising_delivery:'+DAY+':v1')
          part=next(p for p in delivery['parts']if p.get('family')=='budgets' or p['kind'].startswith('budgets:'))
          if part['message_id']!=MID or part['status']!='sent':raise ValueError('Unexpected original delivery')
          source=copy.deepcopy(fresh['source']);source.update(observed_at=fresh['observed_at'],budget_balance_observed_at_iso=fresh['observed_at'],economics=fresh['economics'],full_growth_inputs=fresh)
          states={c['id']:c for c in fresh['campaigns']};cash={r['advertId']:r for r in fresh['budgets']['adverts']}
          for batch in source['batches'].values():
           batch['campaigns']['adverts']=[states.get(c['id'],c)for c in batch['campaigns']['adverts']]
          batch=copy.deepcopy(old['bundle']);batch['campaigns']=[c for c in batch['campaigns']if c['id']in states]
          for c in batch['campaigns']:c['balance']=cash[c['id']]['total']
          batch=apply(attach_completed_evidence(batch,source,history(source['executions'])))
          summary=[dict(id=c['id'],balance=c['balance'],spend=c['budget_reference_need'],amount=(c.get('budget_action')or{}).get('amount_cny'),economics=c['campaign_budget_economics'])for c in batch['campaigns']]
          expected={40945502:100,41155909:100,41270309:100,41296363:None}
          if {r['id']:r['amount']for r in summary}!=expected:raise ValueError('Readiness scope mismatch: '+json.dumps([{k:r[k]for k in ['id','amount']}for r in summary]))
          pages=[f for f in render(batch)if f['family']=='budgets']
          if len(pages)!=1 or len(pages[0]['actions'])!=3:raise ValueError('Unexpected ready budget page')
          f=pages[0];p=plan(io,DAY,f,1,slot='ready-budgets4')
          caption='Китай · бюджеты · 4 ноября. Рекомендации: три пополнения по 100 CNY, всего 300 CNY. Манишка — ограниченный тест. РК 41296363 пока не пополнять. Это рекомендации; деньги не внесены. Исполнение — только по новой отдельной команде ответом на этот обновлённый PNG.'
          if io.tg('getMe',{})['id']!=8780468043:raise ValueError('Bot identity')
          archive=dict(artifacts=old,delivery=delivery,binding=io.get(BIND+str(MID)),archived_at=datetime.now(timezone.utc).isoformat())
          if not io.create(ROOT+':original_sent',archive):raise ValueError('Archive exists')
          oldpid=archive['binding']['plan_id'];oldplan=io.get(PLAN+oldpid);oldplan.update(invalidated_at=datetime.now(timezone.utc).isoformat(),invalidation_reason='Fresh ready-only budget recommendations replace empty/conditional plan');io.put(PLAN+oldpid,oldplan)
          step=dict(status='editing',message_id=MID,chat_id=-1004342917488,bot_id=8780468043,sha256=hashlib.sha256(f['bytes']).hexdigest(),plan_id=p['plan_id'],plan_sha256=p['plan_sha256'],submitted_at=datetime.now(timezone.utc).isoformat(),wb_writes=0)
          if not io.create(ROOT+':delivery',step):raise ValueError('Concurrent edit')
          try:
           media=json.dumps(dict(type='photo',media='attach://photo',caption=caption),ensure_ascii=False)
           r=requests.post('https://api.telegram.org/bot'+io.bot+'/editMessageMedia',data=dict(chat_id=-1004342917488,message_id=MID,media=media),files={'photo':('budget-ready4.png',f['bytes'],'image/png')},timeout=60)
           j=r.json()
           if not r.ok or not j.get('ok'):raise RuntimeError('Telegram edit HTTP '+str(r.status_code))
           receipt=j['result']
           if receipt.get('message_id')!=MID or receipt.get('chat',{}).get('id')!=-1004342917488 or receipt.get('from',{}).get('id')!=8780468043 or not receipt.get('photo'):raise ValueError('Edit receipt mismatch')
           at=datetime.now(timezone.utc).isoformat();p.update(report_message_ids=[MID],visible_from=at);io.put(PLAN+p['plan_id'],p)
           io.put(BIND+str(MID),dict(plan_id=p['plan_id'],plan_sha256=p['plan_sha256'],chat_id=-1004342917488,family='budgets'))
           newfile=dict(kind=f['kind'],family='budgets',page=1,total=1,plan_id=p['plan_id'],plan_sha256=p['plan_sha256'],action_count=3,b64=base64.b64encode(f['bytes']).decode())
           new=copy.deepcopy(old);new['files']=[newfile if x['family']=='budgets'else x for x in old['files']]
           lookup={c['id']:c for c in batch['campaigns']}
           new['bundle']['campaigns']=[lookup.get(c['id'],c)for c in old['bundle']['campaigns']]
           new['owner_budget_ready_at']=at;io.put('china_agent:advertising_artifacts:'+DAY+':v2',new)
           part.update(sha256=step['sha256'],receipt=receipt,edited_at=at,plan_id=p['plan_id'],plan_sha256=p['plan_sha256'])
           delivery['budget_ready_correction_key']=ROOT+':delivery';io.put('china_agent:advertising_delivery:'+DAY+':v1',delivery)
           step.update(status='edited_verified',receipt=receipt,verified_at=at,total_action_count=3,total_cny=300)
           io.put(ROOT+':delivery',step);io.put(ROOT,dict(status='recommendations_ready',observed_at=fresh['observed_at'],campaigns=summary,total_cny=300,grants_action_permission=False,wb_writes=0,delivery_key=ROOT+':delivery'))
          except Exception as ex:
           step.update(status='uncertain',reason=str(ex));io.put(ROOT+':delivery',step);raise
          print(json.dumps({k:step[k]for k in ['status','message_id','total_action_count','total_cny','wb_writes']}))
          
          PY

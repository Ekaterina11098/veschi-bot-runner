name: Requested OOO query history read
on:
  push:
    branches: [main]
    paths: ['.github/workflows/requested-ooo-query-history.yml']
permissions: {contents: read}
jobs:
  read:
    if: github.event.head_commit.message == 'Read OOO search history for requested semantic comparison'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Read reports into private cache only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import os,time,json,requests
          from datetime import datetime,timezone,timedelta
          from china_cloud_cost_control import Cache,stamp
          c=Cache();token=os.environ['WB_TOKEN_1'];host='https://advert-api.wildberries.ru'
          def read(path,body=None):
           r=requests.request('POST' if body else 'GET',host+path,headers={'Authorization':token},json=body,timeout=90,allow_redirects=False)
           if r.status_code!=200:raise RuntimeError('Report HTTP '+str(r.status_code))
           return r.json()
          end=datetime.now(timezone(timedelta(hours=3))).date()-timedelta(days=1);start=end-timedelta(days=6)
          root='owner_agent:semantic_gap_review:'+str(end)+':v1'
          if c.get(root):raise RuntimeError('Reuse existing report')
          groups=read('/adv/v1/promotion/count').get('adverts',[])
          ids=sorted({i['advertId'] for g in groups if g.get('status') in (9,11) for i in g.get('advert_list',[])})
          if len(ids)>200:raise RuntimeError('More campaigns than bounded report permits')
          configs=[]
          for n in range(0,len(ids),50):
           time.sleep(2);configs+=read('/api/advert/v2/adverts?ids='+','.join(map(str,ids[n:n+50])))['adverts']
          pairs=[{'advertId':v['id'],'nmId':n['nm_id']} for v in configs if v.get('settings',{}).get('placements',{}).get('search') for n in v.get('nm_settings',[])]
          c.put(root+':campaigns',{'rows':configs,'pairs':pairs,'observed_at':stamp()})
          for k in range(0,len(pairs),50):
           time.sleep(8)
           data=read('/adv/v1/normquery/stats',{'from':str(start),'to':str(end),'items':pairs[k:k+50]})
           c.put(root+':stats:'+str(k),{'data':data,'period_from':str(start),'period_to':str(end),'observed_at':stamp(),'cabinet':'token_1'})
          c.put(root,{'status':'complete','pairs':len(pairs),'period_from':str(start),'period_to':str(end),'wb_writes':0,'telegram_sends':0})
          print(json.dumps({'complete':True,'pairs':len(pairs)}))
          PY

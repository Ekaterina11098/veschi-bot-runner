name: Owner recovery 044 177 and 41779660 read
on:
  push:
    branches: [main]
    paths: [.github/workflows/owner-recovery13-read.yml]
permissions: {contents: read}
jobs:
  verify:
    if: github.run_attempt == 1 && github.event.head_commit.message == '[owner-recovery13] Read exact recovery evidence without mutations'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - run: pip install requests==2.32.5 Pillow==12.3.0
      - name: Read exact seller prices, MSK COGS and completed own cohort
        env:
          PYTHONPATH: scripts:source
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
        run: python scripts/owner_recovery13_read.py


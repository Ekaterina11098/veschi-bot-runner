name: Fill missing label categories in reviewed barcode scope
on:
  push:
    paths: ['.github/workflows/label-category-complete-20261106.yml']
permissions:
  contents: read
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: scripts/fbs_document_chain.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: python
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import sys,re
          sys.path.insert(0,'scripts')
          from fbs_document_chain import Transport,Cache,MS,Stop,now
          t=Transport();db=Cache(t)
          scope=db.get('barcode_sync:china:20261106:v1')
          ids={p['id'] for key in ('plan','already','issues') for p in scope[key]}
          if len(ids)!=317:raise Stop('Scope mismatch')
          defs=t.request(MS,'entity/product/metadata/attributes')['rows']
          matches=[a for a in defs if a['name']=='Категория товара' and a['type']=='string']
          if len(matches)!=1:raise Stop('Category definition mismatch')
          definition=matches[0]
          rows=[];offset=0
          while True:
              page=t.request(MS,'entity/product',params={'filter':'archived=false','limit':1000,'offset':offset})
              rows+=page['rows'];offset+=len(page['rows'])
              if offset==page['meta']['size']:break
              if not page['rows']:raise Stop('Incomplete page')
          items=[p for p in rows if p['id'] in ids]
          if len(items)!=317:raise Stop('Products mismatch')
          plan=[];unresolved=[];existing=0
          for p in items:
              attr=[a for a in p.get('attributes',[]) if a['name']=='Категория товара']
              if attr and str(attr[0].get('value','')).strip():existing+=1;continue
              name=p['name'].replace('Cумка','Сумка')
              m=re.match(r'^(Сумка|Зонт|Ремень|Шарф|Панама|Манишка|Берет|Кеппи|Платок|Рюкзак|Косынка)(?:\b|[- ])',name)
              if not m:unresolved.append({'id':p['id'],'article':p.get('article'),'name':p['name']});continue
              plan.append({'id':p['id'],'article':p.get('article'),'category':m[1]})
          key='label_utility:categories:20261106:v1'
          audit={'status':'prepared','at':now(),'plan':plan,'unresolved':unresolved,'existing':existing,'done':[]}
          db.put(key,audit)
          for offset in range(0,len(plan),50):
              batch=[{'id':item['id'],'attributes':[{'meta':definition['meta'],'value':item['category']}]} for item in plan[offset:offset+50]]
              t.request(MS,'entity/product','POST',batch)
          observed=[];offset=0
          while True:
              page=t.request(MS,'entity/product',params={'filter':'archived=false','limit':1000,'offset':offset})
              observed+=page['rows'];offset+=len(page['rows'])
              if offset==page['meta']['size']:break
              if not page['rows']:raise Stop('Incomplete verification page')
          current={p['id']:p for p in observed}
          for p in items:
              after=current[p['id']]
              attrs={a['name']:a.get('value') for a in after.get('attributes',[])}
              if not attrs.get('Категория товара'):raise Stop('Category missing')
              if after.get('barcodes')!=p.get('barcodes') or after.get('article')!=p.get('article'):raise Stop('Other field changed')
              for a in p.get('attributes',[]):
                  if a['name']!='Категория товара' and attrs.get(a['name'])!=a.get('value'):raise Stop('Other attribute changed')
          audit['done']=[p['id'] for p in plan]
          audit.update(status='verified',verified_at=now());db.put(key,audit)
          print('Category fill verified. Updated:',len(audit['done']),'Existing:',existing,'Unresolved:',len(unresolved))


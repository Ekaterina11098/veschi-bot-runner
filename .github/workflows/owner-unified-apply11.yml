name: Owner confirmed unified plan11Nov
on:
  push:
    paths: ['.github/workflows/owner-unified-apply11.yml']
permissions: {contents: read}
concurrency:
  group: china-dialog-queue
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: china-dialog-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0 python-dotenv simplejson==4.2.0 openai==3.42.1
      - name: Correct false empty price report; read-only preflight and bound price buttons
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ""
          PYTHONPATH: scripts:source
        run: |
          cp scripts/china_price_brief.py source/china_agent/price_brief.py
          python scripts/owner_price296_correction.py

name: IP wave1 WB read only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ip-wave1-wb-read-20261102.yml']
permissions: {}
concurrency:
  group: wb-ip-advertising-agent
  cancel-in-progress: false
jobs:
  read:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read exact WB configuration and candidate cards
        env:
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import os,json,urllib.request,urllib.error,urllib.parse,datetime,time,gzip
          KEY='ip_agent:wave1_wb_read:2026-11-02:v1'
          SB=os.environ['SUPABASE_URL'].rstrip('/')
          sh={'apikey':os.environ['SUPABASE_SECRET_KEY'],'Authorization':'Bearer '+os.environ['SUPABASE_SECRET_KEY'],'Content-Type':'application/json'}
          wh={'Authorization':os.environ['WB_TOKEN_2'],'Content-Type':'application/json'}
          def stamp():return datetime.datetime.now(datetime.timezone.utc).isoformat()
          class NR(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*a,**k):raise RuntimeError('Redirect blocked')
          opener=urllib.request.build_opener(NR)
          def call(url,headers,method='GET',body=None):
           req=urllib.request.Request(url,headers=headers,method=method,data=None if body is None else json.dumps(body).encode())
           try:
            with opener.open(req,timeout=50) as r:
             b=r.read()
             if r.headers.get('Content-Encoding')=='gzip':b=gzip.decompress(b)
             return json.loads(b) if b else None
           except urllib.error.HTTPError as e:raise RuntimeError('HTTP '+str(e.code)+' RetryAfter '+str(e.headers.get('Retry-After','unknown'))) from None
          def get(key):
           r=call(SB+'/rest/v1/telegram_api_cache?'+urllib.parse.urlencode({'cache_key':'eq.'+key,'select':'payload'}),sh)
           return r[0]['payload'] if r else None
          def save():
           call(SB+'/rest/v1/telegram_api_cache?on_conflict=cache_key',dict(sh,Prefer='resolution=merge-duplicates'),'POST',{'cache_key':KEY,'payload':out,'updated_at':stamp(),'expires_at':'2036-11-02T00:00:00Z'})
          request=get('ip_agent:wave1_msk_stock:2026-11-02:v2:request')
          if not request or request['status']!='approved_readonly':raise ValueError('Read scope missing')
          if get(KEY):raise ValueError('Existing read preserved')
          out={'status':'reading','observed_at':stamp(),'wb_writes':0,'telegram_calls':0,'ms_calls':0,'minimums':[],'cards':[],'run_id':os.environ['GITHUB_RUN_ID']}
          try:
           out['configuration']=call('https://advert-api.wildberries.ru/api/advert/v2/adverts?ids=35654841,36514081,37155100,37363108,37757330,39410834,39483230,39634287,40192945,40428505,40428689',wh)
           scope={int(n) for n in request['nm_by_article'].values()}
           for ad in out['configuration'].get('adverts',[]):
            if ad.get('status')!=9 or ad.get('settings',{}).get('payment_type')!='cpc':continue
            ids=[x['nm_id'] for x in ad.get('nm_settings',[]) if x.get('nm_id') in scope]
            if not ids:continue
            time.sleep(2)
            b={'advert_id':ad['id'],'nm_ids':ids,'payment_type':'cpc','placement_types':['search']}
            out['minimums'].append({'campaign':ad['id'],'result':call('https://advert-api.wildberries.ru/api/advert/v1/bids/min',wh,'POST',b)})
           save()
           for sku,nm in request['nm_by_article'].items():
            time.sleep(0.8)
            r=call('https://content-api.wildberries.ru/content/v2/get/cards/list',wh,'POST',{'settings':{'cursor':{'limit':100},'filter':{'textSearch':str(nm),'withPhoto':-1}}})
            exact=[c for c in r.get('cards',[]) if c.get('nmID')==int(nm) and c.get('vendorCode')==sku]
            out['cards'].append({'article':sku,'nm_id':int(nm),'matching':len(exact),'data':exact[0] if len(exact)==1 else None})
           out['status']='complete'
          except Exception as e:out['status']='partial';out['error']=str(e) if isinstance(e,(ValueError,RuntimeError)) else type(e).__name__
          out['finished_at']=stamp();save()
          print(json.dumps({'status':out['status'],'card_count':len(out['cards']),'wb_writes':0,'ms_calls':0,'telegram_calls':0}))

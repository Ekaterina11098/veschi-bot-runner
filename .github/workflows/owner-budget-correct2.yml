name: Owner budget PNG correction 2 November
on:
  push:
    branches: [main]
    paths: ['scripts/owner_budget_correct2.py']
permissions:
  contents: read
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Correct only owner-selected budget photo with immutable before archive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          WB_TOKEN_3: unavailable-readonly-photo-correction
        run: python scripts/owner_budget_correct2.py

name: OOO dated intraday PNG delivery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ooo-midday-send9.yml']
permissions: {contents: read}
concurrency:
  group: ooo-midday-2026-11-09-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a7e131eef378bde48ab30ae9fee65b09acc15afe
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 --quiet
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OOO_TELEGRAM_BOT_TOKEN: ${{ secrets.OOO_TELEGRAM_BOT_TOKEN }}
        run: python scripts/ooo_send_midday9.py

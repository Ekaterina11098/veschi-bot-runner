name: China control exact periods owner preview only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-coverage-preview-20261016.yml']
permissions:
  contents: read
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  recover:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv aiogram apscheduler pillow > "$RUNNER_TEMP/install.log" 2>&1
      - name: Reconcile forecast with retained WB orders without Telegram
        working-directory: source
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: |
          python ../scripts/install_china_order_coverage.py
          cp ../scripts/china_wb_order_gaps.py china_agent/wb_order_gaps.py
          cp ../scripts/china_coverage_worker.py china_agent/coverage_worker.py
          cp ../scripts/china_morning_pair.py china_agent/morning_pair.py
          cp ../scripts/china_control_owner_preview.py china_agent/control_owner_preview.py
          cp ../scripts/china_control_gap_preview.py china_agent/control_gap_preview.py
          cp ../scripts/china_control_funnel_preview.py china_agent/control_funnel_preview.py
          cp ../scripts/china_cohort_preview.py china_agent/cohort_preview.py
          cp ../scripts/china_buyout_rate_preview.py china_agent/buyout_rate_preview.py
          cp ../scripts/china_expected_order_profit.py china_agent/expected_order_profit.py
          cp ../scripts/china_price_experiment_result.py china_agent/price_experiment_result.py
          cp ../scripts/china_expected_full_preview.py china_agent/expected_full_preview.py
          cp ../scripts/china_expected_reconciled_preview.py china_agent/expected_reconciled_preview.py
          python -m china_agent.expected_reconciled_preview

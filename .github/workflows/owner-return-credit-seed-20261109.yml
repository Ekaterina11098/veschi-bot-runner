name: Owner read-only MS article143 document audit4Nov
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-return-credit-seed-20261109.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bot-stock
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            stock_deploy_support.py
            owner_return_credit_seed_20261109.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: e65c33eaaab7d269df0884e444bbe049e7518fc9
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv==1.1.1 aiogram==3.22.0 simplejson==4.2.0 'psycopg[binary]==3.2.9' cryptography > "$RUNNER_TEMP/read-install.log" 2>&1
      - name: Read one article warehouse documents only
        env:
          PYTHONPATH: ${{ github.workspace }}/private-source:${{ github.workspace }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: python owner_return_credit_seed_20261109.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-article143-ms-audit
          path: ${{ runner.temp }}/stock-deploy-proof
          retention-days: 30

# Read-only retry with supported MS filter.

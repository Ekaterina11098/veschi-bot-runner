name: Owner approved119 separate search and100CNY funding
on:
  push:
    paths: ['.github/workflows/owner119-search4.yml']
permissions:
  contents: read
concurrency:
  group: china-owner119-search4
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Bounded fresh growth economics; no model or Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json,os,time,requests
          from datetime import datetime,timezone
          from china_cloud_cost_control import Cache,WB,validate_identity,stamp,digest
          from china_advertising_state import AdvertisingIO
          from china_morning_readiness import current_prices,published_stock
          from china_moysklad_read import read_stock
          ROOT='china_agent:owner_119_search:2026-11-04:v1';NM=1473243898
          NAME='Китай · Поиск · Клатч119 · 04.11'
          c=Cache();w=WB();io=AdvertisingIO()
          def put(k,v):
           v=json.loads(json.dumps(v))
           if c.get(k)is None:
            if not c.create(k,v):raise ValueError('Concurrent receipt')
           else:c.put(k,v)
          def auth():
           a=c.get(ROOT+':approval')or{}
           if a.get('owner_user_id')!=5122667182 or a.get('execution_authorized')is not True or a.get('source_channel')!='codex'or a.get('nm_id')!=NM or a.get('amount_cny')!=100 or a.get('max_bid_minor')!=30 or a.get('subject_id')!=136 or a.get('placement')!='search':raise ValueError('Owner exact authorization differs')
           if datetime.now(timezone.utc)>datetime.fromisoformat(a['expires_at']):raise ValueError('Approval expired')
           return a
          def req(path,method='GET',body=None):
           time.sleep(1.5)
           r=requests.request(method,'https://advert-api.wildberries.ru'+path,headers={'Authorization':w.token},json=body,timeout=50)
           if not r.ok:raise RuntimeError('WB HTTP '+str(r.status_code)+' '+r.text[:600])
           return r.json()if r.content else {}
          def rows(s):return {n['nm_id']:n for n in s['nm_settings']}
          def state(cid):return w.campaigns([cid])[str(cid)]
          def budget(cid):
           rr=w.req('/api/advert/v2/budget','POST',dict(advertIds=[cid]))['adverts']
           if len(rr)!=1 or rr[0]['currency']!='CNY'or rr[0]['advertId']!=cid:raise ValueError('Budget currency/coverage')
           return rr[0]['total']
          def check(s):
           if s['currency']!='CNY'or s['bid_type']!='manual'or s['settings']['payment_type']!='cpc'or s['settings']['placements']!={'search':True,'recommendations':False}or set(rows(s))!={NM}or rows(s)[NM]['subject']['id']!=136:raise ValueError('New campaign composition or placement differs')
          def mutation(e,key,path,method,body=None):
           auth()
           if key in e['operations']:raise ValueError('Never repeat submitted/uncertain mutation')
           cid=e.get('campaign_id')
           allowed=(key=='create'and path=='/adv/v2/seacat/save-ad'and method=='POST'and body==dict(name=NAME,nms=[NM],bid_type='manual',payment_type='cpc',placement_types=['search']))
           if cid:
            allowed=allowed or(key=='fund100'and path=='/adv/v1/budget/deposit?id='+str(cid)and method=='POST'and body.get('sum')==100 and body.get('type')in[0,1])
            allowed=allowed or(key=='start'and path=='/adv/v0/start?id='+str(cid)and method=='GET'and body is None)
            allowed=allowed or(key=='bid'and path=='/api/advert/v1/bids'and method=='PATCH'and body==dict(bids=[dict(advert_id=cid,nm_bids=[dict(nm_id=NM,placement='search',bid_kopecks=e.get('target_minor'))])])and 0<e.get('target_minor',0)<=30)
           if not allowed:raise ValueError('Mutation outside119 new search campaign and100CNY')
           op=dict(status='submitting',path=path,method=method,body=body,at=stamp());e['operations'][key]=op;put(ROOT+':execution',e)
           try:
            r=req(path,method,body);op.update(status='accepted',response=r,accepted_at=stamp());e['wb_writes']+=1;put(ROOT+':execution',e);return r
           except Exception as ex:
            op.update(status='uncertain',error=str(ex));put(ROOT+':execution',e);raise
          def main():
           if os.environ.get('GITHUB_REPOSITORY')!='Ekaterina11098/veschi-bot-runner'or os.environ.get('GITHUB_REF')!='refs/heads/main':raise ValueError('Public main only')
           a=auth();validate_identity(c,w)
           if c.get(ROOT+':execution'):raise ValueError('Execution exists; never replay')
           e=dict(status='preflight',approval_key=ROOT+':approval',operations={},wb_writes=0,created_at=stamp())
           if not c.create(ROOT+':execution',e):raise ValueError('Concurrent worker')
           try:
            prices=current_prices(io,[NM]);pub=published_stock(io,prices,[NM]);p=prices['rows'][0];stock=read_stock([p['article']]);st=stock['rows'][0]
            model=c.get('china_agent:owner_full_growth_review:2026-11-04:v1:collection')['economics']['rows'][str(NM)]
            if p['article']!='119-NoelBag-darkblack'or p['currency']!='CNY'or not stock['coverage_complete']or st['stock']-st['reserve']<=0 or pub['missing_nm_ids']or pub['amounts'].get(str(NM),0)<=0 or st['price']<=0:raise ValueError('Current exact119 price/stock/COGS unavailable')
            margin=model['expected_margin_before_ads_cny']+model['buyout']*(p['seller_price']-model['seller_price_cny'])*(1-model['commission_pct']/100)-model['buyout']*(st['price']/100-model['own_cogs_rub'])/model['fx_rub_per_cny']
            if margin<=0:raise ValueError('Current own preliminary economics nonpositive')
            existing=state(41155909)
            if rows(existing)[NM]['subject']['id']!=136:raise ValueError('119 subject differs')
            q=w.minimums(41155909,[NM],'search')
            if q[NM]>30:raise ValueError('Current119 minimum above owner ceiling')
            eligible=req('/adv/v2/supplier/nms','POST',[136])
            if not any(r.get('nm')==NM and r.get('subjectId')==136 for r in eligible):raise ValueError('119 not eligible for category136')
            cfg=req('/api/advert/v1/config');bal=req('/adv/v1/balance')
            source=0 if bal.get('balance',0)>=100 else 1 if bal.get('net',0)>=100 else None
            if cfg['currency']!='CNY'or cfg['minTopUp']>10000 or bal.get('currency')!='CNY'or source is None:raise ValueError('100CNY funding unavailable')
            e['preflight']=dict(observed_at=stamp(),prices=prices,published_stock=pub,stock=stock,own_pre_ad_margin_cny=margin,own_model_source='china_agent:owner_full_growth_review:2026-11-04:v1:collection',minimum_quote_current_campaign=q,existing_recommendations=existing,config=cfg)
            put(ROOT+':execution',e)
            cid=mutation(e,'create','/adv/v2/seacat/save-ad','POST',dict(name=NAME,nms=[NM],bid_type='manual',payment_type='cpc',placement_types=['search']))
            if type(cid)is not int or cid<=0:raise ValueError('New campaign id response unknown; never recreate')
            e['campaign_id']=cid;put(ROOT+':execution',e)
            draft=None
            for i in range(18):
             try:draft=state(cid);check(draft);break
             except (RuntimeError,KeyError):time.sleep(5)
            if draft is None:raise ValueError('New campaign readback missing')
            check(draft);e['before']=draft;put(ROOT+':execution',e)
            if draft['status']not in[4,11]:raise ValueError('New campaign not inactive draft')
            exact=w.minimums(cid,[NM],'search');target=exact[NM]
            if not 0<target<=30 or target%cfg['cpcStep']:raise ValueError('New exact119 minimum exceeds ceiling or invalid step; draft remains unfunded')
            e['target_minor']=target;e['exact_minimums']=exact;put(ROOT+':execution',e)
            if rows(draft)[NM]['bids_kopecks']['search']!=target:
             mutation(e,'bid','/api/advert/v1/bids','PATCH',dict(bids=[dict(advert_id=cid,nm_bids=[dict(nm_id=NM,placement='search',bid_kopecks=target)])]))
             for i in range(18):
              draft=state(cid);check(draft)
              if rows(draft)[NM]['bids_kopecks']['search']==target:break
              time.sleep(5)
             else:raise ValueError('Exact bid readback uncertain; never repeat')
            bb=budget(cid)
            if bb!=0:raise ValueError('New campaign already funded; do not top up')
            funding=dict(status='submitting',before=state(cid),before_budget=bb,amount_cny=100,created_at=stamp());put(ROOT+':funding',funding)
            mutation(e,'fund100','/adv/v1/budget/deposit?id='+str(cid),'POST',dict(sum=100,type=source))
            for i in range(18):
             ba=budget(cid);funded=state(cid);check(funded)
             if ba>=100:break
             time.sleep(5)
            else:raise ValueError('Funding readback uncertain; never repeat')
            funding.update(status='verified',after=funded,after_budget=ba,verified_at=stamp());put(ROOT+':funding',funding)
            if rows(funded)[NM]['bids_kopecks']['search']!=target or funded['status']not in[4,11]:raise ValueError('Bid/status changed before start')
            mutation(e,'start','/adv/v0/start?id='+str(cid),'GET')
            for i in range(30):
             active=state(cid);check(active)
             if active['status']==9 and rows(active)[NM]['bids_kopecks']['search']==target:break
             time.sleep(5)
            else:raise ValueError('Active119 readback uncertain; do not repeat launch')
            final_bal=budget(cid)
            if final_bal<=0:raise ValueError('Active campaign has no remaining budget')
            if rows(state(41155909))!=rows(existing):raise ValueError('Original recommendations changed concurrently')
            e.update(status='verified',after=active,after_budget=final_bal,verified_at=stamp(),funding_key=ROOT+':funding');put(ROOT+':execution',e)
            reg=c.get('china_agent:verified_campaign_state:v1')or{};reg[str(cid)]=ROOT+':execution';put('china_agent:verified_campaign_state:v1',reg)
           except Exception as ex:
            e.update(status='partial_or_uncertain',error=str(ex)if isinstance(ex,(RuntimeError,ValueError))else type(ex).__name__,updated_at=stamp());put(ROOT+':execution',e)
            print(json.dumps({'status':e['status'],'campaign_id':e.get('campaign_id'),'error':e['error'],'wb_writes':e['wb_writes']}));raise
           text='119 добавлен в отдельную поисковую РК'+str(cid)+' и запущен. Ставка '+format(target/100,'.2f')+'CNY, бюджет пополнен на100CNY. Состав, ставка, баланс и активный статус проверены в WB.143 и590 не меняли.'
           if io.tg('getMe',{})['id']!=8780468043:raise ValueError('Bot identity')
           notice=dict(status='sending',text=text,chat_id=-1004342917488,bot_id=8780468043,execution_key=ROOT+':execution',created_at=stamp())
           if not c.create(ROOT+':delivery',notice):raise ValueError('Notice exists; no repeat')
           try:
            r=io.tg('sendMessage',dict(chat_id=-1004342917488,text=text))
            if r.get('chat',{}).get('id')!=-1004342917488 or r.get('from',{}).get('id')!=8780468043 or not r.get('message_id'):raise ValueError('TG delivery identity')
            notice.update(status='sent',message_id=r['message_id'],receipt=r,sent_at=stamp());put(ROOT+':delivery',notice)
           except Exception:
            notice['status']='uncertain';put(ROOT+':delivery',notice);raise
           print(json.dumps({'status':'verified','campaign_id':cid,'bid_cny':target/100,'budget':final_bal,'wb_writes':e['wb_writes'],'message_id':notice['message_id']}))
          main()
          
          PY

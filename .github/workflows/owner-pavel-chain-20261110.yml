name: Finish exact Pavel confirmations 287 288
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-pavel-chain-20261110.yml']
permissions:
  contents: read
concurrency:
  group: china-dialog-queue
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: china-dialog-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/
            /*request*.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /analytics/
            /business_agents/
            /advertising_agent/
            /china_agent/
            /tests/
            /*.py
      - name: Install pinned read transport
        run: pip install requests==2.32.5 Pillow==12.3.0 openai==3.42.1 > "$RUNNER_TEMP/watch-dependencies.log" 2>&1
      - run: |
          python scripts/install_china_dialog.py
          python scripts/install_china_buyout.py --root source
      - name: Exact approved plans only; no historical queue drain
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          OPENAI_API_KEY: ""
          CHINA_ANALYSIS_BACKEND: managed_codex
          PYTHONPATH: scripts:source
        run: |
          python -u - <<'PY'
          import subprocess,sys,json
          from china_loss_execute import IO
          from china_loss_control import APPROVAL,PLAN
          from china_daily_ad_actions import execute
          io=IO()
          expected={288:('daily-2026-11-10-budgets-1','8154f22c62577cdaf4415c78f9446d65818b682683f4162daa0d09e798ef1f49'),287:('daily-2026-11-10-drr-0','bfc49f2b10957e13a8a376a7e5aca231a4473d7d05daaeb4dd0a5ecf5452b99e')}
          for jid,(pid,phash) in expected.items():
              subprocess.run([sys.executable,'scripts/conversion_watches.py','--exact-dialog-job',str(jid)],check=True)
              a=io.get(APPROVAL+str(jid));p=io.get(PLAN+pid)
              if not a or a['plan_id']!=pid or a['plan_sha256']!=phash or p['plan_sha256']!=phash:raise ValueError('Exact approval missing or changed')
              e=execute(io,a,p)
              print(json.dumps({'job_id':jid,'plan_id':pid,'status':e['status'],'items':[{'id':x['id'],'status':x['status'],'reason':x.get('reason'),'already_done':x.get('already_done',False)}for x in e['items']]},ensure_ascii=False))
          PY

name: Owner exact coat gallery read10Nov
on:
  push:
    paths: ['.github/workflows/owner-coat-photo-read-20261110.yml']
permissions:
  contents: read
concurrency:
  group: owner-coat-media
  cancel-in-progress: false
jobs:
  read:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 10ca471ebdc30e8979abeb6286434c51fe218931
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Read exact gallery only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import os,requests,time
          from datetime import datetime,timezone
          from china_loss_execute import IO
          io=IO();key='china_agent:owner_coat_photo:2026-11-10:v1:read'
          if io.get(key):raise SystemExit('Already read')
          out=dict(status='reading',wb_writes=0,telegram_calls=0,lookups=[])
          assert io.create(key,out)
          for text in ['5-furcoat-beige','2215883910']:
           r=requests.post('https://content-api.wildberries.ru/content/v2/get/cards/list',headers={'Authorization':io.token},json={'settings':{'cursor':{'limit':100},'filter':{'textSearch':text,'withPhoto':-1}}},timeout=40)
           out['lookups'].append(dict(search=text,http=r.status_code))
           if r.ok:
            j=r.json()
            found=[c for c in j.get('cards',[]) if c.get('nmID')==2215883910 and c.get('vendorCode')=='5-furcoat-beige']
            if found:out['card']=found[0];break
           time.sleep(1)
          if 'card' not in out:
           cursor={'limit':100}
           for page in range(12):
            r=requests.post('https://content-api.wildberries.ru/content/v2/get/cards/list',headers={'Authorization':io.token},json={'settings':{'cursor':cursor,'filter':{'withPhoto':-1}}},timeout=40)
            r.raise_for_status();j=r.json()
            found=[c for c in j.get('cards',[]) if c.get('nmID')==2215883910 and c.get('vendorCode')=='5-furcoat-beige']
            out['lookups'].append(dict(page=page,count=len(j.get('cards',[]))))
            if found:out['card']=found[0];break
            cu=j.get('cursor',{})
            if cu.get('total',0)<100:break
            cursor={'limit':100,'updatedAt':cu['updatedAt'],'nmID':cu['nmID']}
            time.sleep(1)
          out['status']='complete' if 'card' in out else 'exact_card_unavailable'
          out['observed_at']=datetime.now(timezone.utc).isoformat();io.put(key,out)
          print(out['status'])
          PY

name: China visual manifest 20261112-all-recheck
on:
  push:
    paths: ['.github/workflows/china-visual-manifest-20261112-all-recheck.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: pip install requests
      - name: Read current photo order only
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        shell: python
        run: |
          import os,json,time,requests
          cursor={'limit':100};total=0
          for page in range(40):
           body={'settings':{'sort':{'ascending':True},'cursor':cursor,'filter':{'withPhoto':-1}}}
           for attempt in range(3):
            try:
             r=requests.post('https://content-api.wildberries.cn/content/v2/get/cards/list',json=body,headers={'Authorization':os.environ['WB_TOKEN_3']},timeout=(20,90))
             if r.status_code==429:raise RuntimeError('Rate limit: stop')
             r.raise_for_status();b=r.json();break
            except requests.exceptions.RequestException:
             if attempt==2:raise
             time.sleep(5)
           b=b.get('data',b) if 'cards' not in b else b
           rows=b['cards']
           for c in rows:
            print('VISUAL_CARD',json.dumps({'article':c['vendorCode'],'nmID':c['nmID'],'photos':[p.get('big') or p.get('c516x688') for p in c.get('photos',[])]},ensure_ascii=False),flush=True)
           total+=len(rows)
           if len(rows)<100:break
           cursor={'limit':100,'updatedAt':b['cursor']['updatedAt'],'nmID':b['cursor']['nmID']};time.sleep(2)
          else:raise RuntimeError('pagination ceiling')
          print('READ_ONLY_SUMMARY',json.dumps({'cards':total,'requests':page+1,'writes':0,'paid_calls':0}),flush=True)
          

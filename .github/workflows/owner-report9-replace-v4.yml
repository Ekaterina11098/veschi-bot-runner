name: Owner approved replacement of two existing report messages
on:
  push:
    paths:
      - '.github/workflows/owner-report9-replace-v4.yml'
permissions:
  contents: read
concurrency:
  group: owner-report9-replace-v4
  cancel-in-progress: false
jobs:
  replace:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Archive and edit exactly messages 800 and 801, no marketplace calls
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,hashlib,base64,copy
          from datetime import datetime,timezone,timedelta
          import requests
          ROOT='china_agent:owner_report_replace:2026-11-09:v4'
          ART='china_agent:advertising_artifacts:2026-11-09:v2'
          DEL='china_agent:advertising_delivery:2026-11-09:v1'
          BIND='china_agent:daily_ad_message:v2:'
          PLAN='china_agent:loss_plan:v1:'
          url=os.environ['SUPABASE_URL'].rstrip('/')+'/rest/v1/telegram_api_cache'
          key=os.environ['SUPABASE_SECRET_KEY']
          headers={'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json'}
          def now():return datetime.now(timezone.utc).isoformat()
          def get(k):
           r=requests.get(url,headers=headers,params={'cache_key':'eq.'+k,'select':'payload'},timeout=40);r.raise_for_status();a=r.json();return a[0]['payload'] if a else None
          def put(k,v,create=False):
           h=dict(headers,Prefer='resolution=ignore-duplicates,return=representation' if create else 'resolution=merge-duplicates,return=representation')
           r=requests.post(url,headers=h,json={'cache_key':k,'payload':v,'updated_at':now(),'expires_at':(datetime.now(timezone.utc)+timedelta(days=3650)).isoformat()},timeout=50);r.raise_for_status()
           if create and not r.json():raise RuntimeError('Immutable key already exists: '+k)
          def digest(v):return hashlib.sha256(json.dumps(v,sort_keys=True,ensure_ascii=False,separators=(',',':')).encode()).hexdigest()
          state={'status':'preparing','wb_writes':0,'parts':[],'started_at':now()}
          def run():
           if get(ROOT):raise RuntimeError('Existing revision; no automatic retry')
           put(ROOT,state,True)
           p=get(ROOT+':input');assert p['status']=='owner_approved' and p['chat_id']==-1004342917488 and p['bot_id']==8780468043 and p['wb_writes']==0
           art=get(ART);delivery=get(DEL);assert delivery['status']=='delivered'
           put(ROOT+':before_artifacts',art,True);put(ROOT+':before_delivery',delivery,True)
           token=os.environ['CHINA_TELEGRAM_BOT_TOKEN'];tg='https://api.telegram.org/bot'+token+'/'
           me=requests.post(tg+'getMe',timeout=30).json();assert me.get('ok') and me['result']['id']==p['bot_id']
           ready=[]
           for f in p['files']:
            raw64=''.join(get(ROOT+':chunk:'+f['family']+':'+str(i))['b64'] for i in range(f['chunk_count']))
            assert len(raw64)==f['b64_length'];raw=base64.b64decode(raw64,validate=True);assert hashlib.sha256(raw).hexdigest()==f['sha256']
            part=next(x for x in delivery['parts'] if x['kind']==f['kind']);assert part['message_id']==f['message_id'] and part['receipt']['chat']['id']==p['chat_id'] and part['receipt']['from']['id']==p['bot_id']
            old=get(BIND+str(f['message_id']));assert old and old['family']==f['family'];put(ROOT+':before_binding:'+str(f['message_id']),old,True)
            oldplan=get(PLAN+old['plan_id']);assert oldplan;put(ROOT+':before_plan:'+str(f['message_id']),oldplan,True)
            pid='daily-2026-11-09-owner-v4-'+f['family'];items=f['actions'];sha=digest(items)
            anchors=[x['growth_evidence']['observed_at'] for x in items if x.get('direction') in ('raise','add') and x.get('growth_evidence')]+[x['budget_evidence']['observed_at'] for x in items if x.get('budget_evidence')]
            expiry=min(datetime.fromisoformat(t)+timedelta(hours=2) for t in anchors).isoformat() if anchors else (datetime.now(timezone.utc)+timedelta(hours=20)).isoformat()
            plan=dict(plan_id=pid,chat_id=p['chat_id'],bot_id=p['bot_id'],execution_kind='daily_ad_actions_v2',family=f['family'],created_at=now(),expires_at=expiry,items=items,plan_sha256=sha,report_message_ids=[f['message_id']],price_changes=False,auto_topup=False,period_to=p['day'],owner_revision=ROOT,visible_from=now())
            plan.update(invalidated_at=now(),invalidation_reason='Report replacement in progress')
            put(PLAN+pid,plan,True)
            oldplan.update(invalidated_at=now(),invalidation_reason='Owner-approved replacement with revised recommendations',replaced_by_plan_id=pid);put(PLAN+old['plan_id'],oldplan)
            put(BIND+str(f['message_id']),dict(old,plan_id=pid,plan_sha256=sha))
            ready.append((f,raw64,raw,plan,part))
           state['status']='editing';put(ROOT,state)
           for f,raw64,raw,plan,part in ready:
            label='реклама' if f['family']=='drr' else 'бюджеты'
            caption='Китай · '+label+' · 2026-11-09 · обновлённый отчёт. Новых рекомендаций: '+str(len(f['actions']))+'. Ответьте «Сделай всё» для действий только этого PNG; перед выполнением — проверка актуальности.'
            journal={'status':'submitting','message_id':f['message_id'],'sha256':f['sha256'],'submitted_at':now()};state['parts'].append(journal);put(ROOT,state)
            try:
             response=requests.post(tg+'editMessageMedia',data={'chat_id':p['chat_id'],'message_id':f['message_id'],'media':json.dumps({'type':'photo','media':'attach://photo','caption':caption},ensure_ascii=False)},files={'photo':('report.png',raw,'image/png')},timeout=50).json()
            except Exception:
             journal['status']='uncertain';put(ROOT,state);raise RuntimeError('Telegram media response uncertain; do not retry blindly') from None
            if not response.get('ok'):
             journal.update(status='failed',error_code=response.get('error_code'),description=response.get('description'));put(ROOT,state);raise RuntimeError('Telegram rejected media edit')
            receipt=response['result'];assert receipt['message_id']==f['message_id'] and receipt['chat']['id']==p['chat_id'] and receipt['from']['id']==p['bot_id'] and receipt.get('photo') and receipt['caption']==caption
            journal.update(status='edited',receipt=receipt,edited_at=now(),plan_id=plan['plan_id'],plan_sha256=plan['plan_sha256']);put(ROOT,state)
            plan.pop('invalidated_at',None);plan.pop('invalidation_reason',None)
            plan['visible_from']=datetime.fromtimestamp(receipt.get('edit_date',receipt['date']),timezone.utc).isoformat();put(PLAN+plan['plan_id'],plan)
            af=next(x for x in art['files'] if x['kind']==f['kind']);af.update(b64=raw64,plan_id=plan['plan_id'],plan_sha256=plan['plan_sha256'],action_count=len(f['actions']),owner_revision=ROOT)
            part.update(sha256=f['sha256'],receipt=receipt,edited_at=journal['edited_at'],owner_revision=ROOT)
            art['owner_revision']=ROOT;delivery['owner_revision']=ROOT;put(ART,art);put(DEL,delivery)
           state.update(status='completed',completed_at=now(),telegram_edits=2,wb_writes=0);put(ROOT,state)
           assert get(ROOT)['status']=='completed' and all(x['status']=='edited' for x in get(ROOT)['parts'])
           print('Verified replacement of messages 800 and 801; no WB writes')
          if get(ROOT):
           print('Revision already exists; no automatic retry');raise SystemExit(0)
          try:run()
          except Exception as e:
           if state.get('status')!='completed' and get(ROOT):
            state.update(status='attention_required',error_type=type(e).__name__,failed_at=now());put(ROOT,state)
           print('Replacement stopped; inspect private revision receipt. No blind retry.');raise SystemExit(1)
          PY

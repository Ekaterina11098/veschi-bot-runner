name: Complete reconciled owner cohort26
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-cohort26-complete.yml']
permissions:
  contents: read
concurrency:
  group: china-cost-control-single-writer
  cancel-in-progress: false
jobs:
  complete:
    if: ${{ false }} # One-off finished; canonical receipts prevent any action replay.
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python - <<'PY'
          import os,pathlib,urllib.request
          root=pathlib.Path('scripts');root.mkdir(exist_ok=True)
          for name in ['china_cohort26_complete.py','china_cloud_cost_control.py']:
              root.joinpath(name).write_bytes(urllib.request.urlopen('https://raw.githubusercontent.com/Ekaterina11098/veschi-bot-runner/'+os.environ['GITHUB_SHA']+'/scripts/'+name,timeout=40).read())
          PY
      - run: pip install requests==2.32.5 > /tmp/dependencies.log 2>&1
      - run: python -m py_compile scripts/china_cohort26_complete.py
      - run: python scripts/china_cohort26_complete.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}

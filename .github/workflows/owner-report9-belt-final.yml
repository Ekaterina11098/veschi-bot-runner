name: Final exact belt readback and bounded confirmed-not-applied repair
on:
  push:
    paths:
      - '.github/workflows/owner-report9-belt-final.yml'
permissions:
  contents: read
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  finish:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1fc94106bc8e208169b1bd32a670b474e2e08d82
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Verify exact current belt and campaign before any further write; no interim Telegram result
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import os,json,time,copy
          from datetime import datetime,timezone
          import requests
          from china_loss_execute import IO as BaseIO
          from china_loss_control import CHAT,BOT,OWNER,PLAN,digest
          from china_daily_ad_actions import EXEC
          from china_daily_report_validity import require
          AUTH='china_agent:owner_report_apply:2026-11-09:v1';ROOT=AUTH+':belt-final'
          class IO(BaseIO):
           def put(self,k,v):
            if self.get(k)is None:
             if not self.create(k,v):raise ValueError('Creation race')
            else:super().put(k,v)
          io=IO()
          if io.get(ROOT):print('Existing final belt journal; no replay');raise SystemExit(0)
          state=dict(status='reading_before',wb_writes=0,created_at=datetime.now(timezone.utc).isoformat());assert io.create(ROOT,state)
          def save():io.put(ROOT,state)
          def read_campaign():
           r=requests.get('https://advert-api.wildberries.ru/api/advert/v2/adverts',params={'ids':41187173},headers={'Authorization':io.token},timeout=45)
           if not r.ok:raise ValueError('Campaign read HTTP '+str(r.status_code))
           rows=r.json()['adverts'];assert len(rows)==1 and rows[0]['id']==41187173 and rows[0]['currency']=='CNY';return rows[0]
          def post_read(path,body):
           time.sleep(15);r=requests.post('https://advert-api.wildberries.ru'+path,headers={'Authorization':io.token},json=body,timeout=45)
           if not r.ok:raise ValueError('Minimum read HTTP '+str(r.status_code))
           return r.json()
          try:
           p=io.get(PLAN+'daily-2026-11-09-owner-v4-drr');require(io,p);grant=io.get(AUTH+':authorization');assert grant['status']=='owner_approved'and grant['plan_hashes']['drr']==p['plan_sha256']==digest(p['items'])
           item=next(i for i in p['items']if i.get('nm_id')==1560230895 and i['kind']=='ad_add_sku');assert item['target_minor']==19 and item['campaign_id']==41187173
           io.validate_owner(dict(sender_id=OWNER,chat_id=CHAT,bot_id=BOT,job_id=277,reply_message_id=800))
           old=io.get(EXEC+p['plan_id']);original=next(s for s in old['items']if s['id']==item['id']);assert original['status']=='uncertain'and original.get('bid_phase')is None
           before=read_campaign();state['before']=before;save()
           existing=next((n for n in before['nm_settings']if n['nm_id']==1560230895),None)
           if existing:
            if existing['bids_kopecks'].get('recommendations')!=19:raise ValueError('Already added at different bid; no blind write')
            state.update(status='verified',already_present=True,after=before);save()
           else:
            if before!=original['before']:raise ValueError('Campaign changed since uncertain request; no retry')
            state['initial_request_readback']='not_applied; exact before composition confirmed';save()
            card=io.card(1560230895);state['card_identity']={k:card.get(k)for k in('nmID','subjectID','subjectName','vendorCode')};save()
            if card.get('subjectID')!=item['subject_id']:raise ValueError('Actual WB subject incompatible with approved campaign')
            from china_morning_readiness import current_prices,published_stock
            from china_moysklad_read import read_stock
            prices=current_prices(io,[1560230895]);published=published_stock(io,prices,[1560230895]);stock=read_stock([item['article']]);e=item['growth_evidence'];s=stock['rows'][0]
            if prices['rows'][0]['seller_price']!=e['price_cny']or not stock['coverage_complete']or s['stock']-s['reserve']<=0:raise ValueError('Current belt price/stock changed')
            if s['price']<=0 or e['expected_margin_before_ads_cny']-e['buyout']*(s['price']/100-e['own_cogs_rub'])/e['fx_rub_per_cny']<=0:raise ValueError('Current belt own economics unavailable')
            reference=min(before['nm_settings'],key=lambda n:n['bids_kopecks']['recommendations'])['nm_id'];q=post_read('/api/advert/v1/bids/min',dict(advert_id=41187173,nm_ids=[reference],payment_type='cpc',placement_types=['recommendation']))
            vals=[b['value']for n in q.get('bids',[])if n['nm_id']==reference for b in n['bids']if b['type']=='recommendation'and b['currency']=='CNY'];assert len(vals)==1 and vals[0]<=19
            body=dict(nms=[dict(advert_id=41187173,nms=dict(add=[1560230895],delete=[]))]);state.update(status='submitting_add',request=body);save()
            r=requests.patch('https://advert-api.wildberries.ru/adv/v0/auction/nms',headers={'Authorization':io.token},json=body,timeout=45)
            state['response_status']=r.status_code
            try:state['response']=r.json()
            except Exception:state['response']={'text':r.text[:3000]}
            save()
            if not r.ok:
             after=read_campaign();state['after']=after;state.update(status='blocked_confirmed_not_applied'if after==before else 'uncertain',reason='WB addition HTTP '+str(r.status_code));save()
            else:
             state.update(status='add_accepted',wb_writes=1);save();time.sleep(6);added=read_campaign();state['after_add']=added;save()
             oldmap={n['nm_id']:n for n in before['nm_settings']};newmap={n['nm_id']:n for n in added['nm_settings']}
             if set(newmap)!=set(oldmap)|{1560230895}or any(newmap[n]!=v for n,v in oldmap.items()):raise ValueError('Unexpected membership after add')
             if newmap[1560230895]['bids_kopecks']['recommendations']!=19:
              q=post_read('/api/advert/v1/bids/min',dict(advert_id=41187173,nm_ids=[1560230895],payment_type='cpc',placement_types=['recommendation']))
              vals=[b['value']for n in q.get('bids',[])if n['nm_id']==1560230895 for b in n['bids']if b['type']=='recommendation'and b['currency']=='CNY'];assert len(vals)==1 and vals[0]<=19
              state['status']='submitting_bid';save();body=dict(bids=[dict(advert_id=41187173,nm_bids=[dict(nm_id=1560230895,bid_kopecks=19,placement='recommendations')])]);r=requests.patch('https://advert-api.wildberries.ru/api/advert/v1/bids',headers={'Authorization':io.token},json=body,timeout=45)
              if not r.ok:raise ValueError('Belt exact bid HTTP '+str(r.status_code))
              state.update(status='bid_accepted',wb_writes=2);save();time.sleep(6)
             after=read_campaign();state['after']=after;newmap={n['nm_id']:n for n in after['nm_settings']}
             if set(newmap)!=set(oldmap)|{1560230895}or any(newmap[n]!=v for n,v in oldmap.items())or newmap[1560230895]['bids_kopecks']['recommendations']!=19:raise ValueError('Belt final state not verified')
             state.update(status='verified',verified_at=datetime.now(timezone.utc).isoformat());save()
           if state['status']=='verified':
            assert io.create(ROOT+':before_ledger',old)
            original.update(status='verified',before=state['before'],after=state['after'],recovery_execution_key=ROOT,verified_at=datetime.now(timezone.utc).isoformat());old['status']='done';old['wb_writes']+=state['wb_writes'];io.put(EXEC+p['plan_id'],old)
            registry=io.get('china_agent:verified_campaign_state:v1')or{};key=ROOT+':campaign:41187173';io.put(key,dict(status='verified',before=state['before'],after=state['after'],verified_at=datetime.now(timezone.utc).isoformat(),source_execution=ROOT));registry['41187173']=key;io.put('china_agent:verified_campaign_state:v1',registry)
           print('Belt final readback/response saved privately; no Telegram interim sent')
          except Exception as ex:
           state.update(status='attention_required',error=str(ex)if isinstance(ex,(ValueError,RuntimeError))else type(ex).__name__);save();print('Belt diagnostic stopped; inspect private state');raise SystemExit(1)
          PY

name: Verify targeted MoySklad reads30
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-moysklad-read-verify30.yml']
permissions:
  contents: read
concurrency:
  group: china-moysklad-read-check
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - run: python -m unittest discover -s scripts -p test_china_moysklad_read.py -v
      - name: Verify exact targeted MSK stock-reserve and current cost reads
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: python scripts/owner_moysklad_read_verify30.py

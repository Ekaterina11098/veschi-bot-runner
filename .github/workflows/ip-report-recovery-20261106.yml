name: Owner requested missing Nov5 IP report data only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ip-report-recovery-20261106
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1f270faf0510327aa82c8936b771d77abc27c64
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ip_report_recovery_20261106.py
            advertising_budget_evidence.py
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 2f798a9509b72030d6fb5ec68fb915c5d216c31b
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 cryptography==46.0.2 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Existing missing-only reader; no WB or Telegram tokens
        run: python ip_report_recovery_20261106.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          SUPABASE_EGRESS_OPTIMIZED: 'true'
          ADVERTISING_EXECUTION_ENABLED: 'false'

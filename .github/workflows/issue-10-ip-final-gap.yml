name: Issue 10 IP pilot exact SKU detail recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/issue-10-ip-final-gap.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: d04b3be8cbd8eef97391f7e8082f2810c0d67aec
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv aiogram apscheduler pillow > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Verify exact gap planner and recover only unattempted pilot SKU reports
        env:
          TASK: issue-10-ip-pilot-detail-gap
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
        run: |
          python - <<'PY'
          import run_private
          run_private.execute('Test exact pilot gap planner',['-m','unittest','discover','-s','tests','-p','test_ip_pilot_detail_gap.py'])
          script="""
          from analytics.ip_pilot_detail_gap import run
          for batch in range(3):run()
          """
          run_private.execute('Bounded exact pilot SKU day reports',['-c',script])
          PY

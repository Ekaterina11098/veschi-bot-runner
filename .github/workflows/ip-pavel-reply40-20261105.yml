name: Owner authorized exact reply to Pavel40
on:
  push:
    branches: [main]
    paths: ['.github/disabled/ip-pavel-reply40.never']
permissions:
  contents: read
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 33a6862dd8551468c1662fbdee35c128f1f9d564
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ip_pavel_reply40_20261105.py
            ip_apply_nine_20261103.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python ip_pavel_reply40_20261105.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ADVERTISING_TELEGRAM_BOT_TOKEN: ${{ secrets.ADVERTISING_TELEGRAM_BOT_TOKEN }}

name: Requested weekly report documents
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-requested-weekly-report.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: requested-weekly-ooo-883046423
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finish and verify authorized weekly documents
        env:
          WEEKLY_REVIEW_ROOT: 'weekly_report_review:ooo:883046423:'
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/create_requested_weekly_chain.py

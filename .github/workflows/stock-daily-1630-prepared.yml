name: Stock daily 05:00 and 16:30 MSK
on:
  workflow_dispatch:
    inputs:
      slot:
        description: Approved Moscow stock slot
        type: choice
        options: ['0700', '1630']
        default: '0700'
  schedule:
    - cron: '0 2 * * *'
    - cron: '30 13 * * 0-6'
    - cron: '40,50 13 * * *'
    - cron: '10,20,30,40,50 2 * * *'
    - cron: '*/10 3-8 * * *'
    - cron: '*/10 14-18 * * *'
# Daily05:00/16:30MSK; legacy0700 journal identity retained; bounded10-minute checks resume unfinished slots only.
# Completed slots and unexpired Retry-After are skipped without business API calls.
# Owner approved daily stock execution and new stock notifications, 2026-10-15.
permissions:
  contents: read
concurrency:
  group: bot-stock
  cancel-in-progress: false
jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 64ee20a8d55b30f552f630f123d8d36a8aace322
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv==1.1.1 aiogram==3.22.0 simplejson==4.2.0 'psycopg[binary]==3.2.9' cryptography > "$RUNNER_TEMP/daily-install.log" 2>&1
      - name: Fresh stock calculation and newly created stock-only notifications
        env:
          PYTHONPATH: ${{ github.workspace }}/private-source:${{ github.workspace }}
          STOCK_DAILY_ENABLED: 'true'
          STOCK_OZON_ENABLED: 'true'
          STOCK_PENDING_RESERVE_ENABLED: 'true'
          STOCK_RUN_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || ((github.event.schedule == '0 2 * * *' || github.event.schedule == '10,20,30,40,50 2 * * *' || github.event.schedule == '*/10 3-8 * * *') && '0700' || '1630') }}
          STOCK_NOTIFICATIONS_ENABLED: 'true'
          STOCK_CLOUD_EXECUTION_ENABLED: 'true'
          STOCK_JOURNAL_IMPORT_ACCEPTED: 'true'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          WB_FINANCE_TOKEN_1: ${{ secrets.WB_FINANCE_TOKEN_1 }}
          WB_FINANCE_TOKEN_2: ${{ secrets.WB_FINANCE_TOKEN_2 }}
          WB_FINANCE_TOKEN_3: ${{ secrets.WB_FINANCE_TOKEN_3 }}
          WB_STOCK_WAREHOUSE_1: ${{ vars.WB_STOCK_WAREHOUSE_1 }}
          WB_STOCK_WAREHOUSE_2: ${{ vars.WB_STOCK_WAREHOUSE_2 }}
          WB_STOCK_WAREHOUSE_3: ${{ vars.WB_STOCK_WAREHOUSE_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          MOYSKLAD_STORE_NAME: МСК
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          AUTO_STOCK_FAIL_FAST: '1'
        run: |
          python content_group_destination.py private-source/stock_regular_job.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-stock-daily-receipt
          path: ${{ runner.temp }}/stock-deploy-proof
          retention-days: 90


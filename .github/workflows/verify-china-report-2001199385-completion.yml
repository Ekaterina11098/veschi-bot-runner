name: Verify requested China report completion
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-china-report-2001199385-completion.yml']
  workflow_dispatch:
permissions: {}
concurrency:
  group: china-weekly-20261102-read
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Read finance report into private storage
        shell: python
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import os,json,gzip,urllib.request,urllib.error,time,datetime
          ROOT="weekly_report_review:china:20261102:"
          SB=os.environ["SUPABASE_URL"].rstrip("/")
          def now():return datetime.datetime.now(datetime.timezone.utc).isoformat()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs):raise RuntimeError("Redirect blocked")
          op=urllib.request.build_opener(NoRedirect)
          def http(url,headers,body=None):
           delay=0
           for attempt in range(4):
            if delay:time.sleep(delay)
            req=urllib.request.Request(url,headers=headers,method="GET" if body is None else "POST",data=None if body is None else json.dumps(body).encode())
            try:
             with op.open(req,timeout=120) as r:
              raw=r.read()
              if r.headers.get("Content-Encoding")=="gzip":raw=gzip.decompress(raw)
              return r.status,json.loads(raw) if raw else []
            except urllib.error.HTTPError as e:
             if e.code not in (429,500,502,503,504) or attempt==3:return e.code,None
             try:delay=max(62,float(e.headers.get("X-RateLimit-Retry") or e.headers.get("Retry-After") or 62)+3)
             except ValueError:delay=65
             put("transport_status:v1",{"at":now(),"status":"retry_wait","http":e.code,"retry_seconds":delay,"attempt":attempt+1})
             if delay>600:raise RuntimeError("Server retry window exceeds this read job")
            except Exception as e:
             put("transport_status:v1",{"at":now(),"status":"retry_wait","error_type":type(e).__name__,"attempt":attempt+1})
             if attempt==3:raise
             delay=62
          def put(key,payload):
           h={"apikey":os.environ["SUPABASE_SECRET_KEY"],"Authorization":"Bearer "+os.environ["SUPABASE_SECRET_KEY"],"Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=minimal"}
           req=urllib.request.Request(SB+"/rest/v1/telegram_api_cache?on_conflict=cache_key",headers=h,method="POST",data=json.dumps({"cache_key":ROOT+key,"payload":payload,"updated_at":now(),"expires_at":"2099-01-01T00:00:00Z"}).encode())
           with op.open(req,timeout=60) as r:assert r.status in (200,201,204)
          def get(key):
           h={"apikey":os.environ["SUPABASE_SECRET_KEY"],"Authorization":"Bearer "+os.environ["SUPABASE_SECRET_KEY"]}
           req=urllib.request.Request(SB+"/rest/v1/telegram_api_cache?cache_key=eq."+ROOT+key+"&select=payload",headers=h)
           with op.open(req,timeout=60) as r:data=json.loads(r.read())
           assert len(data)==1
           return data[0]["payload"]
          proof=get("source_proof:v1")
          assert proof["rows"]==3138 and proof["reports"][0]["reportId"]==2001199385
          last=get(proof["chunks"][-1]["key"].removeprefix(ROOT))[-1]["rrdId"]
          time.sleep(62)
          H={"Authorization":os.environ["WB_TOKEN_3"],"Content-Type":"application/json","Accept-Encoding":"gzip"}
          url="https://finance-api.wildberries.cn/api/finance/v1/sales-reports/detailed"
          status,rows=http(url,H,{"dateFrom":"2026-11-02","dateTo":"2026-11-08","period":"weekly","limit":100000,"rrdId":last})
          proof["period_completion_check"]={"at":now(),"http":status,"cursor":last}
          if status==204 or (status==200 and rows==[]):
           proof.update(status="downloaded",completed_at=now(),pagination_exhausted=True,completion_method="period endpoint terminal response after exact report cursor")
           put("source_proof:v1",proof)
           print("Requested source completion confirmed using period endpoint.")
          else:
           proof.update(status="completion_requires_review",completion_http=status)
           put("source_proof:v1",proof)
           if status==200 and isinstance(rows,list):put("completion_additional_rows:v1",rows)
           raise RuntimeError("Completion check needs review")

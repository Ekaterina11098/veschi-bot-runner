name: OOO one dated intraday snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ooo-midday-read11.yml']
permissions: {contents: read}
concurrency:
  group: ooo-token1-current-ads-read
  cancel-in-progress: false
jobs:
  read:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d63a9e0a00ccfa84df145e140f5da3521ac23657
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 --quiet
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
        run: python -u scripts/ooo_midday_read11.py

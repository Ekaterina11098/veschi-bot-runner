name: China free diagnostic repair 10Nov
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-free-repair10-once.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: china-dialog-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - run: pip install requests==2.32.5 Pillow==12.3.0 openai==3.42.1
      - name: Offline checks
        run: |
          python scripts/install_china_dialog.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_free_diagnostics.py
          PYTHONPATH=scripts:source python -m unittest discover -s scripts -p test_china_free_diagnostic_repair.py
      - name: Read real WB data and correct original requested replies
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          OPENAI_API_KEY: ""
          PYTHONPATH: scripts:source
        run: python scripts/china_free_diagnostic_repair.py --job-id 283 --job-id 285

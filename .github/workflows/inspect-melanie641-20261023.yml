name: Inspect Melanie 641 photos
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: melanie-641-media
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - name: Read exact China card and save gallery
        shell: python
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: |
          import os,json,hashlib,io
          from pathlib import Path
          import requests
          from PIL import Image,ImageDraw
          root=Path('melanie641');root.mkdir()
          token=os.environ['WB_TOKEN_3'];assert token
          r=requests.post('https://content-api.wildberries.cn/content/v2/get/cards/list',headers={'Authorization':token},json={'settings':{'cursor':{'limit':100},'filter':{'withPhoto':-1,'textSearch':'641-MelanieBag-grey'}}},timeout=60)
          r.raise_for_status();body=r.json();cards=body.get('cards',body.get('data',{}).get('cards',[]))
          selected=[c for c in cards if c.get('nmID')==1473246047 and c.get('vendorCode')=='641-MelanieBag-grey'];assert len(selected)==1,'Exact card missing'
          card=selected[0];(root/'media.json').write_text(json.dumps({k:card.get(k) for k in ['nmID','vendorCode','photos','video']},ensure_ascii=False),encoding='utf-8')
          photos=card.get('photos') or [];assert photos
          sheet=Image.new('RGB',(1000,((len(photos)+3)//4)*365),'white');d=ImageDraw.Draw(sheet)
          for i,p in enumerate(photos,1):
              u=p.get('big') or p.get('c516x688');res=requests.get(u,timeout=60);res.raise_for_status();raw=res.content
              (root/f'photo-{i:02d}.webp').write_bytes(raw)
              im=Image.open(io.BytesIO(raw)).convert('RGB');im.thumbnail((240,335));x=((i-1)%4)*250;y=((i-1)//4)*365
              sheet.paste(im,(x,y+25));d.text((x+8,y+5),f'PHOTO {i}',fill='black')
          sheet.save(root/'overview.jpg',quality=95)
          print(json.dumps({'article':card['vendorCode'],'nmID':card['nmID'],'count':len(photos),'video':bool(card.get('video')),'photos':photos},ensure_ascii=False))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: melanie641-gallery
          path: melanie641/
          retention-days: 14

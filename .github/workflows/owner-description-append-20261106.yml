name: Owner authorized append descriptions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-description-append-20261106.yml']
permissions: {contents: read}
concurrency:
  group: china-owner-description-writes
  cancel-in-progress: false
jobs:
  apply:
    if: github.event.head_commit.message == 'Publish approved description additions within confirmed WB limit'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 55b20385ba58e6f2e8567e112aed0b2ea7e61980
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Append approved descriptions and verify preservation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MODE: apply
          APPROVED_MANIFEST_SHA: d33a126c559b1e54b72d66a49934d0e1792f1f3390c9967c8c7bafcf34810b93
          PYTHONPATH: scripts
        run: python scripts/owner_description_append_20261106_v2.py

name: Execute exact owner-requested China return move
on:
  push:
    branches: [main]
    paths: ['.github/workflows/execute-china-return-move-20261105.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fbs-document-chain-production
  cancel-in-progress: false
jobs:
  exact-move:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Verify fresh stock, create one exact move and read back
        shell: python
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: |
          """One exact owner-requested return move. No scheduled runner or marketplace mutations."""
          import collections,copy,datetime as dt,math,sys
          sys.path.insert(0,"scripts")
          import fbs_document_chain as m
          ROOT="returns_transfer:china:20261105:"
          SOURCE_HASH="d5ae8ed68c529aae2d560a3d0b3e3c6d3f50ce03687ff955008b29d77aedfbd4"
          class OnlyMove(m.Transport):
           approved_payload=None
           posts=0
           def request(self,base,path,method="GET",body=None,params=None):
            if base==m.MS and method!="GET":
             if method!="POST" or path!="entity/move" or body!=self.approved_payload or self.posts:raise m.Stop("Write outside exact approved move blocked")
             self.posts+=1
            return super().request(base,path,method,body,params)
          def totals(positions):
           out=collections.Counter()
           for p in positions:
            if not isinstance(p.get("quantity"),(int,float)) or p["quantity"]<=0:raise m.Stop("Invalid move position quantity")
            out[m.href(p["assortment"])]+=p["quantity"]
           return out
          def scoped(doc,source,target,org):
           return m.href(doc.get("sourceStore",{}))==m.href(source) and m.href(doc.get("targetStore",{}))==m.href(target) and m.href(doc.get("organization",{}))==m.href(org)
          t=OnlyMove();db=m.Cache(t);w=m.Worker(t,db,{})
          result={"status":"preparing","at":m.now(),"write_attempted":False}
          try:
           req=db.get(ROOT+"request:v1")
           if not req or req.get("owner_confirmed") is not True or req.get("forbid_negative_stock") is not True or req.get("source_sha256")!=SOURCE_HASH or req.get("sheet")!="Возвраты Китай 05 11 26":raise m.Stop("Exact owner source confirmation missing")
           if req.get("quantity")!=442 or req.get("positions")!=141 or req.get("source_quantity")!=444:raise m.Stop("Source totals changed")
           if len(req.get("excluded",[]))!=1 or req["excluded"][0]["source_label"]!="143" or req["excluded"][0]["quantity"]!=2:raise m.Stop("Two 143 bags must be excluded")
           scope=req["resolved_scope"];mapping_by_label={p["source_label"]:p for p in req["approved_mapping"]}
           mapping=[copy.deepcopy(mapping_by_label[r["source_label"]]) for r in req["rows"]]
           if len(mapping)!=141 or len({p["id"] for p in mapping})!=141 or sum(p["quantity"] for p in mapping)!=442:raise m.Stop("Approved product composition invalid")
           if any(p["kind"]=="сумка" and p["number"]=="143" for p in mapping):raise m.Stop("Excluded bag included")
           if any(p["quantity"]!=r["quantity"] for p,r in zip(mapping,req["rows"])):raise m.Stop("Approved source quantities changed")
           source=t.request(m.MS,"entity/store/"+scope["source_store_id"])
           target=t.request(m.MS,"entity/store/"+scope["target_store_id"])
           org=t.request(m.MS,"entity/organization/"+scope["organization_id"])
           for obj,key in ((source,"source_store_name"),(target,"target_store_name"),(org,"organization_name")):
            if obj.get("name")!=scope[key] or obj.get("archived"):raise m.Stop("Warehouse or organization identity changed")
           if source["id"]==target["id"]:raise m.Stop("Source and target must differ")
           products={p["id"]:p for p in w.ms_rows("entity/product")}
           for p in mapping:
            live=products.get(p["id"],{})
            if live.get("code")!=p["code"] or live.get("article")!=p["article"] or live.get("name")!=p["name"] or live.get("archived") or live.get("variantsCount",0) or live.get("isSerialTrackable") or live.get("trackingType","NOT_TRACKED")!="NOT_TRACKED":raise m.Stop("Approved product identity or tracking changed")
            p["assortment"]=m.meta(live)
           expected=collections.Counter({m.href(p["assortment"]):p["quantity"] for p in mapping})
           docs=w.ms_rows("entity/move",{"filter":"externalCode="+req["externalCode"]})
           if len(docs)>1:raise m.Stop("Duplicate exact move external identity")
           adopted=bool(docs)
           if docs:doc=docs[0]
           else:
            creation=db.get(ROOT+"creation:v1")
            if creation and creation.get("status") in ("inflight","created","verified"):raise m.Stop("Prior creation outcome requires reconciliation")
            if req.get("writes_enabled") is not True or m.stamp(req["expires_at"])<=m.stamp(m.now()):raise m.Stop("One-time execution is disabled or expired")
            local=dt.datetime.now(dt.timezone(dt.timedelta(hours=3)))
            if local.date().isoformat()!=req["business_date"]:raise m.Stop("Dated owner request expired")
            same_day=w.ms_rows("entity/move",{"filter":"moment>=2026-11-05 00:00:00;moment<2026-11-06 00:00:00"})
            for d in same_day:
             if not d.get("deleted") and scoped(d,source,target,org):
              ps=w.ms_rows("entity/move/"+d["id"]+"/positions")
              if totals(ps)==expected:raise m.Stop("Matching existing move found; review before creating a duplicate")
            current=t.request(m.MS,"report/stock/bystore/current",params={"stockType":"freeStock","include":"zeroLines"})
            if not isinstance(current,list):raise m.Stop("Current stock report incomplete")
            free={}
            for r in current:
             pair=(r["storeId"],r["assortmentId"])
             if pair in free:raise m.Stop("Duplicate current stock identity")
             free[pair]=r["freeStock"]
            stock=w.ms_rows("report/stock/all",{"filter":"store="+m.href(source),"stockMode":"all","quantityMode":"all"})
            byhref={m.href(r).split("?")[0]:r for r in stock}
            shortages=[]
            for p in mapping:
             s=byhref.get(m.href(p["assortment"]).split("?")[0],{})
             p.update(available_before=free.get((source["id"],p["id"])),stock_before=s.get("stock"),quantity_before=s.get("quantity"))
             values=[p["available_before"],p["stock_before"],p["quantity_before"]]
             known=all(type(v) in (int,float) and math.isfinite(v) for v in values)
             if not known or min(values)<p["quantity"]:
              shortages.append({k:p.get(k) for k in ("source_label","code","article","name","quantity","available_before","stock_before","quantity_before")})
            result.update(mapping=mapping,source=source["name"],target=target["name"],organization=org["name"],quantity=442,positions=141,excluded=req["excluded"],stock_checked_at=m.now())
            if shortages:
             result.update(status="insufficient_stock",stock_issues=shortages,owner_decision_required=True);db.put(ROOT+"result:v1",result)
             req["writes_enabled"]=False;req["owner_decision_required"]=True;db.put(ROOT+"request:v1",req)
             raise m.Stop("Insufficient or unknown stock; no move posted; owner decision required")
            payload={"organization":m.meta(org),"sourceStore":m.meta(source),"targetStore":m.meta(target),"description":req["description"],"externalCode":req["externalCode"],"applicable":True,"moment":local.strftime("%Y-%m-%d %H:%M:%S"),"positions":[{"assortment":p["assortment"],"quantity":p["quantity"],"price":0} for p in mapping]}
            if not db.claim(ROOT+"execution_claim:v1",{"at":m.now(),"source_sha256":SOURCE_HASH,"quantity":442,"positions":141,"confirmation_page":req["confirmation_page"]}):raise m.Stop("One-time execution already claimed; reconcile without replay")
            db.put(ROOT+"creation:v1",{"status":"inflight","at":m.now(),"externalCode":req["externalCode"],"source_sha256":SOURCE_HASH})
            result.update(status="inflight",write_attempted=True);db.put(ROOT+"result:v1",result)
            t.approved_payload=payload
            doc=t.request(m.MS,"entity/move","POST",payload)
            db.put(ROOT+"creation:v1",{"status":"created","id":doc["id"],"at":m.now(),"externalCode":req["externalCode"]})
           live=t.request(m.MS,"entity/move/"+doc["id"])
           positions=w.ms_rows("entity/move/"+doc["id"]+"/positions")
           checks={"exact_products_and_quantities":totals(positions)==expected,"quantity":sum(p["quantity"] for p in positions)==442,"positions":len(positions)==141,"posted":live.get("applicable") is True,"scope":scoped(live,source,target,org),"description":live.get("description")==req["description"],"external_identity":live.get("externalCode")==req["externalCode"],"source_date":live.get("moment","").startswith("2026-11-05"),"zero_prices":live.get("sum")==0 and all(p.get("price")==0 for p in positions),"not_deleted":not live.get("deleted"),"143_excluded":all(p["number"]!="143" or p["kind"]!="сумка" for p in mapping)}
           after=t.request(m.MS,"report/stock/bystore/current",params={"stockType":"freeStock","include":"zeroLines"})
           if not isinstance(after,list):raise m.Stop("Post-move stock report incomplete")
           af={(r["storeId"],r["assortmentId"]):r["freeStock"] for r in after}
           checks["remaining_source_available_nonnegative"]=all(type(af.get((source["id"],p["id"]))) in (int,float) and af[(source["id"],p["id"])]>=0 for p in mapping)
           result.update(status="verified" if all(checks.values()) else "verification_failed",id=live["id"],name=live["name"],url=live["meta"].get("uuidHref"),moment=live["moment"],quantity=sum(p["quantity"] for p in positions),positions=len(positions),source=source["name"],target=target["name"],organization=org["name"],excluded=req["excluded"],checks=checks,adopted_existing=adopted,verified_at=m.now())
           db.put(ROOT+"result:v1",result)
           if not all(checks.values()):raise m.Stop("Move verification needs review; no automatic repeat")
           db.put(ROOT+"creation:v1",{"status":"verified","id":live["id"],"externalCode":req["externalCode"],"at":m.now()})
           req["writes_enabled"]=False;req["completed_document_id"]=live["id"];db.put(ROOT+"request:v1",req)
           print("Owner-requested move posted and live-verified; all receipts saved privately.")
          except Exception as exc:
           if result.get("status") not in ("insufficient_stock","inflight","verification_failed"):result["status"]="stopped"
           result.update(error=str(exc) if isinstance(exc,m.Stop) else type(exc).__name__,checked_at=m.now())
           db.put(ROOT+"result:v1",result)
           print("Exact transfer stopped; private receipt records the outcome. No blind replay.")
           sys.exit(1)

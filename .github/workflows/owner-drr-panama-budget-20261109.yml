name: Owner DRR review Panama budget current inputs
on:
  push:
    paths:
      - '.github/workflows/owner-drr-panama-budget-20261109.yml'
permissions:
  contents: read
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  fund:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 10ca471ebdc30e8979abeb6286434c51fe218931
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Read exact Panama budget current economics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          from datetime import datetime,timezone
          from china_loss_execute import IO
          from china_advertising_v2 import http
          from china_morning_readiness import current_prices,published_stock
          from china_moysklad_read import read_stock
          io=IO();key='china_agent:owner_all_drr_review:2026-11-09:v1:panama_budget_inputs'
          if io.get(key):raise SystemExit('Saved budget inputs, no replay')
          assert io.create(key,dict(status='collecting',wb_writes=0,telegram_calls=0))
          try:
           cp=http(io,'/api/advert/v2/adverts?ids=40945478')['adverts'][0]
           nms=[n['nm_id']for n in cp['nm_settings']]
           prices=current_prices(io,nms);published=published_stock(io,prices,nms);stock=read_stock([r['article']for r in prices['rows']])
           budget=http(io,'/api/advert/v2/budget','POST',dict(advertIds=[40945478]))['adverts'][0]
           io.put(key,dict(status='complete',campaign=cp,budget=budget,prices=prices,published=published,stock=stock,observed_at=datetime.now(timezone.utc).isoformat(),wb_writes=0,telegram_calls=0))
           print('Panama budget economics current read saved; no writes')
          except Exception as ex:
           io.put(key,dict(status='blocked',error=type(ex).__name__,wb_writes=0,telegram_calls=0));raise
          
          PY

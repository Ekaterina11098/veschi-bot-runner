name: Three cabinet Sol dialogue activation check
on:
  push:
    branches: [main]
    paths: ['cloud-dialog-activation-request.json']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: three-cabinet-dialogue-activation-check
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Read-only model access and cabinet configuration verification
        env:
          OOO_TELEGRAM_BOT_TOKEN: ${{ secrets.OOO_TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/cloud_dialog_activation_check.py

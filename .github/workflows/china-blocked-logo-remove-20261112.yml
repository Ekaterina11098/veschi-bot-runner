ode']==e['article'] and c['photos']==e['photos'] and c.get('video')==e['video'],'Gallery changed since visual review'\n  before[str(c['nmID'])]=c\n (ROOT/'before.json').write_text(json.dumps(before,ensure_ascii=False))\n def fetch(job):\n  e,n=job;raw,im=image(e['photos'][n-1]['big']);assert hashlib.sha256(raw).hexdigest()==e['hashes'][n-1],'Photo content changed'\n  (ROOT/f\"{e['nmID']}_{n}.webp\").write_bytes(raw)\n with concurrent.futures.ThreadPoolExecutor(max_workers=8)as pool:list(pool.map(fetch,[(e,n) for e in EXPECTED for n in range(1,len(e['photos'])+1)]))\n (ROOT/'plan.json').write_text(json.dumps(EXPECTED,ensure_ascii=False))\n print('PREPARED',len(EXPECTED),'cards; 8 exact reviewed photos; originals backed up',flush=True)\nelse:\n before=json.loads((ROOT/'before.json').read_text());latest=cards()\n for e in EXPECTED:\n  c=latest[e['nmID']];b=before[str(e['nmID'])]\n  assert c['photos']==b['photos'] and c.get('video')==b.get('video'),'Concurrent media change'\n result=[]\n for e in sorted(EXPECTED,key=lambda e:bool(e['video'])):\n  b=before[str(e['nmID'])];urls=[p['big']for n,p in enumerate(b['photos'],1)if n not in e['remove']]\n  if b.get('video'):urls.append(b['video'])\n  receipt={'article':e['article'],'nmID':e['nmID'],'removed_original_slots':e['remove'],'before_count':len(b['photos']),'expected_count':len(b['photos'])-len(e['remove']),'status':'submitting'}\n  result.append(receipt);Path('result.json').write_text(json.dumps(result,ensure_ascii=False))\n  try:\n   response=request('/content/v3/media/save',{'nmId':e['nmID'],'data':urls})\n   receipt['status']='accepted_pending_readback';receipt['response']=response\n  except Exception as ex:\n   receipt['status']='rejected_or_uncertain';receipt['error']=type(ex).__name__+':'+str(ex)[:400]\n  print('WRITE_RESULT',json.dumps(receipt,ensure_ascii=False),flush=True);Path('result.json').write_text(json.dumps(result,ensure_ascii=False));time.sleep(2)\n for attempt in range(3):\n  time.sleep(12);after=cards()\n  for receipt in result:\n   nm=receipt['nmID'];b=before[str(nm)];a=after[nm];e=next(e for e in EXPECTED if e['nmID']==nm)\n   receipt['actual_count']=len(a['photos']);receipt['video_preserved']=a.get('video')==b.get('video')\n   receipt['other_fields_preserved']=core(a)==core(b)\n   retained=[n for n in range(1,len(b['photos'])+1)if n not in e['remove']]\n   ok=len(a['photos'])==len(retained) and receipt['video_preserved'] and receipt['other_fields_preserved']\n   if ok:\n    checks=[]\n    for pos,n in enumerate(retained):\n     raw,im=image(a['photos'][pos]['big']);old=Image.open(ROOT/f'{nm}_{n}.webp').convert('RGB')\n     delta=sum(ImageStat.Stat(ImageChops.difference(im.resize((90,120)),old.resize((90,120)))).mean)/3\n     checks.append(round(delta,3))\n    receipt['image_differences']=checks;ok=all(x<8 for x in checks)\n   if ok:receipt['status']='verified'\n   receipt['after']=a\n  Path('result.json').write_text(json.dumps(result,ensure_ascii=False))\n  if all(x['status']=='verified'for x in result):break\n for receipt in result:print('FINAL_RESULT',json.dumps({k:v for k,v in receipt.items()if k!='after'},ensure_ascii=False),flush=True)\n r=requests.get('https://seller-analytics-api.wildberries.cn/api/v1/analytics/banned-products/blocked',headers=H,params={'sort':'nmId','order':'asc'},timeout=(15,50));r.raise_for_status()\n print('BLOCKED_AFTER',json.dumps(r.json(),ensure_ascii=False),flush=True)\n assert all(x['status']=='verified'for x in result),'Some removals not yet verified; do not resubmit'\n")

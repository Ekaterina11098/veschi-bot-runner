name: China price morning report only
on:
  push:
    branches: [main]
    paths: ['china-price-morning-request.json']
permissions:
  contents: read
concurrency:
  group: bot-business-agent
  cancel-in-progress: false
jobs:
  report:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: bot-mpstats-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact dated request
        id: request
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          with open('china-price-morning-request.json') as f:value=json.load(f)
          day=datetime.now(ZoneInfo('Europe/Moscow')).date().isoformat()
          allowed=(value.get('report_date')==day and value.get('mode')=='morning'
                   and value.get('action') in ('run','verify') and value.get('source_commit')=='b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c'
                   and isinstance(value.get('nonce'),str) and len(value['nonce'])>=8)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('allowed='+str(allowed).lower()+'\n')
          print(json.dumps(dict(mode='morning',report_date=value.get('report_date'),authorized_run=allowed)))
          PY
      - uses: actions/checkout@v4
        if: steps.request.outputs.allowed == 'true'
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.request.outputs.allowed == 'true'
        with:
          python-version: '3.12'
      - name: Install pinned transport and existing worker dependencies
        if: steps.request.outputs.allowed == 'true'
        run: pip install requests==2.32.5 python-dotenv aiogram apscheduler pillow simplejson==4.2.0 > "$RUNNER_TEMP/install.log" 2>&1
      - name: Deliver exact China morning report
        if: steps.request.outputs.allowed == 'true'
        working-directory: source
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: |
          cp ../scripts/china_order_coverage.py china_agent/order_coverage.py
          cp ../scripts/china_wb_order_gaps.py china_agent/wb_order_gaps.py
          cp ../scripts/china_coverage_worker.py china_agent/coverage_worker.py
          cp ../scripts/china_morning_pair.py china_agent/morning_pair.py
          python -m compileall -q china_agent/morning_pair.py
          ACTION=$(python -c "import json;print(json.load(open('../china-price-morning-request.json'))['action'])")
          if [ "$ACTION" = verify ]; then
            python -m china_agent.morning_pair --verify
          else
            python -m china_agent.morning_pair
          fi

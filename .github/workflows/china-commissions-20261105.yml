name: Read China category commissions 20261105
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-commissions-20261105.yml']
permissions:
  contents: read
jobs:
  read:
    if: github.event.head_commit.message == 'Read China category commissions 20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: china-commission-read
      cancel-in-progress: false
    steps:
      - name: Read official China fees only
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: |
          python3 -u <<'PY'
          import os,json,urllib.request,datetime
          token=os.environ['WB_TOKEN_3']
          if not token: raise RuntimeError('China token unavailable')
          req=urllib.request.Request('https://common-api.wildberries.cn/api/v1/tariffs/commission?locale=ru',headers={'Authorization':token})
          with urllib.request.urlopen(req,timeout=60) as r: data=json.load(r)
          report=data.get('report')
          assert isinstance(report,list) and report,'Missing fee report'
          selected=[r for r in report if r.get('subjectName','').casefold() in ['сумки','зонты','ремни','панамы','манишки','шарфы','палантины','шапки']]
          assert any(r.get('subjectName','').casefold()=='сумки' for r in selected),'Bags category missing'
          assert all(isinstance(r.get('kgvpChina'),(int,float)) and 0<=r['kgvpChina']<100 for r in selected),'China fee missing'
          print('OBSERVED_UTC',datetime.datetime.now(datetime.timezone.utc).isoformat())
          print('TOTAL_SUBJECTS',len(report))
          print('CHINA_FEES',json.dumps(selected,ensure_ascii=False))
          PY

name: Requested current sales funnel read
on:
  push:
    branches: [main]
    paths: ['.github/workflows/requested-current-funnel-read.yml']
permissions: {contents: read}
concurrency:
  group: china-dialog-data
  cancel-in-progress: false
jobs:
  read:
    if: github.event.head_commit.message == 'Read requested current funnel into private cache without marketplace changes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Read requested funnel into private cache only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import os, json
          from datetime import datetime, timezone, timedelta
          import requests
          from china_wb_evidence import Reports
          class Cache:
           def db(self,method,table,params=None,body=None,prefer=None):
            headers={'apikey':os.environ['SUPABASE_SECRET_KEY'],'Authorization':'Bearer '+os.environ['SUPABASE_SECRET_KEY']}
            if prefer: headers['Prefer']=prefer
            r=requests.request(method,os.environ['SUPABASE_URL'].rstrip('/')+'/rest/v1/'+table,headers=headers,params=params,json=body,timeout=90)
            r.raise_for_status()
            return r.json() if r.content else None
           def get(self,key):
            rows=self.db('GET','telegram_api_cache',params={'cache_key':'eq.'+key,'select':'payload'})
            return rows[0]['payload'] if rows else None
           def save(self,key,value):
            self.db('POST','telegram_api_cache',params={'on_conflict':'cache_key'},body={'cache_key':key,'payload':value,'updated_at':datetime.now(timezone.utc).isoformat(),'expires_at':(datetime.now(timezone.utc)+timedelta(days=60)).isoformat()},prefer='resolution=merge-duplicates')
          day=datetime.now(timezone(timedelta(hours=3))).date().isoformat()
          result=Reports(Cache()).funnel(day,day)
          print(json.dumps({'complete':result.get('complete'),'status':result.get('status'),'rows':len(result.get('rows',[])),'observed_at':result.get('observed_at'),'wb_writes':0,'telegram_sends':0}))
          PY

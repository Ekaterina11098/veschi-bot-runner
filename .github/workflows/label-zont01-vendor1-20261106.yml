name: Set owner specified vendor number for remaining China label
on:
  push:
    paths: ['.github/workflows/label-zont01-vendor1-20261106.yml']
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: scripts/fbs_document_chain.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: python
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import sys
          sys.path.insert(0,"scripts")
          from fbs_document_chain import Transport,Cache,MS,now,Stop
          t=Transport();db=Cache(t)
          KEY="label_fields:china:20261106:zont01_vendor1:v1"
          audit=db.get("label_fields:china:20261106:execution:v1")
          items=[x for x in audit.get("unresolved",[]) if x.get("article")=="Zont01-fio" and x.get("field")=="ВендорКод"]
          if len(items)!=1:raise Stop("Expected one reviewed unnumbered item")
          path="entity/product/"+items[0]["id"]
          p=t.request(MS,path)
          if p.get("article")!="Zont01-fio" or p.get("archived"):raise Stop("Product identity changed")
          attrs=p.get("attributes",[])
          vendor=[a for a in attrs if a.get("name")=="ВендорКод"]
          if len(vendor)>1:raise Stop("Duplicate attribute")
          if vendor and str(vendor[0].get("value") or "") not in ("","1"):raise Stop("Existing vendor field changed")
          old=db.get(KEY)
          before=old["before"] if old and old.get("before") else attrs
          entry={"meta":{"href":MS+"entity/product/metadata/attributes/07274bb5-fd7a-11ee-0a80-1479002b0ae8","type":"attributemetadata","mediaType":"application/json"},"value":"1"}
          state={"status":"preflight","at":now(),"id":p["id"],"article":p["article"],"before":before}
          db.put(KEY,state)
          if not vendor or str(vendor[0].get("value"))!="1":
              state["status"]="applying";db.put(KEY,state)
              t.request(MS,path,"PUT",{"attributes":[a for a in attrs if a.get("name")!="ВендорКод"]+[entry]})
          after=t.request(MS,path)
          def fields(q):return {a["name"]:a.get("value") for a in q.get("attributes",[])}
          if fields(after).get("ВендорКод")!="1":raise Stop("Vendor readback mismatch")
          if after.get("barcodes")!=p.get("barcodes"):raise Stop("Barcode changed")
          for name,value in fields(p).items():
              if name!="ВендорКод" and fields(after).get(name)!=value:raise Stop("Other attribute changed")
          state.update(status="verified",after=after.get("attributes"),verified_at=now())
          db.put(KEY,state)
          catalog=db.get("label_utility:catalog:20261106:v1")
          matching=[x for x in catalog["products"] if x["id"]==p["id"]]
          if len(matching)!=1:raise Stop("Private catalog identity mismatch")
          matching[0]["attributes"]=after.get("attributes",[])
          catalog["last_patch_at"]=now()
          db.put("label_utility:catalog:20261106:v1",catalog)
          print("Owner requested vendor field verified; private catalog patched")
          

name: Owner complete report categories and missing statistics
on:
  push:
    paths: ['.github/workflows/owner-report-growth-repair-20261111.yml']
permissions:
  contents: read
concurrency:
  group: china-advertising-daily
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Read exact categories and quotes; no WB writes or Telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: unused-no-telegram
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import requests,time,unittest
          from datetime import datetime,timezone
          from china_price_apply import IO
          import test_growth_subject_identity
          result=unittest.TextTestRunner().run(unittest.defaultTestLoader.loadTestsFromModule(test_growth_subject_identity))
          assert result.wasSuccessful()
          io=IO();K='china_agent:owner_report_complete:2026-11-11:v1:minimum-api-check'
          if io.get(K):raise SystemExit('Existing bounded API read; no replay')
          e=dict(status='reading',tests_passed=result.testsRun,wb_writes=0,telegram_calls=0,observed_at=datetime.now(timezone.utc).isoformat());assert io.create(K,e)
          for label,path,body in [('new_campaign','/api/advert/v1/bids/min',dict(advert_id=0,nm_ids=[1473242577],payment_type='cpc',placement_types=['search'])),('legacy','/adv/v0/bids/min',dict(advert_id=41298169,nm_ids=[1473242577],payment_type='cpc',placement_types=['search']))]:
           time.sleep(3.5)
           try:
            r=requests.post('https://advert-api.wildberries.ru'+path,headers={'Authorization':io.token},json=body,timeout=35)
            e[label]={'http':r.status_code,'body':r.json() if r.content else None}
           except Exception as ex:e[label]={'error':type(ex).__name__}
           io.put(K,e)
          e['status']='read';io.put(K,e);print('Regression tests and bounded read-only minimum API checks saved')
          PY

name: Clean processed review reply messages
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/review-participant-cleanup.yml']
permissions:
  contents: read
concurrency:
  group: review-participant-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /test_review_cleanup.py
            /review-approval-preparation/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'psycopg[binary]==3.2.10'
      - run: python -m unittest test_review_cleanup.py
      - name: Remove only tracked processed messages through guarded cleanup
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os,sys,hmac,hashlib,base64,json
          sys.path.insert(0,'review-approval-preparation')
          import psycopg
          from review_telegram_approval import Approval,Repository
          from review_telegram_runtime import TelegramTransport
          from review_approval_cleanup import cleanup_completed
          root=os.environ['SUPABASE_SECRET_KEY'].encode()
          password=hmac.new(root,b'veschi:review-approval-login:20261015:v1',hashlib.sha256).hexdigest()
          with psycopg.connect(host='aws-0-eu-central-1.pooler.supabase.com',port=5432,dbname='postgres',user='review_approval_login_20261015.abxgjoqlddhtcmjcjwxw',password=password,sslmode='require',autocommit=True,connect_timeout=15,options='-c statement_timeout=30000') as conn:
              row=conn.execute("SELECT payload FROM review_approval.source_cache WHERE cache_key='reviews:telegram-approval:config:v1'").fetchone()
              cfg=row[0] if row else {}
              if not cfg.get('enabled') or not cfg.get('destination_verified'):raise SystemExit('Approval destination not enabled and verified')
              secret=base64.b64encode(hmac.new(root,b'veschi:review-approval-ingress:20261015:v1',hashlib.sha256).digest()).decode()
              app=Approval(Repository(conn,postgres=True),secret,cfg['owner_id'],cfg['chat_id'],cfg['bot_id'],enabled=True)
              class DeleteOnly:
                  def __init__(self):self.transport=TelegramTransport(os.environ['TELEGRAM_BOT_TOKEN'])
                  def call(self,method,payload):
                      if method!='deleteMessage':raise RuntimeError('Cleanup permits deletion only')
                      return self.transport.call(method,payload)
              print(json.dumps(cleanup_completed(app,DeleteOnly(),intent_id='e4a2dc7a8941eccea089a4444a882160f9fe6b48a1966bb519adbad02c25db06')))
          PY

name: Issue 10 advertised stock verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/issue-10-ad-stock.yml']
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
permissions:
  contents: read
concurrency:
  group: issue-10-stock-read-only
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 2207832ccbf0dcc321dc7ba4422576884ad509de
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv aiogram apscheduler pillow streamlit openai playwright > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Test stock availability and execution lifecycle before rollout
        env:
          TASK: issue-10-stock-tests
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          for pattern in ('test_stock_availability.py','test_price_finance_period_cache.py'):
              run_private.execute('Validate stock and scoped finance '+pattern,['-m','unittest','discover','-s','tests','-p',pattern])
          print('Stock/movement/lifecycle and finance period cache tests passed.')
          PY
      - name: Install ordinary browser runtime for read-only buyer diagnosis
        run: python -m playwright install --with-deps chromium > "$RUNNER_TEMP/browser.log" 2>&1
      - name: Diagnose seller restrictions and buyer regions including Moscow
        env:
          TASK: issue-10-buyer-diagnostics
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          run_private.execute('Read protected buyer and seller pilot diagnostics',['-m','advertising_agent.run_buyer_availability'])
          run_private.execute('Read exact native saleable inventory gap',['-m','analytics.stock_sellable_gap'])
          script="""
          import json
          from pathlib import Path
          from datetime import datetime,timezone
          from advertising_agent.stock_availability import fresh
          from advertising_agent.run_stock_availability import store_cache,cache
          evidence=json.loads(Path('docs/evidence/issue-10-buyer-pilot-20261011.json').read_text())
          if fresh(evidence,datetime.now(timezone.utc)):
              state=cache('advertising:buyer_availability:token_2:v1') or {}
              state[str(evidence['nm_id'])]=evidence
              store_cache('advertising:buyer_availability:token_2:v1',state)
          """
          run_private.execute('Preserve authorized current UI proof without claiming API readback',['-c',script])
          print('Regional diagnostics saved privately; includes Moscow. No purchase or WB writes.')
          PY
      - name: Pilot exact Raye SKU before all-active campaign rollout
        env:
          TASK: issue-10-stock-pilot
          STOCK_NOTIFY: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          ADVERTISING_TELEGRAM_BOT_TOKEN: ${{ secrets.ADVERTISING_TELEGRAM_BOT_TOKEN }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          run_private.execute('Pilot Raye stock and movement',['-m','advertising_agent.run_stock_availability','--target'])
          script="""
          import os,sys
          from advertising_agent.run_stock_availability import read,SOURCE,store_cache,cache
          rows=read('analytics_snapshots',dict(source='eq.'+SOURCE,cabinet='eq.token_2',select='payload',order='id.desc',limit=1)) or []
          report=rows[0]['payload'][0] if rows else {}
          passed=report.get('stock_checks_complete') and report.get('campaign_scope_complete')
          gate_key='advertising:stock_pilot_gate:token_2:v2'
          if passed:store_cache(gate_key,dict(passed=True,nm_id=432727735,campaign_id=40428689,observed_at=report.get('observed_at')))
          if not passed and not (cache(gate_key) or {}).get('passed'):
              print('Pilot source evidence pending; initial rollout waits for verified inventory.')
              if os.environ.get('STOCK_NOTIFY')=='true':
                  from advertising_agent.run_stock_availability import main
                  sys.argv=['stock','--target','--notify']
                  main()
          else:
              from advertising_agent.run_stock_availability import main
              sys.argv=['stock']+(['--notify'] if os.environ.get('STOCK_NOTIFY')=='true' else [])
              main()
          """
          run_private.execute('Roll out only after actual pilot sources pass',['-c',script])
          print('Protected stock pilot/coverage saved. No WB writes; Telegram enabled only for daily scheduled actionable decisions.')
          PY

name: Owner approved three100CNY budget topups and Telegram notice
on:
  push:
    paths: ['.github/workflows/owner-budget-fund4.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-budget-fund4
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Bounded fresh growth economics; no model or Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import copy,json,os
          from datetime import datetime,timezone
          from china_advertising_state import AdvertisingIO
          from china_daily_ad_actions import execute,EXEC
          from china_loss_control import PLAN,digest
          from china_cloud_cost_control import Cache,WB,validate_identity
          ROOT='china_agent:owner_budget_fund:2026-11-04:v1'
          PID='daily-2026-11-04-ready-budgets4-budgets-1'
          def norm(v):return json.loads(json.dumps(v))
          class IO(AdvertisingIO):
           def put(self,k,v):
            v=norm(v)
            if self.get(k)is None:
             if not self.create(k,v):raise ValueError('Concurrent state creation')
            else:super().put(k,v)
           def validate_owner(self,a):
            saved=self.get(ROOT+':approval');p=self.get(PLAN+PID)
            if saved!=a or a.get('owner_user_id')!=5122667182 or a.get('source_channel')!='codex' or not a.get('execution_authorized'):raise ValueError('Owner authorization missing')
            if not p or p.get('invalidated_at')or p['plan_sha256']!=a['plan_sha256']or p['plan_sha256']!=digest(p['items'])or p.get('report_message_ids')!=[671]:raise ValueError('Bound plan changed')
            if datetime.now(timezone.utc)>datetime.fromisoformat(p['expires_at']):raise ValueError('Plan expired')
            if {x['campaign_id']:x['amount_cny']for x in p['items']}!={40945502:100,41155909:100,41270309:100}or any(x['kind']!='topup_campaign'for x in p['items']):raise ValueError('Scope outside three100CNY topups')
          io=IO()
          if os.environ.get('GITHUB_REPOSITORY')!='Ekaterina11098/veschi-bot-runner'or os.environ.get('GITHUB_REF')!='refs/heads/main':raise ValueError('Public main only')
          if io.get(ROOT+':execution')or io.get(EXEC+PID):raise ValueError('Existing execution: never replay uncertain funding')
          p=io.get(PLAN+PID);now=datetime.now(timezone.utc).isoformat()
          a=dict(status='approved',source_channel='codex',owner_user_id=5122667182,execution_authorized=True,quote='пополни бюджеты и напиши в ТГ, что бюджеты пополнены',plan_id=PID,plan_sha256=p['plan_sha256'],created_at=now,reply_message_id=671,chat_id=-1004342917488,bot_id=8780468043,total_cny=300)
          if not io.create(ROOT+':approval',a):raise ValueError('Authorization journal exists')
          io.validate_owner(a);validate_identity(Cache(),WB())
          if not io.create(ROOT+':execution',dict(status='running',approval_key=ROOT+':approval',canonical_execution_key=EXEC+PID,created_at=now)):raise ValueError('Concurrent executor')
          e=execute(io,a,p)
          states=e['items']
          from china_execution_notice import proven
          byid={x['id']:x for x in p['items']}
          success=len(states)==3 and all(proven(byid[s['id']],s)and not s.get('already_done')for s in states)
          summary=dict(status='verified'if success else 'partial_or_blocked',items=states,wb_writes=e['wb_writes'],canonical_execution_key=EXEC+PID,verified_at=datetime.now(timezone.utc).isoformat())
          io.put(ROOT+':execution',summary)
          if not success:
           print(json.dumps(dict(status=summary['status'],items=[dict(id=s['id'],status=s['status'],reason=s.get('reason'))for s in states],wb_writes=e['wb_writes'])));raise ValueError('Not all topups verified; do not announce all funded')
          text='Бюджеты пополнены на 300 CNY, проверено в WB:\n• Манишка · РК 40945502: +100 CNY.\n• Клатч перевёртыш · РК 41155909: +100 CNY.\n• Китай тест 23.10 заказы сумки · РК 41270309: +100 CNY.'
          if io.tg('getMe',{})['id']!=8780468043:raise ValueError('Bot identity')
          notice=dict(status='sending',text=text,chat_id=-1004342917488,bot_id=8780468043,execution_key=ROOT+':execution',created_at=datetime.now(timezone.utc).isoformat())
          if not io.create(ROOT+':delivery',notice):raise ValueError('Notice exists; never repeat')
          try:
           r=io.tg('sendMessage',dict(chat_id=-1004342917488,text=text,reply_parameters=dict(message_id=671,allow_sending_without_reply=True)))
           if r.get('chat',{}).get('id')!=-1004342917488 or r.get('from',{}).get('id')!=8780468043 or not r.get('message_id'):raise ValueError('Delivery identity')
           notice.update(status='sent',message_id=r['message_id'],receipt=r,sent_at=datetime.now(timezone.utc).isoformat());io.put(ROOT+':delivery',notice)
          except Exception:
           notice['status']='uncertain';io.put(ROOT+':delivery',notice);raise
          p['owner_completed_budget_receipts']=[ROOT+':execution'];p['owner_budget_resolution']='Три пополнения по100CNY уже выполнены и проверены WB. Повторно не пополняю.';io.put(PLAN+PID,p)
          print(json.dumps(dict(status='verified',total_cny=300,wb_writes=e['wb_writes'],message_id=notice['message_id'],balances=[dict(id=byid[s['id']]['campaign_id'],before=s['before_budget'],after=s['after_budget'])for s in states])))
          
          PY

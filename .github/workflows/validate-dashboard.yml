name: Validate cabinet dashboard
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/validate-dashboard.yml'
permissions:
  contents: read
concurrency:
  group: validate-cabinet-dashboard
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: main
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install UI test runtime
        run: pip install streamlit pandas requests python-dotenv > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Check cabinet isolation and UI
        run: |
          python - <<'PY'
          import run_private
          run_private.execute('Verify isolated cabinet dashboard',['-m','unittest','discover','-s','tests','-p','test_cabinet_dashboard.py'])
          run_private.execute('Verify daily task persistence and UI',['-m','unittest','discover','-s','tests','-p','test_dashboard_tasks*.py'])
          run_private.execute('Verify modified pages compile',['-m','py_compile','cabinet_dashboard.py','dashboard_tasks.py','pages/01_Кабинеты.py','manager.py','review_manager.py','pages/02_Реклама.py'])
          run_private.execute('Verify dashboard with saved cabinet reports',['-c',"from cabinet_dashboard import Report,period,CABINETS,PERIODS\nfrom advertising_agent import agent_store as store\nsaved={}\ndef read(table,params):\n    key=(table,repr(sorted(params.items())))\n    if key not in saved:saved[key]=store.db('GET',table,params=params) or []\n    return saved[key]\nresults=[]\nfor name,cabinet in CABINETS.items():\n    report=Report(read,cabinet)\n    for label in PERIODS:\n        start,end=period(label)\n        result=report.build(start,end)\n        results.append(dict(cabinet=cabinet,period=label,available=result['available'],products=len(result['products']),profit_available=result.get('profit') is not None,reason=result.get('reason'),finance_note=result.get('finance_note')))\nfrom dashboard_tasks import Tasks\nplanner=Tasks(read)\ntask_results=[]\nfor name,cabinet in CABINETS.items():\n    tasks=planner.build(cabinet)\n    assert all(t['cabinet']==cabinet for t in tasks)\n    task_results.append(dict(cabinet=cabinet,tasks=len(tasks),warnings=list(planner.warnings)))\nstore.cache_set('dashboard:verification',dict(results=results,daily_tasks=task_results),ttl_days=7)\nprint('Saved cabinet data verification completed')\n"])
          PY
        env:
          TASK: dashboard-validation
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

# Verify all cabinet and section states using the repository-root page.


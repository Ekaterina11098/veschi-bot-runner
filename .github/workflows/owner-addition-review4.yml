name: Owner readonly addition review 4Nov
on:
  push:
    paths: ['.github/workflows/owner-addition-review4.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-addition-review4
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Bounded fresh growth economics; no model or Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: disabled
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json,requests
          from china_cloud_cost_control import Cache,WB,validate_identity,stamp
          c=Cache();w=WB();validate_identity(c,w)
          k='china_agent:owner_addition_review:2026-11-04:v1:inputs'
          v=c.get(k)
          v['budgets']=w.req('/api/advert/v2/budget','POST',dict(advertIds=[40933588,41298169,41332083]))
          v['budget_observed_at']=stamp()
          v['minimum_diagnostics']={}
          for cid,ids,z in [(40933588,[1473243896,1473243442],'recommendation'),(41298169,[1473243897,1473243898,1473243902],'search')]:
           r=requests.post('https://advert-api.wildberries.ru/api/advert/v1/bids/min',headers={'Authorization':w.token},json=dict(advert_id=cid,nm_ids=ids,payment_type='cpc',placement_types=[z]),timeout=55)
           v['minimum_diagnostics'][str(cid)]={'http_status':r.status_code,'body':r.text[:800]}
          v['diagnostics_observed_at']=stamp()
          c.put(k,v)
          assert c.get(k)==v
          print(json.dumps({'status':'readback_ok','budgets':v['budgets'],'diagnostics':v['minimum_diagnostics']}))
          
          PY

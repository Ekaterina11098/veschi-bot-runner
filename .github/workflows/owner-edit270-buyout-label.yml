name: Owner exact Telegram final PNG buyout label edit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-edit270-buyout-label.yml']
permissions: {contents: read}
concurrency:
  group: china-dialog-data
  cancel-in-progress: false
jobs:
  edit_label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 Pillow==12.3.0 --quiet
      - name: Edit only messages787and788 and verify receipts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: python scripts/owner_edit270_buyout_label.py

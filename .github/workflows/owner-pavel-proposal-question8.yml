name: Owner Pavel proposal question 8Nov
on:
  push:
    branches: [main]
    paths: ['owner-pavel-proposal8-request.json']
permissions:
  contents: read
concurrency:
  group: owner-pavel-proposal8
  cancel-in-progress: false
jobs:
  question:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Verify preparation consent and execution remain separate
        run: |
          PYTHONPATH=scripts python -m unittest discover -s scripts -p test_china_ad_proposal_consent.py
          PYTHONPATH=scripts python -m unittest discover -s scripts -p test_china_free_ads.py
      - name: Ask only the owner-authorized clarification
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: python scripts/owner_pavel_proposal_question8.py

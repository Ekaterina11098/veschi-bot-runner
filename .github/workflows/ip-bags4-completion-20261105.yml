name: IP four bags verified receipt
on:
  workflow_run:
    workflows: ['Apply exact four IP bags Nov5']
    types: [completed]
permissions:
  contents: read
jobs:
  receipt:
    if: ${{ github.event.workflow_run.id == 42028148609 && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1e20e2e6dfed3559e13aa0ff77b7aef6820b23ca
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ip_bags4_completion_20261105.py
            ip_apply_nine_20261103.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python ip_bags4_completion_20261105.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ADVERTISING_TELEGRAM_BOT_TOKEN: ${{ secrets.ADVERTISING_TELEGRAM_BOT_TOKEN }}

name: WB FBS daily document chains
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fbs-document-chain.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: Status, read-only preview, one-time activation baseline, or gated execution
        type: choice
        options: [status, preview, run]
        default: status
      execution_kind:
        description: Manual runs require a one-time owner confirmation; daily is the scheduled WB batch
        type: choice
        options: [manual, daily]
        default: manual
      owner_approval_id:
        description: Private one-time confirmation ID for a manually requested WB run
        type: string
        required: false
permissions:
  contents: read
jobs:
  chain:
    concurrency:
      group: fbs-document-chain-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
          filter: blob:none
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Verify retry and duplicate-protection tests
        run: |
          python -m unittest discover -s scripts -p test_fbs_read_retries.py -v
          python -m unittest discover -s scripts -p test_fbs_picking_scope.py -v
          python -m unittest discover -s scripts -p test_fbs_daily_schedule.py -v
          python -m unittest discover -s scripts -p test_fbs_daily_late_start.py -v
          node scripts/test_wb_ms_daily_clock.mjs
          python -m unittest discover -s scripts -p 'test_fbs_ozon*.py' -v
      - name: Execute selected mode with backend-only secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MODE: ${{ inputs.mode || (github.event_name == 'schedule' && 'run') || 'status' }}
          FBS_EXECUTION_KIND: ${{ inputs.execution_kind || (github.event_name == 'schedule' && 'daily') || 'manual' }}
          FBS_OWNER_APPROVAL_ID: ${{ inputs.owner_approval_id }}
        run: |
          exec python scripts/fbs_wb_cabinets.py "$MODE"
  audit_comments:
    needs: chain
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'run')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: fbs-document-comments
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and restore comments on completed WB and Ozon chains
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: python scripts/fbs_comment_audit.py


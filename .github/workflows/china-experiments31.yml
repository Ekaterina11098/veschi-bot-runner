name: Private experiment journal bootstrap31
on:
  push:
    branches: [main]
    paths: [.github/workflows/china-experiments31.yml]
permissions: {contents: read}
jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - run: PYTHONPATH=scripts python -m unittest discover -s scripts -p test_china_experiment_journal31.py
      - name: Read canonical private receipts and write only immutable private journal
        env:
          PYTHONPATH: scripts
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/bootstrap_china_experiments31.py

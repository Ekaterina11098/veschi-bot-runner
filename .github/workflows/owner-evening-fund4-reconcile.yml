name: Reconcile first deposit then finish owner evening funding
on:
  push:
    paths: ['.github/workflows/owner-evening-fund4-reconcile.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-evening-fund4-reconcile
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Bounded fresh growth economics; no model or Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import copy,json,os,time,requests
          from datetime import datetime,timezone
          os.environ['CHINA_TELEGRAM_BOT_TOKEN']='disabled-read-only-no-token'
          from china_cloud_cost_control import Cache,WB,validate_identity,stamp,digest
          from china_advertising_state import AdvertisingIO
          from china_morning_readiness import current_prices,published_stock
          from china_moysklad_read import read_stock
          ROOT='china_agent:owner_evening_budget_fund:2026-11-04:v1'
          ITEMS={40933588:800,41298169:900,41055480:500,40945502:400,41270309:600,41325622:300}
          c=Cache();w=WB();io=AdvertisingIO()
          def put(k,v):
           v=json.loads(json.dumps(v))
           if c.get(k)is None:
            if not c.create(k,v):raise ValueError('Concurrent receipt creation')
           else:c.put(k,v)
          def rows(s):return {r['nm_id']:r for r in s['nm_settings']}
          def fixed(s):return {k:s.get(k)for k in ['id','status','bid_type','currency','settings']}
          def same(a,b):return fixed(a)==fixed(b)and rows(a)==rows(b)
          def auth():
           a=c.get(ROOT+':approval')or{};p=c.get(ROOT+':plan')or{}
           if a.get('owner_user_id')!=5122667182 or a.get('source_channel')!='codex'or not a.get('execution_authorized')or a.get('telegram_notice_authorized'):raise ValueError('Owner authority differs')
           if a.get('items')!=p.get('items')or {i['campaign_id']:i['amount_cny']for i in p['items']}!=ITEMS or p.get('total_cny')!=3500:raise ValueError('Exact funding scope differs')
           if datetime.now(timezone.utc)>datetime.fromisoformat(a['expires_at']):raise ValueError('Owner funding expired')
           return a,p
          def req(path,method='GET',body=None):
           allowed=method=='GET'and path in ['/api/advert/v1/config','/adv/v1/balance']
           allowed=allowed or method=='POST'and path=='/api/advert/v2/budget'and set(body)=={'advertIds'}and set(body['advertIds'])<=set(ITEMS)
           allowed=allowed or method=='POST'and any(path=='/adv/v1/budget/deposit?id='+str(cid)and body.get('sum')==amount and body.get('type')in[0,1]for cid,amount in ITEMS.items())
           if not allowed:raise ValueError('Endpoint outside exact owner scope')
           time.sleep(1.5)
           r=requests.request(method,'https://advert-api.wildberries.ru'+path,headers={'Authorization':w.token},json=body,timeout=50)
           if not r.ok:raise RuntimeError('WB HTTP '+str(r.status_code))
           if path.startswith('/adv/v1/budget/deposit?'):return None
           return r.json()
          def budget(cid):
           r=req('/api/advert/v2/budget','POST',dict(advertIds=[cid]))
           rr=r.get('adverts',r.get('budgets',[]))if isinstance(r,dict)else r
           if len(rr)!=1 or rr[0].get('advertId')!=cid or rr[0].get('currency')!='CNY':raise ValueError('Budget identity/currency')
           return rr[0]['total']
          a,p=auth()
          prior=c.get(ROOT+':execution')or{}
          if prior.get('wb_writes')!=1 or prior.get('items')!=[]or 'Expecting value'not in prior.get('error',''):raise ValueError('Unexpected previous state; no write authorized')
          if not c.create(ROOT+':attempt2:execution',prior):raise ValueError('Recovery already started')
          e=copy.deepcopy(prior);e.update(status='reconciling',updated_at=stamp());e.pop('error',None);put(ROOT+':execution',e)
          try:
           validate_identity(c,w)
           cs=w.campaigns(sorted(ITEMS))
           if any(not same(p['expected_states'][str(cid)],cs[str(cid)])for cid in ITEMS):raise ValueError('Campaign state changed')
           prior_preflight=e.get('preflight')or{}
           if (datetime.now(timezone.utc)-datetime.fromisoformat(prior_preflight['observed_at'])).total_seconds()>1800:raise ValueError('Preflight older than30min; read-only refresh needed')
           first=c.get(ROOT+':campaign:40933588')or{}
           if first.get('status')!='submitting'or first.get('amount_cny')!=800:raise ValueError('First pending receipt differs')
           after=w.campaigns([40933588])['40933588'];ba=budget(40933588)
           if not same(first['before'],after)or ba<first['before_budget']+795:raise ValueError('First deposit still uncertain; never repeat')
           first.update(status='verified',after=after,after_budget=ba,verified_at=stamp(),reconciled_without_repeat=True);put(ROOT+':campaign:40933588',first)
           e['items']=[dict(campaign_id=40933588,amount_cny=800,before_budget=first['before_budget'],after_budget=ba,status='verified',receipt_key=ROOT+':campaign:40933588')]
           registry=c.get('china_agent:verified_campaign_state:v1')or{};registry['40933588']=ROOT+':campaign:40933588';put('china_agent:verified_campaign_state:v1',registry);put(ROOT+':execution',e)
           cfg=req('/api/advert/v1/config')
           if cfg.get('currency')!='CNY'or cfg.get('minTopUp',100000)>10000:raise ValueError('Funding minimum/currency changed')
           wallet=req('/adv/v1/balance')
           source=0 if wallet.get('balance',0)>=3500 else 1 if wallet.get('net',0)>=3500 else None
           if wallet.get('currency')!='CNY'or source is None:raise ValueError('Single3500CNY funding source unavailable')
           e.update(status='running',recovered_at=stamp());put(ROOT+':execution',e)
           for cid,amount in ITEMS.items():
            if cid==40933588:continue
            auth();before=w.campaigns([cid])[str(cid)]
            if not same(cs[str(cid)],before):raise ValueError('Current campaign changed before deposit')
            bb=budget(cid);ck=ROOT+':campaign:'+str(cid)
            if c.get(ck):raise ValueError('Child receipt already exists; never repeat')
            child=dict(status='submitting',before=before,before_budget=bb,amount_cny=amount,created_at=stamp(),approval_key=ROOT+':approval',plan_hash=e['plan_hash'])
            if not c.create(ck,child):raise ValueError('Concurrent deposit')
            e['wb_writes']+=1;put(ROOT+':execution',e)
            req('/adv/v1/budget/deposit?id='+str(cid),'POST',dict(sum=amount,type=source))
            verified=False
            for attempt in range(18):
             after=w.campaigns([cid])[str(cid)];ba=budget(cid)
             if same(before,after)and ba>=bb+amount-3:
              verified=True;break
             time.sleep(5)
            if not verified:raise ValueError('Deposit readback uncertain; never repeat')
            child.update(status='verified',after=after,after_budget=ba,verified_at=stamp());put(ck,child)
            e['items'].append(dict(campaign_id=cid,amount_cny=amount,before_budget=bb,after_budget=ba,status='verified',receipt_key=ck));put(ROOT+':execution',e)
            registry=c.get('china_agent:verified_campaign_state:v1')or{};registry[str(cid)]=ck;put('china_agent:verified_campaign_state:v1',registry)
           e.update(status='verified',total_cny=sum(x['amount_cny']for x in e['items']),verified_at=stamp());put(ROOT+':execution',e)
           print(json.dumps(dict(status=e['status'],items=e['items'],total_cny=e['total_cny'],wb_writes=e['wb_writes'],telegram_calls=0)))
          except Exception as ex:
           e.update(status='partial_or_uncertain',error=str(ex)if isinstance(ex,(ValueError,RuntimeError))else type(ex).__name__,updated_at=stamp());put(ROOT+':execution',e);print(json.dumps(dict(status=e['status'],error=e['error'],verified_items=len(e['items']),wb_writes=e['wb_writes'])));raise
          PY

name: Verify confirmed China WB price application
on:
  push:
    branches: [china-confirmed-wb-prices-20261019]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - run: |
          node scripts/test_china_price_approvals.mjs
          node scripts/test_china_webhook.mjs
          PYTHONPATH=scripts python -m unittest discover -s scripts -p test_china_price_apply.py
      - name: Read-only live identity and write-scope capability check
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: python scripts/china_price_apply.py --verify

name: China morning advertising regression checks
on:
  push:
    branches: [main, fix/china-morning-full-day-20261027]
    paths: ['scripts/china_advertising_*.py', 'scripts/china_daily_ad_actions.py', 'scripts/china_report_buttons.py', 'scripts/conversion_watches.py', 'scripts/china_once_report.py', 'scripts/china_table_png.py', 'scripts/test_china_once_report.py', 'scripts/china_dialog_clock_policy.mjs', 'scripts/test_china_dialog_clock_policy.mjs', 'scripts/test_china_advertising_*.py', '.github/workflows/china-advertising-daily.yml', '.github/workflows/china-morning-regressions.yml']
  pull_request:
    paths: ['scripts/china_advertising_*.py', 'scripts/china_daily_ad_actions.py', 'scripts/china_report_buttons.py', 'scripts/test_china_advertising_*.py', '.github/workflows/china-advertising-daily.yml', '.github/workflows/china-morning-regressions.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_china_advertising_*.py'

      - run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_china_once_report.py'
      - run: node scripts/test_china_dialog_clock_policy.mjs

name: Apply owner-approved IP nine and verify all fifteen Nov3
on:
  push:
    branches: [main]
    paths: ['.github/disabled/ip-approved-nine-20261103.never']
permissions:
  contents: read
concurrency:
  group: wb-ip-advertising-agent
  cancel-in-progress: false
jobs:
  apply:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8f924826323972583e53ffd7796594583c192223
          sparse-checkout: |
            ip_apply_nine_20261103.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read current WB, verify prior six, apply only approved nine bids, verify all fifteen
        run: python ip_apply_nine_20261103.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_FINANCE_TOKEN_2: ${{ secrets.WB_FINANCE_TOKEN_2 }}
          ADVERTISING_EXECUTION_ENABLED: 'false'

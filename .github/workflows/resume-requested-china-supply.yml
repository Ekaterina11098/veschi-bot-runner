name: Resume requested China supply
on:
  push:
    branches: [main]
    paths: ['.github/workflows/resume-requested-china-supply.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fbs-document-chain-production
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resume one prepared chain and verify all documents
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: python scripts/resume_requested_china_supply.py

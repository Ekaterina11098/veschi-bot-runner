name: China search cart API read26
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-search-cart-api26.yml']
permissions:
  contents: read
concurrency:
  group: china-search-cart-read26
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 > /tmp/dependencies.log 2>&1
      - run: python -m py_compile scripts/china_search_cart_api26.py
      - run: python scripts/china_search_cart_api26.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}

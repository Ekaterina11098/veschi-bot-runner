name: Release stalled repair verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-free-repair10-cleanup.yml']
permissions:
  contents: read
  actions: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel only superseded one-off repair runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          base='https://api.github.com/repos/Ekaterina11098/veschi-bot-runner/actions/runs/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          for rid in (42751974604,42752254291):
              with urllib.request.urlopen(urllib.request.Request(base+str(rid),headers=headers)) as f:r=json.load(f)
              if r['name']!='China free diagnostic repair 10Nov' or r['head_sha'] not in ('e82b2b4f3cf72a2df64826291104b3fed42709e4','0ce06f03d3f503fdab97e97014e67b9a2d91a557'):raise RuntimeError('Repair run scope mismatch')
              if r['status']=='completed':continue
              with urllib.request.urlopen(urllib.request.Request(base+str(rid)+'/cancel',headers=headers,method='POST')) as f:print('Cancelled superseded repair run',rid,f.status)
          PY

name: Owner inspect pricing read source contract 9Nov
on:
  push:
    paths: ['.github/workflows/owner-price-source-contract-20261109.yml']
permissions:
  contents: read
concurrency:
  group: china-price-source-contract
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b90b5e83efd7c691d6a3d24b1d17b35c0e7da99c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          sparse-checkout: analytics
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 simplejson==4.2.0
      - name: Read tool schemas only
        env:
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PYTHONPATH: scripts:source
        run: |
          python - <<'PY'
          import os,json
          from analytics.mpstats_probe import discover
          from china_cloud_cost_control import Cache,stamp
          result=discover(os.environ['MPSTATS_API_TOKEN'])
          selected=[t for t in result.get('tools',[]) if t['name'] in ('lk_wb_products','lk_wb_pulse_products')]
          value=dict(status=result['status'],observed_at=stamp(),tools=selected,executed_data_tools=result.get('executed_data_tools'),wb_writes=0,telegram_calls=0)
          Cache().put('china_agent:owner_price_delivery_recovery:2026-11-09:v1:source_contract',value)
          print(json.dumps(dict(status=value['status'],tools=[t['name'] for t in selected],wb_writes=0,telegram_calls=0)))
          PY

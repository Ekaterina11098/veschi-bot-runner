name: China advertising compact report checks
on:
  push:
    branches: [china-ads-compact-20261021]
permissions: {contents: read}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow==11.3.0 requests==2.32.5
      - run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_china_advertising_*.py'

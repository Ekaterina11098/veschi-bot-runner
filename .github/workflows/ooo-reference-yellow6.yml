name: OOO reference actionable row highlight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ooo-reference-yellow6.yml']
permissions:
  contents: read
concurrency:
  group: ooo-telegram-photo-delivery-20261106
  cancel-in-progress: false
jobs:
  replace:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 58b324b372ac8d73df473351f46e7c1e5b73e2c7
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 --quiet
      - run: python -m py_compile scripts/ooo_reference_yellow_delivery6.py
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OOO_TELEGRAM_BOT_TOKEN: ${{ secrets.OOO_TELEGRAM_BOT_TOKEN }}
        run: python -u scripts/ooo_reference_yellow_delivery6.py

name: Owner requested Pavel clarification 4Nov
on:
  push:
    paths: ['.github/workflows/owner-pavel-clarify4.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-pavel-clarify4
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Bounded fresh growth economics; no model or Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: disabled
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from china_cloud_cost_control import Cache
          from china_advertising_state import AdvertisingIO
          from datetime import datetime,timezone
          import json
          c=Cache();io=AdvertisingIO();key='china_agent:owner_pavel_clarify:2026-11-04:jobs238239:v1:delivery'
          if c.get(key):raise ValueError('Existing reply; no duplicate')
          e=c.get('china_agent:owner_growth_selected:2026-11-04:job237:v1:attempt3:execution')or{}
          if e.get('status')!='verified'or e.get('verified_items')!=8:raise ValueError('Verified raises absent')
          text='Павел, все 8 повышений уже выполнены и проверены WB. По решению Екатерины снижения и исключения не делаем. По бюджетному PNG согласованы 4 суммы резерва; это ещё не пополнения. Пересчитаем условия по текущему составу РК без снижений и исключений.'
          if io.tg('getMe',{})['id']!=8780468043:raise ValueError('Bot mismatch')
          record=dict(status='sending',chat_id=-1004342917488,text=text,created_at=datetime.now(timezone.utc).isoformat(),reply_to_message_id=678)
          if not c.create(key,record):raise ValueError('Concurrent reply')
          try:
           r=io.tg('sendMessage',dict(chat_id=-1004342917488,reply_to_message_id=678,text=text))
           if r.get('chat',{}).get('id')!=-1004342917488 or type(r.get('message_id'))is not int:raise ValueError('Receipt mismatch')
           record.update(status='sent',message_id=r['message_id'],receipt=r);c.put(key,record)
          except Exception as ex:record.update(status='uncertain',reason=str(ex));c.put(key,record);raise
          print(json.dumps(dict(status='sent',message_id=record['message_id'])))
          PY

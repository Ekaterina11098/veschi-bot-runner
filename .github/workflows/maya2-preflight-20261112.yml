name: MAYA 2 read-only catalogue preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/maya2-preflight-20261112.yml']
permissions: {}
concurrency:
  group: maya2-catalogue-20261112
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read catalogues without changing products
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        shell: python
        run: |
          import os,json,gzip,time,datetime,urllib.request,urllib.parse,urllib.error
          sb=os.environ["SUPABASE_URL"].rstrip("/")
          sh={"apikey":os.environ["SUPABASE_SECRET_KEY"],"Authorization":"Bearer "+os.environ["SUPABASE_SECRET_KEY"],"Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=minimal"}
          def req(url,headers,body=None):
           r=urllib.request.urlopen(urllib.request.Request(url,headers=headers,data=None if body is None else json.dumps(body).encode()),timeout=60)
           raw=r.read()
           if r.headers.get("Content-Encoding")=="gzip":raw=gzip.decompress(raw)
           return json.loads(raw) if raw else None
          def save(key,payload):
           req(sb+"/rest/v1/telegram_api_cache?on_conflict=cache_key",sh,{"cache_key":key,"payload":payload,"updated_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"expires_at":"2026-12-31T23:59:59Z"})
          out=req(sb+"/rest/v1/telegram_api_cache?cache_key=eq.maya2:preflight:20261112&select=payload",sh)[0]["payload"]
          out["run_id"]=os.environ["GITHUB_RUN_ID"];out["errors"]=[]
          save("maya2:preflight:20261112",out)
          for n in ("3",):
           token=os.environ.get("WB_TOKEN_"+n,"")
           if not token:out["errors"].append({"cabinet":n,"error":"Token missing"});continue
           headers={"Authorization":token,"Content-Type":"application/json","Accept-Encoding":"gzip"}
           host="https://content-api.wildberries.cn" if n=="3" else "https://content-api.wildberries.ru"
           rows=[];trash=[]
           try:
            for endpoint,destination in (("/content/v2/get/cards/list",rows),("/content/v2/get/cards/trash",trash)):
             cursor={"limit":100}
             for _ in range(30):
              page=req(host+endpoint,headers,{"settings":{"cursor":cursor,"filter":{"withPhoto":-1}}})
              for p in page.get("cards",[]):destination.append({k:p.get(k) for k in ("nmID","vendorCode","subjectID","subjectName","photos","sizes")})
              c=page.get("cursor",{})
              if c.get("total",0)<100:break
              cursor={k:c[k] for k in (("trashedAt","nmID") if endpoint.endswith("trash") else ("updatedAt","nmID")) if k in c};cursor["limit"]=100;time.sleep(0.8)
             else:raise RuntimeError("Pagination incomplete")
            out["cabinets"][n]={"cards":rows,"trash":trash,"complete":True}
           except Exception as e:out["errors"].append({"cabinet":n,"error":type(e).__name__+":"+str(e)})
           save("maya2:preflight:20261112",out)
          try:
           mh={"Authorization":"Bearer "+os.environ["MOYSKLAD_API_TOKEN"],"Accept-Encoding":"gzip"}
           for archived in ("false","true"):
            offset=0
            while True:
             page=req("https://api.moysklad.ru/api/remap/1.2/entity/product?"+urllib.parse.urlencode({"filter":"archived="+archived,"limit":1000,"offset":offset}),mh)
             out["ms"].extend([{k:p.get(k) for k in ("id","article","code","name","externalCode","archived","description")} for p in page["rows"]]);offset+=len(page["rows"])
             if offset>=page["meta"]["size"]:break
             if not page["rows"]:raise RuntimeError("MS pagination incomplete")
          except Exception as e:out["errors"].append({"source":"MS","error":type(e).__name__+":"+str(e)})
          out["status"]="complete" if not out["errors"] else "incomplete"
          save("maya2:preflight:20261112",out)
          print("Read-only catalogue preflight recorded privately.")
          
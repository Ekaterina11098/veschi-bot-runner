name: Activate approved advertising presentation metadata only
on:
  push:
    branches: [activate-advertising-format-20261017]
    paths: ['.github/workflows/advertising-format-activate-20261017.yml']
permissions: {contents: write}
concurrency:
  group: wb-ip-advertising-agent
  cancel-in-progress: false
jobs:
  deliver:
    if: false # Deployment metadata confirmed; one-off activation disabled.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: d71a576d55f4e9c89aaa5fb5cc2177722c6176f9
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r private-source/requirements.txt cryptography==46.0.2 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Verify existing daily hook and update only approved source SHA
        working-directory: private-source
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ADVERTISING_EXECUTION_ENABLED: 'false'
        run: python ../advertising_format_activate_20261017.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-format-activation
          path: ${{ runner.temp }}/stock-deploy-proof/*.aes.json
          retention-days: 90
      - name: Preserve delivery receipt ciphertext only
        if: always()
        run: |
          mkdir -p recovery-output/advertising
          for file in "$RUNNER_TEMP"/stock-deploy-proof/*.aes.json; do
            test -f "$file" || continue
            cp "$file" "recovery-output/advertising/format-activation-${{ github.run_id }}.aes.json"
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-output/advertising/format-activation-*.aes.json
          git diff --cached --quiet || git commit -m "Preserve encrypted deployment metadata receipt"
          git push origin HEAD:activate-advertising-format-20261017

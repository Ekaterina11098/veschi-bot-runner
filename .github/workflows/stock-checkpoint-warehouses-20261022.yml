name: Exact warehouse checkpoint regression22Oct
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stock-checkpoint-warehouses-20261022.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: a91d352aed04e8475f79a7f91ea273ba191a8b59
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv==1.1.1 aiogram==3.22.0 simplejson==4.2.0 'psycopg[binary]==3.2.9' cryptography
      - name: Offline recovery, exact warehouse proof and no-repeat regression
        env:
          PYTHONPATH: ${{ github.workspace }}/private-source
        run: python -m unittest test_stock_checkpoint_warehouses test_stock_automatic_recovery test_stock_current_order_reserve test_stock_regular_service test_stock_group_execution test_stock_shared_requests test_stock_unposted_orders

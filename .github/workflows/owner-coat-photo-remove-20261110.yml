name: Owner remove exact coat photo17 and preserve video10Nov
on:
  push:
    paths: ['.github/workflows/owner-coat-photo-remove-20261110.yml']
permissions:
  contents: read
concurrency:
  group: owner-coat-media
  cancel-in-progress: false
jobs:
  read:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 10ca471ebdc30e8979abeb6286434c51fe218931
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Install video preservation dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /tmp/ffmpeg-install.log 2>&1
      - name: Remove owner-selected frame and verify every retained media
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: unused-no-telegram
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import os,json,time,hashlib,base64,subprocess,shutil,io as bio
          from datetime import datetime,timezone
          from urllib.parse import urljoin
          import requests
          from PIL import Image,ImageChops,ImageStat
          from china_loss_execute import IO
          io=IO();K='china_agent:owner_coat_photo:2026-11-10:v1:execution';nm=2215883910
          if io.get(K):raise SystemExit('Existing execution: never replay')
          assert shutil.which('ffmpeg') and shutil.which('ffprobe')
          def stamp():return datetime.now(timezone.utc).isoformat()
          def card():
           r=requests.post('https://content-api.wildberries.ru/content/v2/get/cards/list',headers={'Authorization':io.token},json={'settings':{'cursor':{'limit':100},'filter':{'textSearch':'5-furcoat-beige','withPhoto':-1}}},timeout=40);r.raise_for_status()
           rows=[c for c in r.json().get('cards',[]) if c.get('nmID')==nm and c.get('vendorCode')=='5-furcoat-beige'];assert len(rows)==1;return rows[0]
          def core(c):return {k:v for k,v in c.items() if k not in ['photos','video','updatedAt']}
          before=card();prior=io.get('china_agent:owner_coat_photo:2026-11-10:v1:read')['card']
          assert before['photos']==prior['photos'] and before.get('video')==prior.get('video')
          assert len(before['photos'])==19 and before.get('video')
          claims=json.loads(base64.urlsafe_b64decode(io.token.split('.')[1]+'='*(-len(io.token.split('.')[1])%4)))
          ids=io.db('analytics_snapshots?cabinet=eq.token_3&source=eq.seller_identity&status=eq.complete&select=payload&limit=100')
          assert claims.get('sid') and {x['payload'].get('sid') for x in ids}=={claims['sid']}
          e=dict(status='preparing',nm_id=nm,article='5-furcoat-beige',removed_photo=17,reason='Owner: remove photo with ves chi brand; visually verified17 shows veschi on label and hangtag',before=before,wb_writes=0,telegram_calls=0,model_calls=0,prepared_at=stamp())
          assert io.create(K,e)
          def storage(path,method='GET',**kw):
           r=requests.request(method,io.url+'/storage/v1/'+path,headers=io.headers,timeout=60,**kw);r.raise_for_status();return r
          try:
           bucket='owner-media-recovery'
           bs=storage('bucket').json()
           if not any(b['id']==bucket for b in bs):storage('bucket','POST',json={'id':bucket,'name':bucket,'public':False,'file_size_limit':52428800})
           images=[]
           for i,p in enumerate(before['photos'],1):
            r=requests.get(p['big'],timeout=25);r.raise_for_status();im=Image.open(bio.BytesIO(r.content)).convert('RGB');assert im.width>=700 and im.height>=900
            images.append(im.copy())
            # Retain a private immutable recovery copy of every original frame.
            rr=requests.post(io.url+'/storage/v1/object/'+bucket+'/coat2215883910-20261110/'+str(i)+'.webp',headers={**io.headers,'Content-Type':'image/webp','x-upsert':'false'},data=r.content,timeout=40)
            assert rr.status_code in (200,201,400,409)
            if rr.status_code==400:assert 'exist' in rr.text.lower()
           video=before['video'];assert video.startswith('https://videonme-basket-09.wbbasket.ru/') and '/2215883910/' in video
           subprocess.run(['ffmpeg','-v','error','-i',video,'-c','copy','-movflags','+faststart','-y','/tmp/coat-original.mp4'],check=True,timeout=90,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
           data=open('/tmp/coat-original.mp4','rb').read();assert len(data)<50*1024*1024
           vp=bucket+'/coat2215883910-20261110/original.mp4'
           rr=requests.post(io.url+'/storage/v1/object/'+vp,headers={**io.headers,'Content-Type':'video/mp4','x-upsert':'false'},data=data,timeout=60);assert rr.status_code in (200,201)
           signed=storage('object/sign/'+vp,'POST',json={'expiresIn':86400}).json()['signedURL']
           vu=io.url+('/storage/v1' if signed.startswith('/object/') else '')+signed
           # Check WB will receive actual MP4 without credentials.
           rr=requests.get(vu,timeout=40);rr.raise_for_status();assert hashlib.sha256(rr.content).digest()==hashlib.sha256(data).digest()
           e.update(video_backup_sha256=hashlib.sha256(data).hexdigest(),video_backup_object=vp,backup_bucket_private=True,video_bytes=len(data))
           assert card()['photos']==before['photos']
           urls=[p['big'] for i,p in enumerate(before['photos'],1) if i!=17]+[vu]
           e.update(status='writing',wb_writes=1,submitted_at=stamp());io.put(K,e)
           r=requests.post('https://content-api.wildberries.ru/content/v3/media/save',headers={'Authorization':io.token},json={'nmId':nm,'data':urls},timeout=60)
           e['http_status']=r.status_code
           if not r.ok:e.update(status='rejected',response=r.text[:500]);io.put(K,e);raise SystemExit('WB rejected')
           j=r.json();e['response']=j
           if j.get('error') is not False:e.update(status='rejected');io.put(K,e);raise SystemExit('WB rejected media')
           e.update(status='accepted_pending_readback');io.put(K,e)
           originals=[im.resize((64,64)) for i,im in enumerate(images,1) if i!=17]
           for attempt in range(12):
            time.sleep(10);after=card();e['after']=after;e['observed_at']=stamp()
            assert core(after)==core(before),'Non-media fields changed'
            if len(after['photos'])!=18 or not after.get('video'):continue
            checks=[]
            for i,p in enumerate(after['photos']):
             rr=requests.get(p['big']+'?owner_check='+str(int(time.time())),timeout=25);rr.raise_for_status();im=Image.open(bio.BytesIO(rr.content)).convert('RGB').resize((64,64))
             checks.append(sum(ImageStat.Stat(ImageChops.difference(im,originals[i])).mean)/3)
            e['photo_mean_pixel_differences']=checks
            if max(checks)>=10:continue
            # Verify restored video content at three points instead of merely URL presence.
            differences=[]
            for sec in (1,8,16):
             ims=[]
             for v in ['/tmp/coat-original.mp4',after['video']]:
              raw=subprocess.run(['ffmpeg','-v','error','-ss',str(sec),'-i',v,'-frames:v','1','-vf','scale=64:64','-f','image2pipe','-vcodec','png','-'],check=True,timeout=45,stdout=subprocess.PIPE,stderr=subprocess.PIPE).stdout
              ims.append(Image.open(bio.BytesIO(raw)).convert('RGB'))
             differences.append(sum(ImageStat.Stat(ImageChops.difference(*ims)).mean)/3)
            e['video_frame_mean_pixel_differences']=differences
            if max(differences)<15:e.update(status='verified',completed_at=stamp());io.put(K,e);print('Exact photo17 removed;18 retained;video verified');break
           else:io.put(K,e);print('Accepted; verification pending; do not retry')
          except Exception as ex:
           e['error']=type(ex).__name__+':'+str(ex)[:150]
           e['status']='uncertain' if e.get('status')=='writing' else e.get('status','blocked_before_write')
           if e.get('wb_writes',0)==0:e['status']='blocked_before_write'
           io.put(K,e);raise
          PY

name: Verify FBS recovery tests 20261113
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-fbs-recovery-20261113.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run shared WB Ozon tests without operational writes
        run: |
          python -m unittest discover -s scripts -p 'test_fbs_ozon*.py' -v
          python -m unittest discover -s scripts -p test_fbs_china_warehouse_routing.py -v
          python -m unittest discover -s scripts -p test_fbs_daily_schedule.py -v

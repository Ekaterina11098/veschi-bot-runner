name: Owner blocked complete gallery inspection
on:
  push:
    paths:
      - '.github/workflows/owner-blocked-gallery-20261109.yml'
permissions:
  contents: read
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  read:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 10ca471ebdc30e8979abeb6286434c51fe218931
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Read exact four SKU inventory and documents
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import requests,base64,io as bio
          from concurrent.futures import ThreadPoolExecutor
          from PIL import Image,ImageDraw
          from datetime import datetime,timezone
          from china_loss_execute import IO
          io=IO();key='china_agent:owner_blocked_cards:2026-11-09:v1:gallery'
          if io.get(key):raise SystemExit('Existing gallery')
          assert io.create(key,dict(status='collecting',wb_writes=0))
          p=io.get('china_agent:owner_blocked_cards:2026-11-09:v1:read')
          jobs=[(c['nmID'],c['vendorCode'].split('-')[0],i,x['big'])for c in p['cards']for i,x in enumerate(c['photos'],1)]
          def get(a):
           nm,label,i,url=a
           try:
            r=requests.get(url,timeout=20);assert r.ok
            im=Image.open(bio.BytesIO(r.content)).convert('RGB');im.thumbnail((230,310))
            tile=Image.new('RGB',(240,345),'white');tile.paste(im,((240-im.width)//2,30));ImageDraw.Draw(tile).text((5,5),label+' photo '+str(i),fill='black');return tile,None
           except Exception as ex:return None,dict(nm=nm,index=i,error=type(ex).__name__)
          with ThreadPoolExecutor(max_workers=4)as pool:results=list(pool.map(get,jobs))
          panels=[r[0]for r in results if r[0]is not None];errors=[r[1]for r in results if r[1]is not None]
          assert panels,'All photo reads failed'
          sheet=Image.new('RGB',(1680,((len(panels)+6)//7)*345),'white')
          for i,t in enumerate(panels):sheet.paste(t,((i%7)*240,(i//7)*345))
          buf=bio.BytesIO();sheet.save(buf,format='JPEG',quality=88)
          io.put(key,dict(status='complete'if not errors else'partial',sheet_b64=base64.b64encode(buf.getvalue()).decode(),errors=errors,photos_count=len(panels),observed_at=datetime.now(timezone.utc).isoformat(),wb_writes=0,telegram_calls=0))
          PY

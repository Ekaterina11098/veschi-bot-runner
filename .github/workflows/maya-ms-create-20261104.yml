name: MAYA authorized product creation 20261104
on:
  push:
    branches: [main]
    paths: ['.github/workflows/maya-ms-create-20261104.yml']
permissions: {}
concurrency:
  group: maya-ms-products-20261104
  cancel-in-progress: false
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Create authorized missing products and verify
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import os,json,gzip,datetime,urllib.request,urllib.parse,urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*a,**k):raise RuntimeError("Redirect blocked")
          opener=urllib.request.build_opener(NoRedirect)
          sb=os.environ["SUPABASE_URL"].rstrip("/")
          base="https://api.moysklad.ru/api/remap/1.2/"
          sh={"apikey":os.environ["SUPABASE_SECRET_KEY"],"Authorization":"Bearer "+os.environ["SUPABASE_SECRET_KEY"],"Content-Type":"application/json"}
          mh={"Authorization":"Bearer "+os.environ["MOYSKLAD_API_TOKEN"],"Accept-Encoding":"gzip","Accept":"application/json;charset=utf-8","Content-Type":"application/json"}
          def call(url,headers,method="GET",body=None):
           try:
            with opener.open(urllib.request.Request(url,headers=headers,method=method,data=None if body is None else json.dumps(body,ensure_ascii=False).encode()),timeout=60) as r:
             raw=r.read()
             if not raw:return None
             if r.headers.get("Content-Encoding")=="gzip":raw=gzip.decompress(raw)
             return json.loads(raw)
           except urllib.error.HTTPError as e:raise RuntimeError("Remote HTTP "+str(e.code)) from None
          def norm(a):return str(a or "").strip().lower().lstrip("0")
          req=call(sb+"/rest/v1/telegram_api_cache?cache_key=eq.maya_cycle:create_request:20261104&select=payload",sh)[0]["payload"]
          assert req["authorized"] is True and len(req["products"])==18
          products=req["products"]
          assert len({norm(p["article"]) for p in products})==18
          existing=[]
          for archived in ("false","true"):
           offset=0
           while True:
            query=urllib.parse.urlencode({"filter":"archived="+archived,"limit":1000,"offset":offset})
            page=call(base+"entity/product?"+query,mh)
            existing.extend(page["rows"])
            offset+=len(page["rows"])
            if offset>=page["meta"]["size"]:break
            if not page["rows"] or offset>20000:raise RuntimeError("Incomplete preflight")
          out={"run_id":os.environ["GITHUB_RUN_ID"],"status":"in_progress","products":[]}
          def save():
           stamp=datetime.datetime.now(datetime.timezone.utc).isoformat()
           out["updated_at"]=stamp
           record={"cache_key":"maya_cycle:create_result:20261104","payload":out,"updated_at":stamp,"expires_at":"2026-11-11T23:59:59Z"}
           h=dict(sh);h["Prefer"]="resolution=merge-duplicates,return=minimal"
           call(sb+"/rest/v1/telegram_api_cache?on_conflict=cache_key",h,"POST",record)
          save()
          for p in products:
           assert set(p)=={"article","name","externalCode","description"}
           matches=[x for x in existing if norm(x.get("article"))==norm(p["article"]) or x.get("externalCode")==p["externalCode"]]
           if len(matches)>1:raise RuntimeError("Ambiguous duplicate")
           if matches:
            obj=matches[0];action="existing_preserved"
           else:
            obj=call(base+"entity/product",mh,"POST",p);action="created"
            existing.append(obj)
           verified=call(base+"entity/product/"+obj["id"],mh)
           assert verified.get("article")==p["article"] and verified.get("name")==p["name"]
           out["products"].append({"article":p["article"],"id":verified["id"],"name":verified["name"],"code":verified.get("code"),"barcodes":verified.get("barcodes",[]),"action":action,"verified":True})
           save()
          out["status"]="complete"
          save()
          print("Authorized product creation and GET verification completed. Private result saved.")

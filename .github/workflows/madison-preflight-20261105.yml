name: Madison exact card preflight
on:
  push:
    branches: [madison-fill-20261105]
    paths: ['.github/workflows/madison-preflight-20261105.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read three exact China cards and schema
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os,json,time,urllib.request,urllib.error,datetime
          ARTICLES=['025-MadisonBag-zblack','026-MadisonBag-zcoffee','027-MadisonBag-zdarkred']
          def request(url,body=None,method=None,headers=None):
              h=headers if headers is not None else {'Authorization':os.environ['WB_TOKEN_3'],'Content-Type':'application/json'}
              req=urllib.request.Request(url,headers=h,data=None if body is None else json.dumps(body).encode(),method=method or ('POST' if body is not None else 'GET'))
              with urllib.request.urlopen(req,timeout=45) as f:
                  raw=f.read()
                  return json.loads(raw) if raw else None
          def save(key,payload):
              now=datetime.datetime.now(datetime.timezone.utc);k=os.environ['SUPABASE_SECRET_KEY'];h={'apikey':k,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'}
              if not k.startswith('sb_secret_'):h['Authorization']='Bearer '+k
              return request(os.environ['SUPABASE_URL'].rstrip('/')+'/rest/v1/telegram_api_cache?on_conflict=cache_key',{'cache_key':key,'payload':payload,'updated_at':now.isoformat(),'expires_at':(now+datetime.timedelta(days=365)).isoformat()},headers=h)
          out={'status':'reading','cards':[],'cabinet':'token_3','wb_writes':0}
          try:
              for article in ARTICLES:
                  d=request('https://content-api.wildberries.ru/content/v2/get/cards/list',{'settings':{'sort':{'ascending':False},'cursor':{'limit':100},'filter':{'withPhoto':-1,'textSearch':article}}})
                  hits=[c for c in d.get('cards',[]) if c.get('vendorCode')==article]
                  if len(hits)!=1:raise RuntimeError('Exact article count '+str(len(hits))+' for '+article)
                  out['cards'].append(hits[0]);time.sleep(1)
              sid=out['cards'][0]['subjectID']
              if any(c['subjectID']!=sid for c in out['cards']):raise RuntimeError('Subject mismatch')
              out['charcs']=request('https://content-api.wildberries.ru/content/v2/object/charcs/'+str(sid))
              out['prices']=[]
              for c in out['cards']:
                  d=request('https://discounts-prices-api.wildberries.ru/api/v2/list/goods/filter?limit=10&filterNmID='+str(c['nmID']))
                  out['prices']+=d.get('data',{}).get('listGoods',[])
                  time.sleep(1)
              out['status']='received'
          except urllib.error.HTTPError as e:out.update(status='error',http_status=e.code)
          except Exception as e:out.update(status='error',error=str(e))
          save('madison_fill:china:20261105:preflight:v1',out)
          print('Preflight saved privately; no card changes.')
          
          PY

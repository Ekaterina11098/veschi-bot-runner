name: Owner045 lower recommendation bid to verified minimum
on:
  push:
    branches: [main]
    paths: [.github/workflows/owner-045-minimum31.yml]
permissions: {contents: read}
concurrency:
  group: owner-045-minimum31
  cancel-in-progress: false
jobs:
  apply:
    if: ${{ false }} # One-time owner action WBverified31Oct; no further execution
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Exact one-item owner action with private before-after receipt
        env:
          PYTHONPATH: scripts
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import copy,json,os,time
          from datetime import datetime,timezone
          import requests
          from china_cloud_cost_control import Cache,WB,validate_identity,projection,stamp
          from china_moysklad_read import read_stock
          ROOT='china_agent:owner_045_minimum31:v1'
          CID=40933588
          SEARCH=41332083
          NM=1473243895
          ARTICLE='045-NoelBag-ginger'
          QUOTE='Проверь текущую минимальную ставку и снизь до неё ставку 045-NoelBag-ginger в рекомендациях, поиск пока оставь по 0,28 ¥.'
          def main():
           c=Cache();old=c.get(ROOT+':execution')
           if old:print(json.dumps({'existing':True,'status':old['status']}));return
           def approval():
            a=c.get(ROOT+':approval') or {}
            if a.get('status')!='approved' or a.get('quote')!=QUOTE or a.get('owner_user_id')!=5122667182 or a.get('cabinet')!='token_3' or a.get('campaign_id')!=CID or a.get('nm_id')!=NM or a.get('placement')!='recommendations' or a.get('target')!='fresh_minimum_lower_only' or datetime.now(timezone.utc)>=datetime.fromisoformat(a['expires_at']):raise ValueError('Exact approval absent or expired')
           approval()
           w=WB();validate_identity(c,w)
           e=dict(status='preflight',created_at=stamp(),approval_key=ROOT+':approval',cabinet='token_3',nm_id=NM,article=ARTICLE,wb_writes=0,telegram_calls=0)
           if not c.create(ROOT+':execution',e):raise ValueError('Existing execution; do not repeat')
           def save():c.put(ROOT+':execution',copy.deepcopy(e))
           def sku(cp):
            ns=[x for x in cp['nm_settings'] if x['nm_id']==NM]
            if len(ns)!=1:raise ValueError('Exact campaign membership missing')
            return ns[0]
           try:
            before=w.campaigns([CID,SEARCH]);rec=before[str(CID)];search=before[str(SEARCH)]
            for cp in [rec,search]:
             if cp['status']!=9 or cp['currency']!='CNY' or cp['bid_type']!='manual' or cp['settings']['payment_type']!='cpc':raise ValueError('Campaign identity/settings changed')
            if rec['settings']['placements']!={'search':False,'recommendations':True} or search['settings']['placements']!={'search':True,'recommendations':False}:raise ValueError('Placements changed')
            current=sku(rec)['bids_kopecks']['recommendations']
            if sku(search)['bids_kopecks']['search']!=28:raise ValueError('Search is not0.28; no search write authorized')
            e.update(before=rec,search_before=search,before_observed_at=stamp())
            rr=requests.get('https://advert-api.wildberries.ru/api/advert/v1/config',headers={'Authorization':w.token},timeout=45);rr.raise_for_status();cfg=rr.json()
            if cfg.get('currency')!='CNY' or type(cfg.get('cpcStep'))is not int or cfg['cpcStep']<=0:raise ValueError('CNY step unknown')
            target=w.minimums(CID,[NM],'recommendations')[NM]
            if target%cfg['cpcStep'] or target>cfg.get('cpcMaxBid',0) or target>current:raise ValueError('Fresh minimum cannot be used for lower-only action')
            e.update(minimum_minor=target,current_minor=current,config=cfg,minimum_observed_at=stamp())
            e['stock']=read_stock([ARTICLE])
            if not e['stock'].get('coverage_complete'):raise ValueError('Exact MSK stock/COGS unavailable')
            rr=requests.get('https://discounts-prices-api.wildberries.ru/api/v2/list/goods/filter',params={'limit':1000,'offset':0,'filterNmID':NM},headers={'Authorization':w.token},timeout=45);rr.raise_for_status()
            goods=rr.json().get('data',{}).get('listGoods',[])
            if len(goods)!=1 or goods[0]['nmID']!=NM or goods[0]['vendorCode']!=ARTICLE or goods[0].get('currencyIsoCode4217')!='CNY':raise ValueError('Exact seller price unclear')
            e.update(prices=goods,prices_observed_at=stamp());save()
            approval()
            check=w.campaigns([CID,SEARCH])
            if any(projection(check[str(cid)])!=projection(before[str(cid)]) for cid in [CID,SEARCH]):raise ValueError('Campaign changed during preflight')
            expected=copy.deepcopy(rec);sku(expected)['bids_kopecks']['recommendations']=target
            body={'bids':[{'advert_id':CID,'nm_bids':[{'nm_id':NM,'bid_kopecks':target,'placement':'recommendations'}]}]}
            e.update(expected=expected,body=body)
            if target<current:
             e.update(status='submitting',submitted_at=stamp(),wb_writes=1);save()
             e['response']=w.req('/api/advert/v1/bids','PATCH',body,write=True)
             e['status']='accepted';save()
            for n in range(4):
             after=w.campaigns([CID,SEARCH]);e.update(after=after[str(CID)],search_after=after[str(SEARCH)],verified_read_at=stamp())
             if projection(e['after'])==projection(expected) and projection(e['search_after'])==projection(search):break
             if n<3:time.sleep(5)
            else:raise ValueError('Readback mismatch; never repeat write')
            e.update(status='verified',verified_at=stamp(),no_op=target==current,search_unchanged=True);save()
            registry=c.get('china_agent:verified_campaign_state:v1') or {}
            registry[str(CID)]=ROOT+':execution';c.put('china_agent:verified_campaign_state:v1',registry)
            print(json.dumps({'status':'verified','before_minor':current,'after_minor':target,'search_minor':28,'wb_writes':e['wb_writes']}))
           except Exception as ex:
            e.update(status='uncertain' if e.get('wb_writes') else 'blocked',error=str(ex)[:180] if isinstance(ex,(ValueError,RuntimeError)) else type(ex).__name__,failed_at=stamp());save();raise
          if __name__=='__main__':main()
          
          PY

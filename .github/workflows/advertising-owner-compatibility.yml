name: Advertising main PR19 storage compatibility, owner preparation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/advertising-owner-compatibility.yml']
permissions:
  contents: write
concurrency:
  group: advertising-owner-preparation
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 1b4201067880e379d8dacbe5f6ca3f9848d6ffb0
          fetch-depth: 0
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: combined
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: a40ffd3ac5e5cbde9fa3eb84cf8bd142957c3060
          fetch-depth: 0
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: pr19
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Dependencies
        run: pip install simplejson cryptography==46.0.2 -r combined/requirements.txt > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Combine privately and run relevant network-disabled regressions
        run: python advertising_compatibility_owner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-advertising-compatibility
          path: ${{ runner.temp }}/stock-deploy-proof/*.aes.json
          retention-days: 90
      - name: Preserve independent ciphertext only
        if: always()
        run: |
          mkdir -p recovery-output/advertising
          cp "$RUNNER_TEMP/stock-deploy-proof/advertising-compatibility.aes.json" "recovery-output/advertising/compatibility-${{ github.run_id }}.aes.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-output/advertising/
          git commit -m "Preserve encrypted advertising compatibility result"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
          done
          exit 1

name: Owner read-only orders38furmanizhka21Oct
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-orders38-read-20261021.yml']
permissions:
  contents: read
concurrency:
  group: bot-stock
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 2f136b039acfc256264a04d4f9110fe0311822b2
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv==1.1.1 aiogram==3.22.0 simplejson==4.2.0 'psycopg[binary]==3.2.9' cryptography > "$RUNNER_TEMP/read-install.log" 2>&1
      - name: Read article orders only
        env:
          PYTHONPATH: ${{ github.workspace }}/private-source:${{ github.workspace }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          AUTO_STOCK_FAIL_FAST: '1'
        run: python private-source/owner_article_orders_20261021.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-article-orders-read
          path: ${{ runner.temp }}/stock-deploy-proof
          retention-days: 30

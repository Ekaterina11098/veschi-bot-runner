name: Owner agent — dialogue with MPStats gap recovery
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Exact owner_agent_jobs ID
        required: true
        type: string
permissions: {contents: read}
concurrency:
  group: owner-agent-dialogue
  cancel-in-progress: false
  queue: max
jobs:
  answer:
    concurrency:
      group: bot-mpstats-data
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 29f6e3f4a59e87c43a085f18d69f8509fe1cf6c1
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 > "$RUNNER_TEMP/owner-dependencies.log" 2>&1
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Offline isolation and transport tests
        run: node --test owner_agent/test.mjs
      - name: Answer one authorized saved question
        env:
          OWNER_AGENT_JOB_ID: ${{ inputs.job_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          OWNER_TELEGRAM_BOT_TOKEN: ${{ secrets.OWNER_TELEGRAM_BOT_TOKEN }}
          OWNER_AI_MODEL: ${{ vars.OWNER_AI_MODEL || 'gpt-4.1-mini' }}
        run: node owner_agent/worker.mjs

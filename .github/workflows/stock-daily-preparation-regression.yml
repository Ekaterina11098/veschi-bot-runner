name: Daily stock lease and stock notices offline regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stock-daily-preparation-regression.yml']
permissions:
  contents: read
  actions: read
jobs:
  regress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: offline
          POSTGRES_PASSWORD: offline-only
          POSTGRES_DB: stock_regression
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U offline -d stock_regression"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: c9aa01737a307997b0ef63cf9bff9954873f6de7
          fetch-depth: 0
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: offline-recovery-runtime-kit
          run-id: 38686760314
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/runtime
      - name: Verify exact deployment file set excludes PR16 unrelated modules
        run: |
          python - <<'PY'
          import json,subprocess,os
          from pathlib import Path
          files=subprocess.check_output(['git','diff','--name-only','755b69c266ad39beafd334e60aa900c07814cae8','HEAD'],text=True).splitlines()
          prohibited=[p for p in files if any(p.startswith(prefix) for prefix in ['pages/','china_agent/','business_agents/']) or 'dashboard' in p.lower() or (p.startswith('advertising_agent/') and p!='advertising_agent/store_knowledge.json')]
          assert not prohibited,prohibited
          deps=['analytics/storage_archive.py','analytics/storage_collection_gate.py']
          assert all(p in files for p in deps)
          assert 'analytics/storage_transport_guards.py' not in files and 'analytics/storage_worker_bootstrap.py' not in files
          out=Path(os.environ['RUNNER_TEMP'])/'deployment-proof';out.mkdir()
          (out/'composition.json').write_text(json.dumps({'commit':'c9aa01737a307997b0ef63cf9bff9954873f6de7','base':'755b69c266ad39beafd334e60aa900c07814cae8','files':files,'minimal_pr16_modules':deps,'pr16_head_reference':'85e94e969e8a9673b860087ef61c0861c9ca79c1','no_full_pr16_or_pr19_merge':True},sort_keys=True))
          print(json.dumps({'composition_verified':True,'changed_files':len(files),'only_stock_dependencies':True}))
          PY
      - name: Stock, storage proof and isolated PostgreSQL regression only
        env:
          OFFLINE_POSTGRES_DSN: postgresql://offline:offline-only@127.0.0.1:5432/stock_regression
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          python - <<'PY'
          import os,sys,socket,json,subprocess,unittest
          from pathlib import Path
          rt=Path(os.environ['RUNNER_TEMP'])/'runtime'
          subprocess.run([sys.executable,'-m','pip','install','--no-index','--find-links',str(rt/'wheels'),'-r',str(rt/'requirements.recovery.lock.txt')],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          original=socket.socket.connect
          def guarded(self,address,*a,**k):
              if isinstance(address,tuple) and address[0] in ('127.0.0.1','localhost','::1'):return original(self,address,*a,**k)
              raise AssertionError('Business network denied')
          socket.socket.connect=guarded
          def denied(*a,**k):raise AssertionError('Business network denied')
          socket.create_connection=denied;socket.socket.connect_ex=denied
          assert not any(os.getenv(k) for k in ('SUPABASE_SECRET_KEY','WB_TOKEN_1','WB_TOKEN_2','WB_TOKEN_3','TELEGRAM_BOT_TOKEN'))
          names=['test_auto_stock.py','test_stock_*.py','test_low_stock_policy.py','test_moscow_stock_source.py','test_sales_cache.py','test_storage_collection_gate.py']
          files=sorted({p.name for pattern in names for p in Path('tests').glob(pattern)})
          sys.path.insert(0,'tests')
          suite=unittest.TestSuite(unittest.defaultTestLoader.discover('tests',pattern=f) for f in files)
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          summary={'commit':'c9aa01737a307997b0ef63cf9bff9954873f6de7','tests':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),'skipped':len(result.skipped),'failure_ids':[t.id() for t,_ in result.failures],'error_ids':[t.id() for t,_ in result.errors],'business_calls':0,'wb_writes':0,'telegram_calls':0,'production_db_calls':0,'files':files}
          out=Path(os.environ['RUNNER_TEMP'])/'deployment-proof'
          (out/'summary.json').write_text(json.dumps(summary,sort_keys=True));print(json.dumps(summary,sort_keys=True))
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-daily-preparation-regression
          path: ${{ runner.temp }}/deployment-proof
          retention-days: 90

name: Release publication checkout queue without interrupting WB operations
on:
  push:
    paths: ['.github/workflows/review-publication-checkout-recover-20261104.yml']
permissions: {contents: read, actions: write}
jobs:
  release-stale-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only a verified stale checkout before any publication step
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          base='https://api.github.com/repos/'+os.environ['REPOSITORY']+'/actions/runs/41868633090'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def read(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:return json.load(r)
          run=read(base)
          if run['head_sha']!='125b616dc64091cdd7733ef94a4c7da9f47b0695' or run['path']!='.github/workflows/review-approved-publication.yml':raise RuntimeError('Wrong run; no cancellation')
          if run['status']=='completed':print('Old run already completed; no action')
          else:
              jobs=read(base+'/jobs?per_page=100')['jobs']
              for job in jobs:
                  for step in job.get('steps',[]):
                      if step['name']=='Resume only post-cutover authenticated Telegram approvals' and step['status'] not in ('pending','queued') and step.get('conclusion')!='skipped':
                          raise RuntimeError('Publication may have started; leave run alone')
              with urllib.request.urlopen(urllib.request.Request(base+'/cancel',headers=headers,method='POST'),timeout=30) as r:
                  if r.status!=202:raise RuntimeError('Cancellation not accepted')
              print('Stopped only old checkout before all WB publication steps')
          PY

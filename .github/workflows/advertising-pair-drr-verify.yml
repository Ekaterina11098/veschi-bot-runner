name: Verify pair DRR preparation without delivery or WB changes
on:
  push:
    branches: [verify-pair-drr-format-20261017]
    paths: ['.github/workflows/advertising-pair-drr-verify.yml']
permissions: {contents: write}
concurrency:
  group: wb-ip-advertising-agent
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b205bd3e1a8635ef549a2c6d52bdac64eb9384bb
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r private-source/requirements.txt cryptography==46.0.2 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Existing offline regression suites, external sockets blocked
        working-directory: private-source
        run: |
          python - <<'PY'
          import socket,unittest,sys
          def deny(*a,**k):raise AssertionError('Offline verification: external socket forbidden')
          socket.create_connection=deny
          socket.socket.connect=deny
          loader=unittest.TestLoader();suite=unittest.TestSuite()
          for name in ('test_ip_daily_recommendations.py','test_ip_campaign_audit.py','test_ip_completed_investigations.py','test_ip_sku_complete_review.py','test_ip_full_offline_pipeline.py','test_ip_delivery_boundary.py','test_ip_unknown_identity_controls.py'):
              suite.addTests(loader.discover('tests',pattern=name))
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(not result.wasSuccessful())
          PY
      - name: Exact retained end-to-end preview, no transport
        working-directory: private-source
        run: |
          python - <<'PY'
          import socket,runpy,sys
          def deny(*a,**k):raise AssertionError('No external transport in retained preview')
          socket.create_connection=deny
          socket.socket.connect=deny
          sys.path.insert(0,'tests')
          namespace=runpy.run_path('tests/test_ip_full_offline_pipeline.py')
          result=namespace['retained_pair_preview_acceptance']()
          sys.path.insert(0,'..')
          from stock_deploy_support import seal
          seal('pair-drr-e2e-preview',result)
          print({'generated_actions':len(result['generated_actions']),'campaign_messages':len(result['exact_telegram_preview']),'telegram_calls':0,'wb_writes':0,'external_calls':0})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-pair-drr-preview
          path: ${{ runner.temp }}/stock-deploy-proof/*.aes.json
          retention-days: 90
      - name: Preserve preview ciphertext only
        if: always()
        run: |
          mkdir -p recovery-output/advertising
          for file in "$RUNNER_TEMP"/stock-deploy-proof/*.aes.json; do
            test -f "$file" || continue
            cp "$file" "recovery-output/advertising/pair-preview-${{ github.run_id }}.aes.json"
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-output/advertising/pair-preview-*.aes.json
          git diff --cached --quiet || git commit -m "Preserve encrypted retained pair preview"
          git push origin HEAD:verify-pair-drr-format-20261017

name: Stock reserve identity offline diagnosis
on:
  push:
    paths: ['.github/workflows/stock-reserve-identity-20261029.yml']
permissions:
  contents: read
concurrency:
  group: stock-offline-reserve-identity
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 28f230cccd2b16e80eff2b335429427edebbda9c
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests > /dev/null
      - name: Hash-only identity; no API calls
        env:
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: |
          python - <<'PY'
          import os,json,hashlib
          from types import SimpleNamespace
          from stock_current_order_reserve import ledger_key
          from stock_operation_store import digest
          from stock_ozon_scope import load_scope,is_working_article
          from stock_ozon_source import mapping,article
          g=SimpleNamespace(cabinet_tokens=lambda:[os.environ['WB_TOKEN_'+str(i)] for i in (1,2,3)],STOCK_APPROVED_WAREHOUSES=[[1863255],[854652],[2126188]])
          key=ledger_key(g,{'warehouses':g.STOCK_APPROVED_WAREHOUSES,'ozon':{}})
          s=load_scope();a=mapping()
          print(json.dumps({'expected_row':'technical:stock-shared:v1:'+digest(key),'working_count':sum(is_working_article(o,s) for o in s['known_articles'].values()),'helena_working':is_working_article('510-HelenaBag-brown',s),'token_hashes':[hashlib.sha256(t.encode()).hexdigest() for t in g.cabinet_tokens()],'working':[article(o,a) for o in s['known_articles'].values() if is_working_article(o,s)]}))
          PY

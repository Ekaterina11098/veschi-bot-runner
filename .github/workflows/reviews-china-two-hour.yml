name: China reviews every two hours with safe automatic positive replies
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reviews-china-two-hour.yml']
  schedule:
    # UTC odd hours correspond to even Moscow hours, at :17; separate tested China checkpoint with immutable source reuse.
    - cron: '17 1-23/2 * * *'
permissions:
  contents: read
concurrency:
  group: reviews-china-two-hour
  cancel-in-progress: false
jobs:
  china-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /review-approval-preparation/*.py
            /.github/workflows/reviews-china-two-hour.yml
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 18649db15489c3dc77edc22bec5a4ddc5ed6a410
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /tests/*.py
            /*.md
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'psycopg[binary]==3.2.10' cryptography==46.0.2 requests==2.32.5 python-dotenv==1.1.1 openai==1.109.1
      - name: Validate China isolation, scheduling, duplicate protection and shared rate budget
        run: |
          python -m unittest test_review_china_routing_audit.py test_review_china_two_hour.py test_review_morning.py test_review_auto_five_star.py test_review_semantic_positive.py
          PYTHONPATH=private-source python -m unittest discover -s private-source/tests -p test_review_rate_budget.py
          PYTHONPATH=private-source python -c "from openai_client import load_system_prompt; assert load_system_prompt().strip()"
          python -m py_compile review_morning.py review_china_two_hour.py
      - name: Collect only China reviews and route positives without Telegram approval
        env:
          PYTHONPATH: ${{ github.workspace }}/private-source
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_SEMANTIC_AUTO_FIVE_STAR: '1'
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: python review_china_two_hour.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-china-review-receipts
          path: ${{ runner.temp }}/stock-deploy-proof
          retention-days: 90

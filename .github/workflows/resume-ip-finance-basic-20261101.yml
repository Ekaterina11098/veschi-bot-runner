name: Resume one requested IP finance report after server cooldown
on:
  push:
    branches: [main]
    paths: ['.github/workflows/resume-ip-finance-basic-20261101.yml']
  schedule:
    - cron: '50 * 3-5 11 *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: ip-basic-finance-20261101
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resume saved cursor only when allowed
        shell: python
        env:
          WB_FINANCE_TOKEN_2: ${{ secrets.WB_FINANCE_TOKEN_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import os,json,gzip,datetime,urllib.request,urllib.error,email.utils
          ROOT="weekly_report_review:ip:20261101:finance_basic:"
          URL="https://finance-api.wildberries.ru/api/finance/v1/sales-reports/detailed"
          SB=os.environ["SUPABASE_URL"].rstrip("/")
          def now():return datetime.datetime.now(datetime.timezone.utc)
          def stamp():return now().isoformat()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs):raise RuntimeError("Redirect blocked")
          op=urllib.request.build_opener(NoRedirect)
          SH={"apikey":os.environ["SUPABASE_SECRET_KEY"],"Authorization":"Bearer "+os.environ["SUPABASE_SECRET_KEY"],"Content-Type":"application/json"}
          def get(key):
           req=urllib.request.Request(SB+"/rest/v1/telegram_api_cache?cache_key=eq."+urllib.parse.quote(ROOT+key,safe="")+"&select=payload",headers=SH)
           with op.open(req,timeout=60) as r:data=json.load(r)
           return data[0]["payload"] if data else None
          def put(key,payload):
           data={"cache_key":ROOT+key,"payload":payload,"updated_at":stamp(),"expires_at":"2099-01-01T00:00:00Z"}
           req=urllib.request.Request(SB+"/rest/v1/telegram_api_cache?on_conflict=cache_key",headers={**SH,"Prefer":"resolution=merge-duplicates,return=minimal"},method="POST",data=json.dumps(data).encode())
           with op.open(req,timeout=60) as r:assert r.status in (200,201,204)
          proof=get("source_proof:v1")
          assert proof and proof["dateFrom"]=="2026-11-01" and proof["dateTo"]=="2026-11-01"
          if proof["status"] in ("complete","complete_reconciled"):print("Already complete; no request.");raise SystemExit()
          deadline=proof.get("next_allowed_at")
          if deadline and now()<datetime.datetime.fromisoformat(deadline.replace("Z","+00:00")):
           print("Server retry window has not elapsed; no WB request.");raise SystemExit()
          if now()>datetime.datetime(2026,11,6,tzinfo=datetime.timezone.utc):
           print("One-off resume window expired; no WB request.");raise SystemExit()
          cursor=proof.get("last_rrd_id",0)
          body={"dateFrom":"2026-11-01","dateTo":"2026-11-01","period":"weekly","limit":100000,"rrdId":cursor}
          req=urllib.request.Request(URL,method="POST",data=json.dumps(body).encode(),headers={"Authorization":os.environ["WB_FINANCE_TOKEN_2"],"Content-Type":"application/json","Accept-Encoding":"gzip"})
          try:
           with op.open(req,timeout=120) as r:
            status=r.status;headers=r.headers;raw=r.read()
          except urllib.error.HTTPError as e:
           status=e.code;headers=e.headers;raw=e.read()
          except Exception:
           proof.update(status="transport_outcome_requires_safe_resume",next_allowed_at=(now()+datetime.timedelta(seconds=43203)).isoformat(),last_transport_error_at=stamp())
           put("source_proof:v1",proof);raise
          if headers.get("Content-Encoding")=="gzip":raw=gzip.decompress(raw)
          try:data=json.loads(raw) if raw else []
          except Exception:data=None
          rh={k:headers.get(k) for k in ("X-RateLimit-Retry","Retry-After","X-RateLimit-Reset","X-RateLimit-Limit","X-RateLimit-Remaining") if headers.get(k) is not None}
          waits=[43203]
          for key in ("X-RateLimit-Retry","Retry-After","X-RateLimit-Reset"):
           try:
            value=float(rh.get(key,""))
            if value>1000000000:value=max(0,value-now().timestamp())
            waits.append(value+3)
           except ValueError:pass
          delay=max(waits)
          proof.setdefault("resume_requests",[]).append({"at":stamp(),"http":status,"cursor":cursor,"headers":rh,"run_id":os.environ["GITHUB_RUN_ID"]})
          proof["next_allowed_at"]=(now()+datetime.timedelta(seconds=delay)).isoformat()
          if status==204 or (status==200 and data==[]):
           proof.update(status="complete",pagination_exhausted=True,completed_at=stamp());put("source_proof:v1",proof);print("Full pagination complete; results private.");raise SystemExit()
          if status!=200:
           proof.update(status="waiting_for_server_retry" if status==429 else "source_error",http_status=status,error=data)
           put("source_proof:v1",proof)
           if status!=429:raise RuntimeError("Finance HTTP "+str(status))
           print("Server rate limit persisted; next retry checkpoint saved.");raise SystemExit()
          assert isinstance(data,list) and data,"Unexpected finance representation"
          seen=set()
          for chunk in proof["chunks"]:
           for r in get(chunk["key"][len(ROOT):]):seen.add(str(r["rrdId"]))
          for row in data:
           rid=str(row["rrdId"]);assert rid not in seen,"Duplicate row";seen.add(rid)
          for offset in range(0,len(data),100):
           key="source_rows:"+str(proof["rows"]+offset);batch=data[offset:offset+100];put(key,batch);proof["chunks"].append({"key":ROOT+key,"rows":len(batch)})
          proof["rows"]+=len(data);proof["last_rrd_id"]=data[-1]["rrdId"];assert proof["last_rrd_id"]!=cursor
          proof["keys"]=list(data[0]);proof["status"]="page_saved_waiting_next_cursor";proof["http_status"]=200
          put("source_proof:v1",proof);print("Complete page saved privately; next cursor scheduled after server window.")
          
# Resume authorized saved cursor after 2026-11-03 cooldown.

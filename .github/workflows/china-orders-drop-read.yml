name: China orders decline read-only audit
on:
  push:
    branches: [china-orders-drop-20261023]
    paths: ['.github/workflows/china-orders-drop-read.yml']
permissions:
  contents: read
jobs:
  wb:
    concurrency:
      group: china-orders-direct-read
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Read WB orders, ads and prices only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: disabled
          PYTHONPATH: scripts
        run: python scripts/china_orders_today_wb.py
name: China Veschi photo audit 20261110
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-veschi-audit-20261110.yml']
permissions:
  contents: read
concurrency:
  group: china-veschi-photo-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.event.head_commit.message == 'Run read-only China Veschi photo audit 20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-rus
      - run: pip install requests pillow
      - name: Read-only China catalog and free OCR
        shell: python
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          OMP_THREAD_LIMIT: '1'
        run: |
          import os,json,time,hashlib,io,re,subprocess,concurrent.futures,threading
          from pathlib import Path
          import requests
          from PIL import Image,ImageOps
          os.environ['OMP_THREAD_LIMIT']='1'
          BASE='https://content-api.wildberries.cn'
          TOKEN=os.environ['WB_TOKEN_3'];assert TOKEN
          root=Path('scan');root.mkdir()
          cards=[];cursor={'limit':100};calls=0;seen=set()
          for page in range(30):
              r=requests.post(BASE+'/content/v2/get/cards/list',headers={'Authorization':TOKEN},json={'settings':{'sort':{'ascending':True},'cursor':cursor,'filter':{'withPhoto':-1}}},timeout=60)
              calls+=1
              if r.status_code==429:raise RuntimeError('WB rate limited; no repeated request')
              r.raise_for_status();b=r.json();b=b.get('data',b) if 'cards' not in b else b
              rows=b['cards'];cards.extend(rows)
              if len(rows)<100:break
              c=b['cursor'];marker=(c.get('updatedAt'),c.get('nmID'));assert marker not in seen;seen.add(marker)
              cursor={'limit':100,'updatedAt':marker[0],'nmID':marker[1]};time.sleep(2)
          else:raise RuntimeError('Pagination ceiling')
          assert len({c['nmID'] for c in cards})==len(cards)
          jobs=[{'nmID':c['nmID'],'article':c['vendorCode'],'photo':i+1,'url':p.get('big') or p.get('c516x688')} for c in cards for i,p in enumerate(c.get('photos') or [])]
          print('COVERAGE_START',json.dumps({'cards':len(cards),'photos':len(jobs),'api_requests':calls,'no_photos':[c['vendorCode'] for c in cards if not c.get('photos')],'videos_not_scanned':sum(bool(c.get('video')) for c in cards)}),flush=True)
          lock=threading.Lock();unique={};loaded=[];errors=[]
          def download(j):
              for attempt in range(2):
                  try:
                      res=requests.get(j['url'],timeout=40);res.raise_for_status();raw=res.content
                      im=Image.open(io.BytesIO(raw));im.verify();sha=hashlib.sha256(raw).hexdigest()
                      with lock:
                          if sha not in unique:
                              path=root/(sha+'.webp');path.write_bytes(raw);unique[sha]=str(path)
                      return dict(j,sha256=sha)
                  except Exception as e:
                      if attempt: return dict(j,error=type(e).__name__)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              for k,j in enumerate(pool.map(download,jobs),1):
                  (errors if 'error' in j else loaded).append(j)
                  if k%200==0:print('DOWNLOAD_PROGRESS',k,len(jobs),flush=True)
          print('DOWNLOAD_COMPLETE',len(loaded),'UNIQUE',len(unique),'ERRORS',len(errors),flush=True)
          def brand(s):
              s=s.upper().translate(str.maketrans({'Е':'E','С':'C','Н':'H','І':'I','У':'V','5':'S','$':'S','|':'I','!':'I','1':'I'}))
              n=re.sub('[^A-Z]','',s)
              return ('VESCH' in n or 'VESHI' in n or 'ВЕСЧИ' in s or n in ['VESCI','VESCNI','VESCНI','VESCHI','VESCHL'])
          def ocr(im,psm):
              b=io.BytesIO();im.save(b,format='PNG')
              p=subprocess.run(['tesseract','stdin','stdout','-l','eng+rus','--psm',str(psm)],input=b.getvalue(),capture_output=True,timeout=40)
              if p.returncode:raise RuntimeError('OCR failed')
              return p.stdout.decode(errors='replace')
          def scan(item):
              sha,path=item
              try:
                  im=Image.open(path).convert('RGB');im.thumbnail((1200,1600))
                  outputs=[('full',ocr(im,11))]
                  top=im.crop((0,0,min(im.width,400),min(im.height,140)))
                  top=ImageOps.expand(ImageOps.autocontrast(top.convert('L')).resize((top.width*3,top.height*3)),border=30,fill='white')
                  outputs.append(('top',ocr(top,7)))
                  foot=im.crop((0,int(im.height*.84),im.width,im.height))
                  foot=ImageOps.expand(ImageOps.autocontrast(foot.convert('L')).resize((foot.width*2,foot.height*2)),border=20,fill='white')
                  outputs.append(('footer',ocr(foot,6)))
                  if re.search('КАЧЕСТВО|ФУРНИТУРА|ЗАСТЕЖКА|ЗАСТЁЖКА',outputs[0][1],re.I):
                      detail=im.crop((0,int(im.height*.18),im.width,int(im.height*.92)))
                      detail=ImageOps.autocontrast(detail.convert('L'));detail=detail.resize((detail.width*2,detail.height*2))
                      outputs.append(('detail',ocr(detail,11)))
                      outputs.append(('detail90',ocr(detail.rotate(90,expand=True),11)))
                      outputs.append(('detail270',ocr(detail.rotate(270,expand=True),11)))
                  hits=[]
                  for region,txt in outputs:
                      for line in txt.splitlines():
                          if brand(line):hits.append({'region':region,'text':line.strip()})
                  return sha,{'hits':hits}
              except Exception as e:return sha,{'error':type(e).__name__}
          results={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              for k,(sha,r) in enumerate(pool.map(scan,unique.items()),1):
                  results[sha]=r
                  if k%50==0:print('OCR_PROGRESS',k,len(unique),flush=True)
          findings=[dict(j,hits=results[j['sha256']]['hits']) for j in loaded if results.get(j['sha256'],{}).get('hits')]
          ocr_errors=[j for j in loaded if results.get(j['sha256'],{}).get('error')]
          for j in findings:print('LOGO_CANDIDATE',json.dumps(j,ensure_ascii=False),flush=True)
          for j in errors+ocr_errors:print('UNVERIFIED_PHOTO',json.dumps(j,ensure_ascii=False),flush=True)
          fields=[]
          for c in cards:
              flagged=[k for k in ['brand','title','description','characteristics'] if re.search(r'veschi|veshi|весчи',json.dumps(c.get(k),ensure_ascii=False),re.I)]
              if flagged:fields.append({'article':c['vendorCode'],'nmID':c['nmID'],'fields':flagged})
          print('TEXT_FIELDS',json.dumps(fields,ensure_ascii=False),flush=True)
          print('AUDIT_SUMMARY',json.dumps({'cards':len(cards),'photos_expected':len(jobs),'photos_downloaded':len(loaded),'unique_images':len(unique),'candidate_photos':len(findings),'candidate_cards':len({x['article'] for x in findings}),'download_errors':len(errors),'ocr_errors':len(ocr_errors),'api_requests':calls,'wb_writes':0,'paid_ai_calls':0}),flush=True)

name: Owner morning complete417 read
on:
  push:
    paths: ['.github/workflows/owner-morning417-read-20261111.yml']
permissions:
  contents: read
concurrency:
  group: china-advertising-daily
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Bounded read with control campaign and independent history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: unused-no-telegram
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import requests,time,copy
          from datetime import datetime,timezone
          from china_price_apply import IO
          io=IO();K='china_agent:owner_morning_quotes:2026-11-11:v2:read'
          if io.get(K):raise SystemExit('Existing read; no replay')
          e=dict(status='reading',wb_writes=0,telegram_calls=0,observed_at=datetime.now(timezone.utc).isoformat());assert io.create(K,e)
          v=io.get('china_agent:owner_report_complete:2026-11-11:v1:growth-repair2')['inputs']
          ids=[c['id']for c in v['campaigns']if c['status']in[9,11]]
          calls=[('panamas_search','POST','/api/advert/v1/bids/min',dict(advert_id=40945478,nm_ids=[1535337771,1535337772,1535337773,1535337779],payment_type='cpc',placement_types=['search'])),('umbrella_recommendations','POST','/api/advert/v1/bids/min',dict(advert_id=41325637,nm_ids=[1556488181],payment_type='cpc',placement_types=['recommendation']))]
          for label,method,path,body in calls:
           time.sleep(3.5)
           try:
            r=requests.request(method,'https://advert-api.wildberries.ru'+path,json=body,headers={'Authorization':io.token},timeout=35)
            e[label]={'http':r.status_code,'data':r.json() if r.content else None}
           except Exception as ex:e[label]={'error':type(ex).__name__}
           io.put(K,e)
          e['status']='read';io.put(K,e);print('Exact dated placement quotes and balances saved')
          PY

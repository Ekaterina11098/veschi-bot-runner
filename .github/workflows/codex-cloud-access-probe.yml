name: Codex cloud API access probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/codex-cloud-access-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: pip install openai==3.42.1 --quiet
      - name: Test synthetic two-turn cloud conversation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -u - <<'PY'
          import json
          from uuid import uuid4
          from openai import OpenAI
          client=OpenAI(max_retries=0,timeout=90)
          sid=None
          try:
              with client.beta.agents.sessions.create(
                  agent={"model":"gpt-6-astra","instructions":"Answer briefly in Russian. This is a synthetic continuity test. No tools or external actions. Preserve user facts, distinguish missing values from zero. Output JSON only."},
                  environment={"type":"none"},
                  input="Запомни учебные условия: ставка изменена 2 ноября 2026. День изменения исключаем, нужен следующий полный день МСК, оцениваем на следующий день после него. Код проекта СИНИЙ-КЛЁН-73. Расходы двух учебных товаров 10 и 90 CNY, суммы рекламных заказов 100 и 300 CNY. Общие расходы неизвестны. Ответь только {\"remembered\":true}.",
                  stream=True
              ).with_result_collection() as stream:
                  for event in stream:
                      if event.type.endswith(('.failed','.cancelled')): print(event.to_json())
                  result=stream.get_final_result()
              sid=result.session_id
              print(json.dumps({"first_turn":result.output_text,"session_created":bool(sid)},ensure_ascii=False))
              answers=[];completed=False
              with client.beta.agents.sessions.events.stream(sid) as events:
                  client.beta.agents.sessions.events.create(sid,idempotency_key=str(uuid4()),events=[{"type":"agent.session.input.message","input":[{"role":"user","content":[{"type":"input_text","text":"Верни JSON с полями code, earliest_review_date (YYYY-MM-DD), weighted_drr_percent, zero_orders_drr (null если неопределима), unknown_general_expenses_is_zero (boolean). Используй условия прошлого сообщения. Дополнительно: при положительном расходе и нуле заказов чему равна ДРР? Никаких действий."}]}]}])
                  for event in events:
                      data=event.to_dict()
                      if event.type.endswith('output_text.delta'): answers.append(data.get('delta',''))
                      if event.type=='agent.session.turn.completed' and event.turn.subagent_id is None:
                          completed=True;break
                      if event.type in ('error','agent.session.failed','agent.session.turn.failed','agent.session.turn.cancelled'):
                          print(event.to_json());break
              print(json.dumps({"second_turn_completed":completed,"second_turn_output":"".join(answers)},ensure_ascii=False))
              if not completed:raise RuntimeError('Cloud second turn not completed')
          except Exception as e:
              print(json.dumps({"probe_error_type":type(e).__name__,"status_code":getattr(e,'status_code',None),"detail":str(e)[:1200]},ensure_ascii=False))
              raise
          finally:
              if sid:
                  try:
                      client.beta.agents.sessions.delete(sid)
                      print('{"test_session_deleted":true}')
                  except Exception as e:print(json.dumps({"cleanup_error":type(e).__name__}))
          PY

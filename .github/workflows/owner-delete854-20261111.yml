name: Owner delete superseded advertising854 only11Nov
on:
  push:
    paths: ['.github/workflows/owner-delete854-20261111.yml']
permissions:
  contents: read
concurrency:
  group: china-advertising-daily
  cancel-in-progress: false
jobs:
  proposal:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Delete only verified superseded report854 preserving archive and active856
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: unused-no-wb
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import requests
          from datetime import datetime,timezone
          from china_price_apply import IO
          io=IO();K='china_agent:owner_remove_old_report854:2026-11-11:v1'
          if io.get(K):raise SystemExit('Existing deletion journal; no replay')
          d=io.get('china_agent:advertising_delivery:2026-11-11:v1')
          old=next(p for p in d['parts'] if p.get('message_id')==854)
          assert old['status']=='sent' and old['kind']=='drr:001' and old['receipt']['chat']['id']==-1004342917488 and old['receipt']['from']['id']==8780468043
          b=io.get('china_agent:daily_ad_message:v2:856');current=io.get('china_agent:daily_ad_current_report:v1:drr')
          assert b['plan_id']==current['plan_id'] and b['plan_id']=='daily-2026-11-11-owner55-drr-0'
          url='https://api.telegram.org/bot'+io.bot+'/'
          r=requests.post(url+'getMe',timeout=25);r.raise_for_status();assert r.json()['result']['id']==8780468043
          e=dict(status='deleting',message_id=854,chat_id=-1004342917488,owner_quote='удали первый отчет по РК из ТГ чтоб не было путаницы',archive_receipt=old,archive_source='china_agent:advertising_artifacts:2026-11-11:v2',kept_message_ids=[855,856],wb_writes=0,started_at=datetime.now(timezone.utc).isoformat())
          assert io.create(K,e)
          try:
           r=requests.post(url+'deleteMessage',json={'chat_id':-1004342917488,'message_id':854},timeout=40)
           j=r.json();assert r.ok and j.get('ok')is True and j.get('result')is True
           e.update(status='deleted_verified',telegram_response={'ok':True,'result':True},completed_at=datetime.now(timezone.utc).isoformat());io.put(K,e)
          except Exception:
           e['status']='uncertain';io.put(K,e);raise
          print('Deleted854;kept855and856;WB0')
          PY

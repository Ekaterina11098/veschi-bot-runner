name: Owner add two search placements
on:
  push:
    branches: [main]
    paths: ['scripts/china_add_search669622_29.py','.github/workflows/china-add-search669622-29.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: china-add-search669622-29
  cancel-in-progress: false
jobs:
  apply:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Owner scoped second CPM operation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          ADD_STAGE: apply
        run: PYTHONPATH=scripts python scripts/china_add_search669622_29.py

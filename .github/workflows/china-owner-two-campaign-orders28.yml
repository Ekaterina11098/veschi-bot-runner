name: Owner two campaign all-source orders28
on:
  push:
    paths: ['ops/china-owner-two-campaign-orders28.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owner-china-two-campaign-orders28
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - run: python -m py_compile scripts/china_owner_two_campaign_orders28.py
      - name: Read exact campaign SKU orders and sales
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: python scripts/china_owner_two_campaign_orders28.py

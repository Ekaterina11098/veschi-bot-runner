                  cur.execute("select schemaname,tablename from pg_tables where schemaname not in ('pg_catalog','information_schema') order by 1,2")
                  tables=cur.fetchall()
                  for schema,table in tables:
                      name=schema+'.'+table
                      with conn.cursor(name='point_hash_'+str(len(receipt['tables']))) as hash_cursor:
                          hash_cursor.itersize=25
                          hash_cursor.execute(sql.SQL("select encode(sha256(convert_to(to_jsonb(t)::text,'UTF8')),'hex') from {}.{} t").format(sql.Identifier(schema),sql.Identifier(table)))
                          current=[r[0] for r in hash_cursor]
                      aggregate=hashlib.sha256(('\n'.join(sorted(current))).encode()).hexdigest()
                      old=baseline.get(table) if schema=='public' else None
                      if old and 'row_hashes' not in old:
                          assert len(current)==old['count'] and aggregate==old['sha256'],'Previously matching small table changed; preserve originals and diagnose selective delta'
                          known=set(current)
                      else:known=reuse.get(name,set())
                      missing=set(current)-known
                      receipt['tables'][name]={'count':len(current),'row_hashes':current,'reused':len(current)-sum(h in missing for h in current),'delta_rows':sum(h in missing for h in current)}
                      if not missing:continue
                      with conn.cursor(name='point_rows_'+str(len(receipt['tables']))) as stream:
                          stream.itersize=1
                          query=sql.SQL("select row_to_json(t)::text from {}.{} t where encode(sha256(convert_to(to_jsonb(t)::text,'UTF8')),'hex')=any(%s)").format(sql.Identifier(schema),sql.Identifier(table))
                          stream.execute(query,(list(missing),))
                          got=collections.Counter()
                          for (raw,) in stream:
                              if receipt['source_payload_bytes']>=2_000_000_000 or time.monotonic()-start>=4800 or shutil.disk_usage(root).free<4_000_000_000:raise RuntimeError('Maintenance budget stop')
                              if passbytes>=100_000_000:
                                  assert receipt['passes']<20
                                  receipt['passes']+=1;passbytes=0
                              n=len(raw.encode());receipt['source_payload_bytes']+=n;passbytes+=n
                              row=simplejson.loads(raw,use_decimal=True);h=rowhash(row)
                              assert h in missing
                              got[h]+=1
                              delta.record(name,h+':'+str(got[h]),row);delta.db.commit()
                          assert got==collections.Counter(h for h in current if h in missing)
                  cur.execute('select rolname,rolsuper,rolinherit,rolcreaterole,rolcreatedb,rolcanlogin,rolreplication,rolbypassrls,rolconnlimit from pg_roles order by rolname')
                  receipt['role_flags_without_passwords']=cur.fetchall()
                  cur.execute('select schemaname,sequencename from pg_sequences order by 1,2')
                  receipt['sequences']={}
                  for schema,name in cur.fetchall():
                      cur.execute(sql.SQL('select last_value,is_called from {}.{}').format(sql.Identifier(schema),sql.Identifier(name)))
                      receipt['sequences'][schema+'.'+name]=cur.fetchone()
                  schema_file=root/'point-schema.sql'
                  args=['docker','run','--rm']
                  for name in ('PGHOST','PGPORT','PGDATABASE','PGUSER','PGPASSWORD','PGSSLMODE','PGOPTIONS'):args+=['-e',name]
                  args += [image,'pg_dump','--schema-only','--snapshot='+snapshot,'--lock-wait-timeout=5000','--no-password']
                  with open(schema_file,'wb') as output,open(root/'point-private.log','ab') as log:
                      result=subprocess.run(args,stdout=output,stderr=log,timeout=1200)
                  assert result.returncode==0,'Same-snapshot schema dump failed'
              conn.rollback()
          receipt['same_snapshot_materialized']=True
          delta.set_state('consistent_point_receipt',receipt);delta.db.commit();delta.db.close()
          receipt_file=root/'point-receipt.json';receipt_file.write_text(json.dumps(receipt,sort_keys=True))
          summary={'point_utc':receipt['point_utc'],'same_snapshot_materialized':True,'full_database_backup':False,'actual_isolated_restore':False,'tables':{k:{f:v[f] for f in ('count','reused','delta_rows')} for k,v in receipt['tables'].items()},'source_payload_bytes':receipt['source_payload_bytes'],'passes':receipt['passes'],'production_writes':0,'components':{}}
          for path in (delta_plain,schema_file,receipt_file):
              target=out/(path.name+'.aes')
              hashes=seal(path,target,os.environ['RECOVERY_PUBLIC_KEY'],os.environ['SUPABASE_SECRET_KEY'])
              check=root/(path.name+'.readback')
              assert restore(target,check,secret=os.environ['SUPABASE_SECRET_KEY'])==hashes['plaintext_sha256']
              summary['components'][path.name]={**hashes,'ciphertext_bytes':target.stat().st_size}
              check.unlink();path.unlink()
          summary['elapsed_seconds']=round(time.monotonic()-start,3)
          (out/'summary.json').write_text(json.dumps(summary,sort_keys=True))
          print(json.dumps(summary,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-consistent-point
          path: ${{ runner.temp }}/schema-sealed
          retention-days: 7
          if-no-files-found: error

name: Content group dialog and connection verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['content_group_dialog.py', '.github/workflows/content-group-dialog.yml']
  schedule:
    - cron: '4-59/5 * * * *'
permissions:
  contents: read
concurrency:
  group: content-group-dialog
  cancel-in-progress: false
jobs:
  dialog:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 18649db15489c3dc77edc22bec5a4ddc5ed6a410
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'psycopg[binary]==3.2.10' requests==2.32.5 python-dotenv==1.1.1 openai==1.109.1 cryptography==46.0.2
      - name: Verify destination and answer only this group's questions
        env:
          PYTHONPATH: ${{ github.workspace }}/private-source
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python content_group_dialog.py

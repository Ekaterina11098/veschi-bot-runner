name: Morning growth regression31
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-growth31-checks.yml']
permissions: {contents: read}
jobs:
  checks:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Verify morning growth and duplicate funding guard31'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Offline full advertising regression including Pavel duplicate confirmation
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_china_advertising_*.py'

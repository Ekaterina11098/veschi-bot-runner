name: Read three Cristine card identities
on:
  push:
    branches: [madison-fill-20261105]
    paths: ['.github/workflows/cristine-preflight-20261105.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Resolve existing Cristine variants and reference values
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os,json,time,urllib.request,urllib.error,datetime
          ARTICLES=['025-MadisonBag-zblack','026-MadisonBag-zcoffee','027-MadisonBag-zdarkred']
          def request(url,body=None,method=None,headers=None):
              h=headers if headers is not None else {'Authorization':os.environ['WB_TOKEN_3'],'Content-Type':'application/json'}
              req=urllib.request.Request(url,headers=h,data=None if body is None else json.dumps(body).encode(),method=method or ('POST' if body is not None else 'GET'))
              with urllib.request.urlopen(req,timeout=45) as f:
                  raw=f.read()
                  return json.loads(raw) if raw else None
          def save(key,payload):
              now=datetime.datetime.now(datetime.timezone.utc);k=os.environ['SUPABASE_SECRET_KEY'];h={'apikey':k,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'}
              if not k.startswith('sb_secret_'):h['Authorization']='Bearer '+k
              return request(os.environ['SUPABASE_URL'].rstrip('/')+'/rest/v1/telegram_api_cache?on_conflict=cache_key',{'cache_key':key,'payload':payload,'updated_at':now.isoformat(),'expires_at':(now+datetime.timedelta(days=365)).isoformat()},headers=h)
          
          out={'status':'reading','cards':[],'wb_writes':0}
          wanted={'30-cristinebag-zblack','31-cristinebag-zcoffee','32-cristinebag-zgrey'}
          def norm(s):return s.lower().lstrip('0')
          try:
              found={};cursor={'limit':100}
              for page in range(6):
                  d=request('https://content-api.wildberries.ru/content/v2/get/cards/list',{'settings':{'sort':{'ascending':False},'cursor':cursor,'filter':{'withPhoto':-1}}})
                  for c in d.get('cards',[]):
                      n=norm(c.get('vendorCode',''))
                      if n in wanted:
                          if n in found and found[n]['nmID']!=c['nmID']:raise RuntimeError('Duplicate article identity')
                          found[n]=c
                  if len(found)==3:break
                  cur=d.get('cursor',{})
                  if cur.get('total',0)<100:break
                  cursor={k:cur[k] for k in ['updatedAt','nmID']};cursor['limit']=100;time.sleep(1)
              out['cards']=list(found.values())
              if set(found)!=wanted:raise RuntimeError('Missing exact Cristine variants')
              out['colors']=request('https://content-api.wildberries.ru/content/v2/directory/colors?locale=ru')
              out['schema']=request('https://content-api.wildberries.ru/content/v2/object/charcs/50')
              out['tnved']=request('https://content-api.wildberries.ru/content/v2/directory/tnved?subjectID=50&search=4202210000&locale=ru')
              out['status']='received'
          except Exception as e:out.update(status='error',error=str(e))
          save('cristine_fill:china:20261105:preflight:v1',out)
          print('Read-only Cristine preflight saved privately.')
          
          PY

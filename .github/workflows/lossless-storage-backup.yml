name: Owner encrypted lossless storage recovery backup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lossless-storage-backup.yml']
  workflow_dispatch:
    inputs:
      authorized_backup:
        description: 'Only after confirmed restoration of database access'
        type: boolean
        default: false
        required: true
      source_recovery_confirmed:
        description: 'Provider restored maintenance access; does not bypass Retry-After'
        type: boolean
        default: false
        required: true
      resume_run_id:
        description: 'Run containing a verified encrypted original checkpoint; empty starts new backup'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: veshi-storage-maintenance
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 2c4c5b9361171551b0c7c54cdb70f2b8357c1870
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv simplejson cryptography > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Test exact restoration, deduplication, owner key and corruption rejection
        env:
          TASK: storage-archive-tests
        run: |
          python - <<'PY'
          import run_private
          run_private.execute('Lossless archive and authenticated owner/worker decryption',['-m','unittest','discover','-s','tests','-p','test_storage*.py'])
          run_private.execute('Reader cache regression',['-m','unittest','discover','-s','tests','-p','test_snapshot_reads.py'])
          run_private.execute('Existing notification lifecycle regression',['-m','unittest','discover','-s','tests','-p','test_ip_daily_recommendations.py'])
          run_private.execute('Existing business data readers regression',['-m','unittest','discover','-s','tests','-p','test_business_agents.py'])
          run_private.execute('Existing advertising dashboard regression',['-m','unittest','discover','-s','tests','-p','test_advertising_dashboard.py'])
          run_private.execute('Existing price watch notification regression',['-m','unittest','discover','-s','tests','-p','test_price_watch_notifications.py'])
          run_private.execute('Existing experiment notification regression',['-m','unittest','discover','-s','tests','-p','test_advertising_notifications.py'])
          run_private.execute('Economics regression',['-m','unittest','discover','-s','tests','-p','test_sku_economics.py'])
          run_private.execute('Compile guarded recovery modules',['-m','py_compile','analytics/storage_recovery_prepare.py','analytics/storage_archive.py','analytics/storage_read_guard.py','analytics/storage_compatibility.py','analytics/r2_archive.py','analytics/storage_working_reader.py','analytics/storage_budget.py'])
          PY
      - name: Download owner-encrypted resume checkpoint only after restoration confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.authorized_backup && inputs.source_recovery_confirmed && inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: owner-encrypted-storage-backup
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/veschi-recovery-resume
      - name: Read-only complete backup and measured content-addressed plan
        if: github.event_name == 'workflow_dispatch' && inputs.authorized_backup && inputs.source_recovery_confirmed
        env:
          TASK: storage-readonly-backup
          RECOVERY_FULL_BACKUP_AUTHORIZED: 'true'
          RECOVERY_SOURCE_RECOVERY_CONFIRMED: 'true'
          RECOVERY_MAX_RESPONSE_BYTES: '100000000'
          REQUESTED_RESUME_RUN: ${{ inputs.resume_run_id }}
          RECOVERY_RESUME_DIRECTORY: ${{ runner.temp }}/veschi-recovery-resume
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RECOVERY_WORK: ${{ runner.temp }}/veschi-recovery-private
          RECOVERY_OUTPUT: ${{ runner.temp }}/veschi-recovery-sealed
          RECOVERY_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAst6VhelAueCkrgeGYeMm
            BBn16lRh8KaLjidOXiKiAtzBSRvtvGpcz4JsdOtfs4zi0CHAcs60iD4Kdh+UlJMm
            0z8ekieLrY4DWqmuXyRH63TYGQyqOS+O5gtHpEXo6aHZSW6IooPJC2/rI5NtAVFr
            TV76dCAE+8cQXQGKUerWcRQ1Amb4s5gWcDzg81R9VwhDJgDyttlrlvkmY5BWWjqy
            VCJnrMPgwKVDaoh5KMAHH+O5AZJuGOrjC1exbJ4N7UkglOgGvWGllIeaRNttuPSV
            Lmn5epyhasMfeVXyYaVqgoQcDfIexkTWgESr8+xPk663tr5OTbbfYEkWKordC7AD
            yUe9aT73GMnk0rXwCZzGKpw3rOukkHn40CUJPK7NLmSwE5RwSCuyxHpF+WutDzl6
            6ZCXZhgzYh9brD/hvbB6q7xoPxweqfD+71ONlf8WC1S3dWDo8sCKGWToqLncFce8
            eAI8KPT+ymfjEqA3/sGKw1z/FkKvcuCMZpfHlTBFbdJjAgMBAAE=
            -----END PUBLIC KEY-----
        run: |
          python - <<'PY'
          import subprocess,tempfile,sys,os
          from pathlib import Path
          if os.environ.get('REQUESTED_RESUME_RUN'):
              candidates=[Path(os.environ['RECOVERY_RESUME_DIRECTORY'])/name for name in ('original.partial.sqlite.aes','original.sqlite.aes')]
              selected=next((p for p in candidates if p.exists()),None)
              if selected is None:raise RuntimeError('No encrypted checkpoint; source reads not started')
              os.environ['RECOVERY_RESUME_FILE']=str(selected)
          with tempfile.TemporaryFile() as private_log:
              result=subprocess.run([sys.executable,'-m','analytics.storage_recovery_prepare'],
                  cwd='private-source',stdout=private_log,stderr=subprocess.STDOUT)
          if result.returncode:
              print('Backup failed; only sanitized summaries and encrypted partial copies retained.')
              raise SystemExit(result.returncode)
          PY
      - name: Safe numeric backup status
        if: always()
        run: |
          for name in resource-summary failure-summary partial-summary; do
            if [ -f "$RUNNER_TEMP/veschi-recovery-sealed/$name.json" ]; then cat "$RUNNER_TEMP/veschi-recovery-sealed/$name.json"; fi
          done
      - name: Retain only encrypted backups and technical resource summary
        if: always() && github.event_name == 'workflow_dispatch' && inputs.authorized_backup && inputs.source_recovery_confirmed
        uses: actions/upload-artifact@v4
        with:
          name: owner-encrypted-storage-backup
          path: |
            ${{ runner.temp }}/veschi-recovery-sealed/*.sqlite.aes
            ${{ runner.temp }}/veschi-recovery-sealed/resource-summary.json
            ${{ runner.temp }}/veschi-recovery-sealed/failure-summary.json
            ${{ runner.temp }}/veschi-recovery-sealed/partial-summary.json
          if-no-files-found: error
          retention-days: 90

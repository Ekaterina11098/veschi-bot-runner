name: Owner agent — live three-cabinet and context acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['owner_agent/acceptance-request.json']
permissions: {contents: read}
concurrency:
  group: owner-agent-acceptance
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --test owner_agent/test.mjs
      - name: Real model, real saved data, independent private SQL fixtures; no Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OWNER_AI_MODEL: ${{ vars.OWNER_AI_MODEL || 'gpt-4.1-mini' }}
        run: node owner_agent/acceptance.mjs

name: Issue 10 current IP search evidence after catalog completion
on:
  push:
    branches: [main]
    paths: ['.github/workflows/issue-10-stage-one.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 06609d26fa61329465b64ddb019f73792d60fa26
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv aiogram apscheduler pillow > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Read exact current-period MPStats query gaps
        env:
          TASK: ip-current-query-sources
          IP_RECOVERY_MODE: queries
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          script="from analytics.ip_financial_period_recovery import run\nfor batch in range(12):\n    if not run():break"
          run_private.execute('Only missing current IP paid-pair query scopes; reuse terminal results',['-c',script])
          PY
      - name: WB only for demonstrated remaining MPStats gaps
        env:
          TASK: ip-current-query-gap-batches
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          script="import time\nfrom analytics.ip_query_gap_batches import run\nfor batch in range(3):\n    if not run():break\n    time.sleep(7)"
          run_private.execute('Exact paid pairs only; max100 per request; shared cooldown',['-c',script])
          PY
      - name: Render both periods from saved evidence
        env:
          TASK: ip-completed-investigations
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          script="import os\nfrom analytics.ip_completed_investigations import run\nos.environ['IP_REVIEW_ID']='11059'\nrun()\nos.environ.pop('IP_REVIEW_ID')\nrun()"
          run_private.execute('Both completed periods; no finance retry, WB changes or Telegram',['-c',script])
          PY

name: Advertising dialogue existing connection preflight
on:
  push:
    branches: [advertising-chat-readonly-20261017]
    paths: ['.github/workflows/advertising-chat-preflight.yml']
permissions: {contents: write}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 8d28c9f2719815086ee8da3d46e8adf3c0216b52
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r private-source/requirements.txt cryptography==46.0.2 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - run: python advertising_chat_preflight_20261017.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ADVERTISING_TELEGRAM_BOT_TOKEN: ${{ secrets.ADVERTISING_TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADVERTISING_AI_MODEL: ${{ vars.ADVERTISING_AI_MODEL || 'gpt-4o-mini' }}
      - name: Preserve owner-only encrypted preflight
        if: always()
        run: |
          mkdir -p recovery-output/advertising
          cp "$RUNNER_TEMP"/stock-deploy-proof/advertising-chat-preflight.aes.json "recovery-output/advertising/chat-preflight-${{ github.run_id }}.aes.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-output/advertising/chat-preflight-*.aes.json
          git diff --cached --quiet || git commit -m "Preserve encrypted chat preflight"
          git push origin HEAD:advertising-chat-readonly-20261017

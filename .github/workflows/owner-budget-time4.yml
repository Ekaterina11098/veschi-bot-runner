name: Owner show fresh balance timestamp in existing budget PNG
on:
  push:
    paths: ['.github/workflows/owner-budget-time4.yml']
permissions:
  contents: read
concurrency:
  group: china-owner-budget-time4
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Bounded fresh growth economics; no model or Telegram credentials
        env:
          WB_TOKEN_3: disabled
          MOYSKLAD_API_TOKEN: disabled
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import base64,copy,hashlib,json,requests
          from datetime import datetime,timezone
          from china_advertising_state import AdvertisingIO
          from china_advertising_v2_png import render
          ROOT='china_agent:owner_budget_ready_recommendations:2026-11-04:v1';ART='china_agent:advertising_artifacts:2026-11-04:v2';DEL='china_agent:advertising_delivery:2026-11-04:v1'
          io=AdvertisingIO();old=io.get(ART);delivery=io.get(DEL);step=io.get(ROOT+':delivery')
          if step.get('receipt',{}).get('message_id')!=671:raise ValueError('No confirmed prior edit; no repeat')
          if io.get(ROOT+':timestamp_edit'):raise ValueError('Never repeat timestamp edit')
          b=copy.deepcopy(old['bundle']);ids={40945502,41155909,41270309,41296363};b['campaigns']=[c for c in b['campaigns']if c['id']in ids]
          b['budget_balance_observed_at']='04.11.2026 08:35 МСК'
          b['budget_observed_at']=b['budget_balance_observed_at_iso']='2026-11-04T05:35:14.778749+00:00'
          f=next(f for f in render(b)if f['family']=='budgets')
          file=next(f for f in old['files']if f['family']=='budgets');sha=hashlib.sha256(f['bytes']).hexdigest()
          if len(f['actions'])!=3:raise ValueError('Plan scope changed')
          j=dict(status='editing',previous_sha=step['sha256'],sha256=sha,wb_writes=0)
          if not io.create(ROOT+':timestamp_edit',j):raise ValueError('Concurrent edit')
          media=json.dumps(dict(type='photo',media='attach://photo',caption=step['receipt']['caption']),ensure_ascii=False)
          r=requests.post('https://api.telegram.org/bot'+io.bot+'/editMessageMedia',data=dict(chat_id=-1004342917488,message_id=671,media=media),files={'photo':('budget-ready4-time.png',f['bytes'],'image/png')},timeout=60);v=r.json()
          if not r.ok or not v.get('ok'):raise RuntimeError('Timestamp edit uncertain; never repeat')
          receipt=v['result']
          if receipt.get('message_id')!=671 or receipt['chat']['id']!=-1004342917488 or receipt['from']['id']!=8780468043:raise ValueError('Receipt mismatch')
          at=datetime.now(timezone.utc).isoformat();file['b64']=base64.b64encode(f['bytes']).decode();old['bundle'].update({k:b[k]for k in ['budget_observed_at','budget_balance_observed_at_iso','budget_balance_observed_at']});io.put(ART,json.loads(json.dumps(old)))
          part=next(p for p in delivery['parts']if p['message_id']==671);part.update(sha256=sha,receipt=receipt,edited_at=at);io.put(DEL,json.loads(json.dumps(delivery)))
          step.update(status='edited_verified',sha256=sha,receipt=receipt,verified_at=at,reconciled_reason='Prior State readback mismatch was JSON integer-key normalization; artifact, plan, binding and receipt confirmed. No funding or repeat execution.')
          io.put(ROOT+':delivery',json.loads(json.dumps(step)))
          j.update(status='edited_verified',receipt=receipt,verified_at=at);io.put(ROOT+':timestamp_edit',j)
          print('Verified original671 updated with fresh balance timestamp; no WB writes')
          
          PY

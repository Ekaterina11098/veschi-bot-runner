name: Issue 10 advertised stock verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/issue-10-ad-stock.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue-10-stock-read-only
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 8a48dbaec2f137f334d9981315cadd020cab16bb
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv aiogram apscheduler pillow streamlit openai > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Test stock availability and execution lifecycle before rollout
        env:
          TASK: issue-10-stock-tests
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          for pattern in ('test_stock_availability.py','test_price_finance_period_cache.py'):
              run_private.execute('Validate stock and scoped finance '+pattern,['-m','unittest','discover','-s','tests','-p',pattern])
          print('Stock/movement/lifecycle and finance period cache tests passed.')
          PY
      - name: Pilot exact Raye SKU before all-active campaign rollout
        env:
          TASK: issue-10-stock-pilot
          STOCK_NOTIFY: 'false'
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          run_private.execute('Pilot Raye stock and movement',['-m','advertising_agent.run_stock_availability','--target'])
          script="""
          import os,sys
          from advertising_agent.run_stock_availability import read,SOURCE,store_cache,cache
          rows=read('analytics_snapshots',dict(source='eq.'+SOURCE,cabinet='eq.token_2',select='payload',order='id.desc',limit=1)) or []
          report=rows[0]['payload'][0] if rows else {}
          passed=report.get('stock_checks_complete') and report.get('campaign_scope_complete')
          gate_key='advertising:stock_pilot_gate:token_2:v2'
          if passed:store_cache(gate_key,dict(passed=True,nm_id=432727735,campaign_id=40428689,observed_at=report.get('observed_at')))
          if not passed and not (cache(gate_key) or {}).get('passed'):
              print('Pilot source evidence pending; initial rollout waits for verified inventory.')
              if os.environ.get('STOCK_NOTIFY')=='true':
                  from advertising_agent.run_stock_availability import main
                  sys.argv=['stock','--target','--notify']
                  main()
          else:
              from advertising_agent.run_stock_availability import main
              sys.argv=['stock']+(['--notify'] if os.environ.get('STOCK_NOTIFY')=='true' else [])
              main()
          """
          run_private.execute('Roll out only after actual pilot sources pass',['-c',script])
          print('Protected stock pilot/coverage saved. No WB writes or Telegram.')
          PY
      - name: Validate and recover due IP experiment history gap
        env:
          TASK: issue-10-ip-experiment-history
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          run_private.execute('Validate source gap gate',['-m','unittest','discover','-s','tests','-p','test_ip_history_gap.py'])
          run_private.execute('Bounded missing IP history read',['-m','analytics.ip_experiment_history_gap'])
          run_private.execute('Refresh due checkpoints from saved history',['-m','advertising_agent.experiments'])
          run_private.execute('Refresh protected IP acceptance',['-m','analytics.ip_campaign_audit'])
          print('Protected checkpoint diagnostics saved; no WB writes or Telegram.')
          PY

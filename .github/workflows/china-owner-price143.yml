name: Owner confirmed143 price429CNY
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-owner-price143.yml']
permissions:
  contents: read
concurrency:
  group: china-confirmed-wb-price-writes
  cancel-in-progress: false
jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 > /tmp/dependencies.log 2>&1
      - run: python -m py_compile scripts/china_owner_price143.py
      - run: python scripts/china_owner_price143.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}

name: Owner exact reply to Pavel289 no WB
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-reply289-20261110.yml']
permissions:
  contents: read
concurrency:
  group: owner-reply289-20261110
  cancel-in-progress: false
jobs:
  reply-once:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send exact owner-approved reply using native receipt key
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,datetime
          ROOT="china_agent:owner_reply289:2026-11-10:v1"
          RECEIPT="china_agent:conversion_watch_delivery:v1:codex_bridge:289:0"
          URL=os.environ["SUPABASE_URL"].rstrip("/")
          KEY=os.environ["SUPABASE_SECRET_KEY"]
          TOKEN=os.environ["CHINA_TELEGRAM_BOT_TOKEN"]
          def stamp():return datetime.datetime.now(datetime.timezone.utc).isoformat()
          def db(method,path,body=None,prefer=None):
           h={"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"}
           if prefer:h["Prefer"]=prefer
           with urllib.request.urlopen(urllib.request.Request(URL+"/rest/v1/"+path,data=json.dumps(body).encode() if body is not None else None,headers=h,method=method),timeout=40) as r:
            data=r.read()
            return json.loads(data) if data else None
          def get(k):
           rows=db("GET","telegram_api_cache?cache_key=eq."+k+"&select=payload")
           return rows[0]["payload"] if rows else None
          def put(k,p):
           db("POST","telegram_api_cache?on_conflict=cache_key",dict(cache_key=k,payload=p,updated_at=stamp(),expires_at="2036-11-10T00:00:00Z"),"resolution=merge-duplicates,return=minimal")
          a=get(ROOT+":authorization")
          assert a and a["status"]=="owner_approved" and a["author_id"]==5122667182 and a["chat_id"]==-1004342917488 and a["reply_message_id"]==841 and a["job_id"]==289
          execution=get(a["execution_receipt"])
          assert execution["status"]=="verified" and {r["nm_id"]for r in execution["after"]["nm_settings"]}=={1473243908,1473244355}
          jobs=db("GET","business_agent_jobs?id=eq.289&select=chat_id,sender_id,tool_trace")
          assert len(jobs)==1 and jobs[0]["chat_id"]==a["chat_id"] and jobs[0]["sender_id"]==307200273
          marker=next(t for t in jobs[0]["tool_trace"]if t.get("name")=="china_saved_question")
          assert marker["message_id"]==841
          old=get(RECEIPT)
          if old:
           assert old["status"]=="sent" and old.get("message_id"),"Existing delivery not confirmed; no replay"
           print(json.dumps(dict(status="already_sent",message_id=old["message_id"])));raise SystemExit()
          me=json.load(urllib.request.urlopen("https://api.telegram.org/bot"+TOKEN+"/getMe",timeout=30))
          assert me["ok"] and me["result"]["id"]==8780468043
          p=dict(status="sending",chat_id=a["chat_id"],job_id=289,text=a["text"],reply_message_id=841,started_at=stamp())
          db("POST","telegram_api_cache",dict(cache_key=RECEIPT,payload=p,updated_at=stamp(),expires_at="2036-11-10T00:00:00Z"),"return=representation")
          try:
           body=dict(chat_id=a["chat_id"],text=a["text"],reply_parameters=dict(message_id=841,allow_sending_without_reply=False))
           req=urllib.request.Request("https://api.telegram.org/bot"+TOKEN+"/sendMessage",data=json.dumps(body).encode(),headers={"Content-Type":"application/json"},method="POST")
           result=json.load(urllib.request.urlopen(req,timeout=45))
           assert result["ok"] and result["result"]["chat"]["id"]==a["chat_id"]
           p.update(status="sent",message_id=result["result"]["message_id"],receipt=result["result"],sent_at=stamp())
           put(RECEIPT,p)
          except Exception:
           p.update(status="uncertain",error="Send or receipt persistence uncertain");put(RECEIPT,p)
           raise RuntimeError("Uncertain; do not replay") from None
          put("china_agent:owner_dialog_resolution:v1:job:289",dict(status="answered_by_owner",job_id=289,chat_id=a["chat_id"],message_id=p["message_id"],receipt_key=RECEIPT,answer=a["text"],resolved_at=stamp(),source_channel="codex",wb_writes=0))
          put(ROOT+":delivery",p)
          print(json.dumps(dict(status="sent",message_id=p["message_id"],reply_message_id=841)))
          
          PY

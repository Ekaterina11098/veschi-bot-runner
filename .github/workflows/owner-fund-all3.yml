name: Owner bounded funding 3Nov
on:
  push:
    branches: [main]
    paths: ['owner-fund-all3-request.json']
permissions:
  contents: read
concurrency:
  group: china-owner-fund-all3
  cancel-in-progress: false
jobs:
  fund:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch only pinned funding code
        run: |
          mkdir -p scripts
          curl --fail --location --retry 2 --max-time 60 https://raw.githubusercontent.com/Ekaterina11098/veschi-bot-runner/3e274a5b76ce819e33ad4983f366560da390d250/scripts/owner_fund_all3.py -o scripts/owner_fund_all3.py
          curl --fail --location --retry 2 --max-time 60 https://raw.githubusercontent.com/Ekaterina11098/veschi-bot-runner/3e274a5b76ce819e33ad4983f366560da390d250/scripts/china_cloud_cost_control.py -o scripts/china_cloud_cost_control.py
      - run: python -m pip install requests==2.32.5
      - name: Owner-authorized deposits only with durable readback
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          PYTHONPATH: scripts
        run: python -u scripts/owner_fund_all3.py

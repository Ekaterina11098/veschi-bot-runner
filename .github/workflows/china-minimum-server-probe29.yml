name: WB minimum server profile configuration probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Verify replay and timeout guards offline
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_china_minimum_server_transport29.py'
      - name: Check server API access without opening or changing WB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: PYTHONPATH=scripts python scripts/china_minimum_server_probe29.py
      - name: Verify saved WB identity and one price row from server only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: PYTHONPATH=scripts python scripts/china_minimum_server_wb_read29.py

name: Cancelled owner returns extra 5Nov - audit only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Owner cancellation record
        run: echo 'Cancelled by owner on 2026-11-05 after manual stock changes. No collection, redistribution, resume or notifications. Regular 05:00 and 20:00 MSK unchanged.'

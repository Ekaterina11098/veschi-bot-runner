name: Switch own read-only stock preview22Oct
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stock-preview-switch-20261022.yml']
permissions:
  contents: read
  actions: write
jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only superseded owner read-only preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          base='https://api.github.com/repos/Ekaterina11098/veschi-bot-runner/actions/runs/39731711843'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          with urllib.request.urlopen(urllib.request.Request(base,headers=headers)) as r: run=json.load(r)
          assert run['path']=='.github/workflows/stock-pending-reserve-preview-20261022.yml'
          assert run['head_sha']=='3f3f4103bc592b16d21394b5e151f009b8217727'
          assert run['event']=='push'
          if run['status'] in ('in_progress','queued','pending','waiting'):
              req=urllib.request.Request(base+'/cancel',headers=headers,data=b'',method='POST')
              with urllib.request.urlopen(req) as r: assert r.status==202
              print(json.dumps({'run':39731711843,'cancel_requested':True,'scope':'superseded no-write preview only'}))
          else: print(json.dumps({'run':39731711843,'already_finished':True}))
          PY

name: Loss product matching audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/loss-ip-20261103-matching.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loss-ip-20261103
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Read only private preflight
        shell: python
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import sys,collections
          sys.path.insert(0,'scripts')
          import fbs_document_chain as m
          ROOT='loss_report:ip:20261103:'
          class Read(m.Transport):
           def request(self,base,path,method='GET',body=None,params=None):
            if base==m.MS and method!='GET':raise m.Stop('Read only')
            return super().request(base,path,method,body,params)
          t=Read();db=m.Cache(t);w=m.Worker(t,db,{})
          prep=db.get(ROOT+'preflight:v1');inp=db.get(ROOT+'input:v1')
          allp=[]
          for archived in ('false','true'):allp+=w.ms_rows('entity/product',{'filter':'archived='+archived})
          out=[]
          for e in prep['matching_exceptions']:
           a=e['article'];candidates=[]
           for p in allp:
            pa=(p.get('article') or '').strip().casefold()
            if pa==a or (a in ('139-allabag-beige-','28-fabiabag-black_restored_901e36') and pa.startswith(a.split('_restored_')[0].rstrip('-'))) or ('belts' in a and (pa.replace('-','')==a.replace('-','') or p.get('name','').casefold().find(a.split('-')[0])>=0)):
             candidates.append(p)
           out.append({'source_article':a,'source_quantity':inp['sales'][a],'candidates':candidates})
          db.put(ROOT+'matching_audit:v1',{'at':m.now(),'matches':out});print('Private matching audit saved; no documents changed.')
          

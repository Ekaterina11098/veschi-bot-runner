name: Verify daily source repair and preserve prior diagnostic ciphertext
on:
  push:
    branches: [prepare-daily-source-repair-20261017]
    paths: ['.github/workflows/advertising-daily-cache-diagnostic.yml']
permissions: {contents: write}
concurrency:
  group: advertising-retained-cache-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 6eb5f990aecfa1a92909169ffd76f05ac6da469d
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install simplejson==3.20.2 requests==2.32.5 python-dotenv cryptography==46.0.2 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Compile prepared repair only, no production credentials
        run: python -m py_compile advertising_source_owner.py
      - name: Preserve previous GET-only diagnostic cipher, no source replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/Ekaterina11098/veschi-bot-runner/actions/artifacts/12093317899/zip --output "$RUNNER_TEMP/prior-diagnostic.zip"
          mkdir -p "$RUNNER_TEMP/prior-diagnostic" recovery-output/advertising
          unzip -q "$RUNNER_TEMP/prior-diagnostic.zip" -d "$RUNNER_TEMP/prior-diagnostic"
          cp "$RUNNER_TEMP/prior-diagnostic/daily-cache-diagnostic.aes.json" recovery-output/advertising/daily-cache-diagnostic-39013476298.aes.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-output/advertising/daily-cache-diagnostic-39013476298.aes.json
          git diff --cached --quiet || git commit -m "Preserve existing diagnostic ciphertext without repeating reads"
          git push origin HEAD:prepare-daily-source-repair-20261017

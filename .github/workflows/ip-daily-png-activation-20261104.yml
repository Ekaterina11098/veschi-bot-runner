name: Verify and deliver approved IP daily PNG format from saved data only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ip-daily-png-activation-20261104.yml']
permissions:
  contents: read
concurrency:
  group: ip-daily-png-delivery-only
  cancel-in-progress: true
jobs:
  retained:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7bbd202222c567f50f166868d1693df6deb07282
          sparse-checkout: |
            advertising_daily_tables_owner.py
            ip_daily_png_contract.py
            advertising_daily_png.py
            advertising_budget_evidence.py
            stock_deploy_support.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 2f798a9509b72030d6fb5ec68fb915c5d216c31b
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 cryptography==46.0.2 Pillow==12.3.0 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Existing delivery stage only; no collectors, WB token or action execution
        run: python advertising_daily_tables_owner.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ADVERTISING_TELEGRAM_BOT_TOKEN: ${{ secrets.ADVERTISING_TELEGRAM_BOT_TOKEN }}
          ADVERTISING_EXECUTION_ENABLED: 'false'

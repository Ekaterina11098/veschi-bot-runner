name: Issue 10 complete cached-source IP working mode acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/issue-10-working-mode-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue10-cached-complete-analysis
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 4de978ca44ec0e7e5349d8137b61b806cc00144b
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv aiogram apscheduler pillow > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Full coverage, scoped sources and decision bridge regression
        env:
          TASK: ip-full-replay-tests
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          for pattern in ('test_ip_working_mode_replay.py','test_profit_stability.py','test_ip_campaign_audit.py','test_ip_sku_complete_review.py','test_ip_completed_investigations.py','test_ip_campaign_reach.py','test_ip_daily_recommendations.py','test_ip_finance_reconciliation.py','test_price_watch_notifications.py','test_price_effect_recovery.py','test_sales_cache.py','test_mpstats*.py'):
              run_private.execute('Every dated SKU retained; qualified findings become actions; safe finance and notifications',['-m','unittest','discover','-s','tests','-p',pattern])
          PY
      - name: Complete path from retained source receipts to fresh proposals for every IP pair
        env:
          TASK: ip-complete-working-mode-replay
          IP_EVENT_START: '2026-09-28'
          IP_EVENT_END: '2026-10-11'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          run_private.execute('Full retained-source analysis; isolated state, external HTTP blocked, no delivery',['-m','analytics.ip_working_mode_replay'])
          PY

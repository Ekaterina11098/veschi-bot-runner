name: Restore requested IP morning report Nov2 missing only
on:
  push:
    branches: [main]
    paths: ['.github/disabled/ip-morning-restore-20261103.never']
permissions:
  contents: read
concurrency:
  group: wb-ip-advertising-agent
  cancel-in-progress: false
jobs:
  restore:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a94c3c02128f7dccaedaf1dcaecb4c9f9ce3d698
          sparse-checkout: |
            ip_morning_recover_20261103.py
            advertising_budget_evidence.py
            advertising_daily_png.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 2f798a9509b72030d6fb5ec68fb915c5d216c31b
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
          sparse-checkout: |
            analytics
            business_agents
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests > "$RUNNER_TEMP/report-dependencies.log" 2>&1
      - name: Recover missing exact-day snapshots and saved report view; no WB token or sending credentials
        run: python ip_morning_recover_20261103.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          SUPABASE_EGRESS_OPTIMIZED: 'true'
          ADVERTISING_EXECUTION_ENABLED: 'false'

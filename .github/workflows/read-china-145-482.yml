name: Read China 145 and 482 card dimensions only
on:
  push:
    branches: [china-read-145-482-20261019]
permissions: {contents: read}
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Read exact China cards without mutations
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,time
          token=os.environ['WB_TOKEN_3']
          for article,nm in [('145-FlorenceBag-black',1900197978),('482-RiginaBag-red',1900202932)]:
              body={'settings':{'cursor':{'limit':100},'filter':{'textSearch':article,'withPhoto':-1}}}
              req=urllib.request.Request('https://content-api.wildberries.ru/content/v2/get/cards/list',data=json.dumps(body).encode(),headers={'Authorization':token,'Content-Type':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=40) as r:data=json.load(r)
              except Exception as e:raise RuntimeError('WB content read failed: '+type(e).__name__) from None
              rows=[c for c in data.get('cards',[]) if c.get('vendorCode')==article and c.get('nmID')==nm]
              if len(rows)!=1:raise RuntimeError('Exact China card not found')
              c=rows[0]
              print(json.dumps(dict(article=article,nm_id=nm,dimensions=c.get('dimensions'),updatedAt=c.get('updatedAt'),observed_at=time.time(),wb_writes=0),ensure_ascii=False))
              time.sleep(1)
          PY

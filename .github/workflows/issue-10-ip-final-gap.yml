name: Issue 10 pilot and remaining IP MPStats search gaps
on:
  push:
    branches: [main]
    paths: ['.github/workflows/issue-10-ip-final-gap.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 5e0a1c45a66c57405fcf780ad2bb9a96828164e2
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv aiogram apscheduler pillow > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Validate recovered evidence and bounded raw lineage
        env:
          TASK: ip-search-gap-recovery
          IP_RECOVERY_MODE: queries
          IP_PERIOD_FROM: '2026-10-04'
          IP_PERIOD_TO: '2026-10-10'
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import run_private
          for pattern in ('test_ip_investigation_sources.py','test_regina_query_gap.py','test_ip_financial_period_recovery.py'):
              run_private.execute('Evidence and safety regression '+pattern,['-m','unittest','discover','-s','tests','-p',pattern])
          script = "from analytics.ip_financial_period_recovery import run\nfor batch in range(4):\n    if not run():break"
          run_private.execute('Bounded exact IP query requests; reuse completed scopes',['-c',script])
          print('Bounded lineage audit and evidence regressions passed; private results saved.')
          PY

name: Apply approved IP bags growth subset Nov4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ip-bags-growth-20261104.yml']
permissions:
  contents: read
concurrency:
  group: wb-ip-advertising-agent
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 90dcd733c9a7d1aaab759690af081c69c0c1941f
          sparse-checkout: |
            ip_bags_growth_20261104.py
            ip_apply_nine_20261103.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify current WB, apply only frozen subset, verify each target
        run: python ip_bags_growth_20261104.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          ADVERTISING_EXECUTION_ENABLED: 'false'

name: Inspect Melanie 641 photos
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: melanie-641-media
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read current characteristics only
        shell: python
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: |
          import os,json,urllib.request
          payload={'settings':{'cursor':{'limit':100},'filter':{'withPhoto':-1,'textSearch':'641-MelanieBag-grey'}}}
          req=urllib.request.Request('https://content-api.wildberries.cn/content/v2/get/cards/list',data=json.dumps(payload).encode(),headers={'Authorization':os.environ['WB_TOKEN_3'],'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=60) as r:b=json.load(r)
          cs=b.get('cards',b.get('data',{}).get('cards',[]));selected=[c for c in cs if c.get('nmID')==1473246047 and c.get('vendorCode')=='641-MelanieBag-grey'];assert len(selected)==1
          c=selected[0];out={k:c.get(k) for k in ['nmID','vendorCode','title','brand','characteristics','dimensions','updatedAt']};out['photoCount']=len(c.get('photos',[]))
          print('CURRENT_CHARACTERISTICS',json.dumps(out,ensure_ascii=False))
          mentions=[]
          for k in ['title','description','brand','characteristics']:
              if 'veschi' in json.dumps(c.get(k),ensure_ascii=False).lower():mentions.append(k)
          print('VESCHI_FIELDS',json.dumps(mentions))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Current characteristics: 641-MelanieBag-grey\n\n')
              f.write('Read-only API inspection; no product writes. Photo count: '+str(len(c.get('photos',[])))+'\n\n')
              f.write('\n'.join('- '+str(x.get('name'))+': '+str(x.get('value')) for x in c.get('characteristics',[])))

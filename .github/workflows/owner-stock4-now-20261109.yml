name: Owner four SKU stock reserve shipment read
on:
  push:
    paths:
      - '.github/workflows/owner-stock4-now-20261109.yml'
permissions:
  contents: read
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  read:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 10ca471ebdc30e8979abeb6286434c51fe218931
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0
      - name: Read exact four SKU inventory and documents
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          """Owner-requested four-SKU read only inventory/document reconciliation."""
          import os,re,time
          from datetime import datetime,timezone
          import requests
          from china_loss_execute import IO
          from china_moysklad_read import BASE,Reader
          from china_morning_readiness import current_prices,published_stock
          KEY='china_agent:owner_stock4_now:2026-11-09:v1'
          SCOPE={1560345288:'37-FurManizhka-dbrown',1473244348:'602-JessicaBag-green',1473243916:'64-NoelBag-zchocolate',1473245494:'143-ReginaBag-black'}
          class Read(Reader):
           def get(self,path,params):
            assert path in ['/entity/store','/entity/product','/report/stock/all','/report/byoperations/stock','/report/byoperations/reserve','/entity/demand'] or re.fullmatch(r'/entity/demand/[0-9a-f-]{36}(/positions)?',path)
            self.read_attempts+=1
            r=requests.get(BASE+path,params=params,headers={'Authorization':'Bearer '+self.token,'Accept-Encoding':'gzip'},timeout=(10,45),allow_redirects=False)
            if not r.ok:raise ValueError('MoySklad HTTP '+str(r.status_code))
            j=r.json()
            if j.get('errors'):raise ValueError('MoySklad API error')
            return j
           def pages(self,path,params):
            rows=[];size=None
            limit=100 if params.get('expand') else 1000
            for offset in range(0,10000,limit):
             j=self.get(path,dict(params,limit=limit,offset=offset));part=j.get('rows');n=j.get('meta',{}).get('size')
             if not isinstance(part,list)or type(n)is not int or size is not None and size!=n:raise ValueError('Read coverage changed')
             size=n;rows+=part
             if len(rows)==size:return rows
             if not part:raise ValueError('Incomplete page')
            raise ValueError('Bounded10000row limit')
          def href(x):return x.get('meta',{}).get('href','').split('?')[0]
          def main():
           assert os.environ['GITHUB_REPOSITORY']=='Ekaterina11098/veschi-bot-runner'and os.environ['GITHUB_REF']=='refs/heads/main'
           io=IO()
           if io.get(KEY):return
           assert io.create(KEY,dict(status='collecting',wb_writes=0,moysklad_writes=0,telegram_calls=0))
           out=dict(status='collecting',rows=[],errors={},wb_writes=0,moysklad_writes=0,telegram_calls=0)
           rd=Read();stores=[s for s in rd.pages('/entity/store',{})if s.get('name')=='МСК'and not s.get('archived')];assert len(stores)==1
           store=href(stores[0]);out['warehouse_id']=stores[0]['id']
           products={}
           for nm,article in SCOPE.items():
            row=dict(nm_id=nm,article=article);out['rows'].append(row)
            try:
             ps=[p for p in rd.pages('/entity/product',{'filter':'article='+article})if p.get('article','').casefold()==article.casefold()];assert len(ps)==1,'Product missing or ambiguous'
             product=href(ps[0]);products[product]=nm;row['product_id']=ps[0]['id']
             ss=rd.pages('/report/stock/all',{'filter':'store='+store+';stockMode=all;quantityMode=all;product='+product})
             ss=[s for s in ss if href(s)==product];assert len(ss)==1,'Stock report missing'
             row['stock']={k:ss[0].get(k)for k in ['stock','reserve','quantity','inTransit']};row['stock']['free']=ss[0]['stock']-ss[0]['reserve'];row['stock_observed_at']=datetime.now(timezone.utc).isoformat()
             for kind in ['stock','reserve']:
              try:
               rs=rd.pages('/report/byoperations/'+kind,{'filter':'assortment='+product})
               row[kind+'_documents']=[dict(moment=x.get('moment'),value=x.get(kind),store_id=href(x.get('store',{})).split('/')[-1],operation=x.get('operation',{}).get('meta',{}))for x in rs]
              except Exception as ex:row[kind+'_documents_error']=str(ex)[:180]
            except Exception as ex:row['error']=str(ex)[:180]
            io.put(KEY,out)
           # Recent demands are bounded by exact warehouse and a7day date window.
           # Filter positions locally and save only the requested four articles, no counterparties.
           try:
            ds=rd.pages('/entity/demand',{'filter':'store='+store+';moment>=2026-11-03 00:00:00','expand':'positions','order':'moment,desc'})
            relevant={nm:[]for nm in SCOPE}
            for d in ds:
             pos=d.get('positions',{});ps=pos.get('rows')
             if not isinstance(ps,list)or len(ps)!=pos.get('meta',{}).get('size'):
              ps=rd.pages('/entity/demand/'+d['id']+'/positions',{})
             for p in ps:
              nm=products.get(href(p.get('assortment',{})))
              if nm:relevant[nm].append(dict(id=d['id'],name=d.get('name'),moment=d.get('moment'),updated=d.get('updated'),applicable=d.get('applicable'),quantity=p.get('quantity'),reserve=p.get('reserve'),customer_order_id=href(d.get('customerOrder',{})).split('/')[-1]))
            for row in out['rows']:row['demands_since_2026_11_03']=relevant[row['nm_id']]
            out['demands_coverage']=dict(complete=True,documents_scanned=len(ds),start_msk='2026-11-03T00:00:00+03:00')
           except Exception as ex:out['errors']['demands']=str(ex)[:180]
           try:
            prices=current_prices(io,list(SCOPE));out['published_stock']=published_stock(io,prices,list(SCOPE))
           except Exception as ex:out['errors']['published_stock']=type(ex).__name__+':'+str(ex)[:120]
           out.update(status='complete'if not out['errors']and all('error'not in r and 'stock_documents_error'not in r and 'reserve_documents_error'not in r for r in out['rows'])else'partial',observed_at=datetime.now(timezone.utc).isoformat(),read_attempts=rd.read_attempts)
           io.put(KEY,out);print('FourSKU private inventory read saved; no marketplace or document mutations')
          if __name__=='__main__':main()
          PY

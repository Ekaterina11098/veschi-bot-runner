name: Isolated MoySklad GET reader
on:
  push:
    branches: [main]
    paths: ['.github/workflows/moysklad-readonly.yml']
  workflow_dispatch:
permissions: {}
concurrency:
  group: moysklad-isolated-readonly
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read only and save privately
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import os,json,re,urllib.request,urllib.error,datetime,sys
          from decimal import Decimal
          MS="https://api.moysklad.ru/api/remap/1.2/"
          SB=os.environ["SUPABASE_URL"].rstrip("/")
          KEY="moysklad_readonly:requested_documents:v1"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs): raise RuntimeError("Redirect blocked")
          opener=urllib.request.build_opener(NoRedirect)
          def call(url,headers,method="GET",body=None):
           req=urllib.request.Request(url,headers=headers,method=method,data=None if body is None else json.dumps(body).encode())
           try:
            with opener.open(req,timeout=60) as r:return json.load(r)
           except urllib.error.HTTPError as e: raise RuntimeError("Remote HTTP "+str(e.code)) from None
          sh={"apikey":os.environ["SUPABASE_SECRET_KEY"],"Authorization":"Bearer "+os.environ["SUPABASE_SECRET_KEY"],"Content-Type":"application/json"}
          mh={"Authorization":"Bearer "+os.environ["MOYSKLAD_API_TOKEN"],"Accept-Encoding":"gzip","Accept":"application/json;charset=utf-8"}
          # urllib does not decompress gzip automatically.
          mh.pop("Accept-Encoding")
          def ms_get(path,method="GET"):
           if method!="GET":raise ValueError("Only GET allowed")
           if not re.fullmatch(r"entity/(customerorder|demand|salesreturn)/[0-9a-f-]{36}(/positions\?limit=1000&offset=[0-9]+)?",path):raise ValueError("Path rejected")
           return call(MS+path,mh,method="GET")
          request=call(SB+"/rest/v1/telegram_api_cache?cache_key=eq.moysklad_readonly:request:v1&select=payload",sh)[0]["payload"]
          docs=request["documents"]
          if not 1<=len(docs)<=10:raise ValueError("Document limit")
          out={"status":"reading","started_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"run_id":os.environ["GITHUB_RUN_ID"],"documents":[]}
          for ref in docs:
           path="entity/"+ref["type"]+"/"+ref["id"]
           d=ms_get(path)
           if d["name"]!=ref["name"]:raise ValueError("Document name mismatch")
           rows=[];offset=0
           while True:
            page=ms_get(path+"/positions?limit=1000&offset="+str(offset))
            rows.extend(page["rows"])
            offset+=len(page["rows"])
            if offset>=page["meta"]["size"]:break
            if not page["rows"] or offset>10000:raise ValueError("Pagination error")
           out["documents"].append({"type":ref["type"],"id":d["id"],"name":d["name"],"read_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"quantity":str(sum(Decimal(str(p["quantity"])) for p in rows)),"position_count":len(rows),"comment":d.get("description",""),"sum_kopecks":d.get("sum"),"posted":d.get("applicable"),"moment":d.get("moment"),"prices_kopecks":sorted(set(str(p["price"]) for p in rows)),"positions":rows,"document":d})
          out["status"]="read_verified"
          out["finished_at"]=datetime.datetime.now(datetime.timezone.utc).isoformat()
          sh["Prefer"]="resolution=merge-duplicates,return=minimal"
          record={"cache_key":KEY,"payload":out,"updated_at":out["finished_at"],"expires_at":"2099-01-01T00:00:00Z"}
          # Only Supabase result storage can POST. The MS transport permits GET only.
          req=urllib.request.Request(SB+"/rest/v1/telegram_api_cache?on_conflict=cache_key",headers=sh,method="POST",data=json.dumps(record).encode())
          with opener.open(req,timeout=60) as response:
           if response.status not in (200,201,204):raise RuntimeError("Storage failed")
          print("Read-only check complete; private result saved.")
          

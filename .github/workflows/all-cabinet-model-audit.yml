name: All cabinet model inventory
on:
  push:
    branches: [main]
    paths: ['scripts/audit_all_models.py', '.github/workflows/all-cabinet-model-audit.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/recovery-output/
            !/recovery-vault/
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-audit
          persist-credentials: false
          filter: blob:none
      - name: Inventory public runner and private default branch without any API calls
        run: python scripts/audit_all_models.py . private-audit

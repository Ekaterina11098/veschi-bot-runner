name: Verify bounded budget-only continuation and cumulative telemetry offline
on:
  push:
    branches: [fix-advertising-budget-telemetry-20261017]
    paths: ['.github/workflows/advertising-budget-telemetry-verify.yml']
permissions: {contents: write}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 6eb5f990aecfa1a92909169ffd76f05ac6da469d
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - run: |
          python -m py_compile advertising_daily_owner.py advertising_budgets_owner.py advertising_daily_runtime_guard.py
          python -m unittest test_advertising_daily_repair test_advertising_budget_telemetry -v
  retained_cost:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 cryptography==46.0.2
      - run: python advertising_retained_cost_check.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Preserve cipher only
        if: always()
        run: |
          mkdir -p recovery-output/advertising
          cp "$RUNNER_TEMP/stock-deploy-proof/retained-cost.aes.json" "recovery-output/advertising/retained-cost-${{ github.run_id }}.aes.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-output/advertising/
          git commit -m "Preserve exact saved SKU cost readback cipher"
          git push origin HEAD:fix-advertising-budget-telemetry-20261017
